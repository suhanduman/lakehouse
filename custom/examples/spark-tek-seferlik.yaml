# ÖRNEK — tek seferlik (one-shot) Spark uygulaması: Silver shop.orders -> lakehouse.sandbox.ornek_rapor.
#
# NASIL UYARLANIR
#   1. Bu dosyayı kopyalayın, `metadata.name`i değiştirin (driver pod'u <ad>-driver olur).
#   2. Python dosyanızı custom/examples/ornek_rapor.py gibi bu klasöre koyun ve kustomization.yaml'daki
#      configMapGenerator'a ekleyin; `mainApplicationFile` yolu local:///opt/job/<dosya>.py olur,
#      `volumes[].configMap.name` de üretilen ConfigMap adıdır (burada: ornek-rapor).
#   3. Kaynak/bellek: `cores` Spark çekirdek SAYISI, `coreRequest` k8s CPU İSTEĞİ'dir (dar düğümde düşük tutun).
#
# NEDEN kustomization.yaml'da YORUMLU (ArgoCD ile yönetilmez)
#   SparkApplication uygulandığı ANDA koşar. GitOps ile yönetilirse ArgoCD sync anında başlatır (veri hazır
#   olmayabilir), `timeToLiveSeconds` dolup CR silinince selfHeal yeniden yaratır -> iş kendiliğinden TEKRAR koşar,
#   ve başarısız bir koşu Application'ı Degraded yapar. Tekrar eden işler için ScheduledSparkApplication kullanın
#   (spark-zamanli.yaml). Bu dosyayı elle çalıştırın:
#       kubectl delete -n lakehouse sparkapplication ornek-rapor --ignore-not-found
#       kubectl apply -f custom/examples/spark-tek-seferlik.yaml
#
# SİTEYE ÖZEL DEĞERLER (prod'da platform/values/site/glue.yaml ile AYNI olmalı):
#   spark.sql.catalog.lakehouse.s3.endpoint      <- s3.endpoint
#   spark.sql.catalog.lakehouse.client.region    <- s3.region
#   spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation: vended-credentials | none  <- s3.vendedCredentials
#   spark.sql.catalog.lakehouse.uri / .warehouse <- glue/values.yaml iceberg.catalogUri / iceberg.warehouse
#   image / sparkVersion / iceberg-spark-runtime sürümü <- glue/values.yaml spark.image, spark.version, versions.iceberg
# Aşağıdaki değerler `helm template glue -f platform/values/glue-dev.yaml` çıktısındaki ScheduledSparkApplication
# bloğundan BİREBİR alınmıştır (dev/kind değerleri).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: ornek-rapor
  namespace: lakehouse
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: apache/spark:4.1.0-java21-python3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/job/ornek_rapor.py
  sparkVersion: "4.1.0"
  restartPolicy: {type: Never}
  timeToLiveSeconds: 86400          # CR (ve driver pod'u) 24 saat sonra silinir
  sparkConf:
    spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0"
    spark.jars.ivy: /tmp/.ivy2
    spark.redaction.regex: "(?i)secret|password|token|credential"   # driver/executor log ve Spark UI'da sır sızdırma
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.type: rest
    spark.sql.catalog.lakehouse.uri: "http://polaris.lakehouse.svc:8181/api/catalog"
    spark.sql.catalog.lakehouse.warehouse: "lakehouse"
    spark.sql.catalog.lakehouse.scope: PRINCIPAL_ROLE:ALL
    spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.lakehouse.s3.endpoint: "http://minio.lakehouse.svc:9000"     # SİTE
    spark.sql.catalog.lakehouse.s3.path-style-access: "true"                       # SİTE
    spark.sql.catalog.lakehouse.client.region: "us-east-1"                         # SİTE
    spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation: vended-credentials   # SİTE (STS yoksa: none)
    spark.sql.defaultCatalog: lakehouse
    spark.sql.session.timeZone: UTC
    spark.sql.shuffle.partitions: "8"
    spark.default.parallelism: "8"
    spark.driver.memoryOverhead: 512m
    spark.executor.memoryOverhead: 512m
  driver:
    cores: 1
    coreRequest: "500m"
    memory: 1g
    serviceAccount: spark-operator-spark          # spark-operator chart'ının lakehouse ns'inde yarattığı SA
    env:
    - {name: AWS_REGION, value: "us-east-1"}
    - {name: POLARIS_CREDENTIAL, valueFrom: {secretKeyRef: {name: polaris-spark, key: credential}}}
    # s3.vendedCredentials=false (STS yok) ise delegation header'ı `none` yapın ve şu çifti AÇIN:
    # - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
    # - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
    volumeMounts:
    - {name: job, mountPath: /opt/job}
  executor:
    instances: 1
    cores: 1
    coreRequest: "500m"
    memory: 1g
    env:
    - {name: AWS_REGION, value: "us-east-1"}
    # - {name: AWS_ACCESS_KEY_ID,     valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
    # - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
    volumeMounts:
    - {name: job, mountPath: /opt/job}
  volumes:
  - name: job
    configMap: {name: ornek-rapor}      # kustomization.yaml configMapGenerator (disableNameSuffixHash: true)
