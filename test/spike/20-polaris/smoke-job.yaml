# smoke.py'yi KÜME İÇİNDEN çalıştırır (istemcilerin gerçek ağ konumu; vended endpoint minio.minio.svc çözülür).
# Resmi python imajı + pip; özel imaj yok. MODE: "vended" | "static"
apiVersion: batch/v1
kind: Job
metadata: {name: polaris-smoke-MODE, namespace: polaris}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: smoke
        image: python:3.13-slim
        command: ["/bin/sh","-c"]
        args:
        - |
          set -e
          pip install -q 'pyiceberg[s3fs,pyarrow]>=0.10,<0.11'
          python /work/smoke.py "$CLIENT_ID" "$CLIENT_SECRET" EXTRA_ARG
        env:
        - {name: POLARIS_URI, value: http://polaris.polaris.svc:8181/api/catalog}
        - {name: S3_ENDPOINT, value: http://minio.minio.svc:9000}
        - {name: CLIENT_ID, valueFrom: {secretKeyRef: {name: polaris-smoke-cred, key: CLIENT_ID}}}
        - {name: CLIENT_SECRET, valueFrom: {secretKeyRef: {name: polaris-smoke-cred, key: CLIENT_SECRET}}}
        volumeMounts: [{name: work, mountPath: /work}]
      volumes:
      - name: work
        configMap: {name: polaris-smoke}
