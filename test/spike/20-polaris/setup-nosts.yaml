# S1c: STS'siz S3 senaryosu — Polaris credential vending yapmaz; istemciler kendi S3 anahtarlarını kullanır.
catalogs:
  - name: lakehouse_nosts
    type: internal
    storage_type: s3
    default_base_location: s3://lakehouse-nosts/
    allowed_locations: [s3://lakehouse-nosts/]
    region: us-east-1
    endpoint: http://minio.minio.svc:9000
    endpoint_internal: http://minio.minio.svc:9000
    path_style_access: true
    sts_unavailable: true
    roles:
      nosts_admin:
        assign_to: [writers]
        privileges: {catalog: [CATALOG_MANAGE_CONTENT]}
