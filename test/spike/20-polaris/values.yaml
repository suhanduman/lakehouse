image:
  tag: "1.7.0"
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret:
      name: polaris-db-app
      username: username
      password: password
      jdbcUrl: jdbc-uri
storage:
  secret:
    name: minio-creds
    awsAccessKeyId: AWS_ACCESS_KEY_ID
    awsSecretAccessKey: AWS_SECRET_ACCESS_KEY
extraEnv:
  - {name: AWS_REGION, value: us-east-1}
  # STS'siz S3 (stsUnavailable=true): Polaris kendi statik anahtarlarını AWS varsayılan credential zincirinden alır (S1c bulgusu)
  - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: minio-creds, key: AWS_ACCESS_KEY_ID}}}
  - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-creds, key: AWS_SECRET_ACCESS_KEY}}}
realmContext:
  realms: [POLARIS]
