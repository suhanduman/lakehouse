apiVersion: batch/v1
kind: Job
metadata: {name: JOBNAME, namespace: lakehouse}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: check
        image: docker.io/library/python:3.13-slim
        command: ["/bin/sh","-c"]
        # OpenShift: rastgele UID -> HOME=/tmp + pip --user (site-packages yazılamaz)
        args: ["set -e; export HOME=/tmp; pip install -q --user --no-warn-script-location 'trino>=0.339,<0.340' 'requests>=2.32,<3'; python /work/check.py CHECK_ARGS"]
        env:
        - {name: TRINO_HOST, value: trino.lakehouse.svc}
        - {name: CA_FILE, value: /etc/lakehouse-ca/tls.crt}
        - {name: KC_TOKEN_URL, value: http://keycloak-service.lakehouse.svc:8080/realms/lakehouse/protocol/openid-connect/token}
        - {name: KC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: keycloak-clients, key: trino}}}
        envFrom:
        # Kimlikler + akış (lib.sh acc_env): ACC_FLOW, ACC_SA, ACC_ANALYST_*, ACC_USER_*, TRINO_REDIRECT
        - secretRef: {name: e2e-acceptance}
        # Servis hesabı parolaları SA_<ad> olarak (SA_e2e kind'da, SA_zeppelin/SA_superset her yerde);
        # geçersiz ad taşıyan password.db anahtarı Kubernetes tarafından atlanır
        - {prefix: SA_, secretRef: {name: trino-service-accounts}}
        volumeMounts: [{name: work, mountPath: /work}, {name: ca, mountPath: /etc/lakehouse-ca, readOnly: true}]
      volumes:
      - {name: work, configMap: {name: lakehouse-trino-check}}
      - {name: ca, secret: {secretName: lakehouse-ca, items: [{key: tls.crt, path: tls.crt}]}}
