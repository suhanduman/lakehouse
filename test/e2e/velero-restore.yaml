# e2e restore provası: yalnız işaret ConfigMap'i geri yüklenir. Velero Restore'da AD filtresi YOKTUR ->
# labelSelector (e2e: dr-marker) + includedResources ile daraltılır; canlı iş yüklerine dokunulmaz.
# `metadata.namespace` YAZILMAZ (velero-backup.yaml ile aynı gerekçe): `kubectl -n "$VELERO_NS" apply -f`.
# `includedNamespaces` ise YEDEĞİN İÇİNDEKİ ns'tir, Velero sunucusununki değil: e2e yol script'leri ve
# fixture'lar `lakehouse` ns'ine SABİTTİR (runbooks/scripts/acceptance.sh --ns uyarısı) -> sabit yazılır.
apiVersion: velero.io/v1
kind: Restore
metadata: {name: e2e-marker}
spec:
  backupName: e2e-lakehouse
  includedNamespaces: [lakehouse]
  includedResources: [configmaps]
  labelSelector: {matchLabels: {e2e: dr-marker}}
  restorePVs: false
  existingResourcePolicy: update
