apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: jupyterhub, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "2"}}
spec:
  project: default
  sources:
  - repoURL: https://hub.jupyter.org/helm-chart/
    chart: jupyterhub
    targetRevision: 4.4.2
    helm:
      # site/jupyterhub.yaml SONRA: Keycloak/callback URL'leri + S3_ENDPOINT (dev overlay bu listeyi site'sız DEĞİŞTİRİR)
      valueFiles: [$values/platform/values/jupyterhub.yaml, $values/platform/values/site/jupyterhub.yaml]
  - repoURL: https://github.com/suhanduman/lakehouse.git
    targetRevision: main
    ref: values
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  # z2jh 4.4.2 aşağıdaki üç sırrı values'ta pinlenmemişse HER `helm template` çağrısında YENİDEN üretir
  # (chart templates/hub/_helpers-passwords.tpl: randAlphaNum/randHex). Chart'ın kaçış yolu olan `lookup`
  # (küredeki Secret'ı okuyup aynı değeri koru) yalnız canlı `helm upgrade`ta çalışır — ArgoCD'nin
  # `helm template` yolunda BOŞ döner. Sonuç (CI 35451232616): re-sync `hub` Secret'ını yeni token'la
  # yazdı, proxy pod'u döndü ve yeni token'ı aldı, hub eski token'ıyla kaldı ->
  # "api_request to proxy failed: HTTP 403: Forbidden" ve singleuser pod'u hiç yaratılmadı.
  # Çözüm: bu üç anahtar İLK sync'te bir kez üretilir, sonraki sync'lerde ArgoCD CANLI değeri korur
  # (RespectIgnoreDifferences olmadan ignoreDifferences yalnız diff'i susturur, sync yine üzerine yazardı).
  # Secret'ın geri kalanı (`values.yaml` = chart değerleri) sync'lenmeye DEVAM eder; bu yüzden bir values
  # değişikliği hub Deployment'ının `checksum/secret` annotation'ını yine değiştirir ve hub yeniden başlar.
  # Deployment annotation'ları (hub `checksum/secret`, proxy `checksum/auth-token`) BİLEREK yok sayılmadı:
  # token'ı dondurmak için Secret'ın verisini yok saymak YETER. Bu annotation'lar her yeni render'da yine
  # değişir ve hub + proxy'yi gereksizce döndürür — ama artık İKİSİ DE AYNI, değişmeyen token'ı okuduğu için
  # bu zararsızdır. Bilinçli sadeleştirme: fazladan iki `ignoreDifferences` girdisi eklemek yerine anlamsız
  # ama etkisiz bir restart'a katlanıyoruz (yok sayılsalardı hub, values değişikliğinde yeniden başlamazdı).
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: hub
    jsonPointers:
    - /data/hub.config.ConfigurableHTTPProxy.auth_token   # hub <-> proxy API yetkisi (CONFIGPROXY_AUTH_TOKEN)
    - /data/hub.config.JupyterHub.cookie_secret           # oturum çerezi imzası
    - /data/hub.config.CryptKeeper.keys                   # auth_state şifresi
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
