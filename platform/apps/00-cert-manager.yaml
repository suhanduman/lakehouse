apiVersion: argoproj.io/v1alpha1
kind: Application
# sync-wave "-1": plugin-barman-cloud chart'ı (00-cnpg-barman, wave 0) Issuer + 2 Certificate render eder;
# AYNI dalgadaki Application'lar EŞZAMANLI sync edilir -> taze kümede `no matches for kind "Certificate"`.
# Gerekli sıra: cert-manager (-1) < cnpg-barman (0) < glue (1). Dev'deki 40-monitoring de aynı nedenle -1'dir (bağımsız).
metadata: {name: cert-manager, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "-1"}}
spec:
  project: default
  source:
    repoURL: quay.io/jetstack/charts          # OCI: argocd ns'inde repository Secret gerekir (bootstrap.sh, F1 notu)
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      valuesObject:
        crds: {enabled: true, keep: true}
  destination: {server: https://kubernetes.default.svc, namespace: cert-manager}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
