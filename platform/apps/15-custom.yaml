# Müşteri CR'ları (custom/) — ürün chart'ına dokunmadan kendi kaynaklarınız. sync-wave 4: ürün bileşenlerinden
# (glue 1, polaris/trino/jupyterhub 2) SONRA uygulanır. Dev overlay'i path'i custom/examples'a çevirir.
# DİKKAT: bootstrap.sh'ın genel `target: {kind: Application}` yaması YALNIZ /metadata/namespace'i yeniden yazar;
# repoURL/targetRevision yamaları AD BAZLIDIR -> `custom` için bootstrap.sh'ta kendi patch girdisi vardır.
# Buraya YENİ bir git kaynaklı Application eklerseniz bootstrap.sh'a da ona ait bir patch girdisi ekleyin,
# yoksa uygulama `main`e sabit kalır ve PR/e2e eski revizyonu test eder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: custom, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "4"}}
spec:
  project: default
  source: {repoURL: https://github.com/suhanduman/lakehouse.git, targetRevision: main, path: custom}
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    # CreateNamespace: custom, glue'dan bağımsız senkronize olur; ad alanı henüz yoksa ilk sync başarısız olmasın
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: {limit: 5, backoff: {duration: 20s, factor: 2, maxDuration: 3m}}
