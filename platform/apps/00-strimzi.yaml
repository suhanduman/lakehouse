apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: strimzi, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: default
  source:
    repoURL: quay.io/strimzi-helm
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      valuesObject:
        watchNamespaces: [lakehouse]
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
  # API sunucusu Kafka CRD şemasındaki boş `properties: {}`'i (status.clusterSecurity) düşürür -> kalıcı OutOfSync (F1 e2e, ArgoCD 3.5.2)
  ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    name: kafkas.kafka.strimzi.io
    jsonPointers: [/spec/versions/0/schema/openAPIV3Schema/properties/status/properties/clusterSecurity/properties]
