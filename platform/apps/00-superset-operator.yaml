apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: superset-operator, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: default
  source:
    repoURL: ghcr.io/apache/superset-kubernetes-operator/charts   # OCI: argocd ns'inde repository Secret gerekir (bootstrap.sh)
    chart: superset-operator
    targetRevision: 0.2.0
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
