# Kubeflow spark-operator (spec §3): ScheduledSparkApplication; işler lakehouse ns'inde, driver SA spark-operator-spark
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: spark-operator, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: default
  source:
    repoURL: https://kubeflow.github.io/spark-operator
    chart: spark-operator
    targetRevision: 2.5.2
    helm:
      # OpenShift restricted-v2 SCC: chart sabit fsGroup 185 yazar -> controller/webhook pod'u hiç yaratılmaz
      # (ocpphy provası 2026-11-08). `null` chart varsayılanını siler; fsGroup'u OpenShift aralıktan atar.
      # Tamamı METİN `values`: valuesObject'teki null'ları API sunucusu siler ve ArgoCD valuesObject varken
      # `values`'ı hiç okumaz -> ikisi karıştırılamaz (gerekçe: 00-cnpg.yaml).
      values: |
        controller: {podSecurityContext: {fsGroup: null}}
        webhook: {podSecurityContext: {fsGroup: null}}
        spark:
          jobNamespaces: [lakehouse]
        # Operator metrikleri (spark_application_*): PodMonitor CRD'si kurulumdan ÖNCE var olmalı —
        # dev'de kube-prometheus-stack (platform/apps/dev/40-monitoring.yaml, sync-wave -1), prod OpenShift'te platform sağlar.
        prometheus:
          metrics: {enable: true, port: 8080}
          podMonitor: {create: true}
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
