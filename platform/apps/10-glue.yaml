apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: glue, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "1"}}
spec:
  project: default
  source:
    repoURL: https://github.com/suhanduman/lakehouse.git
    targetRevision: v2
    path: glue
    helm:
      valueFiles: [../platform/values/glue.yaml]
  destination: {server: https://kubernetes.default.svc, namespace: lakehouse}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    # ignoreDifferences YOK: Strimzi `spec.build.output.image`'ı yeniden yazmaz (digest yalnız pod'un imajında görünür),
    # imaj Git'te otoriter (connect.buildImage) -> drift gizlenmemeli.
