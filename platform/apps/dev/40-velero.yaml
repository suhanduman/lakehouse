# DEV-ONLY yedekleme (Velero + node-agent). platform/apps/kustomization.yaml base listesine EKLENMEZ:
# yalnız platform/envs/dev/kustomization.yaml `../../apps/dev` diziniyle alır. Prod (OpenShift) karşılığı OADP
# operatörüdür (aynı velero.io/v1 CRD'leri, ns openshift-adp) — runbooks/dr.md.
# sync-wave 0: velero.io CRD'leri (Schedule/Backup/Restore) glue'dan (wave 1) ÖNCE gelmeli; glue
# `Schedule/lakehouse-daily`i velero ns'ine yazar. Bu yüzden Velero'nun S3 Secret'ı da glue'dan DEĞİL
# chart'tan gelir (platform/values/velero-dev.yaml credentials.secretContents) — aksi hâlde wave kilitlenmesi.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: velero, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: default
  sources:
  - repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.1.0
    helm:
      valueFiles: [$values/platform/values/velero-dev.yaml]
  - repoURL: https://github.com/suhanduman/lakehouse.git
    targetRevision: v2
    ref: values
  destination: {server: https://kubernetes.default.svc, namespace: velero}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
