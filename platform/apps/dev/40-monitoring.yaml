# DEV-ONLY izleme yığını (kube-prometheus-stack). platform/apps/kustomization.yaml base listesine EKLENMEZ:
# yalnız platform/envs/dev/kustomization.yaml bu dosyayı kaynak olarak alır. Prod (OpenShift) kendi
# platform/user-workload monitoring'ini kullanır; lakehouse ns'indeki PodMonitor/ServiceMonitor/PrometheusRule'ları o toplar.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: monitoring, namespace: argocd, annotations: {argocd.argoproj.io/sync-wave: "0"}}
spec:
  project: default
  sources:
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.4.1
    helm:
      valueFiles: [$values/platform/values/monitoring-dev.yaml]
  - repoURL: https://github.com/suhanduman/lakehouse.git
    targetRevision: v2
    ref: values
  destination: {server: https://kubernetes.default.svc, namespace: monitoring}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
