# Trino 483 (chart 1.42.2) — kimlik doğrulama TLS ister: HTTPS 8443 + OAUTH2 (Keycloak) + PASSWORD (servis hesapları).
image: {tag: "483"}
server:
  workers: 2
  config:
    authenticationType: OAUTH2,PASSWORD
    https: {enabled: true, port: 8443, keystore: {path: /etc/trino/tls/tls-combined.pem}}   # cert-manager trino-tls (glue tls.yaml)
    query: {maxMemory: 4GB}
  # yalnız coordinator: OAuth2 (Keycloak). BLOK BURADA YOK: çok satırlı string'ler Helm'de birleşmez, son
  # dosyanınki bütünüyle geçer -> issuer'ın MÜŞTERİ değeri tek yerde dursun diye tüm blok oradadır:
  # prod platform/values/site/trino.yaml, dev platform/values/trino-dev.yaml. scripts/check-site.sh doğrular.
additionalConfigProperties:
- internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}
env:
- {name: TRINO_SHARED_SECRET, valueFrom: {secretKeyRef: {name: trino-shared-secret, key: secret}}}
- {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: keycloak-clients, key: trino}}}
- {name: POLARIS_CREDENTIAL, valueFrom: {secretKeyRef: {name: polaris-trino, key: credential}}}   # polaris-setup.sh yazar; yoksa pod CreateContainerConfigError ile bekler
- {name: LDAP_BIND_PASSWORD, valueFrom: {secretKeyRef: {name: keycloak-clients, key: ldap-bind}}}
coordinator:
  jvm: {maxHeapSize: 8G}
  config: {query: {maxMemoryPerNode: 1GB}, nodeScheduler: {includeCoordinator: false}}
  secretMounts:
  - {name: trino-tls, secretName: trino-tls, path: /etc/trino/tls}
worker:
  jvm: {maxHeapSize: 8G}
  config: {query: {maxMemoryPerNode: 1GB}}
auth:
  passwordAuthSecret: trino-service-accounts     # key password.db (htpasswd bcrypt): superset, zeppelin (+ dev: e2e)
catalogs:
  # chart varsayılanı tpch/tpcds sentetik benchmark katalogları içerir (F5 backlog) — açık null render'dan
  # düşürür (helm map birleştirme: yalnız bu iki anahtar; lakehouse'a dokunmaz)
  tpch: null
  tpcds: null
  # lakehouse kataloğu BURADA YOK (aynı gerekçe: s3.endpoint/s3.region müşteri değeri, blok bütünüyle ezilir):
  # prod platform/values/site/trino.yaml, dev platform/values/trino-dev.yaml.
# JMX/serviceMonitor BİLEREK YOK: izleme kapsamı "boru hattı sağlığı"na daraltıldı (kullanıcı kararı
# 2026-09-18, Task 2b) — gösterim bileşenlerinin (Trino) uygulama metriği toplanmaz. Chart varsayılanına
# dönüldü (jmx.enabled/serviceMonitor.enabled kapalı). Geçmiş: Task 1/2'de vardı (plan kararı R13).
accessControl:
  type: configmap
  refreshPeriod: 60s
  # İlk eşleşen kural kazanır: özel (kullanıcı filtre/maske) kurallar genel SELECT kuralından ÖNCE.
  rules:
    rules.json: |-
      {
        "catalogs": [
          {"group": "lakehouse-admins|lakehouse-analysts", "catalog": "lakehouse|system", "allow": "all"},
          {"group": "lakehouse-users", "catalog": "lakehouse|system", "allow": "read-only"},
          {"user": "superset|zeppelin|e2e", "catalog": "lakehouse|system", "allow": "read-only"}
        ],
        "schemas": [
          {"group": "lakehouse-admins", "owner": true},
          {"group": "lakehouse-analysts", "schema": "sandbox", "owner": true},
          {"owner": false}
        ],
        "tables": [
          {"group": "lakehouse-admins", "privileges": ["SELECT", "INSERT", "DELETE", "UPDATE", "OWNERSHIP"]},
          {"group": "lakehouse-analysts", "schema": "sandbox", "privileges": ["SELECT", "INSERT", "DELETE", "UPDATE", "OWNERSHIP"]},
          {"group": "lakehouse-analysts", "privileges": ["SELECT"]},
          {"group": "lakehouse-users", "schema": "shop", "table": "orders", "privileges": ["SELECT"], "filter": "status <> 'shipped'"},
          {"group": "lakehouse-users", "schema": "nginx_raw", "table": "access_log", "privileges": ["SELECT"],
           "columns": [{"name": "remote", "mask": "'x.x.x.x'"}]},
          {"group": "lakehouse-users", "privileges": ["SELECT"]},
          {"user": "superset|zeppelin|e2e", "privileges": ["SELECT"]},
          {"catalog": "system", "privileges": ["SELECT"]}
        ]
      }
