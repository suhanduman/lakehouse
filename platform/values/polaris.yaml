image: {tag: "1.7.0"}
persistence:
  type: relational-jdbc
  relationalJdbc:
    secret: {name: polaris-db-app, username: username, password: password, jdbcUrl: jdbc-uri}
realmContext: {realms: [POLARIS]}
extraEnv:
- {name: AWS_REGION, value: us-east-1}
# STS'siz S3 (sts_unavailable) için sunucunun kendi anahtarları (F0 S1c). Secret adı her ortamda s3-creds (F3):
# dev'de components.minio=true iken glue'nun MinIO şablonu (glue/templates/minio.yaml) üretir; prod'da kurulumdan önce elle yaratılır.
- {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
- {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
storage:
  secret: {name: s3-creds, awsAccessKeyId: AWS_ACCESS_KEY_ID, awsSecretAccessKey: AWS_SECRET_ACCESS_KEY}
# NOT: DROP_WITH_PURGE_ENABLED sunucu geneli olarak burada AÇILMAZ; `lakehouse` kataloğunun properties'inde
# (`polaris.config.drop-with-purge.enabled`) katalog düzeyinde açılır — platform/polaris/setup.yaml.
