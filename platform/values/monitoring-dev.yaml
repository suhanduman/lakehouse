# DEV/vanilla izleme: yalnız operator + küçük Prometheus + kube-state-metrics (customResourceState) + küçük Grafana.
# OpenShift'te KURULMAZ: user-workload monitoring lakehouse ns'indeki PodMonitor/ServiceMonitor/PrometheusRule'ları alır.
alertmanager: {enabled: false}
prometheus-node-exporter: {enabled: false}
nodeExporter: {enabled: false}
kubeApiServer: {enabled: false}
kubelet: {enabled: false}
kubeControllerManager: {enabled: false}
coreDns: {enabled: false}
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
kubeStateMetrics: {enabled: true}
kube-state-metrics:
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 192Mi}}
  rbac:
    extraRules:
    - {apiGroups: [sparkoperator.k8s.io], resources: [sparkapplications, scheduledsparkapplications], verbs: [list, watch]}
  # CustomResourceStateMetrics tanımının TEK KAYNAĞI burasıdır (alan yolları kind'da canlı doğrulandı;
  # eskiden glue/files/ altında kullanılmayan bir kopyası vardı, silindi).
  # KSM chart 8.5.0 yerel anahtarı -> ConfigMap + --custom-resource-state-config-file chart tarafından üretilir.
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
        - groupVersionKind: {group: sparkoperator.k8s.io, version: v1beta2, kind: SparkApplication}
          metricNamePrefix: kube_customresource_sparkapp
          labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
          metrics:
          - name: state
            help: SparkApplication applicationState.state
            each:
              type: StateSet
              stateSet:
                labelName: state
                path: [status, applicationState, state]
                list: [SUBMITTED, RUNNING, COMPLETED, FAILED, SUBMISSION_FAILED, PENDING_RERUN, INVALIDATING, SUCCEEDING, FAILING, UNKNOWN]
          - name: termination_time
            help: SparkApplication terminationTime (epoch s)
            each:
              type: Gauge
              gauge: {path: [status, terminationTime]}
        - groupVersionKind: {group: sparkoperator.k8s.io, version: v1beta2, kind: ScheduledSparkApplication}
          metricNamePrefix: kube_customresource_ssa
          labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
          metrics:
          - name: last_run
            help: ScheduledSparkApplication lastRun (epoch s)
            each:
              type: Gauge
              gauge: {path: [status, lastRun]}
prometheusOperator:
  resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 192Mi}}
prometheus:
  prometheusSpec:
    # Limitler ÖLÇÜLEN gerçek kullanıma göre (Task 7 fix turu, canlı `crictl stats` + VM dmesg):
    # prometheus RSS **153 MB** (retention 24h, 30s scrape, ~2000 seri) -> 640Mi ≈ 4x marj.
    # NOT (kalıcı ders): limit toplamı bir tavandır, kullanımı ÖLÇMEZ ve Kubernetes onu zorlamaz;
    # düğümün "limit taahhüdü %108" olması tek başına hiçbir şeyi öldürmez. VM'in kernel log'unda
    # (açılıştan beri, tüm denemeler dâhil) **host düzeyinde "Out of memory:" kaydı YOKTUR**; tüm
    # kayıtlar `Memory cgroup out of memory`, yani konteynerin KENDİ limiti. Bu yüzden limit düşürmek
    # host baskısını azaltmaz, yalnız cgroup OOM eşiğini erkene çeker (bkz. grafana satırı).
    retention: 24h
    resources: {requests: {cpu: 50m, memory: 400Mi}, limits: {memory: 640Mi}}
    serviceMonitorSelectorNilUsesHelmValues: false     # lakehouse ns'indeki ServiceMonitor'ler görülsün (tuzak!)
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    # podMetadata hub.jupyter.org/network-access-hub etiketi BİLEREK YOK: hub ServiceMonitor kaldırıldı
    # (Task 2b, izleme kapsamı daraltıldı), Prometheus'un artık hub netpol'ünü geçmesi gerekmiyor.
grafana:
  enabled: true
  # Grafana limiti 256Mi/384Mi DEĞİL **768Mi**: canlı ölçümde boştaki RSS **235 MB** (CPU %20) ve ana
  # sürecin yanında ~14 `gpx_grafana-*` eklenti süreci var. VM kernel log'u bu pod'u 13 kez
  # `Memory cgroup out of memory` ile öldürdü — hem 384Mi hem de (d56fa48 ile düşürülen) 256Mi limitinde.
  # Yani F5'in TEK gerçek OOM'u buydu ve limiti düşürmek onu ağırlaştırdı; 768Mi ≈ 3x ölçülen marj.
  # request 256Mi: ölçülen boştaki RSS 235 MB — 128Mi'lik istek scheduler'a yalan söylüyordu.
  resources: {requests: {cpu: 20m, memory: 256Mi}, limits: {memory: 768Mi}}
  sidecar: {dashboards: {enabled: true, searchNamespace: ALL, label: grafana_dashboard}}
  defaultDashboardsEnabled: false
