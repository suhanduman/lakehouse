# SİTE DEĞERLERİ — müşteriye özel tek glue dosyası; ürün varsayılanları ../glue.yaml'da (dokunmayın).
# Doldurma rehberi: docs/30-kurulum.md §4 · anahtar tablosu: docs/90-referans/values-anahtarlari.md
# Tutarlılık kontrolü: scripts/check-site.sh (site/trino.yaml ve site/jupyterhub.yaml ile çapraz doğrular).
appsDomain: apps.ocp.example.net          # $APPS_DOMAIN — oc get ingresses.config cluster -o jsonpath='{.spec.domain}'
# hostname'ler boşken <bileşen>-lakehouse.<appsDomain> türetilir; kurumsal DNS adı için satırı açın:
# trino: {hostname: trino.kurum.edu.tr}
# İSTİSNA — keycloak.hostname AÇIK verilirse ÇIPLAK HOST DEĞİL, TAM URL olmalı (token iss bu değerdir):
# keycloak: {hostname: https://sso.kurum.edu.tr}      # şemasız yazılırsa render hata verir (glue.keycloakUrl)
s3:
  endpoint: https://s3.example.com        # $S3_ENDPOINT (FlashBlade; platform/polaris/setup.yaml ile aynı olmalı)
  region: us-east-1                       # $S3_REGION
  vendedCredentials: true                 # STS yoksa false
connect:
  buildImage: image-registry.openshift-image-registry.svc:5000/lakehouse/connect:2.0.0   # $INTERNAL_REGISTRY/$LAKEHOUSE_NS/connect:<sürüm>
  buildPushSecret: connect-push
keycloak:
  ldap:
    enabled: true                                     # AD gün-1 zorunlu
    connectionUrl: ldaps://ad.example.com:636         # $LDAP_URL
    usersDn: "OU=Users,DC=example,DC=com"             # $LDAP_USERS_DN
    groupsDn: "OU=Groups,DC=example,DC=com"           # $LDAP_GROUPS_DN
    bindDn: "CN=svc-lakehouse,OU=Service,DC=example,DC=com"   # $LDAP_BIND_DN (parola: Secret keycloak-clients/ldap-bind)
    # AD kök CA'sı özel bir CA'dan geliyorsa (hedef ortam) bu Secret'ı kurulumda yaratın (docs/30-kurulum.md
    # §5.13) ve adını burada bırakın: Keycloak, Zeppelin ve Trino onu tek elden alır. AD sertifikası
    # konteynerlerin zaten güvendiği bir kökten geliyorsa TAM OLARAK iki şey yapın:
    #   1) burada caSecret: ""
    #   2) site/trino.yaml -> group-provider bloğundan ldap.ssl.truststore.path satırını SİLİN
    # ../trino-ldap.yaml'a DOKUNMAYIN: oradaki mount optional'dır, Secret yoksa Trino yine açılır.
    # scripts/check-site.sh bu iki adımın birlikte yapıldığını denetler.
    caSecret: ad-ca                                   # Secret adı; anahtar ca.crt (PEM)
cnpg:
  polarisDb:  {storageClass: ""}          # $STORAGE_CLASS ("" = kümenin varsayılanı)
  keycloakDb: {storageClass: ""}
  supersetDb: {storageClass: ""}
backup:
  # VERİ bucket'ından AYRI olmalı (geri yükleme hedefi); dev'deki MinIO `backups` bucket'ıyla da çakışmasın
  s3: {endpoint: https://s3.example.com, bucket: lakehouse-backups, region: us-east-1}   # $S3_ENDPOINT / $S3_BUCKET_BACKUP
tls: {caBundle: ""}                       # docs/30-kurulum.md: lakehouse-ca tls.crt PEM içeriği (Route reencrypt)
sources: []                               # docs/50-isletme/yeni-kaynak-ve-pipeline.md
pipelines: []
