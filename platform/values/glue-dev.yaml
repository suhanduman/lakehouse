# kind / lokal geliştirme
platform: vanilla
kafka:
  replicas: 1
  storageSize: 5Gi
  plainListener: true
  externalListener: true
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
connect:
  buildImage: ttl.sh/lakehouse-connect-dev:24h
  topicPartitions: 3
  sinkCommitIntervalMs: "30000"
cnpg:
  polarisDb: {instances: 1, storageSize: 2Gi}
  keycloakDb: {instances: 1, storageSize: 2Gi}
  supersetDb: {instances: 1, storageSize: 2Gi}
components: {minio: true, devSecrets: true}
# F5 DR: yedekler dev'de AYNI MinIO'nun ayrı `backups` bucket'ına gider (glue/values.yaml backup.* varsayılanları);
# prod'da farklı endpoint/bucket (platform/values/glue.yaml). MinIO artık PVC'li (minio.persistence) — emptyDir'de
# pod yeniden başlayınca hem Iceberg dosyaları hem WAL arşivi kaybolurdu.
minio: {persistence: {size: 5Gi}}
# Velero: dev chart'ı platform/apps/dev/40-velero.yaml ile kurulur -> Schedule + fs-backup dışlamaları açılır.
# Aynı `backups` bucket'ı, AYRI prefix (velero/ vs cnpg/).
velero: {enabled: true}
tls: {selfSignedCA: true}
trino: {hostname: trino.127.0.0.1.nip.io}
monitoring: {silverMergeStaleSeconds: 172800}   # dev: silver-merge cron gecelik (0 3 * * *) -> 48 saat
networkPolicy: {enabled: false}      # dev'de kapalı (e2e port-forward/fixture trafiği); kindnetd enforce EDER (F4 canlı, z2jh singleuser netpol) — prod'da true
keycloak:
  hostname: http://keycloak-service.lakehouse.svc:8080   # dev: iss küme içinden çözülür (Trino OIDC discovery); tarayıcı akışı küme dışından çalışmaz
  devUsers:
  - {username: admin1,   password: admin1-dev,   group: lakehouse-admins}
  - {username: analyst1, password: analyst1-dev, group: lakehouse-analysts}
  - {username: student1, password: student1-dev, group: lakehouse-students}
superset:
  hostname: superset.127.0.0.1.nip.io
  resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1536Mi}}     # CI 4 vCPU: istek düşük, limit aynı
jupyterhub: {hostname: jupyterhub.127.0.0.1.nip.io}
zeppelin:
  hostname: zeppelin.127.0.0.1.nip.io
  mem: "-Xmx768m"
  intpMem: "-Xmx512m"
  storageSize: 2Gi
  resources: {requests: {cpu: 100m, memory: 768Mi}, limits: {memory: 1536Mi}}     # CI 4 vCPU: istek düşük, limit aynı
sources:
- name: shop
  type: postgres
  host: demo-pg-rw.lakehouse.svc       # test/e2e/pg-fixture.yaml
  port: 5432
  database: shop
  tables: [public.orders]
  signalTable: public.debezium_signal
- name: crm
  type: mongodb
  connectionString: "mongodb://demo-mongo.lakehouse.svc:27017/?replicaSet=rs0"
  collections: [crm.customers]
pipelines:
- {bronze: shop_raw.orders, keys: [id], bucket_count: 4, casts: {updated_at: timestamp}}
- {bronze: crm_raw.customers, keys: [_id], bucket_count: 4}
nginx: {enabled: true, partitions: 3}
spark:
  # CI runner'ı 4 vCPU: F4 bileşenleri gelince düğüm CPU İSTEKLERİ %76'ya çıktı ve 1 CPU isteyen Spark driver'ı
  # schedule olamadı (run 35281673277, 2026-09-17). cores (Spark çekirdeği) 1 kalıyor, k8s isteği 500m'ye iniyor.
  driver:   {cores: 1, coreRequest: "500m", memory: 1536m, memoryOverhead: 512m}
  executor: {instances: 1, cores: 1, coreRequest: "500m", memory: 1g, memoryOverhead: 512m}
  # dev: HEPSİ gecelik; e2e işleri `run_spark_once` ile tek seferlik koşturur (plan P9). Sık cron taze kurulumda
  # zararlı: polaris-spark Secret'ı (polaris-setup.sh) gelmeden fırlayan silver-merge/mongo-bronze driver'ları
  # CreateContainerConfigError'da 2×2 GiB rezerve edip Connect/Trino'yu schedule-dışı bırakıyordu (2026-09-17 canlı);
  # F3 notu 4'teki "e2e koşusu :00/:30 cron'uyla çakışırsa Bronze çift satır" riski de böylece kapanır.
  schedules:
    silverMerge: "0 3 * * *"
    positionDeletes: "15 2 * * *"
    compact: "30 2 * * *"
    expireOrphanTtl: "45 2 * * *"
    mongoBronze: "5 3 * * *"           # e2e tek seferlik koşturur
