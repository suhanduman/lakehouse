# Prod-only işaret dosyası: gruplar AD'den gelir (Trino >= 473 LDAP group provider).
#
# group-provider.properties BURADA DEĞİL. Çok satırlı bir string'tir; Helm çok satırlı string'leri
# birleştirmez, SON değer dosyasınınki bütünüyle geçer. Bu yüzden bloğun TAMAMI müşteriye özel tek dosyada
# durur: platform/values/site/trino.yaml (coordinator.additionalConfigFiles."group-provider.properties").
# Burada bir kopya tutulsaydı iki yer sürüklenir, biri sessizce yok sayılırdı.
#
# AYRI DOSYA olarak listede kalır çünkü dev overlay'i (platform/envs/dev/kustomization.yaml) prod değer
# dosyası listesini [trino.yaml, trino-dev.yaml] ile DEĞİŞTİRİR -> dev ne bu dosyayı ne site/trino.yaml'ı
# yükler, yerine auth.groups (dosya provider'ı, platform/values/trino-dev.yaml) devreye girer.
# Bağlama parolası: Secret keycloak-clients anahtarı ldap-bind -> LDAP_BIND_PASSWORD (platform/values/trino.yaml env).
#
# AD KÖK CA'SI (LDAPS güveni) — BURADA. Secret `ad-ca` (anahtar ca.crt, PEM; docs/30-kurulum.md §5.13)
# coordinator'ın initContainer'ına bağlanır ve JVM güven deposuna eklenir (aşağıdaki not). optional: true ZORUNLU:
# ad-ca koşullu bir Secret'tır; AD herkesçe bilinen bir CA kullanıyorsa Secret hiç yaratılmaz, içe aktarma atlanır
# ve Trino yine açılır. site/trino.yaml'da ldap.ssl.truststore.path satırı YOKTUR (Trino 483 hatası, aşağıda).
#
# S3 KÖK CA'SI (FlashBlade özel CA ile imzalıysa) — yine BURADA, çünkü coordinator.additionalVolumes listesinin
# sahibi bu dosyadır (Helm listeleri birleştirmez; trino.yaml'a eklenseydi bu dosya onu ezerdi). Trino'nun native
# S3 dosya sistemi (AWS SDK v2) JVM varsayılan güven deposunu kullanır ve PEM kabul etmez -> Secret `s3-ca`
# (docs/30-kurulum.md §5.14) içindeki `truststore.p12` (JDK kökleri + S3 CA) initContainer'la emptyDir'e kopyalanır.
# Secret YOKSA (S3 herkesçe bilinen CA) aynı initContainer imajın kendi JDK cacerts'ini kopyalar -> davranış
# değişmez; site değeri gerekmez. Polaris (platform/values/polaris.yaml) ve not defterleri (jupyterhub.yaml) aynı
# yöntemi kullanır. İmaj etiketi trino.yaml'daki image.tag ile AYNI tutulmalı (değer dosyası şablonlanamaz).
#
# AD KÖK CA'SI — JVM güven deposuna (ocpphy provası 2026-11-09). Trino 483 + JDK 25'te LDAP group provider'ın
# KENDİ SSL fabrikası (ldap.ssl.truststore.path verilince devreye girer) aralıklı olarak
# "CommunicationException … SSLContext was not set" ile düşer: fabrika SSL bağlamını ScopedValue ile taşır, JNDI
# sınıfı adıyla başka bir sınıf yükleyiciden yükleyince bağlam görünmez. Sonuç: kullanıcının grubu boş gelir,
# analist/son kullanıcı "Access Denied: Cannot access catalog lakehouse" alır (kabul trino-path'i bu yüzden düştü).
# Çözüm: ldap.ssl.truststore.path HİÇ verilmez (site/trino.yaml); AD CA'sı coordinator'ın JVM güven deposuna
# (aşağıdaki initContainer, keytool) eklenir ve JNDI standart SSL'i kullanır — hatalı yol hiç çağrılmaz.
# ad-ca Secret'ı YOKSA (AD herkesçe bilinen bir CA kullanıyor) içe aktarma adımı atlanır; site değeri gerekmez.
initContainers:
  coordinator:
  - name: s3-truststore
    image: docker.io/trinodb/trino:483
    command: [sh, -c, 'set -e; if [ -f /s3-ca/truststore.p12 ]; then cp /s3-ca/truststore.p12 /ts/truststore.p12; echo "S3 CA truststore"; else cp "$(dirname "$(readlink -f "$(command -v java)")")/../lib/security/cacerts" /ts/truststore.p12; echo "JDK varsayilan"; fi; chmod u+w /ts/truststore.p12; if [ -f /ad-ca/ca.crt ]; then keytool -importcert -noprompt -alias ad-ca -file /ad-ca/ca.crt -keystore /ts/truststore.p12 -storepass changeit; echo "AD CA eklendi"; fi']
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
    volumeMounts:
    - {name: s3-ca, mountPath: /s3-ca, readOnly: true}
    - {name: ad-ca, mountPath: /ad-ca, readOnly: true}
    - {name: s3-truststore, mountPath: /ts}
  worker:
  - name: s3-truststore
    image: docker.io/trinodb/trino:483
    command: [sh, -c, 'if [ -f /s3-ca/truststore.p12 ]; then cp /s3-ca/truststore.p12 /ts/truststore.p12; echo "S3 CA truststore"; else cp "$(dirname "$(readlink -f "$(command -v java)")")/../lib/security/cacerts" /ts/truststore.p12; echo "JDK varsayilan"; fi']
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
    volumeMounts:
    - {name: s3-ca, mountPath: /s3-ca, readOnly: true}
    - {name: s3-truststore, mountPath: /ts}
coordinator:
  additionalVolumes:
  - {name: ad-ca, secret: {secretName: ad-ca, optional: true}}
  - {name: s3-ca, secret: {secretName: s3-ca, optional: true}}
  - {name: s3-truststore, emptyDir: {}}
  - {name: trino-data, emptyDir: {}}
  additionalVolumeMounts:
  - {name: s3-truststore, mountPath: /etc/trino/s3-truststore, readOnly: true}
  # OpenShift: pod rastgele UID ile koşar (restricted-v2; runAsUser null, trino.yaml). İmajın /data/trino dizini
  # UID 1000'e aittir -> "pid file is not writeable: ... mkdir /data/trino/var: permission denied" ve CrashLoop
  # (ocpphy provası 2026-11-08). node.data-dir (server.node.dataDir, /data/trino) yazılabilir emptyDir olur;
  # içeriği (pid, launcher günlüğü) geçicidir.
  - {name: trino-data, mountPath: /data/trino}
  additionalJVMConfig: [-Djavax.net.ssl.trustStore=/etc/trino/s3-truststore/truststore.p12, -Djavax.net.ssl.trustStorePassword=changeit]
worker:
  additionalVolumes:
  - {name: s3-ca, secret: {secretName: s3-ca, optional: true}}
  - {name: s3-truststore, emptyDir: {}}
  - {name: trino-data, emptyDir: {}}
  additionalVolumeMounts:
  - {name: s3-truststore, mountPath: /etc/trino/s3-truststore, readOnly: true}
  - {name: trino-data, mountPath: /data/trino}           # OpenShift rastgele UID (bkz. coordinator)
  additionalJVMConfig: [-Djavax.net.ssl.trustStore=/etc/trino/s3-truststore/truststore.p12, -Djavax.net.ssl.trustStorePassword=changeit]
