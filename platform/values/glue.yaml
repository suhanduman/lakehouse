# ÜRÜN (prod) varsayılanları — glue/values.yaml üstüne. MÜŞTERİYE ÖZEL HİÇBİR DEĞER BURADA DEĞİL:
# hostname/appsDomain, S3 endpoint, LDAP DN'leri, Connect imajı, yedek bucket'ı, CA paketi ve
# sources/pipelines TEK YERDE -> platform/values/site/glue.yaml (ArgoCD bu dosyayı SONRA yükler).
# Bu dosya sürümle birlikte güncellenir; site dosyası müşteride kalır.
platform: openshift
route: {enabled: true}
# Route/Ingress host'ları ve Keycloak URL'i glue/values.yaml'da BOŞ: site/glue.yaml'daki appsDomain'den
# <bileşen>-<ns>.<appsDomain> olarak türetilir (glue.hostFor). Keycloak realm'indeki redirect URI'leri de
# aynı kaynaktan TÜRETİLİR (glue/templates/keycloak-realm.yaml) — elle girilmez.
cnpg:
  # HA: primary + 1 replika (CNPG senkron/asenkron replikasyon); storageClass site/glue.yaml'da
  polarisDb: {instances: 2}
  keycloakDb: {instances: 2}
  supersetDb: {instances: 2}
# nginx erişim logu (F3): Fluent Bit ajanları müşteri sunucusunda -> Kafka dış listener (Route). Açmadan önce ikisini de doldur:
#kafka: {externalListener: true}
#nginx: {enabled: true}
# CNPG PITR yedekleri (F5): veri bucket'ından AYRI hedef. Endpoint/bucket site/glue.yaml'da (backup.s3);
# `backup-s3-creds` Secret'ı (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) kurulumdan ÖNCE yaratılır.
# Velero/OADP: prod'da OADP operatörü kurulduktan SONRA açılır (Schedule CR ns openshift-adp'ye yazılır).
# Kapalıyken Kafka/MinIO fs-backup dışlama annotation'ları da render edilmez — runbooks/dr.md.
velero: {enabled: false, namespace: openshift-adp}
backup:
  enabled: true
  s3: {secret: backup-s3-creds}
  retentionPolicy: "30d"
# Büyük tier (F0 S4): tablo/veri hacmi büyüdüğünde yorumu kaldır — küçük tier varsayılanları glue/values.yaml'da
#spark:
#  driver:   {cores: 2, memory: 4g, memoryOverhead: 1g}
#  executor: {instances: 2, cores: 2, memory: 4g, memoryOverhead: 1g}
#  shufflePartitions: 200
