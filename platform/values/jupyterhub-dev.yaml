hub:
  config:
    # DEV-ONLY: enable_auth_state (prod) spawn öncesi refresh_user() zorlar; admin API ile yaratılan e2e
    # kullanıcısının hiç auth_state'i olmadığından (gerçek OAuth login yok) 403 verir. auth_refresh_age: 0
    # bu periyodik refresh'i devre dışı bırakır — gerçek tarayıcı/OAuth login yapan kullanıcıları etkilemez.
    Authenticator: {auth_refresh_age: 0}
    GenericOAuthenticator:
      oauth_callback_url: http://jupyterhub.127.0.0.1.nip.io/hub/oauth_callback
      authorize_url: http://keycloak-service.lakehouse.svc:8080/realms/lakehouse/protocol/openid-connect/auth
      token_url: http://keycloak-service.lakehouse.svc:8080/realms/lakehouse/protocol/openid-connect/token
      userdata_url: http://keycloak-service.lakehouse.svc:8080/realms/lakehouse/protocol/openid-connect/userinfo
  # z2jh hub netpol'ünün varsayılan kuralı podSelector'dır (AYNI ns) -> monitoring ns'indeki Prometheus'u
  # kapsamaz (canlı: hedef "context deadline exceeded"). Liste birleştirilmez, ÜZERİNE YAZILIR:
  # jupyterhub.yaml'daki prod (openshift-user-workload-monitoring) kuralının dev karşılığı budur.
  networkPolicy:
    ingress:
    - from:
      - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
        podSelector: {matchLabels: {hub.jupyter.org/network-access-hub: "true"}}
  services:
    e2e: {apiToken: e2e-dev-token-0123456789abcdef0123456789abcdef}   # DEV-ONLY: e2e REST (kullanıcı yarat + sunucu başlat)
  loadRoles:
    e2e: {description: e2e harness, scopes: [admin:users, admin:servers, read:servers], services: [e2e]}
singleuser:
  memory: {guarantee: 512M, limit: 2G}
  cpu: {guarantee: 0.2, limit: 1}
  storage: {capacity: 1Gi}
  extraEnv: {S3_ENDPOINT: http://minio.lakehouse.svc:9000}
  # Helm değer birleştirmede liste TAMAMEN üzerine yazılır (eklenmez) -> jupyterhub.yaml'daki Trino/Polaris kuralları
  # burada TEKRARLANIYOR + dev'e özgü MinIO kuralı eklendi (vended S3 credentials ile pyiceberg/Trino MinIO'ya
  # doğrudan okur/yazar; prod'da S3 harici olduğundan nonPrivateIPs varsayılanıyla zaten kapsanır).
  networkPolicy:
    egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: trino, app.kubernetes.io/instance: trino, app.kubernetes.io/component: coordinator}}}]
      ports: [{port: 8443}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: polaris, app.kubernetes.io/instance: polaris}}}]
      ports: [{port: 8181}]
    - to: [{podSelector: {matchLabels: {app: minio}}}]
      ports: [{port: 9000}]
scheduling: {userScheduler: {enabled: false}}
prePuller: {hook: {enabled: false}, continuous: {enabled: false}}   # kind: sync'i imaj çekişine bağlama; spawn'da çekilir
