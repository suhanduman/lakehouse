apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../apps
# DEV-ONLY Application'lar (izleme yığını). platform/apps/kustomization.yaml base listesinde YOK -> prod'a girmez.
- ../../apps/dev
patches:
- target: {kind: Application, name: glue}
  patch: |-
    - op: replace
      path: /spec/source/helm/valueFiles
      value: [../platform/values/glue-dev.yaml]
- target: {kind: Application, name: trino}
  patch: |-
    - op: replace
      path: /spec/sources/0/helm/valueFiles
      value: [$values/platform/values/trino.yaml, $values/platform/values/trino-dev.yaml]
- target: {kind: Application, name: jupyterhub}
  patch: |-
    - op: add
      path: /spec/sources/0/helm/valueFiles/-
      value: $values/platform/values/jupyterhub-dev.yaml
