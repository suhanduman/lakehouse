# `polaris setup apply` (apache-polaris CLI 1.7.0) — katalog/namespace/rol/grant/principal tek YAML. Şema = `setup export`.
# S3 modu: STS varsa (MinIO/AWS) bu hâliyle; STS yoksa `sts_unavailable: true` ekle (F0 S1c) ve istemcilerde delegation header'ı kapat.
principal_roles: [writers, readers, sandbox_writers]
principals:
  connect:   {type: service, roles: [writers]}
  spark:     {type: service, roles: [writers]}
  trino:     {type: service, roles: [readers, sandbox_writers]}
  notebooks: {type: service, roles: [readers, sandbox_writers]}
catalogs:
  - name: lakehouse
    type: internal
    storage_type: s3
    default_base_location: s3://lakehouse/
    allowed_locations: [s3://lakehouse/]
    region: us-east-1
    endpoint: http://minio.lakehouse.svc:9000            # prod: müşteri S3 endpoint'i (kurulumda değiştir)
    endpoint_internal: http://minio.lakehouse.svc:9000
    path_style_access: true
    # Trino `DROP TABLE`, REST katalogda silme isteğini `purgeRequested=true` ile gönderir; bayrak kapalıyken
    # Polaris 403 döner ("Unable to purge entity … set DROP_WITH_PURGE_ENABLED", F4 canlı bulgu 6). Sunucu geneli
    # yerine KATALOG düzeyinde açılır (FeatureConfiguration DROP_WITH_PURGE_ENABLED -> catalogConfig anahtarı
    # `drop-with-purge.enabled`; apache/polaris:1.7.0 polaris-core jar'ından doğrulandı) — böylece yalnız bu
    # kataloğun tabloları purge ile silinebilir. UYARI: `polaris setup apply` katalog properties'ini yalnız
    # katalog YARATILIRKEN yazar; var olan kurulumda `polaris catalogs update` ile ayrıca uygulanmalıdır.
    properties:
      polaris.config.drop-with-purge.enabled: "true"
    roles:
      lakehouse_admin:
        assign_to: [writers]
        privileges: {catalog: [CATALOG_MANAGE_CONTENT]}
      lakehouse_read:
        assign_to: [readers]
        privileges: {catalog: [CATALOG_READ_PROPERTIES, NAMESPACE_LIST, TABLE_LIST, TABLE_READ_PROPERTIES, TABLE_READ_DATA, VIEW_LIST, VIEW_READ_PROPERTIES]}
      # motor bazlı yazma yalnız sandbox namespace'inde; analist/kullanıcı ayrımı Trino rules.json'da yapılır
      lakehouse_sandbox:
        assign_to: [sandbox_writers]
        privileges:
          namespace:
            sandbox: [NAMESPACE_READ_PROPERTIES, TABLE_LIST, TABLE_CREATE, TABLE_DROP, TABLE_READ_PROPERTIES, TABLE_WRITE_PROPERTIES, TABLE_READ_DATA, TABLE_WRITE_DATA]
    namespaces:
      - name: shop_raw
      - name: shop
      - name: nginx_raw
      - name: crm_raw
      - name: crm
      - name: sandbox          # analist/kullanıcı çalışma alanı (Trino sandbox_writers)
