name: e2e
on:
  push: {branches: [v2]}
  pull_request: {branches: [v2]}
jobs:
  helm-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with: {version: v4.2.4}
      # Helm 4: git kaynaklı plugin'in provenance'ı yok -> doğrulama kapalı kurulur (sürüm sabit)
      - run: helm plugin install --verify=false --version 1.1.2 https://github.com/helm-unittest/helm-unittest && helm unittest glue
      # Prod render yolu (platform: openshift) da derlensin: unittest varsayılan değerlerle koşar
      - name: prod + dev değer dosyalarıyla render
        run: helm template glue -f platform/values/glue.yaml >/dev/null && helm template glue -f platform/values/glue-dev.yaml >/dev/null
  e2e-kind:
    runs-on: ubuntu-latest
    # F4 yolları eklendi (Trino, Superset, JupyterHub, Zeppelin): pyspark-notebook imajı tek başına ~4,5 dk çekiyor
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with: {version: v4.2.4}
      - uses: helm/kind-action@v1
        with: {version: v0.33.0, cluster_name: lakehouse, install_only: true}
      - name: e2e (ArgoCD, bu commit)
        run: KIND_CLUSTER=lakehouse test/e2e/run.sh --mode argocd --repo "https://github.com/${{ github.repository }}.git" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: teşhis (başarısızlıkta)
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl -n lakehouse get pods -o wide || true
          kubectl -n lakehouse get kafkaconnect,kafkaconnector,cluster,keycloak || true
          kubectl -n lakehouse describe kafkaconnect connect | tail -40 || true
          kubectl -n lakehouse get kafkaconnector -o wide || true
          kubectl -n lakehouse get sparkapplication,scheduledsparkapplication || true
          for p in $(kubectl -n lakehouse get pods -o name | grep -- -driver); do kubectl -n lakehouse logs "$p" --tail=40 || true; done
          kubectl -n lakehouse get kafkatopic,kafkauser || true
          kubectl -n lakehouse logs deploy/fluent-bit --tail=40 || true
          kubectl -n lakehouse logs deploy/demo-mongo --tail=20 || true
          kubectl -n lakehouse get superset,certificate,issuer -o wide || true
          kubectl -n lakehouse describe superset superset | tail -30 || true
          kubectl -n lakehouse logs deploy/trino-coordinator --tail=60 || true
          kubectl -n lakehouse logs deploy/hub --tail=40 || true
          kubectl -n lakehouse logs deploy/zeppelin --tail=40 || true
      - name: kaynak fotoğrafı (F5 boyutlandırma girdisi)
        if: always()
        run: |
          free -m; df -h /
          kubectl describe node | sed -n '/Allocated resources/,/Events/p'
          kubectl -n lakehouse get pods -o wide | wc -l
