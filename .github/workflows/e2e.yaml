name: e2e
on:
  push: {branches: [main, v2]}          # F6 cutover: rename sonrası yalnız main kalır (T4)
  pull_request: {branches: [main, v2]}
jobs:
  helm-unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with: {version: v4.2.4}
      # Helm 4: git kaynaklı plugin'in provenance'ı yok -> doğrulama kapalı kurulur (sürüm sabit)
      - run: helm plugin install --verify=false --version 1.1.2 https://github.com/helm-unittest/helm-unittest && helm unittest glue
      # Spark job kodu (Spark'sız) sözdizimi kontrolü: import hatası/typo push edilmeden yakalanır
      - run: python3 -m py_compile glue/jobs/*.py
      # Saf-python birim testleri (merge_lib, mongo_lib): pyspark GEREKTİRMEZ — `glue/jobs/tests/conftest.py`
      # yalnız `glue/jobs`'ı sys.path'e ekler, test edilen modüller Spark import etmez (bu yüzden `-k`/marker
      # filtresi de gerekmiyor). Sürümler `glue/jobs/requirements-dev.txt`te sabit (pytest 8.4.1).
      - name: pytest (glue/jobs birim testleri)
        run: |
          pip install -r glue/jobs/requirements-dev.txt
          python3 -m pytest glue/jobs/tests -q
      # Prod render yolu (platform: openshift) da derlensin: unittest varsayılan değerlerle koşar
      - name: prod + dev değer dosyalarıyla render
        run: helm template glue -f platform/values/glue.yaml >/dev/null && helm template glue -f platform/values/glue-dev.yaml >/dev/null
      # Upstream chart'ların PROD değer dosyaları e2e'de hiç render edilmiyor (dev overlay'i farklı dosya kullanır):
      # bu iki adım prod-only anahtarlarda (trino-ldap, jupyterhub Keycloak URL'leri) şema/şablon hatasını yakalar.
      - name: prod Trino render (chart 1.42.2, AD/LDAP dâhil)
        run: |
          helm repo add trino https://trinodb.github.io/charts
          helm template trino trino/trino --version 1.42.2 -f platform/values/trino.yaml -f platform/values/trino-ldap.yaml >/dev/null
      - name: prod JupyterHub render (z2jh 4.4.2)
        run: |
          helm repo add jupyterhub https://hub.jupyter.org/helm-chart/
          helm template jupyterhub jupyterhub/jupyterhub --version 4.4.2 -f platform/values/jupyterhub.yaml >/dev/null
      # F5 upstream chart'ları: monitoring/velero DEV-ONLY overlay'de (platform/apps/dev) olduğu için bir
      # şablon/tip hatası ancak küme kurulurken (30+ dk sonra) görünürdü; bu üç adım onu 1 dk'da yakalar.
      # KAPSAM SINIRI: velero 12.1.0 ve plugin-barman-cloud 0.8.0 `values.schema.json` TAŞIR (şema doğrulaması
      # da devreye girer), ama kube-prometheus-stack 91.4.1 (ve kube-state-metrics subchart'ı) TAŞIMAZ ->
      # monitoring-dev.yaml için bu kapı yalnız **şablon/tip** hatası yakalar; yanlış yazılmış bir ANAHTAR
      # (ör. customResourceState bloğunda) sessizce geçer (o blok ConfigMap'e olduğu gibi kopyalanır).
      # Hiçbir şema `additionalProperties: false` demiyor. cnpg-barman'ın değer dosyası yok; Application
      # (platform/apps/00-cnpg-barman.yaml) yalnız `resources` veriyor -> render onunla AYNI değerle koşar.
      - name: F5 render (kube-prometheus-stack 91.4.1, velero 12.1.0, plugin-barman-cloud 0.8.0)
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add vmware-tanzu https://vmware-tanzu.github.io/helm-charts
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm template monitoring prometheus-community/kube-prometheus-stack --version 91.4.1 -f platform/values/monitoring-dev.yaml >/dev/null
          helm template velero vmware-tanzu/velero --version 12.1.0 -f platform/values/velero-dev.yaml >/dev/null
          helm template plugin-barman-cloud cnpg/plugin-barman-cloud --version 0.8.0 --set-json 'resources={"requests":{"cpu":"10m","memory":"64Mi"}}' >/dev/null
  e2e-kind:
    runs-on: ubuntu-latest
    # F4 yolları eklendi (Trino, Superset, JupyterHub, Zeppelin): pyspark-notebook imajı tek başına ~4,5 dk çekiyor
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with: {version: v4.2.4}
      - uses: helm/kind-action@v1
        with: {version: v0.33.0, cluster_name: lakehouse, install_only: true}
      - name: e2e (ArgoCD, bu commit)
        run: KIND_CLUSTER=lakehouse test/e2e/run.sh --mode argocd --repo "https://github.com/${{ github.repository }}.git" --revision "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: teşhis (başarısızlıkta)
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl -n lakehouse get pods -o wide || true
          kubectl -n lakehouse get kafkaconnect,kafkaconnector,cluster,keycloak || true
          kubectl -n lakehouse describe kafkaconnect connect | tail -40 || true
          kubectl -n lakehouse get kafkaconnector -o wide || true
          kubectl -n lakehouse get sparkapplication,scheduledsparkapplication || true
          for p in $(kubectl -n lakehouse get pods -o name | grep -- -driver); do kubectl -n lakehouse logs "$p" --tail=40 || true; done
          kubectl -n lakehouse get kafkatopic,kafkauser || true
          kubectl -n lakehouse logs deploy/fluent-bit --tail=40 || true
          kubectl -n lakehouse logs deploy/demo-mongo --tail=20 || true
          kubectl -n lakehouse get superset,certificate,issuer -o wide || true
          kubectl -n lakehouse describe superset superset | tail -30 || true
          kubectl -n lakehouse logs deploy/trino-coordinator --tail=60 || true
          kubectl -n lakehouse logs deploy/hub --tail=40 || true
          kubectl -n lakehouse logs deploy/zeppelin --tail=40 || true
          kubectl -n argocd get app glue -o jsonpath='{.status.operationState.phase} {.status.operationState.message}{"\n"}' || true
          kubectl -n argocd get app glue -o json | jq -r '.status.conditions[]? | "\(.type): \(.message)"' || true
          kubectl -n argocd get app glue -o json | jq -r '.status.resources[]? | select((.status != "Synced") or ((.health.status // "Healthy") != "Healthy")) | "\(.kind)/\(.name) sync=\(.status) health=\(.health.status // "-")"' || true
          kubectl -n argocd logs statefulset/argocd-application-controller --tail=200 | grep -iE 'glue|webhook|error' | tail -40 || true
      - name: F5 teşhis — izleme + DR (başarısızlıkta)
        if: failure()
        run: |
          # İzleme yığını (dev overlay, release "monitoring" ns "monitoring", sync-wave -1)
          kubectl -n monitoring get pods,prometheus,servicemonitor,podmonitor -o wide || true
          kubectl -n monitoring logs sts/prometheus-monitoring-kube-prometheus-prometheus -c prometheus --tail=60 || true
          # Grafana dashboard sidecar'ı: monitoring-path.sh'in /api/search iddiası düşerse ConfigMap listesi
          # sidecar'ın onu GERÇEKTEN aldığını göstermez; alma/yazma kaydı yalnız bu log'da.
          kubectl -n monitoring logs deploy/monitoring-grafana -c grafana-sc-dashboard --tail=40 || true
          # lakehouse ns'indeki izleme/CNPG-yedek nesneleri (PodMonitor kafka-resources-metrics, 5 kurallı PrometheusRule,
          # ObjectStore lakehouse-backups, 3 ScheduledBackup). "backup" KISA ADI CNPG'ye çözülür -> tam ad yazılıyor.
          kubectl -n lakehouse get prometheusrule,podmonitor,servicemonitor,objectstore,scheduledbackup,backups.postgresql.cnpg.io || true
          kubectl -n lakehouse get configmap -l grafana_dashboard=1 || true
          kubectl -n lakehouse get cluster -o custom-columns='NAME:.metadata.name,ARCHIVING:.status.conditions[?(@.type=="ContinuousArchiving")].status' || true
          # Velero: kısa ad çakışması nedeniyle TAM kaynak adları (backups.velero.io vb.)
          kubectl -n velero get pods,backupstoragelocations,schedules -o wide || true
          kubectl -n velero get backups.velero.io,restores.velero.io,podvolumebackups.velero.io || true
          kubectl -n velero logs deploy/velero --tail=80 || true
          kubectl -n velero logs -l name=node-agent --tail=40 || true
          # Prometheus hedef/kural özeti: e2e'nin UP/M iddiaları düştüğünde hangi hedefin down olduğunu gösterir
          kubectl -n monitoring port-forward svc/monitoring-kube-prometheus-prometheus 9090:9090 >/dev/null 2>&1 &
          PF=$!; sleep 8
          echo "== active targets (job health lastError)"
          curl -sS --max-time 20 localhost:9090/api/v1/targets | jq -r '.data.activeTargets[]? | "\(.labels.job // "-")\t\(.health)\t\(.lastError // "")"' | sort | uniq -c || true
          echo "== rules (name health state)"
          curl -sS --max-time 20 localhost:9090/api/v1/rules | jq -r '.data.groups[]?.rules[]? | "\(.name)\t\(.health)\t\(.state // "-")"' || true
          echo "== firing ALERTS"
          curl -sS --max-time 20 --get --data-urlencode 'query=ALERTS{alertstate="firing"}' localhost:9090/api/v1/query | jq -r '.data.result[]? | .metric | tostring' || true
          kill "$PF" 2>/dev/null || true
      - name: kaynak fotoğrafı (F5 boyutlandırma girdisi)
        if: always()
        run: |
          # `|| true`: bu adım `if: always()` ile koşar; e2e küme kurmadan düştüyse kubectl hata verir ve
          # (set -e) fotoğraf adımı da kırmızı görünür -> asıl başarısızlığı gizler.
          free -m || true; df -h / || true
          kubectl describe node | sed -n '/Allocated resources/,/Events/p' || true
          kubectl -n lakehouse get pods -o wide | wc -l || true
