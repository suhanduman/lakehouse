# Referans dbt CronJob'u (e2e'nin ve glue chart'ının PARÇASI DEĞİLDİR — elle uygulanır).
# Özel imaj yasağı: resmi bir `dbt-trino` imajı YOKTUR, bu yüzden resmi `python:3.13-slim` imajı
# kullanılır ve `dbt-trino` her koşuda pip ile kurulur (PyPI erişimi gerekir; kapalı ağda iç PyPI aynası).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-gold
  namespace: lakehouse
spec:
  schedule: "0 5 * * *"            # silver-merge ve gecelik bakımdan SONRA
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: dbt
            image: python:3.13-slim
            env:
            - {name: TRINO_USER,     valueFrom: {secretKeyRef: {name: dbt-trino, key: username}}}
            - {name: TRINO_PASSWORD, valueFrom: {secretKeyRef: {name: dbt-trino, key: password}}}
            - {name: HOME, value: /tmp}
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              pip install --no-cache-dir 'dbt-trino==1.10.4'
              # ConfigMap anahtarları DÜZ'dür (alt dizin yok) -> proje düzenini yazılabilir bir yerde kur
              mkdir -p /tmp/project/models/gold
              cp /dbt-project/dbt_project.yml /dbt-project/profiles.yml /tmp/project/
              cp /dbt-project/orders_daily.sql /tmp/project/models/gold/
              cd /tmp/project
              dbt debug --profiles-dir /tmp/project --project-dir /tmp/project
              dbt run   --profiles-dir /tmp/project --project-dir /tmp/project
            volumeMounts:
            - {name: project, mountPath: /dbt-project, readOnly: true}
            - {name: ca,      mountPath: /etc/lakehouse-ca, readOnly: true}
            - {name: tmp,     mountPath: /tmp}
            resources:
              requests: {cpu: 100m, memory: 256Mi}
              limits: {memory: 1Gi}
          volumes:
          - {name: project, configMap: {name: dbt-project}}     # dbt_project.yml, profiles.yml, orders_daily.sql
          - {name: ca,      secret: {secretName: lakehouse-ca}} # tls.crt -> profiles.yml `cert`
          - {name: tmp,     emptyDir: {}}
