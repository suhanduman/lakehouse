# Zeppelin Shiro — Active Directory (LDAPS) şablonu. PROD.
#
# Kurulum (glue'dan ÖNCE; components.devSecrets=false olduğu için chart bu Secret'ı üretmez):
#   kubectl -n lakehouse create secret generic zeppelin-shiro --from-file=shiro.ini=shiro-ad.ini
# Değişiklikten sonra: kubectl -n lakehouse rollout restart deploy/zeppelin
#
# DC=/OU= değerlerini, systemUsername/systemPassword'ü ve ldaps ana bilgisayarını müşteri AD'sine göre doldurun.
# LDAPS (636) zorunlu: AD parolaları düz LDAP'ta açık gider. Zeppelin JVM'i AD sunucu sertifikasının
# zincirine güvenmeli (kurumsal kök CA değilse: cacerts'e ekleyin — runbooks/install.md "Kurumsal kök CA").

[main]
activeDirectoryRealm = org.apache.zeppelin.realm.ActiveDirectoryGroupRealm
activeDirectoryRealm.systemUsername = CN=svc-zeppelin,OU=ServiceAccounts,DC=example,DC=com
activeDirectoryRealm.systemPassword = DEĞİŞTİR
activeDirectoryRealm.searchBase = DC=example,DC=com
activeDirectoryRealm.url = ldaps://ad.example.com:636
activeDirectoryRealm.principalSuffix = @example.com
# AD grubu -> Zeppelin rolü (aşağıdaki [roles] ve [urls] ile aynı adlar)
activeDirectoryRealm.groupRolesMap = "CN=lakehouse-admins,OU=Groups,DC=example,DC=com":"admin","CN=lakehouse-analysts,OU=Groups,DC=example,DC=com":"analyst","CN=lakehouse-students,OU=Groups,DC=example,DC=com":"student"
# Grup üyeliği değişiklikleri bir sonraki oturum açmada geçerli olsun (yetki önbelleği yok)
activeDirectoryRealm.authorizationCachingEnabled = false
securityManager.realms = $activeDirectoryRealm

sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
cookie = org.apache.shiro.web.servlet.SimpleCookie
cookie.name = JSESSIONID
cookie.httpOnly = true
cookie.sameSite = LAX
cookie.secure = true                  # Route/Ingress TLS'i sonlandırır: çerez yalnız HTTPS'te
sessionManager.sessionIdCookie = $cookie
securityManager.sessionManager = $sessionManager
securityManager.sessionManager.globalSessionTimeout = 86400000
shiro.loginUrl = /api/login

[roles]
admin = *
analyst = *
student = *

[urls]
# Sıra önemlidir: İLK EŞLEŞEN kural kazanır.
/api/version = anon
/api/cluster/address = anon
/api/interpreter/** = authc, roles[admin]
/api/notebook-repositories/** = authc, roles[admin]
/api/configurations/** = authc, roles[admin]
/api/credential/** = authc, roles[admin]
/** = authc
