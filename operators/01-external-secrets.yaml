# ExternalSecrets Operator — cluster-scoped OLM bootstrap. Pulls Secret
# material (S3 object-store creds, AD bind creds, OIDC client secrets) from
# Vault/AD at runtime — see tools/README.md "Secret'ları hazırlama" note
# ("Üretimde `oc create secret` yerine ExternalSecret CR ile Vault'tan
# çekin") and `values.secrets.mode: external`. This chart does not yet render
# any `ExternalSecret` CR itself (Secret material stays "name reference only"
# — see chart/values.yaml comments), but the operator/CRD is still a required
# cluster prerequisite per tools/README.md's "Ön koşullar" table and
# is checked defensively by chart/templates/_prereq-check.tpl ahead of that
# future template landing.
#
# Namespace per tools/README.md "Ön koşullar" table: `external-secrets`.
#
# POC-DOĞRULA: package/channel/source below are the current (at time of
# writing) `community-operators` catalog values for the community
# "external-secrets-operator" package. Some clusters carry a Red Hat-certified
# build under a different package name — confirm with
# `oc get packagemanifests -n openshift-marketplace | grep -i external-secrets`
# before applying.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: external-secrets-operatorgroup
  namespace: external-secrets
# Empty spec (no `targetNamespaces`) => AllNamespaces install mode.
# POC-DOĞRULA: ExternalSecrets Operator watches `ExternalSecret`/
# `SecretStore` CRs across every namespace that uses it (here: `example`),
# not just its own install namespace — AllNamespaces is the commonly
# documented install mode for this operator. If your cluster's OLM
# catalog entry only supports OwnNamespace/SingleNamespace instead,
# change this to `targetNamespaces: [external-secrets, example]` (or
# whichever release namespace(s) actually need ExternalSecret CRs).
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: external-secrets-operator
  namespace: external-secrets
spec:
  channel: stable  # POC-DOĞRULA
  name: external-secrets-operator  # POC-DOĞRULA — package name/catalog listing
  source: community-operators  # POC-DOĞRULA
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
