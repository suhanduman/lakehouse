# Keycloak Operator — cluster-scoped OLM bootstrap. Provides the
# `k8s.keycloak.org/v2alpha1` `Keycloak`/
# `KeycloakRealmImport` CRDs this chart's Keycloak CR depends on
# (chart/templates/10-keycloak.yaml — grep-verified apiVersion, see that
# file's header comment on the AD -> OIDC federation broker role Keycloak
# plays for this platform, tools/README.md "Active Directory
# kimlik doğrulama stratejisi").
#
# Namespace per tools/README.md "Ön koşullar" table: `keycloak-system`.
#
# POC-DOĞRULA (important version distinction): this chart's CRs specifically
# target the MODERN Keycloak Operator's API group, `k8s.keycloak.org/v2alpha1`
# (the "Keycloak Operator" rewrite, v2, sometimes distributed as part of "Red
# Hat build of Keycloak" under package name `rhbk-operator` on
# `redhat-operators`, or as the community `keycloak-operator` package on
# `community-operators`) — NOT the legacy Operator SDK v1 "Keycloak Operator"
# (API group `keycloak.org/v1alpha1`, a DIFFERENT, older, now largely
# unmaintained CRD set). Whichever package/channel you pick here MUST ship
# the `k8s.keycloak.org` group specifically, or chart/templates/10-keycloak.yaml's
# `Keycloak`/`KeycloakRealmImport` CRs will not be recognized by the cluster.
# Confirm with:
#   oc get packagemanifests -n openshift-marketplace | grep -i keycloak
#   oc get crd keycloaks.k8s.keycloak.org  # after install, expect Established
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak-system
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: keycloak-operatorgroup
  namespace: keycloak-system
spec:
  targetNamespaces:
  - keycloak-system
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: keycloak-operator
  namespace: keycloak-system
spec:
  channel: fast  # POC-DOĞRULA (bazı kataloglarda "stable"/"alpha" olabilir)
  name: keycloak-operator  # POC-DOĞRULA — bkz. yukarıdaki rhbk-operator notu
  source: community-operators  # POC-DOĞRULA
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
