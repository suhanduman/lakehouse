# Source: lakehouse/templates/02-postgres-ha.yaml
# CNPG (CloudNativePG) HA Postgres — Nessie metadata store. 3 instance,
# 1 primary + 2 replica, automatic failover; WAL archive to S3;
# backup + PITR — only parameterized + made namespace-aware. Gated by
# `.Values.components.postgres` (also gates `pg-apicurio` in
# 11-apicurio-registry.yaml — both CNPG clusters are one "postgres"
# subsystem toggle).
#
# CNPG Operator OpenShift OperatorHub'dan önceden kurulu olmalı.
#
# CNPG Cluster adını taşıyan Secret'ları otomatik üretir:
#   pg-nessie-app       — application user (Nessie bağlanacak)
#   pg-nessie-superuser — superuser (operator kullanır)
#
# Service DNS: CNPG operatörü bu Cluster'ı reconcile ederken `pg-nessie-rw`
# (+ `-ro`/`-r`) Service'lerini KENDİSİ üretir (chart bunları literal
# `kind: Service` olarak render ETMEZ). Tüketiciler bu adı ASLA sabit
# yazmaz — `lakehouse.svc.pgNessieRw` helper'ından okur (bkz. _helpers.tpl
# ve chart/scripts/helm-check.py'nin CNPG-farkında servis-kapanış kontrolü).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-nessie
  namespace: example
spec:
  instances: 3
  # SAME pin as pg-apicurio (11-apicurio-registry.yaml) — both read
  # `versions.cnpgPostgresImage` so the two CNPG clusters can never drift
  # apart on Postgres version (parity hardening, sub-project A).
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"

  primaryUpdateStrategy: unsupervised

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "8MB"
      wal_level: "replica"
      max_wal_senders: "10"
      archive_mode: "on"
      # archive_timeout VARSAYILAN (0): yalnızca WAL dolduğunda arşivle.
      # Düşük değerlere (örn. 60s) çekmek S3'e sürekli küçük obje
      # akışı yaratır — IO yükü ve obje sayısı patlar. barman zaten zstd
      # ile sıkıştırıyor; agresif timeout yerine sıkıştırmaya güvenin.
    # NOT bir `postgresql.parameters` anahtarı — CNPG'nin GÜNCEL Cluster
    # CRD'sinde (operator 1.30 / v1) `shared_preload_libraries` kendi
    # top-level `[]string` alanına taşındı; `parameters` map'i içinde
    # bırakmak admission webhook'undan "Can't set fixed configuration
    # parameter" hatasıyla reddedilir (microk8s canlı smoke-test'te
    # doğrulandı — bkz. .superpowers/sdd/microk8s-smoke-report.md Finding 5).
    shared_preload_libraries: ["pg_stat_statements"]

  bootstrap:
    initdb:
      database: nessie
      owner: nessie

  # storageClass empty (default) = the cluster's default StorageClass — CNPG
  # only accepts an OMITTED field, not an empty string, so this template
  # renders the key at all only when a real value is set (storage-neutrality
  # convention, Product Foundation task 6.5).
  storage:
    storageClass: fast-block
    size: "50Gi"

  walStorage:
    storageClass: fast-block
    size: "20Gi"

  # S3'e WAL + base backup
  backup:
    barmanObjectStore:
      destinationPath: "s3://backups/nessie-pg"
      endpointURL: "https://s3.example.com"
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
---
