# Source: lakehouse/templates/04-nessie-ha.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nessie
  namespace: example
  labels:
    app: nessie
    app.kubernetes.io/part-of: lakehouse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nessie
  template:
    metadata:
      labels:
        app: nessie
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nessie
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels: {app: nessie}
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: s3-trust-init
        image: ghcr.io/projectnessie/nessie:0.104.3
        command: ["sh", "-c"]
        args:
          - |
            set -e
            SRC="${JAVA_HOME:-/usr/lib/jvm/jre}/lib/security/cacerts"
            [ -f "$SRC" ] || SRC="$(find / -path '*/security/cacerts' 2>/dev/null | head -1)"
            cp "$SRC" /work/s3-trust/cacerts
            keytool -importcert -noprompt -alias s3-endpoint \
              -file /mnt/s3-ca/ca-bundle.crt \
              -keystore /work/s3-trust/cacerts -storepass changeit
        volumeMounts:
          - {name: s3-trust-ca, mountPath: /mnt/s3-ca, readOnly: true}
          - {name: s3-trust-store, mountPath: /work/s3-trust}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: nessie
        image: "ghcr.io/projectnessie/nessie:0.104.3"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - {name: http, containerPort: 19120}
        - {name: mgmt, containerPort: 9000}
        env:
        # S3 internal-CA truststore — s3-trust-init container kurar
        # (prod hardening). Quarkus JAVA_OPTS_APPEND ile JVM'e verilir.
        - name: JAVA_OPTS_APPEND
          value: "-Djavax.net.ssl.trustStore=/work/s3-trust/cacerts -Djavax.net.ssl.trustStorePassword=changeit"
        # --- Version store (CNPG Cluster'dan secret ile) ---
        - {name: NESSIE_VERSION_STORE_TYPE, value: "JDBC2"}
        - {name: QUARKUS_DATASOURCE_POSTGRESQL_DB_KIND, value: "postgresql"}
        - name: QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL
          value: "jdbc:postgresql://pg-nessie-rw.example.svc.cluster.local:5432/nessie"
        - name: QUARKUS_DATASOURCE_POSTGRESQL_USERNAME
          valueFrom: {secretKeyRef: {name: pg-nessie-app, key: username}}
        - name: QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD
          valueFrom: {secretKeyRef: {name: pg-nessie-app, key: password}}
        - {name: NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE, value: "postgresql"}

        # --- Iceberg REST warehouses (multi-warehouse; PoC deseni) ---
        - name: NESSIE_CATALOG_DEFAULT_WAREHOUSE
          value: "warehouse"
        - name: NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION
          value: "s3://depo/warehouse"
        - name: NESSIE_CATALOG_WAREHOUSES_RAWDATA_LOCATION
          value: "s3://ham-veri/warehouse"

        # --- S3 (credentials from Secret, resolved via Nessie URN) ---
        - name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_REGION
          valueFrom: {secretKeyRef: {name: s3-credentials, key: region}}
        - {name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_PATH_STYLE_ACCESS, value: "true"}
        - name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ENDPOINT
          valueFrom: {secretKeyRef: {name: s3-credentials, key: endpoint}}
        - {name: NESSIE_CATALOG_SERVICE_S3_DEFAULT_OPTIONS_ACCESS_KEY, value: "urn:nessie-secret:quarkus:nessie.catalog.secrets.s3creds"}
        - name: NESSIE_CATALOG_SECRETS_S3CREDS_NAME
          valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key-id}}
        - name: NESSIE_CATALOG_SECRETS_S3CREDS_SECRET
          valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-access-key}}

        # --- AuthN — OIDC (prod'da zorunlu) ---
        # Gated by `.Values.auth.oidc.enabled` (default true — see
        # values.yaml's `auth:` comment). Unlike Trino, Nessie's Quarkus OIDC
        # extension does LAZY discovery (pod stays Running even with a
        # dead issuer, but every REST call 500s — microk8s-smoke-report.md
        # Finding 2), so this gate is a correctness/intent fix rather than a
        # crash-loop fix: when false, Nessie runs genuinely unauthenticated
        # (DEV/SMOKE-TEST ONLY) instead of silently-broken-but-"Running".
        - {name: QUARKUS_OIDC_ENABLED, value: "true"}
        - name: QUARKUS_OIDC_AUTH_SERVER_URL
          valueFrom: {secretKeyRef: {name: oidc-credentials, key: issuer-url}}
        - name: QUARKUS_OIDC_CLIENT_ID
          value: "nessie"
        - {name: NESSIE_SERVER_AUTHENTICATION_ENABLED, value: "true"}

        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "1"

        readinessProbe:
          httpGet: {path: /q/health/ready, port: mgmt}
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /q/health/live, port: mgmt}
          initialDelaySeconds: 30
          periodSeconds: 30
        volumeMounts:
        
        - name: s3-trust-store
          mountPath: /work/s3-trust
      volumes:
      
      - name: s3-trust-ca
        configMap:
          name: s3-trust-bundle
      - name: s3-trust-store
        emptyDir: {}
---
