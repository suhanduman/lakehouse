---
# Apache Shiro — ActiveDirectoryGroupRealm
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeppelin-shiro
  namespace: example
data:
  shiro.ini: |
    [main]
    # AD realm — LDAPS (port 636) + TLS; AD sertifikası Zeppelin truststore'da
    activeDirectoryRealm = org.apache.zeppelin.realm.ActiveDirectoryGroupRealm
    activeDirectoryRealm.systemUsername = ${AD_BIND_DN}
    activeDirectoryRealm.systemPassword = ${AD_BIND_PASSWORD}
    activeDirectoryRealm.searchBase = ${AD_USER_SEARCH_BASE}
    activeDirectoryRealm.url = ${AD_URL}
    activeDirectoryRealm.principalSuffix = @example.com

    # AD group DN → Zeppelin role eşlemesi
    activeDirectoryRealm.groupRolesMap = "\
      CN=lakehouse-admins,OU=Groups,DC=example,DC=com:admin,\
      CN=lakehouse-analysts,OU=Groups,DC=example,DC=com:analyst,\
      CN=lakehouse-students,OU=Groups,DC=example,DC=com:student"

    cacheManager = org.apache.shiro.cache.MemoryConstrainedCacheManager
    securityManager.cacheManager = $cacheManager
    sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
    sessionManager.globalSessionTimeout = 28800000   # 8 saat
    securityManager.sessionManager = $sessionManager
    securityManager.realms = $activeDirectoryRealm

    shiro.loginUrl = /api/login

    [roles]
    admin = *
    analyst = *
    student = *

    [urls]
    /api/version = anon
    /api/interpreter/** = authc, roles[admin]
    /api/configurations/** = authc, roles[admin]
    /api/credential/** = authc
    /** = authc
---
