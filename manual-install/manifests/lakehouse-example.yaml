  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  # storageClass empty (default) = the cluster's default StorageClass — CNPG
  # only accepts an OMITTED field, not an empty string (storage-neutrality
  # convention, Product Foundation task 6.5, same as 02-postgres-ha.yaml).
  storage:
    storageClass: fast-block
    size: "20Gi"
  walStorage:
    storageClass: fast-block
    size: "10Gi"
  backup:
    barmanObjectStore:
      destinationPath: "s3://backups/keycloak-pg"
      endpointURL: "https://s3.example.com"
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
      wal:
        # zstd — pg-nessie/pg-apicurio'nun gzip'inden KASITLI farklı.
        compression: zstd
        maxParallel: 4
      data:
        # gzip — DİKKAT: `data.compression: zstd` CNPG'nin Cluster CRD'sinde
        # GEÇERSİZ ("supported values: bzip2, gzip, lz4, snappy" — zstd bu
        # enum'da YOK), `wal.compression: zstd` (yukarıda) ise aynı CRD
        # sürümünde geçerlidir — iki farklı enum, biri zstd'yi destekliyor
        # diğeri desteklemiyor. gzip kullanılır (pg-nessie/pg-apicurio ile aynı).
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"
  resources:
    requests:
      memory: "512Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"
      cpu: "1"
---
# Source: lakehouse/templates/11-apicurio-registry.yaml
# Apicurio Registry — Avro şema deposu (ilişkisel CDC + scheduled JDBC yolları).
# Only parameterized + made namespace-aware. Storage: CNPG Postgres (sql) →
# CNPG WAL+PITR backup
# hikâyesine dahil.
#
# Two independent gates in this one file:
#   - `pg-apicurio` Cluster + ScheduledBackup -> `.Values.components.postgres`
#     (same CNPG-subsystem toggle as `pg-nessie`, 02-postgres-ha.yaml).
#   - Apicurio Deployment/Service/PDB          -> `.Values.components.apicurio`
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-apicurio
  namespace: example
spec:
  instances: 3
  # 02-postgres-ha.yaml (pg-nessie) ile AYNI pin'li imaj — sürüm drift'ini
  # önler (`versions.cnpgPostgresImage`, tek kaynak).
  imageName: "ghcr.io/cloudnative-pg/postgresql:16.4"
  # storageClass empty (default) = the cluster's default StorageClass — CNPG
  # only accepts an OMITTED field, not an empty string (storage-neutrality
  # convention, Product Foundation task 6.5, same as 02-postgres-ha.yaml).
  storage:
    size: "10Gi"
    storageClass: fast-block
  # Ayrı WAL volume (pg-nessie deseni) — apicurio için ölçeklendirildi.
  walStorage:
    size: "5Gi"
    storageClass: fast-block
  bootstrap:
    initdb:
      database: apicurio
      owner: apicurio
  backup:
    barmanObjectStore:
      destinationPath: "s3://backups/pg-apicurio"
      endpointURL: "https://s3.example.com"
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"
  monitoring:
    enablePodMonitor: true
  # Postgres pod kaynakları — apicurio için makul ölçek.
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
