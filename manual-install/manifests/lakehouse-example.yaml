# Source: lakehouse/templates/03-kafka-strimzi.yaml
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: example
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: "4.2.0"
    # metadataVersion is pinned explicitly so a future `versions.kafka` bump
    # never silently drags the KRaft metadata log format along with it (a
    # one-way upgrade). This chart's apiVersion above is parametrized
    # (`.Values.versions.strimziApi`, default `v1`) — the customer target is
    # upstream community Strimzi, where >=1.1.0 serves the Kafka CRD ONLY as
    # `v1` (`v1beta2` is gone). See `values.yaml`'s "COHERENT STRIMZI VERSION
    # TRIPLE" comment for the full strimziApi/kafka/kafkaMetadata
    # compatibility contract.
    metadataVersion: "4.2-IV1"
    listeners:
    - name: plain                    # iç plaintext (cluster içi)
      port: 9092
      type: internal
      tls: false
    - name: tls                      # iç TLS + SCRAM auth (spec §10: SCRAM+TLS)
      port: 9093
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
    - name: external                 # dış erişim — OpenShift Route + SCRAM
      port: 9094
      type: route
      tls: true
      authentication:
        type: scram-sha-512
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.retention.hours: 168
      log.segment.bytes: 1073741824
    authorization:
      type: simple
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Consumer-group lag source. The broker JMX-Prometheus exporter (metricsConfig
  # above) does NOT expose per-consumer-group lag; Strimzi's built-in
  # kafka-exporter does. Enabling it makes Strimzi run a
  # `kafka-kafka-exporter` Deployment that exports `kafka_consumergroup_lag` /
  # `kafka_consumergroup_current_offset` on its `tcp-prometheus` port — which the
  # kafka PodMonitor (podmonitors.yaml, selector strimzi.io/cluster=kafka +
  # strimzi.io/kind=Kafka, port tcp-prometheus) already scrapes, because the
  # exporter pod carries those SAME labels + port name. This is what backs the
  # `KafkaConsumerLagHigh` PrometheusRule alert; without it that alert can
  # never fire. Gated by the SAME switch as the broker metricsConfig so lag
  # scraping tracks monitoring on/off exactly.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
