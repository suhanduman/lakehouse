apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-registry
  namespace: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apicurio-registry
  template:
    metadata:
      labels:
        app: apicurio-registry
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apicurio-registry
          image: "quay.io/apicurio/apicurio-registry:3.0.6"   # POC-DOĞRULA sürüm
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            - name: APICURIO_STORAGE_KIND
              value: sql
            - name: APICURIO_STORAGE_SQL_KIND
              value: postgresql
            # Host, `lakehouse.svc.pgApicurioRw` helper'ından üretilir — CNPG
            # operatörünün bu Cluster için ürettiği gerçek Service adıyla
            # (pg-apicurio-rw) birebir aynı, namespace'e bağlı FQDN.
            - name: APICURIO_DATASOURCE_URL
              value: "jdbc:postgresql://pg-apicurio-rw.example.svc.cluster.local:5432/apicurio"
            - name: APICURIO_DATASOURCE_USERNAME
              valueFrom:
