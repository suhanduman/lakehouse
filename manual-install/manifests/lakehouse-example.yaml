apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeppelin
  namespace: example
  labels: {app: zeppelin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: zeppelin}
  template:
    metadata:
      labels: {app: zeppelin}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Spark image'a gömülü olduğu için initContainers yok.
      containers:
      - name: zeppelin
        image: "registry.apps.ocp.example.com/lakehouse/zeppelin:1.0"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports: [{containerPort: 8080}]
        env:
        - {name: SPARK_HOME,            value: "/opt/spark"}
        - {name: ZEPPELIN_NOTEBOOK_DIR, value: "/zeppelin/notebook"}
        - {name: SPARK_CONF_DIR,        value: "/spark-conf"}
        - {name: ZEPPELIN_SHIRO_CONF,   value: "/zeppelin/conf/shiro.ini"}
