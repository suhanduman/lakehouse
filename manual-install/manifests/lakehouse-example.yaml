apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-coordinator
  namespace: example
  labels: {app: trino, role: coordinator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trino, role: coordinator}
  template:
    metadata:
      labels: {app: trino, role: coordinator}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: s3-trust-init
        image: trinodb/trino:439
        command: ["sh", "-c"]
        args:
          - |
            set -e
            SRC="${JAVA_HOME:-/usr/lib/jvm/jre}/lib/security/cacerts"
            [ -f "$SRC" ] || SRC="$(find / -path '*/security/cacerts' 2>/dev/null | head -1)"
            cp "$SRC" /work/s3-trust/cacerts
            keytool -importcert -noprompt -alias s3-endpoint \
              -file /mnt/s3-ca/ca-bundle.crt \
              -keystore /work/s3-trust/cacerts -storepass changeit
        volumeMounts:
          - {name: s3-trust-ca, mountPath: /mnt/s3-ca, readOnly: true}
          - {name: s3-trust-store, mountPath: /work/s3-trust}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
      containers:
      - name: trino
        image: "trinodb/trino:439"
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports: [{containerPort: 8080}]
        env:
        - {name: S3_ENDPOINT,        valueFrom: {secretKeyRef: {name: s3-credentials, key: endpoint}}}
        - {name: S3_REGION,          valueFrom: {secretKeyRef: {name: s3-credentials, key: region}}}
        - {name: S3_ACCESS_KEY,      valueFrom: {secretKeyRef: {name: s3-credentials, key: access-key-id}}}
        - {name: S3_SECRET_KEY,      valueFrom: {secretKeyRef: {name: s3-credentials, key: secret-access-key}}}
        - {name: OIDC_ISSUER,        valueFrom: {secretKeyRef: {name: oidc-credentials, key: issuer-url}}}
        - {name: OIDC_CLIENT_ID,     valueFrom: {secretKeyRef: {name: oidc-credentials, key: trino-client-id}}}
        - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: oidc-credentials, key: trino-client-secret}}}
        # Coordinator↔worker internal-communication auth (see
        # coordinator.config.properties' `internal-communication.shared-
        # secret=${ENV:TRINO_INTERNAL_SECRET}` above) — both the coordinator
        # and worker Deployments must define this env var, or the missing
        # side crash-loops on 'unset environment variable
        # TRINO_INTERNAL_SECRET'.
        - {name: TRINO_INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: trino-internal-secret, key: shared-secret}}}
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "6Gi"
            cpu: "4"
        volumeMounts:
        
        - name: s3-trust-store
          mountPath: /work/s3-trust
        - {name: config, mountPath: /etc/trino/jvm.config,                subPath: jvm.config}
        - {name: config, mountPath: /etc/trino/config.properties,         subPath: coordinator.config.properties}
        - {name: config, mountPath: /etc/trino/node.properties,           subPath: node.properties}
        - {name: config, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties}
        - {name: config, mountPath: /etc/trino/rules.json,                subPath: rules.json}
        - {name: config, mountPath: /etc/trino/catalog/lakehouse.properties, subPath: lakehouse.properties}
        - {name: config, mountPath: /etc/trino/catalog/rawlake.properties,   subPath: rawlake.properties}
      volumes:
      
      - name: s3-trust-ca
        configMap:
          name: s3-trust-bundle
      - name: s3-trust-store
        emptyDir: {}
      - name: config
        configMap: {name: trino-config}
