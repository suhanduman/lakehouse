# Source: lakehouse/templates/03-kafka-strimzi.yaml
# Strimzi Kafka (KRaft mode, node pools) — Kafka omurgası (backbone). Only
# parameterized (version/replicas/storage sizing/topic partition+RF/external
# listener type) + made namespace-aware. Gated by `.Values.components.kafka`.
#
# Strimzi Operator OperatorHub'dan önceden kurulu olmalı. KRaft = ZooKeeper yok.
#
# LOAD-BEARING (do NOT change without re-reading spec §10 + sub-project A/B):
#   - listener `tls` (9093): tls: true + authentication.type: scram-sha-512
#     (the "SCRAM+TLS" unified auth model).
#   - listener `external` (9094): OpenShift Route + tls: true +
#     authentication.type: scram-sha-512 (type itself is values-driven for
#     non-OpenShift envs; auth stays scram-sha-512 always).
#   - every KafkaUser ACL below: `connect`'s ingest-namespace ACLs
#     (cdc./jdbc./mongo./http./mqtt./amqp./control/iceberg + connect-cluster- + `connect` group prefix;
#     bkz. connect KafkaUser notu), `debezium-src`'s
#     `schema-history.` prefix, `fluentbit`'s write-only `nginx-access`,
#     `lakehouse-ingest`'s nginx-access/lms-events + `spark-` group prefix.
#   - `default.replication.factor: 3` / `min.insync.replicas: 2` cluster
#     config, and RF=3 on every KafkaTopic below.
#
# Kafka cluster adı SABİT "kafka" kalır (parametreleştirilmez) — Strimzi
# operatörü bu isimden `kafka-kafka-bootstrap` Service'ini üretir; bu isim
# `_helpers.tpl`'deki `lakehouse.svc.kafkaBootstrap` helper'ının ürettiği
# değerle birebir eşleşmek ZORUNDA (bkz. helper dosyasının header yorumu +
# chart/scripts/helm-check.py'nin Kafka-farkında servis-kapanış kontrolü).
#
# KAPSAM NOTU: `KafkaUser/spark-nginx` bu dosyada DEĞİL — o
# prod-manifests/14-nginx-ingest/spark-nginx-streaming.yaml'da tanımlı ve
# 14-nginx-ingest.yaml kapsamında migrate edilecek.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: controller
  namespace: example
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles: [controller]
  # storage.class empty (default) = the cluster's default StorageClass —
  # Strimzi only omits storageClassName on the PVC when the field is left
  # out entirely (storage-neutrality convention, Product Foundation task 6.5).
  storage:
    type: persistent-claim
    size: "10Gi"
    deleteClaim: false
    class: fast-block
  resources:
    requests: {memory: "512Mi", cpu: "250m"}
    limits:   {memory: "1Gi",   cpu: "500m"}
