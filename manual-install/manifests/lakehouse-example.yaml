# Source: lakehouse/templates/03-kafka-strimzi.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: example
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: lakehouse
    helm.sh/chart: lakehouse-0.1.0
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      # Broker/topic başına mesaj & bayt hızı, consumer lag, request süreleri.
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*, topic=(.+)><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
        labels: {topic: "$3"}
      - pattern: kafka.server<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_server_$1_$2_total
        type: COUNTER
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels: {clientId: "$3", topic: "$4", partition: "$5"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
