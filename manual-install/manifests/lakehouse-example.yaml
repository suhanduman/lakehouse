# Source: lakehouse/templates/13-connectors.yaml
# Kafka Connectors — per-source ingest (Debezium CDC + scheduled JDBC) + the
# global Iceberg fan-out sink. Only parameterized + made namespace-aware.
#
# TWO independent gates in this one file (see values.yaml `components.connectors`):
#   - `iceberg-sink-cdc` (`cdc.*`/`jdbc.*`, Avro/Apicurio) + `iceberg-sink-mongo`
#     (`mongo.*`, JSON — Mongo has no Avro schema, see that connector's own
#     comment) -> BOTH gated by `.Values.components.connectors.enabled` only.
#     Together they are CORE ingest infrastructure, not an example: the pair
#     is the source-agnostic sink that lands every `cdc.*`/`jdbc.*`/`mongo.*`
#     topic into Iceberg via the `_target_table` SMT field the source
#     connectors below set. Nothing else in this chart (and nothing in the
#     Console, `console/backend/app/render_service.py`) ever generates a
#     replacement for either, so — unlike the three source connectors below —
#     neither is gated behind the `examples` flag; without them the ingest
#     pipeline has no sink at all, in ANY environment.
#   - `dbz-mssql-students` / `jdbc-mssql-scheduled` / `dbz-mongo-lms` (the
#     three EXAMPLE per-source connectors) -> ALSO requires
#     `.Values.components.connectors.examples.enabled` (default `false`).
#     These are demo/reference instances of the ingest pattern for a
#     specific PoC source (MSSQL "OgrenciDB", Mongo "lms") — real
#     per-source CRs are generated at runtime by the scaffold script
#     (`scaffold-source.sh`) or the Console's add-source wizard
#     (`console/backend/app/orchestrator.py`), not by this chart.
#
# LOAD-BEARING (do not change without re-reading spec + sub-project A —
# docs/superpowers/specs/2026-07-17-ingest-omurgasi-design.md):
#   - Debezium SMTs: `unwrap` (ExtractNewRecordState, delete.handling.mode=
#     rewrite, drop.tombstones=false) + `route` (InsertField$Value,
#     `_target_table` static value) — the Iceberg sink's dynamic routing
#     depends on EVERY source connector setting this field.
#   - COLON-form `${directory:/mnt/external-configuration/<vol>:<key>}`
#     credential references — resolved by 12-kafka-connect.yaml's
#     `config.providers=directory` + the matching `externalConfiguration`
#     volume `name:`s. Never rewritten to `${file:...}` or any other form.
#   - `schema.history.internal.*` SASL_SSL/SCRAM-SHA-512 + truststore block
#     (Debezium's own producer/consumer to the `schema-history.*` topic;
#     the `debezium-src` KafkaUser, 03-kafka-strimzi.yaml, only has ACLs
#     for that prefix — nothing else).
#   - `errors.deadletterqueue.*` on the source connectors is a documented
#     no-op (DLQ is a sink-only Connect feature; real DLQ delivery happens
#     via `iceberg-sink-cdc` below) — preserved verbatim anyway, unchanged
#     from source.
#
# Service wiring (spec §3.1/§8):
#   - schema-history bootstrap servers + Apicurio registry URL resolve via
#     `lakehouse.svc.kafkaBootstrap` / `lakehouse.svc.apicurio` — the SAME
#     helpers 12-kafka-connect.yaml / 11-apicurio-registry.yaml render under.
#   - iceberg-sink-cdc's Nessie catalog URI resolves via `lakehouse.svc.nessie`
#     — the SAME helper 05-spark-operator.yaml/04-nessie-ha.yaml/
#     06-trino-ha.yaml use (path stays the source's exact `/iceberg/v1`).
#   - The MSSQL_HOST / MONGO_HOST / S3_ENDPOINT source hostnames
#     are PRE-Helm double-brace placeholder tokens held in `values.yaml`
#     (same convention as `postgres.nessie.backup.endpointURL`) — plain
#     values-file string data, never parsed by Helm's template engine. They
#     are deliberately NOT spelled out with literal double braces in this
#     comment: doing so inside a template file (even in a YAML `#` comment)
#     makes Helm's Go-template engine try to parse them as an action, since
#     it processes raw text before any YAML/comment parsing — the exact
#     `helm lint` failure this phrasing avoids.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: iceberg-sink-cdc
  namespace: example
  labels: {strimzi.io/cluster: connect}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: 2
  config:
    # Deterministic dedup tie-break (silver-merge): stamp each record's Kafka
    # offset + partition into Bronze. InsertField's offset/partition fields are
    # sink-only Connect record metadata. Debezium keys by PK -> same key -> same
    # partition -> offset monotonic per key -> the MERGE's final ORDER BY key.
    transforms: "kafkameta"
    transforms.kafkameta.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.kafkameta.offset.field: "__kafka_offset"
    transforms.kafkameta.partition.field: "__kafka_partition"
    # AVRO (Apicurio) sources only — relational CDC (cdc.*) + scheduled JDBC
    # (jdbc.*). Mongo (mongo.*) is JSON, NOT Avro: one Connect sink has a SINGLE
    # value.converter, so a JSON source cannot share this Avro sink. Mongo needs
    # its OWN sink (JsonConverter).
    topics.regex: "cdc\\..*|jdbc\\..*"
    # Sink deserializes Avro via Apicurio (matches Debezium/Aiven relational
    # producers). Without this the sink uses the worker-default JsonConverter and
    # fails with "Illegal character (CTRL-CHAR)" on Avro bytes.
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: "http://apicurio-registry:8080/apis/registry/v2"
    value.converter.apicurio.registry.url: "http://apicurio-registry:8080/apis/registry/v2"
    # --- Nessie REST katalog ---
    iceberg.catalog.type: rest
    # Nessie Iceberg REST base — MUST end at /iceberg/ (Trino/Spark use the same).
    # A trailing /v1 makes Nessie parse "v1" as a named reference (branch) →
    # "Named reference 'v1' not found".
    iceberg.catalog.uri: "http://nessie:19120/iceberg/"
    iceberg.catalog.warehouse: "rawdata"
    # --- S3 ---
    iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    iceberg.catalog.s3.endpoint: "https://s3.example.com"
    iceberg.catalog.s3.path-style-access: "true"
    iceberg.catalog.s3.access-key-id: "${directory:/mnt/external-configuration/s3:access-key-id}"
    iceberg.catalog.s3.secret-access-key: "${directory:/mnt/external-configuration/s3:secret-access-key}"
    # --- Fan-out (dinamik routing) ---
    iceberg.tables.dynamic-enabled: "true"
    iceberg.tables.route-field: "_target_table"
    iceberg.tables.auto-create-enabled: "true"
    iceberg.tables.evolve-schema-enabled: "true"
    # APPEND-ONLY: the Apache Iceberg sink cannot upsert (no cdc-field/upsert key
    # exists — verified against apache-iceberg-1.9.0 source). This sink writes the
    # raw CDC change-log to Bronze (rawdata warehouse); current-state upsert happens
    # downstream in the `silver-merge` Spark job (MERGE INTO lakehouse.<ns>.<t>).
    # See docs/superpowers/specs/2026-07-21-medallion-cdc-merge-design.md.
    # --- Commit ---
    iceberg.control.commit.interval-ms: "60000"
    # commit.timeout-ms: koordinatörün, worker'ların DATA_COMPLETE'ini beklediği
    # süre. Kaynak-kısıtlı tek-worker Connect'te sink'in control-consumer'ı
    # (cg-control-*) Kafka 4.2 grup koordinatörüne karşı ~commit-interval
    # periyoduyla rebalance/flap yaşayabiliyor; varsayılan 30s pencere worker'ın
    # geç DATA_COMPLETE'ini kaçırıp "committed to 0 table(s)" üretiyor. Kısıtlı
    # overlay'de bunu büyütmek (ör. 180000) commit'i güvenilir kılar; prod'da
    # varsayılan yeterli.
    iceberg.control.commit.timeout-ms: "30000"
    # --- Kafka client overrides (iceberg.kafka.* -> all sink Kafka clients) ---
    # --- Hata/DLQ ---
    errors.tolerance: all
    errors.log.enable: "true"
    errors.deadletterqueue.topic.name: "iceberg-sink.dlq"
    # DLQ topic replication factor — Connect auto-creates the DLQ topic with
    # this RF; the default (3) fails on a <3-broker cluster ("Could not
    # initialize dead letter queue"). Tracks broker count via the same knob as
    # Connect's internal topics (1 on microk8s-ingest, 3 in prod).
    errors.deadletterqueue.topic.replication.factor: "3"
    errors.deadletterqueue.context.headers.enable: "true"
