# -------- ClusterRoleBinding: grafana SA -> cluster-monitoring-view --------
# `cluster-monitoring-view` is an OpenShift BUILT-IN ClusterRole (provided by
# the platform; not rendered by this chart) — it grants read access to UWM's
# tenancy-aware Thanos querier. The binding NAME is suffixed with the release
# namespace because a ClusterRoleBinding is cluster-scoped: without the suffix
# two installs of this chart into different release namespaces (e.g. the two
# namespaces the test harness renders into) would collide on one global object.
# Same precedent as chart/templates/prereq-check-job.yaml's CRB.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-monitoring-view-example
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: lakehouse
    helm.sh/chart: lakehouse-0.1.0
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: example
roleRef:
  kind: ClusterRole
  name: cluster-monitoring-view
  apiGroup: rbac.authorization.k8s.io
