              key: client-secret
        - {name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: "openid email profile"}
        - {name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: "https://auth.lakehouse.example.com/realms/lakehouse/protocol/openid-connect/auth"}
        - {name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: "https://auth.lakehouse.example.com/realms/lakehouse/protocol/openid-connect/token"}
        - {name: GF_AUTH_GENERIC_OAUTH_API_URL, value: "https://auth.lakehouse.example.com/realms/lakehouse/protocol/openid-connect/userinfo"}
        volumeMounts:
        - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
        - {name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
        - {name: dashboard-kafka, mountPath: /var/lib/grafana/dashboards/kafka.json, subPath: kafka.json, readOnly: true}
        - {name: dashboard-cnpg, mountPath: /var/lib/grafana/dashboards/cnpg.json, subPath: cnpg.json, readOnly: true}
        - {name: dashboard-trino, mountPath: /var/lib/grafana/dashboards/trino.json, subPath: trino.json, readOnly: true}
        - {name: dashboard-iceberg, mountPath: /var/lib/grafana/dashboards/iceberg.json, subPath: iceberg.json, readOnly: true}
        - {name: dashboard-console, mountPath: /var/lib/grafana/dashboards/console.json, subPath: console.json, readOnly: true}
        - {name: dashboard-platform, mountPath: /var/lib/grafana/dashboards/platform.json, subPath: platform.json, readOnly: true}
        readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 30, periodSeconds: 15}
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - {name: datasources, configMap: {name: grafana-datasources}}
      - {name: dashboard-providers, configMap: {name: grafana-dashboard-providers}}
      - {name: dashboard-kafka, configMap: {name: grafana-dashboard-kafka}}
      - {name: dashboard-cnpg, configMap: {name: grafana-dashboard-cnpg}}
      - {name: dashboard-trino, configMap: {name: grafana-dashboard-trino}}
      - {name: dashboard-iceberg, configMap: {name: grafana-dashboard-iceberg}}
      - {name: dashboard-console, configMap: {name: grafana-dashboard-console}}
