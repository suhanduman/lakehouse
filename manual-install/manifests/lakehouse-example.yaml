# -------- Deployment --------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: example
  labels:
    app.kubernetes.io/part-of: lakehouse
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: lakehouse
    helm.sh/chart: lakehouse-0.1.0
spec:
  replicas: 1
