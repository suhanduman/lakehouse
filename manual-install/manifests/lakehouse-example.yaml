# Source: lakehouse/templates/05-spark-operator.yaml
# Paylaşılan Spark config — tüm SparkApplication'lar mount eder.
# PoC spark.yaml ile aynı iki catalog (lakehouse + rawlake).
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-defaults
  namespace: example
data:
  spark-defaults.conf: |
    # Iceberg/AWS/Kafka jars are BAKED into the spark-py image (images/spark-py/
    # Dockerfile) — no runtime spark.jars.packages / Ivy resolution.
    spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

    # KRITIK: Dynamic allocation Kubernetes üzerinde çalışırken executor
    # scale-down olduğunda shuffle verisi kaybolur → job crash. External
    # Shuffle Service K8s'te yok; Spark 3.5'in içindeki "Shuffle Tracking"
    # mekanizması executor'ı shuffle verisi okunmayı bekleyen süre
    # (timeout) boyunca canlı tutar. Bu iki satır üretim için zorunludur.
    spark.dynamicAllocation.shuffleTracking.enabled=true
    spark.dynamicAllocation.shuffleTracking.timeout=3600s

    spark.hadoop.fs.s3a.path.style.access=true
    spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider
    # endpoint ve region pod env'den (s3-credentials Secret) gelir:
    # AWS_ENDPOINT_URL_S3, AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY

    spark.sql.catalog.lakehouse=org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.catalog-impl=org.apache.iceberg.rest.RESTCatalog
    spark.sql.catalog.lakehouse.uri=http://nessie:19120/iceberg/
    spark.sql.catalog.lakehouse.warehouse=s3://depo/warehouse
    spark.sql.catalog.lakehouse.io-impl=org.apache.iceberg.aws.s3.S3FileIO

    spark.sql.catalog.rawlake=org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.rawlake.catalog-impl=org.apache.iceberg.rest.RESTCatalog
    spark.sql.catalog.rawlake.uri=http://nessie:19120/iceberg/
    spark.sql.catalog.rawlake.warehouse=rawdata
    spark.sql.catalog.rawlake.io-impl=org.apache.iceberg.aws.s3.S3FileIO
---
# Source: lakehouse/templates/06-trino-ha.yaml
# Trino HA — Coordinator + N Worker + OIDC + internal-communication auth.
# Only parameterized + made namespace-aware. Gated by
# `.Values.components.trino`.
#
# İç iletişim: internal-communication.shared-secret pod'lar arası kimlik
# doğrulama için zorunlu (HMAC). Bulk data şifrelemesi için iki seçenek:
#   (a) Trino native internal TLS — ConfigMap'te yorum satırları aktif
#       edilir + cert-manager Certificate CR ile keystore.p12 üretilir.
#   (b) OpenShift Service Mesh (Istio) — namespace'e PeerAuthentication
#       {mode: STRICT} uygulanır; uygulama kodunda değişiklik gerekmez.
#
# Service wiring (spec §3.1/§8 — never hardcode a cross-component name):
#   - Trino coordinator's own Service NAME is `lakehouse.svc.trino` (helper,
#     resolves to `trino-coordinator` — matches the Strimzi/CNPG-style
#     canonical name convention in _helpers.tpl).
#   - Trino's Iceberg/Nessie REST catalog URI resolves the Nessie Service
#     via `lakehouse.svc.nessie` + `lakehouse.fqdn` — the SAME helper Nessie
#     itself is rendered under (04-nessie-ha.yaml). Path stays the exact
#     `/iceberg/` prefix the source uses (no `/v1`).
#   - S3 + OIDC credentials come from `.Values.storage.s3.
#     secretName` / `.Values.oidc.secretName` (name-reference-only Secrets,
#     see chart/templates/01-storage.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: example
data:
  jvm.config: |
    -server
    # Xmx 6G (worker pod limit 8Gi) — JVM overhead + Iceberg memory-mapped
    # file okuma için 2 GB tampon bırakır. OOM crash riskini düşürür.
    -Xmx6G
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+UnlockDiagnosticVMOptions
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heap-dump.hprof
    # S3 internal-CA truststore — s3-trust-init container kurar
    # (prod hardening; global.security.s3TrustBundle.enabled).
    -Djavax.net.ssl.trustStore=/work/s3-trust/cacerts
    -Djavax.net.ssl.trustStorePassword=changeit
  coordinator.config.properties: |
    coordinator=true
    # HA prod: false (dedicated workers execute). Single-node/memory-minimal
    # (worker.replicas=0) needs true, else there are ZERO execution nodes and
    # every query hangs/fails. Default false; the microk8s-ingest overlay
    # flips it true.
    node-scheduler.include-coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino-coordinator:8080
    query.max-memory=10GB
    # coord sadece planner; küçük tut
    query.max-memory-per-node=1.5GB
    memory.heap-headroom-per-node=1GB
    # OpenMetrics endpoint: Trino serves it AUTOMATICALLY at `/metrics` on the
    # HTTP port — there is NO enable flag; an unknown property here (e.g. a
    # nonexistent `openmetrics.jmx.enabled`) makes the coordinator CRASH-LOOP
    # at startup, since Trino rejects unrecognized config properties (see
    # Trino docs admin/openmetrics.html). The endpoint is protected by the
    # SAME authentication as the Web UI/client API: with OIDC on (prod) it
    # needs HTTPS + a system-information-permitted user; the trino
    # ServiceMonitor's scrape auth must be wired accordingly on the cluster
    # (see docs/POC-DOGRULA-cluster-checklist.md). An optional
    # `openmetrics.jmx-object-names` (valid property) can filter exposed MBeans.
    # OIDC (TLS Route'ta sonlanır). Trino yalnızca `etc/config.properties`'i
    # (bu dosya) otomatik yükler — ayrı bir `oauth2.properties` dosyası
    # OTOMATİK OKUNMAZ, bu yüzden OIDC satırları doğrudan buraya inline
    # edilmiştir. Gated by `.Values.auth.oidc.enabled` (default true — see
    # values.yaml's `auth:` comment); Trino's OAuth2 authenticator does EAGER
    # discovery at startup, so with no reachable issuer this config MUST be
    # omitted entirely rather than pointed at a dummy URL, or the coordinator
    # crash-loops forever.
    http-server.authentication.type=oauth2
    web-ui.authentication.type=oauth2
    http-server.authentication.oauth2.issuer=${ENV:OIDC_ISSUER}
    http-server.authentication.oauth2.client-id=${ENV:OIDC_CLIENT_ID}
    http-server.authentication.oauth2.client-secret=${ENV:OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.principal-field=preferred_username
    http-server.authentication.oauth2.scopes=openid,email,profile
    # Pod'lar arası iletişim auth zorunlu (shared-secret Secret'tan)
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
    # Faz-2: cluster içi trafik şifreleme. Aşağıdaki satırları aktif ederek
    # coordinator↔worker arası TLS açılır. Gerekli: cert-manager Certificate
    # CR ile trino-internal-tls Secret üretmek (keystore.p12 + passphrase).
    # internal-communication.https.required=true
    # internal-communication.https.keystore.path=/etc/trino/certs/keystore.p12
    # internal-communication.https.keystore.key=${ENV:KEYSTORE_PASS}
    # discovery.uri=https://trino-coordinator:8443
    # http-server.https.enabled=true
    # http-server.https.port=8443
    # http-server.https.keystore.path=/etc/trino/certs/keystore.p12
    # http-server.https.keystore.key=${ENV:KEYSTORE_PASS}
    # Alternatif: OpenShift Service Mesh (Istio) PeerAuthentication CR ile
    # namespace-seviye mTLS; uygulama konfigürasyonu değişmez.
  worker.config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://trino-coordinator:8080
    # 4GB → 3GB: JVM + IO tamponu
    query.max-memory-per-node=3GB
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
  node.properties: |
    node.environment=prod
    node.data-dir=/data/trino
  lakehouse.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nessie.example.svc.cluster.local:19120/iceberg/
    iceberg.rest-catalog.warehouse=s3://depo/warehouse
    iceberg.register-table-procedure.enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.region=${ENV:S3_REGION}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
  rawlake.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://nessie.example.svc.cluster.local:19120/iceberg/
    iceberg.rest-catalog.warehouse=rawdata
    iceberg.register-table-procedure.enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.region=${ENV:S3_REGION}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
  access-control.properties: |
    access-control.name=file
    security.config-file=etc/rules.json
  rules.json: |
    {
      "catalogs": [
        {"user": "alice|admin-group", "catalog": ".*", "allow": "all"},
        {"user": ".*", "catalog": "lakehouse", "allow": "read-only"},
        {"user": ".*", "catalog": "rawlake",   "allow": "read-only"}
      ]
    }
