# Source: lakehouse/templates/00-namespace.yaml
# Operator ingress: the cluster-scoped operators this platform depends on
# live OUTSIDE the release namespace and must reach INTO it — CloudNativePG
# polls every instance pod's status endpoint (:8000; without it the Cluster
# sits at "Instance Status Extraction Error: HTTP communication issue" and
# never reports Ready) and Strimzi's cluster operator talks to the Kafka
# pods' KafkaAgent. On a CNI that actually enforces NetworkPolicy (Calico,
# Cilium, kind >= 0.24 — live kind-e2e finding, 2026-07-22) the
# default-deny above would break reconciliation of every operator-managed
# workload. Source namespaces are values-driven
# (`namespaceConfig.operatorNamespaces`): defaults cover BOTH install paths
# — the vanilla bootstrap's helm-installed operator namespaces
# (bootstrap/operators.env) AND OpenShift's OLM `openshift-operators` — via
# the k8s-standard `kubernetes.io/metadata.name` label (present on every
# namespace on every platform); entries for namespaces that don't exist on
# a given cluster simply match nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-operator-namespaces
  namespace: example
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: strimzi
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spark-operator
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: keycloak-system
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-operators
