apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnector
metadata: {name: "dbz-{{SOURCE}}-{{TABLE}}", namespace: example, labels: {strimzi.io/cluster: connect}}
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  tasksMax: 1
  config:
    database.hostname: "{{DB_HOST}}"
    database.port: "5432"
    database.user: "${directory:/mnt/external-configuration/{{SOURCE}}:user}"
    database.password: "${directory:/mnt/external-configuration/{{SOURCE}}:pass}"
    database.dbname: "{{DB}}"
    plugin.name: pgoutput
    slot.name: "debezium_{{SLOT_SRC}}"
    publication.name: "dbz_{{SLOT_SRC}}_pub"
    topic.prefix: "{{TOPIC_PREFIX}}"
    table.include.list: "{{TABLE}}"
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: "http://apicurio-registry:8080/apis/registry/v2"
    value.converter.apicurio.registry.url: "http://apicurio-registry:8080/apis/registry/v2"
    key.converter.apicurio.registry.auto-register: "{{AUTO_REGISTER}}"
    value.converter.apicurio.registry.auto-register: "{{AUTO_REGISTER}}"
    transforms: "unwrap,route,tsconv"
    transforms.unwrap.type: "io.debezium.transforms.ExtractNewRecordState"
    transforms.unwrap.delete.handling.mode: "rewrite"
    transforms.unwrap.drop.tombstones: "false"
    transforms.unwrap.add.fields: "op,ts_ms,source.lsn:lsn"
    transforms.route.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.route.static.field: "_target_table"
    transforms.route.static.value: "{{TARGET_NS}}_raw.{{TARGET_TABLE}}"
    transforms.tsconv.type: "org.apache.kafka.connect.transforms.TimestampConverter$Value"
    transforms.tsconv.field: "__ts_ms"
    transforms.tsconv.target.type: "Timestamp"
    errors.tolerance: all
    errors.deadletterqueue.topic.name: "{{TOPIC_PREFIX}}.{{TABLE}}.dlq"
    errors.deadletterqueue.context.headers.enable: "true"
