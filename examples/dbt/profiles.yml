# dbt-trino 1.10.4 profili. Kimlik: Trino SERVİS HESABI (HTTP Basic, htpasswd `password.db`) —
# son kullanıcı OIDC akışı bir CronJob'da kullanılamaz. Bu yüzden satır filtresi/kolon maskesi
# UYGULANMAZ (docs/50-isletme/kullanici-ve-yetki.md §7): dbt yalnız kendi Gold modellerini üretir.
lakehouse:
  target: prod
  outputs:
    prod:
      type: trino
      method: ldap                 # dbt-trino'da kullanıcı adı + parola (HTTP Basic) anlamına gelir
      user: "{{ env_var('TRINO_USER') }}"
      password: "{{ env_var('TRINO_PASSWORD') }}"
      host: trino.lakehouse.svc    # küme içi; dışarıdan: <trino.hostname>
      port: 8443                   # kimlik doğrulama YALNIZ HTTPS 8443'te (8080'de auth yok)
      http_scheme: https
      # lakehouse-ca (Secret lakehouse-ca, tls.crt) — cert-manager'ın imzaladığı Trino sertifikasının kökü.
      # NOT: alan adı dbt-trino sürümüne göre değişebilir (`cert` / `ssl_verify`); 1.10.4 belgesiyle doğrulayın.
      cert: /etc/lakehouse-ca/tls.crt
      database: lakehouse          # Trino KATALOĞU (dbt'nin "database"i)
      schema: gold                 # hedef şema = Polaris namespace'i `gold`
      threads: 4
