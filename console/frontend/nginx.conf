# Lakehouse Console frontend -- nginx server block.
#
# Installed by ../Dockerfile as /etc/nginx/conf.d/default.conf inside the
# nginxinc/nginx-unprivileged base image (which already listens on port
# 8080 and runs as a non-root user, per that image's own defaults).

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: react-router-dom (client-side routing) means paths like
    # /clusters/foo or /topics/bar have no matching file on disk. Serve
    # index.html for anything not found so the client-side router can take
    # over on hard refresh / deep link, instead of nginx returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- /api routing ------------------------------------------------------
    # The Console frontend and backend are deployed as separate Deployments +
    # Services, always co-located in the SAME namespace (whatever the Helm
    # release namespace is -- see chart/templates/console/console.yaml,
    # migrated from the pre-Helm manual manifest set's 15-lakehouse-console.yaml
    # -- see git history). The Route only exposes the
    # frontend Service, so this nginx must itself proxy /api/* to the backend
    # Service's in-cluster DNS name -- otherwise /api/* falls through to the
    # SPA fallback above and returns index.html (HTML) instead of JSON,
    # breaking every data page. `console-backend` is the backend Service
    # name/port (same chart/templates/console/console.yaml); using the bare
    # same-namespace service name (rather than a namespace-qualified FQDN)
    # keeps this proxy target namespace-generic -- resolves correctly under
    # any release namespace since a bare service name resolves within the
    # requesting pod's own namespace. The Authorization header is forwarded
    # explicitly because proxy_set_header does not pass it through by
    # default for all upstream configurations.
    location /api/ {
        proxy_pass http://console-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Long-lived caching for hashed Vite build assets (filenames include a
    # content hash, so it's safe to cache them aggressively).
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}
