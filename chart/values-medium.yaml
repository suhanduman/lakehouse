# values-medium.yaml — typical production tier.
#
# Layer OVER the chart defaults (`chart/values.yaml`) — but there is almost
# nothing TO layer: this chart's own defaults ARE the medium/typical-
# production shape by design (see values.yaml's own header comment: "This
# is the chart's skeleton default configuration"). This file exists to make
# that contract EXPLICIT and TESTABLE, not to change behavior — every value
# below is a documented no-op (explicitly restates a chart default), plus a
# few comment-only reminders for choices a fresh install must consciously
# make. `chart/tests/sizing-tiers_test.sh` asserts this file renders
# identically to bare chart defaults (e.g. kafka broker replicas == 3, CNPG
# instances == 3).
#
#   helm install lakehouse chart/ -f chart/values-medium.yaml -n <namespace>
#
# --- Reminders (comment-only — NOT set here; every real install must choose
# these explicitly rather than silently ride the chart default) --------------
#   - `platform`: chart default is `vanilla` (Ingress). An OpenShift install
#     MUST override this to `platform: openshift` (Routes) — see
#     values.yaml's own `platform` comment. Not set here: this file targets
#     BOTH platforms identically (the sizing-tiers test exercises this file
#     under `--set platform=vanilla` AND `--set platform=openshift`).
#   - `secrets.mode`: chart default is `generated` (bootstrap script seeds
#     Secrets before install). A real prod install with an ExternalSecrets/
#     Vault backend should instead set `secrets.mode: external`. Out of
#     scope for a SIZING overlay — choose this per-environment.
#   - `components.minio`: chart default is `false` and MUST STAY false in
#     any real production install (see values.yaml's own comment — MinIO
#     here is single-replica/no-HA, dev/PoC/e2e-only). Not set here (already
#     the default) — asserted by the sizing-tiers test instead (no MinIO
#     Deployment renders from this file).

# --- Documented no-ops: HA replica counts + PVC/RF knobs the chart already
# defaults to the medium/typical-production shape. Restated explicitly (not
# because the value would otherwise be different) so this file is a
# testable assertion of the medium contract, not just a comment. ------------

components:
  superset: true
  dbt: true
  sparkHistory: true
  # Hand-rolled JupyterHub (per-user notebook sandbox): OFF by default even
  # at this tier, restating the chart default — the Hub/proxy Deployments
  # and per-user notebook Pods do NOT render regardless of this file (see
  # the coherence guard in chart/templates/23-jupyterhub.yaml:
  # `components.jupyter` ALSO requires `auth.oidc.enabled`, already the
  # default at this tier, AND `sandbox.enabled`). The operator turns this on
  # PER INSTALL by flipping this to `true` plus the unified sandbox below
  # (`sandbox.enabled: true`, `sandbox.allowedGroups`) — each allowed AD
  # group logs every member into the SAME unified sandbox, isolated only by
  # a per-user Trino/Spark/PyIceberg schema — plus the `jupyter` Keycloak
  # client secret (`jupyter.oidcClientSecret`) and the Hub<->proxy shared
  # token (`jupyter.proxyToken`). See the README's "JupyterHub per-user
  # sandbox" section for the full operator checklist before enabling.
  jupyter: false

# Sandbox v2 (unified analyst sandbox): OFF by default even at this tier,
# restating the chart default (see chart/values.yaml's `sandbox:` block
# comment). The operator turns this on PER INSTALL by flipping
# `enabled: true`, setting `allowedGroups` (AD groups permitted to log in),
# and provisioning the `svc-sandbox` Keycloak client secret
# (`sandbox.oidc.clientSecret`) plus the scoped `s3-sandbox` S3 credential
# out-of-band. See the README's sandbox section for the full operator
# checklist before enabling.
sandbox:
  enabled: false

# Consumption slice d (Spark History Server): non-empty S3 endpoint keeps the
# jobs' eventLog conf valid AND is what the History Server itself reads from.
# MUST match the s3-credentials Secret's endpoint; override per environment.
sparkHistory:
  s3Endpoint: "http://minio.CHANGE-ME.svc:9000"

# b2 (dbt-trino Gold): with `components.dbt: true` above, the chart default
# `auth.oidc.enabled: true` (Keycloak present) and `superset.trino.tls.
# enabled: true` (chart default) together satisfy the coherence guard
# (`components.dbt=true` requires both) — so the dbt-build CronJob, dbt
# profiles Secret, and OIDC client render. `dbt.oidc.clientSecret` and
# `dbt.repo.deployKey` stay empty here (out-of-band per `.Values.secrets.
# mode`, same contract as every other credential in this chart) — never put
# real secrets in a sizing overlay.

# b1 (Trino machine-auth): with `components.superset: true` above and the
# chart default `auth.oidc.enabled: true` (Keycloak present in this tier),
# turn on Superset->Trino JWT machine-auth — Superset presents a Keycloak
# service-account JWT to Trino instead of the dev-only `none` (unauthenticated)
# default. `clientSecret`/`tls.keystorePassword` stay empty here (out-of-band
# per `.Values.secrets.mode`, same contract as every other OIDC credential in
# this chart) — never put real secrets in a sizing overlay.
superset:
  trino:
    authMode: jwt

# Nessie machine-auth: with the chart default `auth.oidc.enabled: true`
# (Keycloak present at this tier), Nessie's own authn/authz turns on too
# (04-nessie-ha.yaml) — this FIXES the latent prod 401 (committers were
# never actually authenticating against it) and requires the 4
# `svc-<x>-nessie` client secrets (`nessie.machineAuth.{trino,spark,connect,
# zeppelin}ClientSecret`, chart/values.yaml). All 4 stay empty-string here
# (out-of-band per `.Values.secrets.mode`, same contract as every other
# credential in this file) — never put real secrets in a sizing overlay. See
# the README's "Nessie machine-auth" section for the full 5-identity CEL
# policy + operator checklist before install.

postgres:
  nessie:
    instances: 3   # chart default — CNPG 3-instance HA cluster
  apicurio:
    instances: 3   # chart default
  keycloak:
    instances: 3   # chart default
  superset:
    instances: 3   # chart default — CNPG 3-instance HA

kafka:
  nodePools:
    controller:
      replicas: 3   # chart default — KRaft controller quorum
    broker:
      replicas: 3   # chart default
  topics:
    nginxAccess: {replicas: 3}     # chart default RF
    lmsEvents: {replicas: 3}       # chart default RF
    connectConfigs: {replicas: 3}  # chart default RF
    connectOffsets: {replicas: 3}  # chart default RF
    connectStatus: {replicas: 3}   # chart default RF
  replication:
    offsetsTopic: 3       # chart default
    txnStateLog: 3        # chart default
    txnStateLogMinIsr: 2  # chart default
    default: 3            # chart default
    minInsync: 2          # chart default

nessie:
  replicas: 2   # chart default

trino:
  # Trino coordinator replica count is NOT a values knob at all — chart/
  # templates/06-trino-ha.yaml hardcodes `replicas: 1` on the coordinator
  # Deployment in every tier (single coordinator is standard Trino
  # topology). There is no `trino.coordinator.replicas` key to restate here.
  worker:
    replicas: 3   # chart default

keycloak:
  instances: 2   # chart default

console:
  backend:
    replicas: 2    # chart default
  frontend:
    replicas: 2    # chart default

kafkaConnect:
  replicas: 2                       # chart default — already HA (2 workers)
  internalTopicReplicationFactor: 3  # chart default

sparkOperator:
  maintenance:
    bronzeRetentionDays: 30   # chart default

# --- Known NON-HA singleton defaults, deliberately left unchanged --------
# `zeppelin.replicas` (chart default 1) and `monitoring.grafana.replicas`
# (chart default 1) are both single-replica by design, not "dev-leaning"
# oversights: Zeppelin is a stateful single-writer interactive notebook
# server (no shared session backend across replicas) and Grafana's single
# pod is the common self-hosted-monitoring shape. Raising either to 2
# without a compatibility review is a behavior change outside a sizing
# overlay's scope, so this file does NOT restate/raise them — flagged here
# instead so the choice is visible, not silent.

namespaceConfig:
  # medium tier aggregate ≈ req 29.8 / lim 77.8 cpu; quota = ×1.15 headroom.
  # Only the 4 cpu/mem keys — pods/storage/etc. deep-merge from chart values.yaml.
  quota:
    requestsCpu: "36"
    requestsMemory: 76Gi
    limitsCpu: "92"
    limitsMemory: 132Gi
