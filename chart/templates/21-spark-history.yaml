# Spark History Server (Consumption slice d, Task 3). Gated by
# `.Values.components.sparkHistory` (default false; on in medium/large —
# chart/values.yaml, `components.sparkHistory` comment). Reads the SAME
# `s3a://spark-events/` event-log dir the batch jobs (05-spark-operator.yaml)
# and the nginx-streaming job (14-nginx-ingest.yaml) write to when that gate
# is on (`_helpers.tpl`'s `lakehouse.spark.baseConf` eventLog block).
#
# Command form + conf-passing method are the docker-confirmed choices from
# the 2026-08-04-d-spark-history-s3a spike (Task 1):
#   - `spark-class org.apache.spark.deploy.history.HistoryServer` directly
#     (NOT `start-history-server.sh`, which daemonizes via spark-daemon.sh
#     and forks into the background — wrong for a container's PID 1).
#   - conf passed via a mounted `spark-defaults.conf` (not `SPARK_HISTORY_
#     OPTS`) since `sparkHistory.s3Endpoint` is templated per-environment and
#     a ConfigMap keeps the file on disk instead of baking it into a
#     Deployment env var — both forms were spike-verified working.
#   - `fs.s3a.endpoint` is REQUIRED (hadoop-aws defaults to real AWS S3 and
#     403s against MinIO/any non-AWS endpoint without it — spike §2).
{{- if .Values.components.sparkHistory }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-history-defaults
  namespace: {{ include "lakehouse.namespace" . }}
data:
  spark-defaults.conf: |
    spark.history.fs.logDirectory={{ .Values.sparkHistory.eventLogDir }}
    spark.hadoop.fs.s3a.endpoint={{ .Values.sparkHistory.s3Endpoint }}
    spark.hadoop.fs.s3a.path.style.access=true
    spark.hadoop.fs.s3a.aws.credentials.provider=com.amazonaws.auth.EnvironmentVariableCredentialsProvider
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: spark-history}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: spark-history}
  template:
    metadata:
      labels: {app: spark-history}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: spark-history
        image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
        env:
        - {name: SPARK_HOME,      value: "/opt/spark"}
        - {name: SPARK_CONF_DIR,  value: "/opt/spark/conf"}
        {{- include "lakehouse.spark.awsEnv" . | nindent 8 }}
        ports: [{name: http, containerPort: 18080}]
        volumeMounts:
        - {name: spark-history-conf, mountPath: /opt/spark/conf/spark-defaults.conf, subPath: spark-defaults.conf}
        resources:
          requests: {memory: {{ .Values.sparkHistory.resources.requests.memory | quote }}, cpu: {{ .Values.sparkHistory.resources.requests.cpu | quote }}}
          limits:   {memory: {{ .Values.sparkHistory.resources.limits.memory | quote }},   cpu: {{ .Values.sparkHistory.resources.limits.cpu | quote }}}
        readinessProbe:
          httpGet: {path: /, port: 18080}
          initialDelaySeconds: 30
          periodSeconds: 15
        livenessProbe:
          httpGet: {path: /, port: 18080}
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: spark-history-conf
        configMap: {name: spark-history-defaults}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-history
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: spark-history}
  ports: [{name: http, port: 18080, targetPort: 18080}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spark-history-pdb
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  minAvailable: 0
  selector:
    matchLabels: {app: spark-history}
{{- end }}
