# jobs-seed Job — copies the image-baked Spark job code into the dedicated
# jobs bucket so SparkApplications can read `mainApplicationFile: s3a://…` at
# runtime (s3a code-delivery model). initContainer (spark-py image) copies
# /opt/spark/jobs/*.py into a shared emptyDir; the mc container uploads them
# (overwrite) to s3://<jobsBucket>/<jobsPrefix>/. Dual-hook (helm + ArgoCD),
# ordered after bucket-init. The image keeps the baked code as the source of
# truth; this Job makes S3 the runtime source. Idempotent.
{{- if .Values.storage.seedJobs }}
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-jobs-seed
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" . | nindent 8 }}
        app: lakehouse-jobs-seed
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      initContainers:
      - name: copy-baked-jobs
        image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args: ["set -eu; cp /opt/spark/jobs/*.py /seed/"]
        volumeMounts:
        - {name: seed, mountPath: /seed}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
      containers:
      - name: upload-jobs
        image: {{ .Values.versions.mcImage | quote }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-c"]
        args:
        - |
          set -eu
          mc alias set s3 "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          mc mb --ignore-existing s3/{{ .Values.storage.jobsBucket }}
          mc cp /seed/*.py s3/{{ .Values.storage.jobsBucket }}/{{ .Values.storage.jobsPrefix }}/
        env:
        - {name: S3_ENDPOINT,    valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: endpoint}}}
        - {name: S3_ACCESS_KEY,  valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: access-key-id}}}
        - {name: S3_SECRET_KEY,  valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: secret-access-key}}}
        volumeMounts:
        - {name: seed, mountPath: /seed}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
      volumes:
      - name: seed
        emptyDir: {}
{{- end }}
