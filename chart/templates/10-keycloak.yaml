# Keycloak — OIDC Provider + AD LDAP Federation. Only parameterized + made
# namespace-aware.
#
# Why: the corporate AD doesn't speak the OIDC protocol (only LDAP/Kerberos).
# Modern services like Trino, Superset, Jupyter, and the AI UI want OIDC.
# Keycloak is the translator in between: it recognizes AD as "user
# federation" and issues OIDC tokens.
#
# Zeppelin exception: it connects directly to AD via LDAPS through Apache
# Shiro's ActiveDirectoryRealm (bypassing Keycloak) — see
# chart/templates/09-zeppelin.yaml.
#
# Prerequisite: the Keycloak Operator must be installed from OperatorHub.
#
# Gating (two independent switches, same file):
#   - `pg-keycloak` CNPG Cluster  -> `.Values.components.keycloakDb`, which
#     falls back to `.Values.components.keycloak` UNLESS explicitly set
#     (see the `$keycloakDbEnabled` computation below). INDEPENDENT of the
#     `postgres` subsystem toggle (the SAME toggle as pg-nessie/pg-apicurio):
#     when the Keycloak app is disabled (`components.keycloak: false`), an
#     "orphaned" pg-keycloak CNPG Cluster that nothing will ever connect to
#     is never produced. If an operator deliberately wants to provision the
#     DB ahead of time while disabling Keycloak (`components.keycloak: false` +
#     `components.keycloakDb: true`), that is possible.
#   - Admin Secret/Certificate/Keycloak CR/KeycloakRealmImport/Route
#                                  -> `.Values.components.keycloak`.
#
# Host/redirect consistency (task brief acceptance criterion): Keycloak's
# own Route (the "auth" name) AND every OIDC client's redirectUris/
# webOrigins are generated from the SAME `lakehouse.routeHost` helper
# (_helpers.tpl) — a Route's host and its corresponding client's redirect
# host can never drift apart.
#
# The `lakehouse-console` + `kafka-ui` clients (+ the `groups` claim
# mapper): a patch from sub-project B (see the header note in
# prod-manifests/17-console-routes-oidc.yaml — rather than adding a second
# KeycloakRealmImport to the same realm, this was patched into this SINGLE
# `clients:` list). These two clients' OWN Routes (console/kafka-ui) are
# defined under chart/templates/console/; here only the SAME
# "console"/"kafka-ui" logical names are used with `lakehouse.routeHost`,
# for redirect-host consistency.
#
# AI-UI client: it exists in the source manifest, but `prod-manifests/
# optional/07-ai-gpu.yaml` (Ollama + text-to-sql-ui) is not being moved
# into a chart template in ANY task of this Helm-packaging plan (plan:
# "ai.enabled: false, no AI in prod"). This is why both this client and the
# "ai-ui" Route in 08-routes-tls.yaml are gated on `.Values.components.ai`
# (default false) — they do NOT render in prod, so no dangling reference
# to the non-existent `text-to-sql-ui` Service is created.
{{- $keycloakDbEnabled := .Values.components.keycloak }}
{{- if hasKey .Values.components "keycloakDb" }}
{{- $keycloakDbEnabled = .Values.components.keycloakDb }}
{{- end }}
{{- if $keycloakDbEnabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-keycloak
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  instances: {{ .Values.postgres.keycloak.instances }}
  # SAME pin as pg-nessie/pg-apicurio — single source, prevents version drift.
  imageName: {{ .Values.versions.cnpgPostgresImage | quote }}
  primaryUpdateStrategy: {{ .Values.postgres.keycloak.primaryUpdateStrategy }}
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: {{ .Values.postgres.keycloak.database }}
      owner: {{ .Values.postgres.keycloak.owner }}
  # storageClass empty (default) = the cluster's default StorageClass — CNPG
  # only accepts an OMITTED field, not an empty string (storage-neutrality
  # convention, Product Foundation task 6.5, same as 02-postgres-ha.yaml).
  storage:
{{- with .Values.postgres.keycloak.storage.storageClass }}
    storageClass: {{ . }}
{{- end }}
    size: {{ .Values.postgres.keycloak.storage.size | quote }}
  walStorage:
{{- with .Values.postgres.keycloak.walStorage.storageClass }}
    storageClass: {{ . }}
{{- end }}
    size: {{ .Values.postgres.keycloak.walStorage.size | quote }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.postgres.keycloak.backup.destinationPath | quote }}
      endpointURL: {{ .Values.postgres.keycloak.backup.endpointURL | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.storage.s3.secretName }}
          key: access-key-id
        secretAccessKey:
          name: {{ .Values.storage.s3.secretName }}
          key: secret-access-key
      wal:
        # zstd — deliberately different from pg-nessie/pg-apicurio's gzip.
        compression: zstd
        maxParallel: {{ .Values.postgres.keycloak.backup.walMaxParallel }}
      data:
        # gzip — NOTE: `data.compression: zstd` is INVALID in CNPG's Cluster
        # CRD ("supported values: bzip2, gzip, lz4, snappy" — zstd is NOT
        # in this enum), while `wal.compression: zstd` (above) IS valid in
        # the same CRD version — two different enums, one supports zstd
        # and the other doesn't. gzip is used (same as pg-nessie/pg-apicurio).
        compression: gzip
        jobs: {{ .Values.postgres.keycloak.backup.dataJobs }}
    retentionPolicy: {{ .Values.postgres.keycloak.backup.retentionPolicy | quote }}
  resources:
    requests:
      memory: {{ .Values.postgres.keycloak.resources.requests.memory | quote }}
      cpu: {{ .Values.postgres.keycloak.resources.requests.cpu | quote }}
    limits:
      memory: {{ .Values.postgres.keycloak.resources.limits.memory | quote }}
      cpu: {{ .Values.postgres.keycloak.resources.limits.cpu | quote }}
{{- end }}
{{- if .Values.components.keycloak }}
---
{{- if .Values.keycloak.adminPassword }}
# Inline stringData Secret -- rendered ONLY when a real `keycloak.adminPassword`
# is explicitly supplied (dev/test convenience). Default is empty: in that
# case this Secret is NOT rendered at all, and the SAME name/keys must be
# provisioned out-of-band (ExternalSecret/Vault or `oc create secret generic
# keycloak-admin-credentials --from-literal=username=... --from-literal=
# password=...`) per `.Values.secrets.mode`, BEFORE install.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.adminUsername | quote }}
  password: {{ .Values.keycloak.adminPassword | quote }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  secretName: keycloak-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.routes.certIssuer | quote }}
  dnsNames:
  # The ACTUAL Service name produced by the Operator (the
  # `lakehouse.svc.keycloak` helper, matching the Route's `to.name` target)
  # + the "auth.<domain>" SAN for external access. helm-check.py's
  # --service-closure check (the Keycloak Operator closure extension in
  # chart/scripts/helm-check.py) verifies this Service name is correct.
  - {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.keycloak" .) "context" .) }}
  - {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  instances: {{ .Values.keycloak.instances }}
  {{- if .Values.versions.keycloakImage }}
  image: {{ .Values.versions.keycloakImage | quote }}
  {{- end }}
  db:
    vendor: postgres
    host: {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.pgKeycloakRw" .) "context" .) }}
    port: 5432
    database: {{ .Values.postgres.keycloak.database }}
    usernameSecret:
      name: pg-keycloak-app
      key: username
    passwordSecret:
      name: pg-keycloak-app
      key: password
  hostname:
    hostname: {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
    strict: false
    strictBackchannel: false
  http:
    tlsSecret: keycloak-tls
  ingress:
    enabled: false                  # via OpenShift Route; the Route is defined below
  additionalOptions:
  - name: log
    value: "console"
  - name: log-level
    value: "INFO"
  - name: metrics-enabled
    value: "true"
  resources:
    requests:
      memory: {{ .Values.keycloak.resources.requests.memory | quote }}
      cpu: {{ .Values.keycloak.resources.requests.cpu | quote }}
    limits:
      memory: {{ .Values.keycloak.resources.limits.memory | quote }}
      cpu: {{ .Values.keycloak.resources.limits.cpu | quote }}
---
# Realm import — AD federation + OIDC clients in a single YAML. The
# Operator processes this and applies it to Keycloak declaratively.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ printf "%s-realm" .Values.keycloak.realm.name }}
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  keycloakCRName: keycloak
  realm:
    realm: {{ .Values.keycloak.realm.name }}
    displayName: {{ .Values.keycloak.realm.displayName | quote }}
    enabled: true
    registrationAllowed: false
    loginWithEmailAllowed: true
    sslRequired: "external"

    # --- AD LDAP Federation ---
    components:
      "org.keycloak.storage.UserStorageProvider":
      - name: "Kurumsal AD"
        providerId: "ldap"
        config:
          enabled: ["true"]
          priority: ["0"]
          editMode: ["READ_ONLY"]
          vendor: ["ad"]
          connectionUrl: [{{ .Values.ad.url | quote }}]
          bindDn: [{{ .Values.ad.bindDn | quote }}]
          bindCredential: [{{ .Values.ad.bindPassword | quote }}]
          usersDn: [{{ .Values.ad.userSearchBase | quote }}]
          userObjectClasses: ["person,organizationalPerson,user"]
          usernameLDAPAttribute: ["sAMAccountName"]
          rdnLDAPAttribute: ["cn"]
          uuidLDAPAttribute: ["objectGUID"]
          searchScope: ["2"]
          useTruststoreSpi: ["ldapsOnly"]
          connectionPooling: ["true"]
          pagination: ["true"]
          batchSizeForSync: ["1000"]
          fullSyncPeriod: ["86400"]
          changedSyncPeriod: ["3600"]
          importEnabled: ["true"]
          syncRegistrations: ["false"]

      "org.keycloak.storage.ldap.mappers.LDAPStorageMapper":
      - name: "email-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["email"]
          ldap.attribute: ["mail"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["false"]
      - name: "last-name-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["lastName"]
          ldap.attribute: ["sn"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["true"]
      - name: "first-name-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["firstName"]
          ldap.attribute: ["givenName"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["true"]
      - name: "group-mapper"
        providerId: "group-ldap-mapper"
        config:
          groups.dn: [{{ .Values.ad.groupSearchBase | quote }}]
          group.name.ldap.attribute: ["cn"]
          group.object.classes: ["group"]
          preserve.group.inheritance: ["false"]
          membership.ldap.attribute: ["member"]
          membership.attribute.type: ["DN"]
          membership.user.ldap.attribute: ["sAMAccountName"]
          mode: ["READ_ONLY"]

    # --- OIDC Clients ---
    clients:
    - clientId: trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/*" (include "lakehouse.routeHost" (dict "name" "trino" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "trino" "context" .)) | quote }}]
      attributes:
        access.token.lifespan: "3600"
    - clientId: svc-superset-trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      # Confidential service account for Superset->Trino machine-auth (b1).
      # Single source with the `superset-trino-oidc-credentials` Secret
      # (19-superset.yaml) via `.Values.superset.trino.oidc.clientSecret`.
      secret: {{ .Values.superset.trino.oidc.clientSecret | quote }}
      attributes:
        access.token.lifespan: "900"
      protocolMappers:
      - name: aud-trino
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config:
          "included.client.audience": "trino"
          "id.token.claim": "false"
          "access.token.claim": "true"
    - clientId: svc-dbt-trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      # Confidential service account for dbt->Trino machine-auth (b2), sole
      # writer of lakehouse.gold. Single source with dbt-trino-oidc-credentials
      # via .Values.dbt.oidc.clientSecret.
      secret: {{ .Values.dbt.oidc.clientSecret | quote }}
      attributes:
        access.token.lifespan: "1800"
      protocolMappers:
      - name: aud-trino
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config:
          "included.client.audience": "trino"
          "id.token.claim": "false"
          "access.token.claim": "true"
    - clientId: svc-zeppelin-trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      # Read-only service account for Zeppelin's %trino interpreter (c1).
      secret: {{ .Values.zeppelin.trino.oidc.clientSecret | quote }}
      attributes:
        # 1h — longer than the other svc clients (900) because each Zeppelin
        # token rotation recycles the interpreter; keep recycles infrequent.
        access.token.lifespan: "3600"
      protocolMappers:
      - name: aud-trino
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config:
          "included.client.audience": "trino"
          "id.token.claim": "false"
          "access.token.claim": "true"
    - clientId: svc-jupyter-trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      # Read-only SA for Jupyter notebook turn-key Trino reads.
      secret: {{ .Values.jupyter.trino.oidc.clientSecret | quote }}
      attributes:
        # 900 — the Jupyter helper fetches a fresh token per call, so a short
        # lifespan is enough (unlike svc-zeppelin-trino's 3600: each rotation
        # recycles the Zeppelin interpreter, so recycles must stay infrequent).
        access.token.lifespan: "900"
      protocolMappers:
      - name: aud-trino
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config:
          "included.client.audience": "trino"
          "id.token.claim": "false"
          "access.token.claim": "true"
    {{- if .Values.auth.oidc.enabled }}
    # Nessie machine-auth: one confidential service-account client per
    # engine/service that talks to Nessie's Iceberg REST catalog directly
    # with its own identity (Trino, Spark, Kafka Connect's Iceberg sink,
    # Zeppelin's %spark interpreter) — mirrors the svc-dbt-trino/
    # svc-zeppelin-trino pattern above (serviceAccountsEnabled,
    # standardFlowEnabled: false, publicClient: false, single-sourced
    # `secret`). Single source with `.Values.nessie.machineAuth.
    # <name>ClientSecret`, so client and any dev-convenience Secret can
    # never drift.
    #
    # Gated `auth.oidc.enabled` (unlike the trino service-account clients
    # above, which aren't gated on this flag): when auth.oidc.enabled is
    # false, Nessie (04-nessie-ha.yaml) runs fully unauthenticated, so these
    # service accounts would be dead weight.
    #
    # CRITICAL DIFFERENCE from the trino service-account clients above: NO
    # `aud-trino` (or any) audience mapper here — Nessie validates the token
    # by ISSUER only (not audience), same as the unified `svc-sandbox`
    # client below.
    - clientId: svc-trino-nessie
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      secret: {{ .Values.nessie.machineAuth.trinoClientSecret | quote }}
    - clientId: svc-spark-nessie
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      secret: {{ .Values.nessie.machineAuth.sparkClientSecret | quote }}
    - clientId: svc-connect-nessie
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      secret: {{ .Values.nessie.machineAuth.connectClientSecret | quote }}
    - clientId: svc-zeppelin-nessie
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      secret: {{ .Values.nessie.machineAuth.zeppelinClientSecret | quote }}
    {{- end }}
    {{- if .Values.sandbox.enabled }}
    # Sandbox v2 (2026-08-07 sandbox-v2-design, Task 1; per-dept clients
    # retired in Task 5): ONE unified confidential client for the single
    # shared sandbox. Same shape as `svc-zeppelin-nessie`
    # (serviceAccountsEnabled, standardFlowEnabled:false, publicClient:
    # false, single-sourced `secret`). Single source with
    # `.Values.sandbox.oidc.clientSecret`.
    #
    # CRITICAL DIFFERENCE from the trino service-account clients above: NO
    # `aud-trino` audience mapper here — Nessie validates the token by
    # ISSUER only (not audience).
    - clientId: svc-sandbox
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: false
      serviceAccountsEnabled: true
      secret: {{ .Values.sandbox.oidc.clientSecret | quote }}
    {{- end }}
    - clientId: superset
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/*" (include "lakehouse.routeHost" (dict "name" "bi" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "bi" "context" .)) | quote }}]
      # Single source with the `superset-oidc-credentials` Secret
      # (chart/templates/19-superset.yaml) — both sides read
      # `.Values.superset.oidc.clientSecret`, so this confidential client's
      # secret and the Secret the Superset Deployment mounts can never drift.
      # Empty default => client kept, secret provisioned out-of-band.
      secret: {{ .Values.superset.oidc.clientSecret | quote }}
    - clientId: jupyter
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/hub/oauth_callback" (include "lakehouse.routeHost" (dict "name" "jupyter" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "jupyter" "context" .)) | quote }}]
      # Single source with the `jupyter-oidc-credentials` Secret
      # (chart/templates/23-jupyterhub.yaml) — both sides read
      # `.Values.jupyter.oidcClientSecret`, so this confidential client's
      # secret and the Secret the Hub Deployment mounts can never drift.
      # Empty default => client kept, secret provisioned out-of-band (same
      # contract as the `superset` client above).
      secret: {{ .Values.jupyter.oidcClientSecret | quote }}
      # `groups` claim mapper (Task 4, jupyterhub-per-user-sandbox) —
      # WITHOUT it Keycloak's userinfo response has NO `groups` key at all
      # (spike-confirmed: docs/superpowers/spikes/
      # 2026-08-06-jupyterhub-config.md §1.1/§1.2). Same
      # oidc-group-membership-mapper shape as `lakehouse-console`/`kafka-ui`
      # below. jupyterhub_config.py's GenericOAuthenticator
      # (`claim_groups_key = "groups"`) reads this exact claim to gate
      # login/spawn on `sandbox-<dept>` membership.
      protocolMappers:
      - name: groups
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config:
          "claim.name": "groups"
          "full.path": "false"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
    {{- if .Values.components.ai }}
    - clientId: ai-ui
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/oauth2/callback" (include "lakehouse.routeHost" (dict "name" "ai" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "ai" "context" .)) | quote }}]
    {{- end }}
    - clientId: nessie
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/*" (include "lakehouse.routeHost" (dict "name" "nessie" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "nessie" "context" .)) | quote }}]
    # Self-Service Lakehouse Console (frontend, SPA). PUBLIC client
    # (PKCE): the frontend sends a Bearer JWT to the backend, and the
    # backend verifies the audience — this client does NOT NEED a
    # confidential secret (unlike the other clients). `groups` claim
    # mapper: console/backend/app/services/authz.py expects
    # `claims.get("groups")` (a list of AD group names).
    - clientId: lakehouse-console
      enabled: true
      protocol: "openid-connect"
      publicClient: true
      standardFlowEnabled: true
      directAccessGrantsEnabled: false
      redirectUris: [{{ printf "https://%s/*" (include "lakehouse.routeHost" (dict "name" "console" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "console" "context" .)) | quote }}]
      attributes:
        "pkce.code.challenge.method": "S256"
      protocolMappers:
      - name: groups
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config:
          "claim.name": "groups"
          "full.path": "false"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
    # Kafka UI (kafbat-ui). CONFIDENTIAL client (Spring Security
    # OAuth2 authorization_code, server-side) — the secret must match the
    # kafka-ui-oidc-credentials Secret. The redirect URI follows Spring
    # Security OAuth2 login's default `/login/oauth2/code/{registrationId}`
    # pattern (registrationId: keycloak).
    - clientId: kafka-ui
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/login/oauth2/code/keycloak" (include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .)) | quote }}]
      # Single source with the `kafka-ui-oidc-credentials` Secret
      # (chart/templates/console/routes-oidc.yaml `stringData.client-secret`)
      # — both sides read `.Values.kafkaUi.oidc.clientSecret`, so this
      # client's secret and the Secret the kafka-ui Deployment mounts can
      # never drift apart.
      secret: {{ .Values.kafkaUi.oidc.clientSecret | quote }}
      protocolMappers:
      - name: groups
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config:
          "claim.name": "groups"
          "full.path": "false"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
    {{- if .Values.monitoring.grafana.oidc.enabled }}
    # Grafana (Monitoring/D1). CONFIDENTIAL client (generic OAuth,
    # authorization_code). Redirect URI = Grafana's `generic_oauth` callback
    # (`/login/generic_oauth`). Host derives from the SAME `lakehouse.routeHost`
    # helper ("grafana" logical name) as the Grafana Route's own spec.host
    # (chart/templates/monitoring/grafana.yaml) — host/redirect never drift.
    # Gated on `monitoring.grafana.oidc.enabled` (false in microk8s smoke →
    # client not rendered → smoke unblocked; true in values-prod.example.yaml).
    - clientId: {{ .Values.monitoring.grafana.oidc.clientId | quote }}
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: [{{ printf "https://%s/login/generic_oauth" (include "lakehouse.routeHost" (dict "name" .Values.monitoring.grafana.route.host "context" .)) | quote }}]
      webOrigins: [{{ printf "https://%s" (include "lakehouse.routeHost" (dict "name" .Values.monitoring.grafana.route.host "context" .)) | quote }}]
      # Single source with the `grafana-oidc` Secret Grafana mounts
      # (chart/templates/monitoring/grafana.yaml `stringData.
      # client-secret`) — both sides read `.Values.monitoring.grafana.oidc.
      # clientSecret`, so this confidential client's secret and the Secret the
      # Grafana Deployment consumes can never drift (same `secrets.mode`
      # pattern as the sibling `trino`/`kafka-ui` confidential clients). Left
      # empty in values → Keycloak keeps the client but the secret is
      # provisioned out-of-band; a real value is quoted verbatim here.
      secret: {{ .Values.monitoring.grafana.oidc.clientSecret | quote }}
    {{- end }}
    {{- if and .Values.auth.oidc.enabled .Values.byoNotebook.enabled }}
    # BYO/local notebook access (2026-08-07-byo-notebook-access design,
    # Task 1; spec 3.6.1.2). PUBLIC device-flow client — NO secret
    # (oc-login style): the user's local `tools/lakehouse-cli login`
    # (Task 2) does an OIDC device-authorization-grant flow against this
    # client to mint their OWN token (their AD identity/roles, not a
    # service account) for direct Trino/PyIceberg access from outside the
    # cluster. `standardFlowEnabled: false` — no browser redirect flow, only
    # the device grant. `aud-trino` mirrors the confidential
    # svc-*-trino clients' mapper above so the minted token is directly
    # usable against Trino's OAuth2 authenticator without a separate
    # audience. 6h token lifespan (21600s) — long enough for a notebook
    # session without re-auth. Gated on BOTH `auth.oidc.enabled` AND
    # `byoNotebook.enabled` (dev default false/false → not rendered).
    - clientId: lakehouse-token
      enabled: true
      protocol: "openid-connect"
      publicClient: true
      standardFlowEnabled: false
      attributes:
        "oauth2.device.authorization.grant.enabled": "true"
        access.token.lifespan: "21600"
      protocolMappers:
      - name: aud-trino
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config:
          "included.client.audience": "trino"
          "id.token.claim": "false"
          "access.token.claim": "true"
    {{- end }}

    # Realm roles — assigned at runtime based on AD group membership
    roles:
      realm:
      - name: admin
        description: "Lakehouse yöneticisi"
      - name: analyst
        description: "Veri analisti / Araştırmacı"
      - name: student
        description: "Öğrenci (salt-okunur)"

    groups:
    - name: lakehouse-admins
      realmRoles: [admin]
    - name: lakehouse-analysts
      realmRoles: [analyst]
    - name: lakehouse-students
      realmRoles: [student]
{{- if include "lakehouse.isOpenShift" . }}
---
# Keycloak Route — external access (reencrypt: Keycloak terminates its own
# TLS, and the Route re-encrypts it). Extra gate: `lakehouse.isOpenShift`
# (`.Values.platform`) — its vanilla counterpart is
# chart/templates/08b-ingress-tls.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.keycloak" . }}   # Service produced by the Keycloak Operator
  port:
    targetPort: https
  tls:
    termination: reencrypt
{{- end }}
{{- end }}
