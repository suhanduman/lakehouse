# OpenShift Routes + cert-manager integration. Only parameterized + made
# namespace-aware. Gated by `.Values.components.routesTls`.
#
# In prod, each public UI is served over HTTPS via its own separate Route.
#
# Host consistency (task brief acceptance criterion): every Route's
# `spec.host` is generated from the `lakehouse.routeHost` helper
# (_helpers.tpl), tied to `.Values.global.domain` — Keycloak's OIDC client
# redirect URIs (chart/templates/10-keycloak.yaml) are generated from the
# SAME helper with the SAME logical name, so a Route's host and that UI's
# OIDC redirect host can never drift apart.
#
# Extra gate (this task): `lakehouse.isOpenShift` (`.Values.platform`) —
# this ENTIRE file only renders when `platform: openshift`; its vanilla
# counterpart is chart/templates/08b-ingress-tls.yaml (`networking.k8s.io/v1`
# Ingress, the SAME components.* gates + the SAME lakehouse.routeHost helper).
#
# DANGLING-ROUTE GATING (spec §3.1/§8 Route-reference closure):
# the `superset`/`jupyter`/`ai-ui` Routes point at follow-up components that
# have NO backing Deployment/Service (Superset+JupyterHub are in sub-project
# D, and AI lives in `prod-manifests/optional/07-ai-gpu.yaml` — it is not
# being moved into a chart template in ANY task of this Helm-packaging
# plan; the plan is: "no AI in prod"). This is why ALL THREE sit behind
# their own `.Values.components.{superset,jupyter,ai}` flag (all default
# false, second switches independent of `.Values.components.routesTls`) —
# they do NOT render in prod, so no dangling Route without a backing
# Service is created. helm-check.py's --service-closure check now also
# validates Route `spec.to.name` targets; thanks to these gates that check
# is genuinely closed, with no need for a whitelist exception. When the
# relevant component is moved into the chart, the flag is flipped to true
# and the backing Service is produced. See the `ai-ui` OIDC client under
# the same `.Values.components.ai` gate in chart/templates/10-keycloak.yaml.
{{- if and .Values.components.routesTls (include "lakehouse.isOpenShift" .) }}
---
# Trino — SQL endpoint + OAuth2 callback
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: trino
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "trino" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.trino" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- if .Values.components.ai }}
---
# AI Text-to-SQL UI (Streamlit) — see the file header note (`components.ai`
# gate; the `text-to-sql-ui` Service is not produced by this chart).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-ui
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "ai" "context" .) }}
  to:
    kind: Service
    name: text-to-sql-ui
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
---
# Nessie REST Catalog (optional: external clients / federated catalog)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nessie
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "nessie" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.nessie" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- if .Values.components.superset }}
---
# Superset BI — Deployment/Service is NOT defined in this package (follow-up
# component, sub-project D). The Route therefore sits behind
# `.Values.components.superset` (default false): it does NOT render in
# prod, so no dangling Route without a backing Service is created
# (Route-reference closure). When Superset is moved into the chart, this
# flag is flipped to true and the `superset` Service is produced.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: superset
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "bi" "context" .) }}
  to:
    kind: Service
    name: superset
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- if .Values.components.zeppelin }}
---
# Apache Zeppelin (deployed via chart/templates/09-zeppelin.yaml).
# components.zeppelin gate: prevents a dangling Route without a backing
# Service when zeppelin is disabled (same pattern as superset/jupyter/ai).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: zeppelin
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "zeppelin" "context" .) }}
  to:
    kind: Service
    name: zeppelin
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- if .Values.components.sparkHistory }}
---
# Spark History Server (Consumption slice d, chart/templates/21-spark-history.
# yaml). `components.sparkHistory` gate — the backing `spark-history`
# Service IS produced by this chart (Task 3), so unlike the other follow-up
# components this is NOT a dangling Route, just a skip while the flag is
# off (default).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: spark-history
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" .Values.sparkHistory.routeHost "context" .) }}
  to:
    kind: Service
    name: spark-history
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- if .Values.components.jupyter }}
---
# JupyterHub (multi-user notebook) — Deployment/Service is NOT defined in
# this package (follow-up component, sub-project D). The Route therefore
# sits behind `.Values.components.jupyter` (default false): it does NOT
# render in prod, so no dangling Route without a backing Service
# (`jupyterhub-proxy`) is created (Route-reference closure).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: jupyter
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "jupyter" "context" .) }}
  to:
    kind: Service
    name: jupyterhub-proxy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}

# NOTE: the Superset + JupyterHub Deployment/Service templates are out of
# scope for this package (SAME note as in the source manifest). Reference:
#   - Superset Helm:   https://github.com/apache/superset/tree/master/helm
#   - JupyterHub Z2J:  https://zero-to-jupyterhub.readthedocs.io/
# The HA deploy pattern follows the SAME principles as the Nessie/Trino
# templates in this chart (OIDC + RWX PVC + HPA + Pod anti-affinity).
