{{- if and .Values.global.security.s3TrustBundle.enabled .Values.global.security.s3TrustBundle.openshiftInject }}
# S3 Internal-CA trust bundle (prod hardening) — OpenShift
# "trusted CA bundle" injection. This ConfigMap is created empty and
# labeled; the OpenShift cluster-network-operator AUTOMATICALLY fills in
# the `ca-bundle.crt` key (system CAs + cluster additional-trust). The S3
# endpoint's Root CA must already be added to the cluster's additional
# trust (Proxy `trustedCA` / image config) — a one-time, cluster-admin step.
#
# This bundle must be mounted into JVM-based S3 clients (Trino / Nessie /
# Kafka Connect / Spark) and added to their truststore — otherwise the
# HTTPS S3 endpoint throws `SSLHandshakeException`. Per-component JVM
# truststore wiring (init-container + keytool + -Djavax.net.ssl.trustStore)
# depends on live OpenShift, so it's documented as a RUNBOOK instead:
# gitops/README.md, "Prod hardening checklist".
#
# If openshiftInject=false: this ConfigMap is NOT created; `configMapName`
# must point to an existing ConfigMap (containing the CA PEM) provided manually.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.security.s3TrustBundle.configMapName }}
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
    config.openshift.io/inject-trusted-cabundle: "true"
# data is DELIBERATELY empty — OpenShift injects `ca-bundle.crt`.
{{- end }}
