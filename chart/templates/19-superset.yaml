# Apache Superset (BI) — Consumption slice (a). Hand-rolled deployment
# (Deployment + Service + ConfigMap + Secret + PDB + init-Job) plus its own
# pg-superset CNPG metadata store, ALL under one `components.superset` gate
# (default false; on in medium/large). Follows the Zeppelin/Kafka-UI
# hand-templated convention. Login: native AUTH_OAUTH against the Keycloak
# `superset` client (10-keycloak.yaml). Trino connection auth is spike-driven
# (docs/superpowers/spikes/2026-08-04-superset-trino-oidc.md).
#
# pg-superset is gated by `components.superset` (NOT `components.postgres`) —
# same "no orphan DB" rationale as pg-keycloak's $keycloakDbEnabled: a disabled
# Superset must not leave a metadata cluster with no consumer, and dev (superset
# off) must not pay for it in the sizing-tiers dev budget.
#
# Service wiring: Trino via `lakehouse.svc.trino`, metadata DB via
# `lakehouse.svc.pgSupersetRw` (both helpers, never hardcoded).
{{- if .Values.components.superset }}
{{- if and (eq .Values.superset.trino.authMode "jwt") (not (and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled)) }}
{{- fail "superset.trino.authMode=jwt requires auth.oidc.enabled=true AND superset.trino.tls.enabled=true (jwt uses the Trino https:8443 listener + jwt authenticator, which those gate)" }}
{{- end }}
{{- if and .Values.superset.alertsReports.enabled (eq .Values.superset.smtp.host "") }}
{{- fail "superset.alertsReports.enabled requires superset.smtp.host (customer SMTP server) — set it or disable alertsReports" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-superset
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  instances: {{ .Values.postgres.superset.instances }}
  imageName: {{ .Values.versions.cnpgPostgresImage | quote }}
  storage:
    size: {{ .Values.postgres.superset.storage.size | quote }}
{{- with .Values.postgres.superset.storage.storageClass }}
    storageClass: {{ . }}
{{- end }}
  walStorage:
    size: {{ .Values.postgres.superset.walStorage.size | quote }}
{{- with .Values.postgres.superset.walStorage.storageClass }}
    storageClass: {{ . }}
{{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgres.superset.database }}
      owner: {{ .Values.postgres.superset.owner }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.postgres.superset.backup.destinationPath | quote }}
      endpointURL: {{ .Values.postgres.superset.backup.endpointURL | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.storage.s3.secretName }}
          key: access-key-id
        secretAccessKey:
          name: {{ .Values.storage.s3.secretName }}
          key: secret-access-key
      wal:
        compression: gzip
        maxParallel: {{ .Values.postgres.superset.backup.walMaxParallel }}
      data:
        compression: gzip
        jobs: {{ .Values.postgres.superset.backup.dataJobs }}
    retentionPolicy: {{ .Values.postgres.superset.backup.retentionPolicy | quote }}
  monitoring:
    enablePodMonitor: {{ and .Values.components.monitoring .Values.monitoring.targets.postgres.enabled .Values.postgres.superset.monitoring.enablePodMonitor }}
  resources:
    requests:
      cpu: {{ .Values.postgres.superset.resources.requests.cpu | quote }}
      memory: {{ .Values.postgres.superset.resources.requests.memory | quote }}
    limits:
      cpu: {{ .Values.postgres.superset.resources.limits.cpu | quote }}
      memory: {{ .Values.postgres.superset.resources.limits.memory | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-superset-daily
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  schedule: "0 0 4 * * *"
  cluster:
    name: pg-superset
  backupOwnerReference: self
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  superset_config.py: |
    import os
    # --- Metadata DB (pg-superset via lakehouse.svc.pgSupersetRw helper) ---
    SQLALCHEMY_DATABASE_URI = (
        "postgresql+psycopg2://%s:%s@%s:5432/%s" % (
            os.environ["DB_USER"], os.environ["DB_PASSWORD"],
            os.environ["DB_HOST"], os.environ["DB_NAME"],
        )
    )
    # --- Session signing key (from Secret, never inlined) ---
    SECRET_KEY = os.environ["SUPERSET_SECRET_KEY"]

    # --- OIDC via the existing Keycloak `superset` client ---
    from flask_appbuilder.security.manager import AUTH_OAUTH
    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Gamma"   # least-privilege default; admins mapped below
    OAUTH_PROVIDERS = [{
        "name": "keycloak",
        "icon": "fa-key",
        "token_key": "access_token",
        "remote_app": {
            "client_id": "superset",
            "client_secret": os.environ["OIDC_CLIENT_SECRET"],
            "server_metadata_url": os.environ["OIDC_ISSUER"] + "/.well-known/openid-configuration",
            "api_base_url": os.environ["OIDC_ISSUER"] + "/protocol/openid-connect/",
            "client_kwargs": {"scope": "openid email profile"},
        },
    }]
    # AD group (Keycloak `groups` claim) -> Superset role. lakehouse-admins -> Admin.
    AUTH_ROLES_MAPPING = {"lakehouse-admins": ["Admin"], "lakehouse-analysts": ["Alpha"], "lakehouse-students": ["Gamma"]}
    AUTH_ROLES_SYNC_AT_LOGIN = True

    # --- Alerts & Reports: ALERT_REPORTS flag'i alertsReports.enabled ile şablonlanır.
    #     (ternary "True"/"False" — Python bool literal'i; helm'in lowercase true/false'u
    #     Python'da geçersizdir.) Celery/SMTP bloğu yalnız enabled iken eklenir.
    #     Tarayıcı yok → THUMBNAILS her zaman False. ---
    FEATURE_FLAGS = {"THUMBNAILS": False, "ALERT_REPORTS": {{ .Values.superset.alertsReports.enabled | ternary "True" "False" }}}
    SQLLAB_TIMEOUT = 60
    SUPERSET_WEBSERVER_TIMEOUT = 120
{{- if .Values.superset.alertsReports.enabled }}
    # --- Alerts & Reports async stack (Redis broker/results + Celery beat schedule) ---
    from celery.schedules import crontab
    import urllib.parse as _urlparse
    _redis = "redis://:%s@%s:6379" % (_urlparse.quote(os.environ.get("REDIS_PASSWORD", ""), safe=""), os.environ["REDIS_HOST"])
    class CeleryConfig:
        broker_url = _redis + "/0"
        result_backend = _redis + "/1"
        imports = ("superset.sql_lab", "superset.tasks.scheduler")
        worker_prefetch_multiplier = 1
        task_acks_late = True
        beat_schedule = {
            "reports.scheduler": {"task": "reports.scheduler", "schedule": crontab(minute="*", hour="*")},
            "reports.prune_log": {"task": "reports.prune_log", "schedule": crontab(minute=0, hour=0)},
        }
    CELERY_CONFIG = CeleryConfig
    # --- SMTP: müşterinin dış sunucusu (values → env; şifre Secret'tan, opsiyonel) ---
    SMTP_HOST = os.environ["SMTP_HOST"]
    SMTP_PORT = int(os.environ.get("SMTP_PORT", "587"))
    SMTP_STARTTLS = os.environ.get("SMTP_STARTTLS", "true").lower() == "true"
    SMTP_SSL = os.environ.get("SMTP_SSL", "false").lower() == "true"
    SMTP_USER = os.environ.get("SMTP_USER", "")
    SMTP_PASSWORD = os.environ.get("SMTP_PASSWORD", "")
    SMTP_MAIL_FROM = os.environ["SMTP_MAIL_FROM"]
    WEBDRIVER_BASEURL = os.environ.get("WEBDRIVER_BASEURL", "http://superset:8088/")  # e-posta linki; TARAYICI DEĞİL
    EMAIL_REPORTS_SUBJECT_PREFIX = "[Lakehouse] "
{{- end }}

    # --- Trino machine-auth (b1): inject a fresh JWT per connection ---
    # Signature VERIFIED against the 4.1.1 image (superset/models/core.py:531):
    #   sqlalchemy_url, params = DB_CONNECTION_MUTATOR(url, params, user, sm, source)
    #   create_engine(sqlalchemy_url, **params)  -> connect_args is params["connect_args"] (NESTED)
    TRINO_AUTH_MODE = {{ .Values.superset.trino.authMode | quote }}
    _TRINO_TOKEN_FILE = "/var/run/trino-token/token"
    # Internal CA for the Trino :8443 listener (trino-internal-tls Secret's
    # ca.crt, mounted read-only on THIS container only — see the Deployment
    # volume/mount below). Without this, trino-python-client (requests-based)
    # verifies against the public certifi bundle and rejects the
    # cert-manager-issued internal cert before auth is even attempted.
    # ASSUMES .Values.routes.certIssuer can issue for the internal
    # *.svc.cluster.local name — same assumption the existing keycloak-tls
    # Certificate (10-keycloak.yaml) already makes; issuer-suitability is a
    # deployment/UAT concern, not this template's.
    _TRINO_CA_FILE = "/etc/trino-ca/ca.crt"
    def DB_CONNECTION_MUTATOR(sqlalchemy_url, params, username, security_manager, source):
        # Only touch the Trino connection, and only in jwt mode.
        if TRINO_AUTH_MODE == "jwt" and str(sqlalchemy_url).startswith("trino://"):
            try:
                with open(_TRINO_TOKEN_FILE) as _f:
                    _tok = _f.read().strip()
            except (OSError, IOError):
                _tok = ""
            if _tok:
                from trino.auth import JWTAuthentication
                _ca = dict((params or {}).get("connect_args") or {})
                _ca["auth"] = JWTAuthentication(_tok)
                _ca["http_scheme"] = "https"
                if os.path.exists(_TRINO_CA_FILE):
                    _ca["verify"] = _TRINO_CA_FILE
                params = {**(params or {}), "connect_args": _ca}
        return sqlalchemy_url, params
{{- if or .Values.superset.secretKey .Values.superset.adminPassword }}
---
# Dev-convenience inline Secret — rendered ONLY when secretKey/adminPassword
# are explicitly supplied. Empty default => NOT rendered; provision out-of-band
# (ExternalSecret/Vault or `oc create secret generic superset ...`) under the
# SAME name/keys per `.Values.secrets.mode`. NEVER logged.
apiVersion: v1
kind: Secret
metadata:
  name: superset
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  secret-key: {{ .Values.superset.secretKey | quote }}
  admin-password: {{ .Values.superset.adminPassword | quote }}
{{- end }}
{{- if .Values.superset.oidc.clientSecret }}
---
# Single source with the Keycloak `superset` client secret (10-keycloak.yaml
# `clients[].secret`, Task 8) via `.Values.superset.oidc.clientSecret` — the two
# can never drift. SAME dev-convenience contract as kafka-ui-oidc-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: superset-oidc-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  client-secret: {{ .Values.superset.oidc.clientSecret | quote }}
{{- end }}
{{- if .Values.superset.trino.oidc.clientSecret }}
---
# Single source with the Keycloak `svc-superset-trino` service-account client
# secret (10-keycloak.yaml) via `.Values.superset.trino.oidc.clientSecret`.
# Consumed by the Superset refresher sidecar. Same dev-convenience contract.
apiVersion: v1
kind: Secret
metadata:
  name: superset-trino-oidc-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  client-secret: {{ .Values.superset.trino.oidc.clientSecret | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: superset}
spec:
  replicas: {{ .Values.superset.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: superset}
  template:
    metadata:
      labels: {app: superset}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: superset
        image: {{ printf "%s/superset:%s" .Values.global.imageRegistry .Values.versions.supersetImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8088, name: http}]
        env:
        - {name: DB_HOST,  value: {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.pgSupersetRw" .) "context" .) | quote }}}
        - {name: DB_NAME,  value: {{ .Values.postgres.superset.database | quote }}}
        - {name: DB_USER,     valueFrom: {secretKeyRef: {name: pg-superset-app, key: username}}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: pg-superset-app, key: password}}}
        - {name: SUPERSET_SECRET_KEY, valueFrom: {secretKeyRef: {name: superset, key: secret-key}}}
        - {name: OIDC_CLIENT_SECRET,  valueFrom: {secretKeyRef: {name: superset-oidc-credentials, key: client-secret}}}
        - {name: OIDC_ISSUER,         valueFrom: {secretKeyRef: {name: {{ required "oidc.secretName is empty — provision the OIDC credentials secret (issuer-url for Superset login) or set auth.oidc.enabled=false" .Values.oidc.secretName }}, key: issuer-url}}}
        {{- if .Values.superset.alertsReports.enabled }}
        {{- include "lakehouse.superset.reportsEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - {name: superset-config, mountPath: /app/pythonpath/superset_config.py, subPath: superset_config.py}
        {{- if eq .Values.superset.trino.authMode "jwt" }}
        {{- include "lakehouse.superset.trinoTokenMounts" . | nindent 8 }}
        {{- end }}
        resources:
          requests: {memory: {{ .Values.superset.resources.requests.memory | quote }}, cpu: {{ .Values.superset.resources.requests.cpu | quote }}}
          limits:   {memory: {{ .Values.superset.resources.limits.memory | quote }},   cpu: {{ .Values.superset.resources.limits.cpu | quote }}}
        readinessProbe:
          httpGet: {path: /health, port: 8088}
          initialDelaySeconds: 60
          periodSeconds: 15
        livenessProbe:
          httpGet: {path: /health, port: 8088}
          initialDelaySeconds: 120
          periodSeconds: 30
      {{- if eq .Values.superset.trino.authMode "jwt" }}
      # Trino machine-auth (b1): refreshes a Keycloak service-account JWT for
      # the `svc-superset-trino` client and writes it atomically to the shared
      # emptyDir; DB_CONNECTION_MUTATOR (superset_config.py above) reads it
      # per-connection. Exponential backoff on failure, keeps last-good token
      # (a transient Keycloak blip must never break existing SQL Lab sessions).
      {{- include "lakehouse.superset.trinoRefresherContainer" . | nindent 6 }}
      {{- end }}
      volumes:
      - name: superset-config
        configMap: {name: superset-config}
      {{- if eq .Values.superset.trino.authMode "jwt" }}
      {{- include "lakehouse.superset.trinoVolumes" . | nindent 6 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: superset}
  ports: [{name: http, port: 8088, targetPort: 8088}]
{{- if .Values.superset.alertsReports.enabled }}
---
# Alerts & Reports Celery broker/results backend. Single, ephemeral (emptyDir):
# a report scheduler is not a data-critical path — a broker restart misses at
# most one tick, the next tick recovers. requirepass from Secret (results
# backend transiently holds query/report data). --save ""/--appendonly no →
# no disk writes → OpenShift arbitrary-UID safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-redis
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: superset-redis}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: superset-redis}
  template:
    metadata:
      labels: {app: superset-redis}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: redis
        image: {{ .Values.versions.redisImage | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["redis-server"]
        args: ["--requirepass", "$(REDIS_PASSWORD)", "--save", "", "--appendonly", "no"]
        env:
        - {name: REDIS_PASSWORD, valueFrom: {secretKeyRef: {name: superset-redis-auth, key: password, optional: true}}}
        ports: [{containerPort: 6379, name: redis}]
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits:   {cpu: "200m", memory: "256Mi"}
        readinessProbe:
          tcpSocket: {port: 6379}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: superset-redis
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: superset-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
{{- if .Values.superset.redis.password }}
---
# Dev-convenience inline Secret — rendered ONLY when redis.password supplied.
# Empty default => NOT rendered; provision out-of-band under the SAME name/key
# per `.Values.secrets.mode`. NEVER logged.
apiVersion: v1
kind: Secret
metadata:
  name: superset-redis-auth
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  password: {{ .Values.superset.redis.password | quote }}
{{- end }}
{{- if .Values.superset.smtp.password }}
---
# Dev-convenience inline Secret for the external SMTP password — same contract.
apiVersion: v1
kind: Secret
metadata:
  name: superset-smtp
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  password: {{ .Values.superset.smtp.password | quote }}
{{- end }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: superset-pdb
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  minAvailable: 0
  selector:
    matchLabels: {app: superset}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: superset-init}
    spec:
      restartPolicy: Never
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: superset-init
        image: {{ printf "%s/superset:%s" .Values.global.imageRegistry .Values.versions.supersetImageTag | quote }}
        command: ["/bin/bash", "-c"]
        args:
        - |
          {{- if not (has .Values.superset.trino.authMode (list "none" "jwt")) }}{{ fail "superset.trino.authMode must be 'none' or 'jwt'" }}{{- end }}
          set -euo pipefail
          superset db upgrade
          superset init
          superset fab create-admin \
            --username "$ADMIN_USER" --firstname Admin --lastname Admin \
            --email admin@lakehouse.local --password "$ADMIN_PASSWORD" || true
          {{- if and (eq .Values.superset.trino.authMode "none") .Values.auth.oidc.enabled }}
          echo "WARN: superset.trino.authMode=none but auth.oidc.enabled=true — the Trino connection is unauthenticated and queries will fail until the JWT slice lands (see spike doc)."
          {{- end }}
          # Register the Trino connection (idempotent — updates if present).
          # authMode={{ .Values.superset.trino.authMode }}: `none` => unauthenticated Trino
          # (works when auth.oidc.enabled=false); `jwt` => tokenless https URI, the
          # DB_CONNECTION_MUTATOR injects the rotating JWT per connection.
          {{- if eq .Values.superset.trino.authMode "jwt" }}
          # JWT machine-auth: tokenless https URI (mutator injects the rotating
          # JWT per connection). `set_database_uri` has NO -e/--extra flag in
          # 4.1.1 (spike-verified) → set pool_recycle via `superset shell`,
          # BELOW the token lifespan so no pooled connection outlives its JWT.
          superset set_database_uri \
            -d "Trino Lakehouse" \
            -u "trino://svc-superset-trino@{{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.trino" .) "context" .) }}:8443/{{ .Values.superset.trino.catalog }}"
          superset shell <<'PY'
          import json
          from superset import db
          from superset.models.core import Database
          d = db.session.query(Database).filter_by(database_name="Trino Lakehouse").one()
          extra = json.loads(d.extra or "{}")
          extra.setdefault("engine_params", {})["pool_recycle"] = {{ .Values.superset.trino.poolRecycleSeconds }}
          d.extra = json.dumps(extra)
          db.session.commit()
          PY
          {{- else }}
          superset set_database_uri \
            -d "Trino Lakehouse" \
            -u "trino://superset@{{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.trino" .) "context" .) }}:8080/{{ .Values.superset.trino.catalog }}"
          {{- end }}
          {{- if .Values.superset.exampleDashboard.enabled }}
          # Best-effort example dashboard import — NEVER fatal (a committed
          # Superset export is version-brittle; authored during UAT).
          superset import-dashboards -p /example/example-dashboard.zip || \
            echo "WARN: example dashboard import skipped (non-fatal)"
          {{- end }}
        env:
        - {name: DB_HOST,  value: {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.pgSupersetRw" .) "context" .) | quote }}}
        - {name: DB_NAME,  value: {{ .Values.postgres.superset.database | quote }}}
        - {name: DB_USER,     valueFrom: {secretKeyRef: {name: pg-superset-app, key: username}}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: pg-superset-app, key: password}}}
        - {name: SUPERSET_SECRET_KEY, valueFrom: {secretKeyRef: {name: superset, key: secret-key}}}
        - {name: OIDC_CLIENT_SECRET,  valueFrom: {secretKeyRef: {name: superset-oidc-credentials, key: client-secret}}}
        - {name: OIDC_ISSUER,         valueFrom: {secretKeyRef: {name: {{ required "oidc.secretName is empty — provision the OIDC credentials secret (issuer-url for Superset login) or set auth.oidc.enabled=false" .Values.oidc.secretName }}, key: issuer-url}}}
        - {name: ADMIN_USER,     value: {{ .Values.superset.adminUser | quote }}}
        - {name: ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: superset, key: admin-password}}}
        {{- if .Values.superset.alertsReports.enabled }}
        {{- include "lakehouse.superset.reportsEnv" . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - {name: superset-config, mountPath: /app/pythonpath/superset_config.py, subPath: superset_config.py}
      volumes:
      - name: superset-config
        configMap: {name: superset-config}
{{- end }}
