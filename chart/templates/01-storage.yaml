# Opt-in vendor CSI StorageClasses. Only parameterized. Gated by
# `.Values.components.storage` (DEFAULT `false` — storage neutrality:
# StorageClass availability/naming varies customer to customer, so most
# installs bring their own pre-existing cluster-scoped StorageClass(es) and
# just point `postgres.*.storage(.walStorage).storageClass` /
# `zeppelin.storageClassName` / `kafka.nodePools.*.storage.class` at them —
# empty default on every one of those fields means "use the cluster's
# default StorageClass", so no StorageClass at all needs to exist for a
# minimal install). Flip `components.storage` to `true` only when the chart
# itself should create the two StorageClasses below (e.g. a fresh cluster
# with a CSI driver already installed but no StorageClass yet) — set
# `storage.classes.*.provisioner`/`backend` to match your driver. Pure
# Storage (PSO CSI driver) is one example (see
# chart/values.yaml comment); any CSI driver works the same way.
#
# İki katmanda depolama:
#   (a) PV/PVC   — konteyner-local disk (Postgres, Kafka, notebook, Ollama cache)
#   (b) S3 object — lakehouse veri deposu; herhangi bir S3-uyumlu object store
#                   endpoint'i (MinIO, AWS S3, Ceph RGW, ...).
#
# NOTE (scope): the source manifest also carried `nessie-db-credentials` and
# `oidc-credentials` Secret placeholders alongside these StorageClasses.
# Those are out of scope here — `nessie-db-credentials` is auto-generated by
# the CNPG `Cluster` CR (see 02-postgres-ha.yaml), and
# `oidc-credentials` belongs to the components that actually consume it
# (Trino/Console). Only the StorageClasses and the
# S3 credential *name* (no material) belong to this task.
{{- if .Values.components.storage }}
# -------- Block (ReadWriteOnce) StorageClass --------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.classes.block.name }}
provisioner: {{ .Values.storage.classes.block.provisioner }}
parameters:
  backend: {{ .Values.storage.classes.block.backend }}
reclaimPolicy: {{ .Values.storage.classes.block.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storage.classes.block.allowVolumeExpansion }}
volumeBindingMode: {{ .Values.storage.classes.block.volumeBindingMode }}
---
# -------- File (ReadWriteMany) StorageClass — JupyterHub shared home vb. --------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.classes.fileRwx.name }}
provisioner: {{ .Values.storage.classes.fileRwx.provisioner }}
parameters:
  backend: {{ .Values.storage.classes.fileRwx.backend }}
reclaimPolicy: {{ .Values.storage.classes.fileRwx.reclaimPolicy }}
allowVolumeExpansion: {{ .Values.storage.classes.fileRwx.allowVolumeExpansion }}
volumeBindingMode: {{ .Values.storage.classes.fileRwx.volumeBindingMode }}
{{- end }}
---
# -------- S3 credential Secret (vendor-neutral) — NAME REFERENCE ONLY --------
# BU SECRET'I ELLE YAZMAYIN / bu chart material üretmez.
# `{{ .Values.storage.s3.secretName }}` adlı bir `Opaque` Secret,
# şu key'lerle namespace `{{ include "lakehouse.namespace" . }}` içinde
# önceden var olmalı — ExternalSecret/Vault (`values.secrets.mode: external`)
# veya `oc create secret` (`manual`) ile sağlanır:
#   access-key-id, secret-access-key, endpoint, region
# Bu chart'ın hiçbir template'i bu Secret'ı OLUŞTURMAZ; yalnızca isimle
# referans verir (bkz. spec §4 — secret materyali git'e/chart'a girmez).
