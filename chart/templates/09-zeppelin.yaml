# Apache Zeppelin — prod deployment. Only parameterized + made
# namespace-aware. Gated by `.Values.components.zeppelin`.
#
# Side-by-side with Jupyter. Zeppelin lets a single notebook blend
# paragraph-based Spark SQL + Python + Scala + Markdown, giving admins a
# presentation-friendly analysis environment.
#
# Arm64 caveat: apache/zeppelin only supports linux/amd64. Not an issue
# since OpenShift prod nodes are generally amd64.
#
# Spark binary: the apache/zeppelin base image already bundles the Spark
# interpreter; the internally-built image (images/zeppelin/Dockerfile) also
# embeds the trino-jdbc driver for the %trino interpreter — see `versions.zeppelinImageTag`.
#
# Authentication: enterprise Active Directory via Apache Shiro's native
# ActiveDirectoryGroupRealm. The bind service account DN + password come
# from a Secret; AD group membership maps to Zeppelin roles. AD/LDAPS
# settings (`zeppelin.ad.*`) are values-driven. `ad-bind-credentials` follows the SAME
# "name reference only" contract as `storage.s3.secretName` by
# default (`zeppelin.ad.bindPassword` defaults empty in chart/values.yaml —
# see that field's comment): this template only renders the Secret inline
# when a real `bindPassword` is explicitly supplied (dev/test convenience);
# otherwise the Secret must be provisioned out-of-band (ExternalSecret/Vault
# or `oc create secret`) under the same name/keys BEFORE install.
#
# Service wiring: Zeppelin's own Service has no downstream consumer in this
# chart (user access only) — so it was not added to _helpers.tpl's
# canonical service list (that list only covers Services with at least one
# consumer); the name stays the literal "zeppelin", only the ns comes from
# the helper. The Nessie catalog URI, however, comes from the
# `lakehouse.svc.nessie` helper — the SAME helper Trino/Spark Operator use (spec §3.1/§8).
# Sandbox v2 (Task 5, 2026-08-07-sandbox-v2): this shared instance's %pyspark
# interpreter also carries the UNIFIED sandbox WRITE catalog when
# `.Values.sandbox.enabled` — see chart/templates/_zeppelin.tpl's define-
# header comment for the full mechanism (svc-sandbox OAuth2, sandbox-oidc-
# credentials Secret, warehouse convention). The per-department sandbox
# Zeppelin instances that used to render from a separate file
# (chart/templates/09c-zeppelin-sandbox.yaml) are retired — this is now the
# ONLY Zeppelin instance the chart renders.
{{- if .Values.components.zeppelin }}
{{ include "lakehouse.zeppelin.instance" (dict
     "ctx" .
     "name" "zeppelin"
     "s3SecretName" .Values.storage.s3.secretName
     "oauth2ClientId" "svc-zeppelin-nessie"
     "oidcSecretName" "nessie-machine-auth-credentials"
     "oidcSecretKey" "zeppelin") }}
{{- end }}
