{{- if .Values.components.keycloak }}
---
# Keycloak auth Ingress — see the Route counterpart in 10-keycloak.yaml
# (there it's `termination: reencrypt`; here the equivalent is
# `nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"` — it tells the
# nginx ingress controller to speak HTTPS to the backend, targeting the
# `https` port of the Service produced by the Keycloak Operator).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
    secretName: keycloak-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "lakehouse.svc.keycloak" . }}
            port:
              name: https
{{- end }}
