# Vanilla Kubernetes Ingress + cert-manager integration — the
# `networking.k8s.io/v1` Ingress counterpart of chart/templates/
# 08-routes-tls.yaml (trino/ai-ui/nessie/superset/zeppelin/jupyter), the
# auth Route in 10-keycloak.yaml, the Routes in console/console.yaml +
# console/kafka-ui.yaml, AND the Route in monitoring/grafana.yaml.
#
# This ENTIRE file is gated on the INVERSE of the `lakehouse.isOpenShift`
# helper (`.Values.platform`): when `platform: openshift`, NOTHING here
# renders (that path renders the Routes instead); when `platform: vanilla`
# (default), the INVERSE holds — the Routes do NOT render, and the
# Ingresses here render instead. It is always the SAME
# `lakehouse.isOpenShift` helper (defined once, in _helpers.tpl), never a
# second literal `eq .Values.platform ...` check — so the two paths can
# never both render (or both stay empty) for the same logical endpoint.
#
# Host consistency (task brief acceptance criterion, SAME as the Routes):
# every Ingress's `spec.rules[].host` is generated from the SAME
# `lakehouse.routeHost` helper (_helpers.tpl) with the SAME logical name —
# Keycloak's OIDC client redirectUris/webOrigins (10-keycloak.yaml) always
# point at the same host regardless of platform.
#
# Gating: every Ingress sits behind the EXACT SAME `.Values.components.*`
# flag as its Route counterpart (the SAME dangling-Route note applies here
# — superset/jupyter/ai have NO backing Service in this package, their
# flags default to false, see the 08-routes-tls.yaml header).
#
# cert-manager: every Ingress carries the SAME `.Values.routes.certIssuer`
# as the `cert-manager.io/cluster-issuer` annotation (the same
# ClusterIssuer as the Routes) and requests its own `spec.tls[].secretName`
# (`<name>-tls` — cert-manager produces this Secret).
{{- if not (include "lakehouse.isOpenShift" .) }}
{{- if .Values.components.routesTls }}
---
# Trino — SQL endpoint + OAuth2 callback (see the Route counterpart in 08-routes-tls.yaml)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" "trino" "context" .) }}
    secretName: trino-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" "trino" "context" .) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "lakehouse.svc.trino" . }}
            port:
              name: http
