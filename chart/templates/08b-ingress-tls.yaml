# Vanilla Kubernetes Ingress + cert-manager entegrasyonu — chart/templates/
# 08-routes-tls.yaml (trino/ai-ui/nessie/superset/zeppelin/jupyter),
# 10-keycloak.yaml'daki auth Route, console/console.yaml + console/
# kafka-ui.yaml'daki Route'ların VE monitoring/grafana.yaml'daki Route'un
# `networking.k8s.io/v1` Ingress eşleniği.
#
# Bu dosyanın TAMAMI `lakehouse.isOpenShift` (`.Values.platform`) helper'ının
# TERSİ ile gate'lenir: `platform: openshift` iken buradan HİÇBİR ŞEY render
# edilmez (o path'te Route'lar render edilir); `platform: vanilla`
# (varsayılan) iken TERSİ — Route'lar render OLMAZ, buradaki Ingress'ler
# render edilir. Aynı `lakehouse.isOpenShift` helper'ı (bir kez tanımlı,
# _helpers.tpl), asla ikinci bir literal `eq .Values.platform ...` kontrolü
# değil — bu yüzden iki path aynı anda render olamaz (ya da ikisi de boş
# kalamaz) aynı mantıksal endpoint için.
#
# Host tutarlılığı (task brief kabul kriteri, Route'larla AYNI): her
# Ingress'in `spec.rules[].host`'u AYNI `lakehouse.routeHost` helper'ından
# (_helpers.tpl), AYNI mantıksal isimle üretilir — Keycloak OIDC client
# redirectUris/webOrigins'i (10-keycloak.yaml) platformdan bağımsız her
# zaman aynı host'u gösterir.
#
# Gating: her Ingress, Route eşleniğiyle BİREBİR AYNI `.Values.components.*`
# flag'i arkasında (dangling-Route notunun AYNISı burada da geçerli —
# superset/jupyter/ai backing Service'i bu pakette YOK, flag'leri varsayılan
# false, bkz. 08-routes-tls.yaml header).
#
# cert-manager: her Ingress AYNI `.Values.routes.certIssuer`'ı
# `cert-manager.io/cluster-issuer` annotation'ı olarak taşır (Route'larla
# aynı ClusterIssuer) ve kendi `spec.tls[].secretName`'ini talep eder
# (`<name>-tls` — cert-manager bu Secret'ı üretir).
{{- if not (include "lakehouse.isOpenShift" .) }}
{{- if .Values.components.routesTls }}
---
# Trino — SQL endpoint + OAuth2 callback (bkz. 08-routes-tls.yaml Route eşleniği)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" "trino" "context" .) }}
    secretName: trino-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" "trino" "context" .) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "lakehouse.svc.trino" . }}
            port:
              name: http
