{{- if .Values.components.keycloak }}
---
# Keycloak auth Ingress — bkz. 10-keycloak.yaml'daki Route eşleniği (orada
# `termination: reencrypt`; burada eşdeğeri
# `nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"` — nginx ingress
# controller'a backend'e HTTPS ile konuşmasını söyler, Keycloak Operator'ün
# ürettiği Service'in `https` portu hedeflenir).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
    secretName: keycloak-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" "auth" "context" .) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "lakehouse.svc.keycloak" . }}
            port:
              name: https
{{- end }}
