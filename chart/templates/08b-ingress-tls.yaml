---
# Apache Zeppelin (chart/templates/09-zeppelin.yaml ile deploy edildi).
# components.zeppelin gate'i: zeppelin kapalıyken backing Service'i olmayan
# dangling bir Ingress kalmasın (Route tarafındaki gate ile birebir — bkz.
# 08-routes-tls.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeppelin
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" "zeppelin" "context" .) }}
    secretName: zeppelin-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" "zeppelin" "context" .) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zeppelin
            port:
              name: http
{{- end }}
{{- if .Values.sandbox.enabled }}
{{- range .Values.sandbox.departments }}
---
# Per-department analyst sandbox Zeppelin instance (Consumption slice c2,
# chart/templates/09c-zeppelin-sandbox.yaml) — vanilla Ingress equivalent of
# the per-dept Route above (08-routes-tls.yaml). Gated on `sandbox.enabled`
# + non-empty `sandbox.departments` ONLY (NOT `components.zeppelin`, same
# reasoning as the Route side), matching 09c-zeppelin-sandbox.yaml's own
# gate exactly so this Ingress's backing Service always exists.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zeppelin-sandbox-{{ .name }}
  namespace: {{ include "lakehouse.namespace" $ }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $.Values.routes.certIssuer | quote }}
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
  - hosts:
    - {{ include "lakehouse.routeHost" (dict "name" (printf "zeppelin-sandbox-%s" .name) "context" $) }}
    secretName: zeppelin-sandbox-{{ .name }}-tls
  rules:
  - host: {{ include "lakehouse.routeHost" (dict "name" (printf "zeppelin-sandbox-%s" .name) "context" $) }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zeppelin-sandbox-{{ .name }}
            port:
              name: http
{{- end }}
{{- end }}
