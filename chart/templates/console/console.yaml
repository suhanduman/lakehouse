# Self-Service Lakehouse Console — backend (FastAPI) + frontend (React/Vite)
# Deployment/Service pair, a dedicated `lakehouse-console` ServiceAccount +
# NAMESPACE-SCOPED Role/RoleBinding (KafkaConnector/KafkaTopic CRs + Secret
# CRUD — no cluster-admin, no ClusterRole), a cert-manager TLS Route
# (frontend only) and a NetworkPolicy set. Only parameterized + made
# namespace-aware. Gated by `.Values.components.console`.
#
# LOAD-BEARING (do not change without re-reading sub-project B):
#   - The Role stays `kind: Role` (namespace-scoped), bound by a
#     `RoleBinding` (never `ClusterRole`/`ClusterRoleBinding`) — this is the
#     task's explicit acceptance criterion, carried over verbatim from the
#     source manifest's own "cluster-admin YOK, ClusterRole YOK" comment.
#   - `secrets` verbs are `[get, create, update, delete]` — no `list`/`patch`
#     (console/backend/app/services/k8s_service.py never LISTS secrets and
#     never calls a JSON-patch; its 409-fallback on `create_secret` calls
#     `replace_namespaced_secret`, a PUT, whose RBAC verb is `update`, not
#     `patch`). `get` (2026-08-29-self-service-resource-safety Task 4) is
#     used ONLY by that same 409-conflict path: when a self-service source-
#     secret name collides with an existing Secret, `create_secret` GETs the
#     existing object to read its **metadata/labels** — deciding whether it
#     carries `app.kubernetes.io/managed-by: lakehouse-console` (a
#     Console-created secret, safe to replace) or not (a foreign/platform
#     secret — e.g. `s3-credentials`/`trino-internal-secret` — which is
#     fail-closed: NEVER overwritten, SEC-1). The secret's VALUE (`.data`)
#     is still never read or logged by the Console — `get` only ever
#     inspects labels, never `.data`.
#
# Service wiring (spec §3.1/§8):
#   - Backend Service name = `lakehouse.svc.consoleBackend` (`console-backend`)
#     — MUST stay this exact name: console/frontend/nginx.conf's `/api`
#     proxy target is baked into the frontend image at Docker-build time as
#     the bare same-namespace service name `console-backend:8080` (see that
#     file's own comment) — namespace-generic by construction, since a bare
#     service name always resolves within the requesting pod's own
#     namespace. This chart only needs to guarantee the backend Service is
#     always named `console-backend` in the SAME namespace as the frontend,
#     which it does under any release namespace.
#   - Console -> Trino/Kafka Connect/Apicurio resolved via the
#     `lakehouse.svc.trino` / `.svc.connect` / `.svc.apicurio` helpers
#     (never hardcoded) — same helpers 06-trino-ha.yaml/12-kafka-connect.yaml/
#     11-apicurio-registry.yaml are verified against.
#   - S3 credentials come from the SAME `.Values.storage.s3.secretName`
#     Secret every other S3 consumer uses (Trino, CNPG backups, ...).
#   - `OIDC_ISSUER` is sourced from the SAME `.Values.oidc.secretName` Secret
#     (key `issuer-url`) Trino/Nessie already consume — single issuer source
#     across every OIDC-aware component in this chart (must match
#     `keycloak.realm.name` = `lakehouse`). `OIDC_AUDIENCE` is plain
#     (non-secret) config, `.Values.console.oidc.audience`.
#
{{- if .Values.components.console }}
{{- /*
GitOps repo URL fallback (2026-07-30-gitops-core-slice-a-write-path Task 6):
explicit `console.gitops.repoUrl` always wins when set. Only when it's
EMPTY *and* the in-cluster Gitea fallback is on (`components.gitea`,
chart/templates/16-gitea.yaml) do we default to that Gitea instance's SSH
remote — same "gitea-ssh" Service name/namespace/port 16-gitea.yaml
renders, so this string and that file's Service must be kept in sync.
When `components.gitea` is off (default) this resolves to "", identical to
today's behavior (Task 5) — the `required()` guard below still fails loud.
*/}}
{{- $gitopsRepoUrl := .Values.console.gitops.repoUrl }}
{{- if and (not $gitopsRepoUrl) .Values.components.gitea }}
{{- $gitopsRepoUrl = printf "ssh://git@gitea-ssh.%s.svc:22/gitea/%s.git" (include "lakehouse.namespace" .) .Values.gitea.repo }}
{{- end }}
---
# -------- ServiceAccount --------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lakehouse-console
  namespace: {{ include "lakehouse.namespace" . }}

---
# -------- Role (NAMESPACE-SCOPED — kind: Role, NEVER ClusterRole) --------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lakehouse-console-role
  namespace: {{ include "lakehouse.namespace" . }}
rules:
- apiGroups: [kafka.strimzi.io]
  resources: [kafkaconnectors, kafkatopics]
  verbs: [get, list, create, patch, delete]
# kafkausers: only get+patch — the orchestrator READ-MODIFY-WRITEs the `connect`
# KafkaUser's per-source ACLs (ensure/remove_user_acl); it never creates/lists/
# deletes KafkaUsers. Scoped to least-privilege (spec 3.7.1.3) rather than
# reusing the broader connector/topic verb set above.
- apiGroups: [kafka.strimzi.io]
  resources: [kafkausers]
  verbs: [get, patch]
- apiGroups: [kafka.strimzi.io]
  resources: [kafkaconnectors/status, kafkatopics/status]
  verbs: [get]
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, create, update, delete]

---
# -------- RoleBinding (namespace-scoped — NEVER ClusterRoleBinding) --------
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lakehouse-console-binding
  namespace: {{ include "lakehouse.namespace" . }}
subjects:
- kind: ServiceAccount
  name: lakehouse-console
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  kind: Role
  name: lakehouse-console-role
  apiGroup: rbac.authorization.k8s.io

---
# -------- Backend config (matches console/backend/app/config.py's Settings
# exactly — pydantic-settings reads NAMESPACE/TRINO_HOST/... case-
# insensitively) --------
apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-console-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  NAMESPACE: {{ include "lakehouse.namespace" . }}
  TRINO_HOST: {{ include "lakehouse.svc.trino" . }}
  TRINO_PORT: "8080"
  TRINO_USER: lakehouse-console
  CONNECT_URL: {{ printf "http://%s:8083" (include "lakehouse.svc.connect" .) | quote }}
  APICURIO_URL: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
  OIDC_AUDIENCE: {{ .Values.console.oidc.audience | quote }}
  {{- if .Values.auth.oidc.enabled }}
  # Nessie machine-auth (2026-08-06-nessie-machine-auth Task 7): tells the
  # backend's Iceberg-sink renderer (render_service._iceberg_catalog_io)
  # whether to emit the svc-connect-nessie OAuth2 keys. Plain (non-secret)
  # flag, same convention as OIDC_AUDIENCE above -- the client secret itself
  # is NEVER passed as a Console env var, only resolved by the Connect
  # worker itself via the `${directory:...}` provider reference
  # (12-kafka-connect.yaml's nessie-oauth mount). Gated (key omitted, not
  # just "false") on auth.oidc.enabled ONLY so the ConfigMap renders
  # byte-identical to pre-Task-7 behavior when auth is off -- the backend's
  # Settings.auth_oidc_enabled defaults to False when the env var is absent,
  # so functionality is identical either way.
  AUTH_OIDC_ENABLED: {{ .Values.auth.oidc.enabled | quote }}
  {{- end }}
  # Spark-batch lane (render_service.render_spark_job / ScheduledSparkApplication)
  # — SAME single-source values as the chart's own Spark jobs
  # (05-spark-operator.yaml): `.Values.global.imageRegistry`/`.Values.versions.
  # sparkImageTag` for the image, `.Values.storage.s3.secretName` for the S3
  # secret name the rendered CR must reference. Without these the backend
  # falls back to config.py's neutral defaults (a non-existent image/secret).
  SPARK_IMAGE: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
  S3_SECRET_NAME: {{ .Values.storage.s3.secretName | quote }}
  # Silver bucket-count default (2026-08-03 silver-scale-hardening) — feeds
  # Settings.silver_default_bucket_count (console/backend/app/config.py),
  # the orchestrator's fallback bucket count when a pipeline spec doesn't
  # set its own `silver_bucket_count` (same bucket-count knob merge_cdc.py's
  # SPJ_CONF prunes against, wired above into silver-merge's sparkConf).
  SILVER_DEFAULT_BUCKET_COUNT: {{ .Values.console.silverDefaultBucketCount | default 16 | quote }}
  # GitOps write-path (2026-07-30-gitops-core-slice-a-write-path Task 5) —
  # plain (non-secret) config, same convention as OIDC_AUDIENCE/S3_SECRET_NAME
  # above. `.Values.console.gitops.credentialSecret` is only a Secret NAME
  # reference here (its material is mounted as a file below, not read as an
  # env var — see the Deployment's gitops volume/volumeMount).
  # GITOPS_REPO_URL uses the computed `$gitopsRepoUrl` (Task 6, see top of
  # file) — falls back to the in-cluster Gitea only when the explicit value
  # is empty AND `components.gitea` is on; otherwise identical to Task 5.
  DEPLOY_MODE: {{ .Values.console.deployMode | quote }}
  GITOPS_REPO_URL: {{ $gitopsRepoUrl | quote }}
  GITOPS_BRANCH: {{ .Values.console.gitops.branch | quote }}
  GITOPS_PATH: {{ .Values.console.gitops.path | quote }}
  GITOPS_CREDENTIAL_SECRET: {{ .Values.console.gitops.credentialSecret | quote }}
  # ArgoCD-status read-path (2026-07-30-gitops-core-slice-b1-argocd-wiring
  # Task 6) — plain (non-secret) config, same convention as GITOPS_* above.
  # Feeds `settings.argocd_namespace` (Task 4), consumed by the `/gitops/
  # status` reader (Task 5) to locate the Application CR. Set unconditionally
  # (not gated on deployMode) since the backend/reader itself only acts on
  # it when relevant; the RBAC granting access to it below IS gated.
  ARGOCD_NAMESPACE: {{ .Values.console.argocdNamespace | quote }}

---
# -------- Backend Deployment --------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-backend
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: console-backend}
spec:
  replicas: {{ .Values.console.backend.replicas }}
  selector: {matchLabels: {app: console-backend}}
  template:
    metadata:
      labels: {app: console-backend}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      serviceAccountName: lakehouse-console
      containers:
      - name: console-backend
        image: {{ printf "%s/console-backend:%s" .Values.global.imageRegistry .Values.versions.consoleBackendImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8080}]
        envFrom:
        - configMapRef: {name: lakehouse-console-config}
        env:
        # S3 credentials come from the S3 secret — since the key names
        # differ (access-key-id/secret-access-key/endpoint) they are mapped
        # one by one, not blindly passed through via envFrom.
        - {name: S3_ENDPOINT, valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: endpoint}}}
        - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: access-key-id}}}
        - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: secret-access-key}}}
        # OIDC issuer — the SAME oidc-credentials Secret as Trino/Nessie (single source).
        - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: issuer-url}}}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 20, periodSeconds: 15}
        resources:
          requests:
            cpu: {{ .Values.console.backend.resources.requests.cpu | quote }}
            memory: {{ .Values.console.backend.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.console.backend.resources.limits.cpu | quote }}
            memory: {{ .Values.console.backend.resources.limits.memory | quote }}
        {{- if eq .Values.console.deployMode "gitops" }}
        # GitOps write-path (Task 5): git SSH credential mounted as files, NOT
        # env vars — the backend (Task 4) reads the private key from
        # /var/run/gitops/ssh-privatekey (+ optional known_hosts alongside
        # it), same "credential mounted as file" pattern used for every other
        # git/SSH-style secret in this ecosystem. `deployMode: gitops` also
        # REQUIRES `console.gitops.repoUrl` (guarded below) — fail loud at
        # `helm install/upgrade`, mirroring the `oidc.secretName` `required()`
        # guard in 06-trino-ha.yaml/04-nessie-ha.yaml, rather than the
        # backend silently no-op'ing at runtime with an empty repo URL.
        volumeMounts:
        - name: gitops-credential
          mountPath: /var/run/gitops
          readOnly: true
        {{- end }}
      {{- if eq .Values.console.deployMode "gitops" }}
      {{- /* Guard on the COMPUTED repo URL ($gitopsRepoUrl, top of file), not
             the raw value — a Gitea-fallback install (components.gitea=true,
             gitops.repoUrl left empty) is a valid gitops config, not a
             misconfiguration. */}}
      {{- $_ := required "console.gitops.repoUrl is required when deployMode=gitops" $gitopsRepoUrl }}
      volumes:
      - name: gitops-credential
        secret:
          secretName: {{ .Values.console.gitops.credentialSecret | quote }}
          defaultMode: 0400
          items:
          - key: ssh-privatekey
            path: ssh-privatekey
          - key: known_hosts
            path: known_hosts
            optional: true
      {{- end }}

---
# -------- Backend Service — MUST match the nginx `/api` proxy target
# exactly (see the file-header NOTE) --------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.consoleBackend" . }}
  namespace: {{ include "lakehouse.namespace" . }}
{{- if and .Values.components.monitoring .Values.monitoring.targets.console.enabled }}
  # ServiceMonitor selector target label (chart/templates/monitoring/
  # servicemonitors.yaml `console` selector.matchLabels) — matches on the
  # Service's metadata.labels, not spec.selector.
  labels: {app: console-backend}
{{- end }}
spec:
  selector: {app: console-backend}
  ports: [{name: http, port: 8080, targetPort: 8080}]

---
# -------- Frontend Deployment --------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console-frontend
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: console-frontend}
spec:
  replicas: {{ .Values.console.frontend.replicas }}
  selector: {matchLabels: {app: console-frontend}}
  template:
    metadata:
      labels: {app: console-frontend}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      # The static nginx server has NO need at all for apiserver/Trino/
      # Connect/Apicurio/S3; it doesn't need a separate ServiceAccount/RBAC
      # (the default SA is enough). NOTE (restrictedSecurityContext): on
      # OpenShift a non-root nginx image is required (unprivileged; 8080 is
      # already an unprivileged port).
      containers:
      - name: console-frontend
        image: {{ printf "%s/console-frontend:%s" .Values.global.imageRegistry .Values.versions.consoleFrontendImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 10, periodSeconds: 15}
        resources:
          requests:
            cpu: {{ .Values.console.frontend.resources.requests.cpu | quote }}
            memory: {{ .Values.console.frontend.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.console.frontend.resources.limits.cpu | quote }}
            memory: {{ .Values.console.frontend.resources.limits.memory | quote }}

---
# -------- Frontend Service — Route hedefi --------
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.consoleFrontend" . }}
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: console-frontend}
  ports: [{name: http, port: 8080, targetPort: 8080}]

{{- if include "lakehouse.isOpenShift" . }}
---
# -------- Route (cert-manager TLS) — only the frontend is exposed
# externally; the backend has NO direct external access (also closed off
# by NetworkPolicy). The host is generated from the SAME
# `lakehouse.routeHost` helper ("console" logical name) as the
# `lakehouse-console` OIDC client's redirectUris/webOrigins in
# 10-keycloak.yaml — host/redirect can never drift apart. --------
# Extra gate: `lakehouse.isOpenShift` (`.Values.platform`) — its vanilla
# counterpart is chart/templates/08b-ingress-tls.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "lakehouse.svc.consoleFrontend" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "console" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.consoleFrontend" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}

---
# -------- NetworkPolicy: Ingress --------
# Frontend: ingress ONLY from the Route/ingress-controller (the
# namespace-wide `allow-intra-namespace` policy (00-namespace.yaml) already
# allows traffic from every pod within the namespace — this policy is a
# console-specific defense-in-depth layer, it does NOT narrow that broader
# rule). The source namespace selector varies by platform — the SAME
# rationale + the SAME helper as the `allow-from-ingress-and-monitoring`
# policy in 00-namespace.yaml: OpenShift's `network.openshift.io/policy-group`
# label does NOT exist on vanilla, so the k8s-standard
# `kubernetes.io/metadata.name` + `.Values.ingress.controllerNamespace` is
# used instead. Pod/port scoping is THE SAME on BOTH platforms.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-frontend-ingress
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  podSelector: {matchLabels: {app: console-frontend}}
  policyTypes: [Ingress]
  ingress:
  - from:
{{- if include "lakehouse.isOpenShift" . }}
    - namespaceSelector:
        matchLabels: {network.openshift.io/policy-group: ingress}
{{- else }}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}}
{{- end }}
    ports: [{protocol: TCP, port: 8080}]

---
# Backend: ingress ONLY from the frontend pod (nginx `/api` proxy) — NO
# direct access from the Route/outside.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-backend-ingress
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  podSelector: {matchLabels: {app: console-backend}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: console-frontend}}
    ports: [{protocol: TCP, port: 8080}]

---
# -------- NetworkPolicy: Egress --------
# console-backend -> apiserver + Trino + Kafka Connect + Apicurio + S3 (+DNS).
# The frontend (static nginx) has NO need for this egress — it was
# deliberately left out of this policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: console-backend-egress
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  podSelector: {matchLabels: {app: console-backend}}
  policyTypes: [Egress]
  egress:
  # DNS resolution. The source namespace selector varies by platform — the
  # SAME rationale + the SAME pattern as this file's frontend Ingress
  # NetworkPolicy (above) and 00-namespace.yaml's
  # allow-from-ingress-and-monitoring: OpenShift's "dns" policy-group does
  # NOT exist on vanilla clusters, so the k8s-standard
  # `kubernetes.io/metadata.name` +
  # `.Values.console.networkPolicy.dnsNamespace` ("kube-system", CoreDNS's
  # k8s-standard address) is used instead.
  - to:
{{- if include "lakehouse.isOpenShift" . }}
    - namespaceSelector:
        matchLabels: {network.openshift.io/policy-group: dns}
{{- else }}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: {{ .Values.console.networkPolicy.dnsNamespace }}}
{{- end }}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  # Kubernetes API server — 443 AND 6443/TCP (see the source manifest's
  # POC-VERIFY note: in-cluster apiserver access can be 443 or 6443
  # depending on the CNI).
  - to:
    - namespaceSelector: {}
    ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 6443}]
  # Trino coordinator (bkz. 06-trino-ha.yaml)
  - to:
    - podSelector: {matchLabels: {app: trino, role: coordinator}}
    ports: [{protocol: TCP, port: 8080}]
  # Kafka Connect REST API (Strimzi's automatic pod labels — see 12-kafka-connect.yaml)
  - to:
    - podSelector: {matchLabels: {strimzi.io/cluster: connect, strimzi.io/kind: KafkaConnect}}
    ports: [{protocol: TCP, port: 8083}]
  # Apicurio Registry (bkz. 11-apicurio-registry.yaml)
  - to:
    - podSelector: {matchLabels: {app: apicurio-registry}}
    ports: [{protocol: TCP, port: 8080}]
  # S3 (outside the cluster) — the CIDR/IP block is environment-specific.
  - to:
    - ipBlock: {cidr: {{ .Values.console.networkPolicy.s3Cidr | quote }}}
    ports: [{protocol: TCP, port: 443}]

{{- if eq .Values.console.deployMode "gitops" }}
---
# -------- ArgoCD-read RBAC (2026-07-30-gitops-core-slice-b1-argocd-wiring
# Task 6) — NAMESPACE-SCOPED `Role` (NEVER `ClusterRole`), rendered ONLY in
# gitops mode. Lives in `.Values.console.argocdNamespace` (ArgoCD's OWN
# namespace, generally different from the release namespace this chart's
# other Role/RoleBinding pair above lives in), granting the SAME
# `lakehouse-console` ServiceAccount (release namespace, bound cross-
# namespace via the RoleBinding's `subjects[].namespace`) read-only access
# to the `Application` CR the `/gitops/status` endpoint (Task 5) polls. --------
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lakehouse-console-argocd-read
  namespace: {{ .Values.console.argocdNamespace | quote }}
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lakehouse-console-argocd-read
  namespace: {{ .Values.console.argocdNamespace | quote }}
subjects:
- kind: ServiceAccount
  name: lakehouse-console
  namespace: {{ include "lakehouse.namespace" . }}
roleRef: {kind: Role, name: lakehouse-console-argocd-read, apiGroup: rbac.authorization.k8s.io}
{{- end }}
{{- end }}
