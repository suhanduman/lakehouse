# Kafka UI (kafbat-ui — community fork of provectus/kafka-ui, Apache-2.0) —
# single-pane-of-glass visibility into Kafka cluster/topic/consumer-group +
# Kafka Connect + the Apicurio schema registry. Only parameterized + made
# namespace-aware. Gated by `.Values.components.kafkaUi`.
# Kafka UI's own Route is defined here (it was in
# 17-console-routes-oidc.yaml in the source manifest — moved here under
# this chart's "a component's file carries its own Route" convention, see
# the header note in chart/templates/console/routes-oidc.yaml).
#
# Kafka UI is ONLY a viewing/ops tool: for the data-plane configuration
# (topic/connector/source definitions), Git is the single source of truth
# (see 03-kafka-strimzi.yaml, 12-kafka-connect.yaml, console/ — the
# KafkaConnector CRs the Console's add-source wizard applies).
#
# Service wiring: Kafka bootstrap via `lakehouse.svc.kafkaBootstrap`, Kafka
# Connect via `lakehouse.svc.connect`, Apicurio ccompat via
# `lakehouse.svc.apicurio` — all from helpers (never hardcoded).
#
# The `kafka-ui` KafkaUser's SCRAM Secret and `kafka-cluster-ca-cert` are
# Strimzi-managed (fixed convention, the SAME pattern as the `connect`
# credentials in 12-kafka-connect.yaml) — not values-driven.
#
# POC-VERIFY (inherited from the source manifest, to be confirmed on the
# cluster — see the header note in prod-manifests/16-kafka-ui.yaml):
#   - the kafbat-ui:v1.5.0 config schema (kafka.clusters[].properties/ssl/
#     schemaRegistry/kafka-connect/auth.oauth2/rbac).
#   - `ssl.truststore-location: .../ca.p12` — the assumption that the
#     kafka-cluster-ca-cert Secret contains the PKCS12 `ca.p12`/`ca.password` keys.
#   - the `SPRING_CONFIG_ADDITIONAL_LOCATION` env var name (underscored — relaxed binding).
#   - the `rbac.roles[].subjects[].type: role` (provider: oauth) enum value.
#   - the Apicurio ccompat path (`/apis/ccompat/v7`).
{{- if .Values.components.kafkaUi }}
---
# Kafka UI's own SCRAM identity — read-only (Describe/Read); NO
# Write/Create/Delete/Alter. Intervening in the data plane (creating
# topics/ACLs, producing messages) was deliberately kept out of this ACL set.
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaUser
metadata:
  name: kafka-ui
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - {resource: {type: topic, name: "", patternType: prefix}, operations: [Read, Describe]}
    - {resource: {type: group, name: "", patternType: prefix}, operations: [Read, Describe]}
    - {resource: {type: cluster}, operations: [Describe, DescribeConfigs]}

---
# -------- Kafka UI config (Spring Boot YAML — the kafbat-ui docs
# recommend this file over env variables). The `${VAR}` placeholders are
# Spring's standard env-variable interpolation (DIFFERENT from Trino's
# `${ENV:VAR}`). --------
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  config.yml: |
    kafka:
      clusters:
        - name: {{ include "lakehouse.namespace" . }}
          bootstrap-servers: {{ printf "%s:9093" (include "lakehouse.svc.kafkaBootstrap" .) }}
          properties:
            "security.protocol": SASL_SSL
            "sasl.mechanism": SCRAM-SHA-512
            "sasl.jaas.config": >-
              org.apache.kafka.common.security.scram.ScramLoginModule required
              username="kafka-ui" password="${KAFKA_UI_SCRAM_PASSWORD}";
          ssl:
            truststore-location: /mnt/kafka-ca/ca.p12       # POC-VERIFY: see the file-header note
            truststore-password: "${KAFKA_CA_TRUSTSTORE_PASSWORD}"
          schemaRegistry: {{ printf "http://%s:8080/apis/ccompat/v7" (include "lakehouse.svc.apicurio" .) | quote }}
          kafka-connect:
            - name: connect
              address: {{ printf "http://%s:8083" (include "lakehouse.svc.connect" .) | quote }}
      # NOTE: the SINGLE source of truth for connectors is the
      # KafkaConnector CRs the Console's add-source wizard
      # (console/backend/app/orchestrator.py) applies to the cluster (see
      # 12-kafka-connect.yaml's `strimzi.io/use-connector-resources`). The
      # RBAC below deliberately grants connectors only "view" — creating a
      # connector from within Kafka UI is left non-functional.
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: kafka-ui
            clientSecret: "${OIDC_CLIENT_SECRET}"
            scope: openid
            client-name: Keycloak
            provider: keycloak
            redirect-uri: {{ printf "https://%s/login/oauth2/code/keycloak" (include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .)) | quote }}
            issuer-uri: "${OIDC_ISSUER}"
            user-name-attribute: preferred_username
            custom-params:
              type: oauth
              roles-field: groups             # see the groups claim mapper in 10-keycloak.yaml
    rbac:
      roles:
        # The AD group names match `groups` in 10-keycloak.yaml
        # (lakehouse-admins/lakehouse-analysts/lakehouse-students) exactly
        # — the SAME contract as console/backend/app/services/authz.py's _GROUP_TO_ROLE.
        - name: lakehouse-admins
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-admins"}   # POC-VERIFY: type enum
          permissions:
          - {resource: applicationconfig, actions: ["view"]}
          - {resource: clusterconfig, actions: ["view"]}
          - {resource: topic, value: ".*", actions: ["view", "messages_read"]}
          - {resource: consumer, value: ".*", actions: ["view"]}
          - {resource: schema, value: ".*", actions: ["view"]}
          - {resource: connect, value: ".*", actions: ["view"]}
          - {resource: connector, value: ".*", actions: ["view"]}   # read-only — see the NOTE above
        - name: lakehouse-analysts
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-analysts"}
          permissions:
          - {resource: clusterconfig, actions: ["view"]}
          - {resource: topic, value: ".*", actions: ["view", "messages_read"]}
          - {resource: consumer, value: ".*", actions: ["view"]}
          - {resource: schema, value: ".*", actions: ["view"]}
          - {resource: connect, value: ".*", actions: ["view"]}
          - {resource: connector, value: ".*", actions: ["view"]}
        - name: lakehouse-students
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-students"}
          permissions:
          - {resource: topic, value: ".*", actions: ["view"]}
      # Unmatched (unmapped) AD groups/users — default: nothing is visible
      # (deny-by-default, least-privilege).
      default-role:
        permissions: []

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: kafka-ui}
spec:
  replicas: {{ .Values.kafkaUi.replicas }}
  selector: {matchLabels: {app: kafka-ui}}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      # Kafka UI never calls the apiserver at all (only HTTP/Kafka-protocol
      # calls to Kafka/Connect/Apicurio/Keycloak) — no dedicated
      # ServiceAccount/RBAC is needed.
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: kafka-ui
        image: {{ .Values.versions.kafkaUiImage | quote }}   # POC-VERIFY: see the file-header note
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8080, name: http}]
        env:
        - {name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "/kafka-ui-config/config.yml"}   # POC-VERIFY: see the file-header note
        - {name: KAFKA_UI_SCRAM_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-ui, key: password}}}
        - {name: KAFKA_CA_TRUSTSTORE_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-cluster-ca-cert, key: ca.password}}}
        - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: issuer-url}}}
        - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: kafka-ui-oidc-credentials, key: client-secret}}}  # see chart/templates/console/routes-oidc.yaml
        volumeMounts:
        - {name: kafka-ui-config, mountPath: /kafka-ui-config, readOnly: true}
        - {name: kafka-ca, mountPath: /mnt/kafka-ca, readOnly: true}
        readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}  # POC-VERIFY: actuator path
        livenessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 40, periodSeconds: 15}
        resources:
          requests:
            cpu: {{ .Values.kafkaUi.resources.requests.cpu | quote }}
            memory: {{ .Values.kafkaUi.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.kafkaUi.resources.limits.cpu | quote }}
            memory: {{ .Values.kafkaUi.resources.limits.memory | quote }}
      volumes:
      - name: kafka-ui-config
        configMap: {name: kafka-ui-config}
      - name: kafka-ca
        secret: {secretName: kafka-cluster-ca-cert}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.kafkaUi" . }}
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: kafka-ui}
  ports: [{name: http, port: 8080, targetPort: 8080}]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-ui-pdb
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: kafka-ui}}

{{- if include "lakehouse.isOpenShift" . }}
---
# Kafka UI — cert-manager TLS Route (edge; Kafka UI doesn't speak TLS
# itself). The host is generated from the SAME `lakehouse.routeHost`
# helper ("kafka-ui" logical name) as the `kafka-ui` OIDC client's
# redirectUris/webOrigins in 10-keycloak.yaml — host/redirect can never
# drift apart. Extra gate: `lakehouse.isOpenShift` (`.Values.platform`) —
# its vanilla counterpart is chart/templates/08b-ingress-tls.yaml.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "lakehouse.svc.kafkaUi" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.kafkaUi" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
