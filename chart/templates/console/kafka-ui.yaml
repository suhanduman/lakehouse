# Kafka UI (kafbat-ui — community fork of provectus/kafka-ui, Apache-2.0) —
# tek pencereden Kafka cluster/topic/consumer-group + Kafka Connect + Apicurio
# schema registry görünürlüğü. Only parameterized + made namespace-aware.
# Gated by `.Values.components.kafkaUi`.
# Kafka UI'nin kendi Route'u burada tanımlı (kaynak manifestte
# 17-console-routes-oidc.yaml'daydı — bu chart'ta "component dosyası kendi
# Route'unu taşır" konvansiyonuyla buraya taşındı, bkz.
# chart/templates/console/routes-oidc.yaml header notu).
#
# Kafka UI YALNIZCA görüntüleme/işletim aracı: veri düzlemi konfigürasyonu
# (topic/connector/kaynak tanımları) GİT tek doğruluk kaynağıdır (bkz.
# 03-kafka-strimzi.yaml, 12-kafka-connect.yaml, 13-connectors.yaml,
# console/).
#
# Servis wiring: Kafka bootstrap `lakehouse.svc.kafkaBootstrap`, Kafka
# Connect `lakehouse.svc.connect`, Apicurio ccompat `lakehouse.svc.apicurio`
# — hepsi helper'dan (asla hardcoded).
#
# `kafka-ui` KafkaUser'ın SCRAM Secret'ı ve `kafka-cluster-ca-cert`
# Strimzi-yönetimlidir (fixed convention, 12-kafka-connect.yaml'ın `connect`
# kimlik bilgileriyle aynı desen) — values-driven değil.
#
# POC-DOĞRULA (kaynak manifestten devralınan, kümede doğrulanacak — bkz.
# prod-manifests/16-kafka-ui.yaml header notu):
#   - kafbat-ui:v1.5.0 config şeması (kafka.clusters[].properties/ssl/
#     schemaRegistry/kafka-connect/auth.oauth2/rbac).
#   - `ssl.truststore-location: .../ca.p12` — kafka-cluster-ca-cert Secret'ının
#     PKCS12 `ca.p12`/`ca.password` anahtarları içerdiği varsayımı.
#   - `SPRING_CONFIG_ADDITIONAL_LOCATION` env adı (altçizgili — relaxed binding).
#   - `rbac.roles[].subjects[].type: role` (provider: oauth) enum değeri.
#   - Apicurio ccompat path'i (`/apis/ccompat/v7`).
{{- if .Values.components.kafkaUi }}
---
# Kafka UI'nin kendi SCRAM kimliği — salt-okunur (Describe/Read); Write/
# Create/Delete/Alter YOK. Veri düzlemine müdahale (topic/ACL oluşturma,
# mesaj üretme) bilerek bu ACL setinin dışında tutuldu.
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaUser
metadata:
  name: kafka-ui
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - {resource: {type: topic, name: "", patternType: prefix}, operations: [Read, Describe]}
    - {resource: {type: group, name: "", patternType: prefix}, operations: [Read, Describe]}
    - {resource: {type: cluster}, operations: [Describe, DescribeConfigs]}

---
# -------- Kafka UI config (Spring Boot YAML — kafbat-ui dokümantasyonu env
# değişkenleri yerine bu dosyayı önerir). `${VAR}` yer tutucuları Spring'in
# standart env değişkeni interpolasyonu (Trino'daki `${ENV:VAR}`'dan FARKLI). --------
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  config.yml: |
    kafka:
      clusters:
        - name: {{ include "lakehouse.namespace" . }}
          bootstrap-servers: {{ printf "%s:9093" (include "lakehouse.svc.kafkaBootstrap" .) }}
          properties:
            "security.protocol": SASL_SSL
            "sasl.mechanism": SCRAM-SHA-512
            "sasl.jaas.config": >-
              org.apache.kafka.common.security.scram.ScramLoginModule required
              username="kafka-ui" password="${KAFKA_UI_SCRAM_PASSWORD}";
          ssl:
            truststore-location: /mnt/kafka-ca/ca.p12       # POC-DOĞRULA: bkz. dosya başı notu
            truststore-password: "${KAFKA_CA_TRUSTSTORE_PASSWORD}"
          schemaRegistry: {{ printf "http://%s:8080/apis/ccompat/v7" (include "lakehouse.svc.apicurio" .) | quote }}
          kafka-connect:
            - name: connect
              address: {{ printf "http://%s:8083" (include "lakehouse.svc.connect" .) | quote }}
      # NOT: connector'ların TEK doğruluk kaynağı Git'teki KafkaConnector
      # CR'leridir (bkz. 12-kafka-connect.yaml `strimzi.io/use-connector-resources`,
      # 13-connectors.yaml). Aşağıdaki RBAC bilerek connector'a yalnızca "view"
      # veriyor — Kafka UI'de connector oluşturma işlevsiz kalır.
    auth:
      type: OAUTH2
      oauth2:
        client:
          keycloak:
            clientId: kafka-ui
            clientSecret: "${OIDC_CLIENT_SECRET}"
            scope: openid
            client-name: Keycloak
            provider: keycloak
            redirect-uri: {{ printf "https://%s/login/oauth2/code/keycloak" (include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .)) | quote }}
            issuer-uri: "${OIDC_ISSUER}"
            user-name-attribute: preferred_username
            custom-params:
              type: oauth
              roles-field: groups             # bkz. 10-keycloak.yaml groups claim mapper
    rbac:
      roles:
        # AD grup adları 10-keycloak.yaml'daki `groups` (lakehouse-admins/
        # lakehouse-analysts/lakehouse-students) ile birebir — bkz.
        # console/backend/app/services/authz.py _GROUP_TO_ROLE ile aynı sözleşme.
        - name: lakehouse-admins
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-admins"}   # POC-DOĞRULA: type enum
          permissions:
          - {resource: applicationconfig, actions: ["view"]}
          - {resource: clusterconfig, actions: ["view"]}
          - {resource: topic, value: ".*", actions: ["view", "messages_read"]}
          - {resource: consumer, value: ".*", actions: ["view"]}
          - {resource: schema, value: ".*", actions: ["view"]}
          - {resource: connect, value: ".*", actions: ["view"]}
          - {resource: connector, value: ".*", actions: ["view"]}   # salt-okunur — yukarıdaki NOT'a bkz.
        - name: lakehouse-analysts
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-analysts"}
          permissions:
          - {resource: clusterconfig, actions: ["view"]}
          - {resource: topic, value: ".*", actions: ["view", "messages_read"]}
          - {resource: consumer, value: ".*", actions: ["view"]}
          - {resource: schema, value: ".*", actions: ["view"]}
          - {resource: connect, value: ".*", actions: ["view"]}
          - {resource: connector, value: ".*", actions: ["view"]}
        - name: lakehouse-students
          clusters: [{{ include "lakehouse.namespace" . }}]
          subjects:
          - {provider: oauth, type: role, value: "lakehouse-students"}
          permissions:
          - {resource: topic, value: ".*", actions: ["view"]}
      # Eşleşmeyen (mapsiz) AD grupları/kullanıcıları — varsayılan: hiçbir
      # şey görünmez (deny-by-default, least-privilege).
      default-role:
        permissions: []

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: kafka-ui}
spec:
  replicas: {{ .Values.kafkaUi.replicas }}
  selector: {matchLabels: {app: kafka-ui}}
  template:
    metadata:
      labels: {app: kafka-ui}
    spec:
      # Kafka UI apiserver'a hiç çağrı yapmaz (yalnızca Kafka/Connect/
      # Apicurio/Keycloak'a HTTP/Kafka protokolü) — özel ServiceAccount/RBAC
      # gerekmez.
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: kafka-ui
        image: {{ .Values.versions.kafkaUiImage | quote }}   # POC-DOĞRULA: bkz. dosya başı notu
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8080, name: http}]
        env:
        - {name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "/kafka-ui-config/config.yml"}   # POC-DOĞRULA: bkz. dosya başı notu
        - {name: KAFKA_UI_SCRAM_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-ui, key: password}}}
        - {name: KAFKA_CA_TRUSTSTORE_PASSWORD, valueFrom: {secretKeyRef: {name: kafka-cluster-ca-cert, key: ca.password}}}
        - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: issuer-url}}}
        - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: kafka-ui-oidc-credentials, key: client-secret}}}  # bkz. chart/templates/console/routes-oidc.yaml
        volumeMounts:
        - {name: kafka-ui-config, mountPath: /kafka-ui-config, readOnly: true}
        - {name: kafka-ca, mountPath: /mnt/kafka-ca, readOnly: true}
        readinessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}  # POC-DOĞRULA: actuator path
        livenessProbe: {httpGet: {path: /actuator/health, port: 8080}, initialDelaySeconds: 40, periodSeconds: 15}
        resources:
          requests:
            cpu: {{ .Values.kafkaUi.resources.requests.cpu | quote }}
            memory: {{ .Values.kafkaUi.resources.requests.memory | quote }}
          limits:
            cpu: {{ .Values.kafkaUi.resources.limits.cpu | quote }}
            memory: {{ .Values.kafkaUi.resources.limits.memory | quote }}
      volumes:
      - name: kafka-ui-config
        configMap: {name: kafka-ui-config}
      - name: kafka-ca
        secret: {secretName: kafka-cluster-ca-cert}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.kafkaUi" . }}
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  selector: {app: kafka-ui}
  ports: [{name: http, port: 8080, targetPort: 8080}]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-ui-pdb
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: kafka-ui}}

{{- if include "lakehouse.isOpenShift" . }}
---
# Kafka UI — cert-manager TLS Route (edge; Kafka UI kendi TLS'ini konuşmaz).
# Host, 10-keycloak.yaml'daki `kafka-ui` OIDC client'ın redirectUris/
# webOrigins'iyle AYNI `lakehouse.routeHost` helper'ından ("kafka-ui"
# mantıksal isim) üretilir — host/redirect asla ayrışmaz. Ek gate:
# `lakehouse.isOpenShift` (`.Values.platform`) — vanilla eşleniği
# chart/templates/08b-ingress-tls.yaml'da.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "lakehouse.svc.kafkaUi" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.routes.certIssuer | quote }}
spec:
  host: {{ include "lakehouse.routeHost" (dict "name" "kafka-ui" "context" .) }}
  to:
    kind: Service
    name: {{ include "lakehouse.svc.kafkaUi" . }}
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
