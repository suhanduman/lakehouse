# connect-acl-seed — dual-hook (helm post-install,post-upgrade + ArgoCD
# PostSync) Job that merge-ADDS `.Values.kafkaConnect.connectBaseAcls` onto
# the `connect` KafkaUser via kubectl+jq.
#
# The `connect` KafkaUser's ACLs are RUNTIME-OWNED: 03-kafka-strimzi.yaml
# declares that KafkaUser WITHOUT an `acls` field (see that file's comment)
# so a plain `helm upgrade`/ArgoCD sync never clobbers the per-source ACLs
# the Console adds at runtime for each newly-configured source connector
# (Task 4 of this project removed the static ACL list from the chart's
# KafkaUser CR for exactly this reason — this Job is what now seeds the
# static BASE set that used to live there).
#
# This Job is intentionally a MERGE-ADD, never a replace/remove: it reads
# the CURRENT `spec.authorization.acls` off the live KafkaUser, appends any
# base-ACL entry not already present (deduped by type|name|patternType,
# existing entries win so Console-added per-source ACLs are never
# overwritten or dropped), and patches the merged list back. Safe to re-run
# on every install/upgrade/PostSync — idempotent, and additive only.
#
# Mirrors chart/templates/prereq-check-job.yaml's SA/Role/RoleBinding/
# hook-Job pattern (RBAC scoped to exactly one verb pair on one resource)
# and chart/templates/18-bucket-init.yaml's dual-hook annotation set (this
# Job, like bucket-init, must run on BOTH plain `helm install/upgrade` AND
# ArgoCD PostSync — see gitops/apps/app-of-apps.yaml).
{{- if .Values.kafkaConnect.seedConnectAcls }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lakehouse-connect-acl-seed
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lakehouse-connect-acl-seed
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
rules:
- apiGroups: [kafka.strimzi.io]
  resources: [kafkausers]
  verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lakehouse-connect-acl-seed
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
subjects:
- kind: ServiceAccount
  name: lakehouse-connect-acl-seed
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  kind: Role
  name: lakehouse-connect-acl-seed
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lakehouse-connect-acl-seed
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "argocd.argoproj.io/hook": PostSync
    "argocd.argoproj.io/hook-delete-policy": HookSucceeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" . | nindent 8 }}
        app: lakehouse-connect-acl-seed
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      serviceAccountName: lakehouse-connect-acl-seed
      restartPolicy: Never
      containers:
      - name: connect-acl-seed
        image: {{ .Values.versions.kubectlImage | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["/bin/sh", "-ceu"]
        args:
        - |
          BASE='{{ .Values.kafkaConnect.connectBaseAcls | toJson }}'
          # Merge-add: keep every existing entry (incl. Console-added per-source
          # ACLs), append any base entry not already present (dedupe by
          # type|name|patternType), then patch. Never removes.
          MERGED=$(kubectl get kafkauser connect -n {{ include "lakehouse.namespace" . }} -o json \
            | jq -c --argjson base "$BASE" '
                (.spec.authorization.acls // []) as $cur
                | ($cur + $base)
                | unique_by(.resource.type + "|" + .resource.name + "|" + .resource.patternType)
                | {spec: {authorization: {acls: .}}}')
          kubectl patch kafkauser connect -n {{ include "lakehouse.namespace" . }} --type merge -p "$MERGED"
          echo "connect ACLs seeded (merge-add)."
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
{{- end }}
