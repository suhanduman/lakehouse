# Trino HA — Coordinator + N Worker + OIDC + internal-communication auth.
# Only parameterized + made namespace-aware. Gated by
# `.Values.components.trino`.
#
# İç iletişim: internal-communication.shared-secret pod'lar arası kimlik
# doğrulama için zorunlu (HMAC). Bulk data şifrelemesi için iki seçenek:
#   (a) Trino native internal TLS — ConfigMap'te yorum satırları aktif
#       edilir + cert-manager Certificate CR ile keystore.p12 üretilir.
#   (b) OpenShift Service Mesh (Istio) — namespace'e PeerAuthentication
#       {mode: STRICT} uygulanır; uygulama kodunda değişiklik gerekmez.
#
# Service wiring (spec §3.1/§8 — never hardcode a cross-component name):
#   - Trino coordinator's own Service NAME is `lakehouse.svc.trino` (helper,
#     resolves to `trino-coordinator` — matches the Strimzi/CNPG-style
#     canonical name convention in _helpers.tpl).
#   - Trino's Iceberg/Nessie REST catalog URI resolves the Nessie Service
#     via `lakehouse.svc.nessie` + `lakehouse.fqdn` — the SAME helper Nessie
#     itself is rendered under (04-nessie-ha.yaml). Path stays the exact
#     `/iceberg/` prefix the source uses (no `/v1`).
#   - S3 + OIDC credentials come from `.Values.storage.s3.
#     secretName` / `.Values.oidc.secretName` (name-reference-only Secrets,
#     see chart/templates/01-storage.yaml).
{{- if .Values.components.trino }}
{{- if and .Values.trino.rbac.enabled (not .Values.trino.ldapGroups.enabled) }}
{{- fail "trino.rbac.enabled requires a group source — set trino.ldapGroups.enabled=true (Trino needs AD groups to match role/row/column rules)" }}
{{- end }}
{{- if and .Values.trino.ldapGroups.enabled (eq .Values.trino.ldapGroups.url "") }}
{{- fail "trino.ldapGroups.enabled requires trino.ldapGroups.url" }}
{{- end }}
{{- if .Values.trino.internalSharedSecret }}
# Inline stringData Secret -- rendered ONLY when a real value is explicitly
# supplied via `.Values.trino.internalSharedSecret` (dev/test convenience).
# Default is empty (see chart/values.yaml's own comment on this field): in
# that case this Secret is NOT rendered at all, and the SAME name/key
# (`trino-internal-secret` / `shared-secret`, referenced by the worker
# Deployment's `secretKeyRef` below regardless of which path created it)
# must be provisioned out-of-band -- an ExternalSecret/Vault backend, or
# `oc create secret generic trino-internal-secret
# --from-literal=shared-secret=...` -- per `.Values.secrets.mode` (external
# vs. manual), BEFORE `helm install`.
apiVersion: v1
kind: Secret
metadata:
  name: trino-internal-secret
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  shared-secret: {{ .Values.trino.internalSharedSecret | quote }}
---
{{- end }}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
---
# PKCS12 keystore passphrase (dev-convenience inline; out-of-band per
# secrets.mode otherwise). NEVER logged.
apiVersion: v1
kind: Secret
metadata:
  name: trino-internal-tls-pass
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  password: {{ .Values.superset.trino.tls.keystorePassword | default "changeit" | quote }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: trino-internal-tls
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  secretName: trino-internal-tls
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.routes.certIssuer | quote }}
  dnsNames:
  - {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.trino" .) "context" .) }}
  - {{ include "lakehouse.svc.trino" . }}
  keystores:
    pkcs12:
      create: true
      passwordSecretRef:
        name: trino-internal-tls-pass
        key: password
---
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  jvm.config: |
    -server
    # Xmx 6G (worker pod limit 8Gi) — JVM overhead + Iceberg memory-mapped
    # file okuma için 2 GB tampon bırakır. OOM crash riskini düşürür.
    -Xmx{{ .Values.trino.memory.jvmXmx }}
    -XX:+UseG1GC
    -XX:G1HeapRegionSize={{ .Values.trino.jvm.g1HeapRegionSize }}
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+UnlockDiagnosticVMOptions
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:HeapDumpPath=/tmp/heap-dump.hprof
    {{- $s3jvm := include "lakehouse.s3TrustJvmProps" . | trim }}
    {{- if $s3jvm }}
    # S3 internal-CA truststore — s3-trust-init container kurar
    # (prod hardening; global.security.s3TrustBundle.enabled).
    {{- $s3jvm | nindent 4 }}
    {{- end }}
  coordinator.config.properties: |
    coordinator=true
    # HA prod: false (dedicated workers execute). Single-node/memory-minimal
    # (worker.replicas=0) needs true, else there are ZERO execution nodes and
    # every query hangs/fails. Default false; the microk8s-ingest overlay
    # flips it true.
    node-scheduler.include-coordinator={{ .Values.trino.includeCoordinator }}
    http-server.http.port=8080
    discovery.uri=http://{{ include "lakehouse.svc.trino" . }}:8080
    query.max-memory={{ .Values.trino.memory.queryMaxMemory }}
    # coord sadece planner; küçük tut
    query.max-memory-per-node={{ .Values.trino.memory.queryMaxMemoryPerNodeCoordinator }}
    memory.heap-headroom-per-node={{ .Values.trino.memory.heapHeadroomPerNode }}
{{- if and .Values.components.monitoring .Values.monitoring.targets.trino.enabled }}
    # OpenMetrics endpoint: Trino serves it AUTOMATICALLY at `/metrics` on the
    # HTTP port — there is NO enable flag; an unknown property here (e.g. a
    # nonexistent `openmetrics.jmx.enabled`) makes the coordinator CRASH-LOOP
    # at startup, since Trino rejects unrecognized config properties (see
    # Trino docs admin/openmetrics.html). The endpoint is protected by the
    # SAME authentication as the Web UI/client API: with OIDC on (prod) it
    # needs HTTPS + a system-information-permitted user; the trino
    # ServiceMonitor's scrape auth must be wired accordingly on the cluster
    # (see docs/POC-DOGRULA-cluster-checklist.md). An optional
    # `openmetrics.jmx-object-names` (valid property) can filter exposed MBeans.
{{- end }}
{{- if .Values.auth.oidc.enabled }}
    # OIDC (TLS Route'ta sonlanır). Trino yalnızca `etc/config.properties`'i
    # (bu dosya) otomatik yükler — ayrı bir `oauth2.properties` dosyası
    # OTOMATİK OKUNMAZ, bu yüzden OIDC satırları doğrudan buraya inline
    # edilmiştir. Gated by `.Values.auth.oidc.enabled` (default true — see
    # values.yaml's `auth:` comment); Trino's OAuth2 authenticator does EAGER
    # discovery at startup, so with no reachable issuer this config MUST be
    # omitted entirely rather than pointed at a dummy URL, or the coordinator
    # crash-loops forever.
    http-server.authentication.type=oauth2,jwt
    web-ui.authentication.type=oauth2
    http-server.authentication.oauth2.issuer=${ENV:OIDC_ISSUER}
    http-server.authentication.oauth2.client-id=${ENV:OIDC_CLIENT_ID}
    http-server.authentication.oauth2.client-secret=${ENV:OIDC_CLIENT_SECRET}
    http-server.authentication.oauth2.principal-field=preferred_username
    http-server.authentication.oauth2.scopes=openid,email,profile
    # Machine clients (Superset, later dbt) present a Keycloak client-credentials
    # JWT; validated against the realm JWKS. aud=trino mandatory (Keycloak
    # audience mapper, 10-keycloak.yaml) or Trino 401s.
    http-server.authentication.jwt.key-file=${ENV:OIDC_ISSUER}/protocol/openid-connect/certs
    http-server.authentication.jwt.required-issuer=${ENV:OIDC_ISSUER}
    http-server.authentication.jwt.required-audience=trino
    http-server.authentication.jwt.principal-field=preferred_username
{{- else }}
    # auth.oidc.enabled=false — DEV/SMOKE-TEST ONLY (see values.yaml's
    # `auth:` comment). No http-server.authentication.type set at all =
    # Trino runs in no-auth mode; web UI + client connections are
    # unauthenticated. NEVER use this in prod.
{{- end }}
    # Pod'lar arası iletişim auth zorunlu (shared-secret Secret'tan)
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
    # Faz-2: cluster içi trafik şifreleme. Aşağıdaki satırları aktif ederek
    # coordinator↔worker arası TLS açılır. Gerekli: cert-manager Certificate
    # CR ile trino-internal-tls Secret üretmek (keystore.p12 + passphrase).
    # internal-communication.https.required=true
    # internal-communication.https.keystore.path=/etc/trino/certs/keystore.p12
    # internal-communication.https.keystore.key=${ENV:KEYSTORE_PASS}
    # discovery.uri=https://trino-coordinator:8443
    # http-server.https.enabled=true
    # http-server.https.port=8443
    # http-server.https.keystore.path=/etc/trino/certs/keystore.p12
    # http-server.https.keystore.key=${ENV:KEYSTORE_PASS}
    # Alternatif: OpenShift Service Mesh (Istio) PeerAuthentication CR ile
    # namespace-seviye mTLS; uygulama konfigürasyonu değişmez.
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
    # Client-facing HTTPS (:8443) for JWT machine-auth (b1). Coordinator keeps
    # :8080 for worker discovery + the edge-TLS Route. cert-manager PKCS12.
    http-server.https.enabled=true
    http-server.https.port=8443
    http-server.https.keystore.path=/etc/trino/certs/keystore.p12
    http-server.https.keystore.key=${ENV:KEYSTORE_PASS}
{{- end }}
  worker.config.properties: |
    coordinator=false
    http-server.http.port=8080
    discovery.uri=http://{{ include "lakehouse.svc.trino" . }}:8080
    # 4GB → 3GB: JVM + IO tamponu
    query.max-memory-per-node={{ .Values.trino.memory.queryMaxMemoryPerNodeWorker }}
    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
  node.properties: |
    node.environment=prod
    node.data-dir=/data/trino
  lakehouse.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://{{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.nessie" .) "context" .) }}:19120/iceberg/
    iceberg.rest-catalog.warehouse={{ .Values.nessie.catalog.warehouse.location }}
{{- if .Values.auth.oidc.enabled }}
    # Nessie machine-auth (Trino >= 465 only — see versions.trinoImage's
    # comment in values.yaml for the 439 blocker this upgrade fixes).
    # `svc-trino-nessie` client-credentials, auto-refreshing (Podman-spike
    # confirmed: docs/superpowers/spikes/
    # 2026-08-06-nessie-machine-auth-config.md §1). Secret NEVER a literal —
    # sourced via `${ENV:NESSIE_OAUTH_SECRET}` (secretKeyRef, see the
    # coordinator/worker env below). Server-uri reuses the SAME
    # `OIDC_ISSUER` env var (from `oidc.secretName`/`issuer-url`) Trino's own
    # http-server.authentication.oauth2/jwt lines above already consume —
    # single issuer source, no hardcoded DNS.
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=svc-trino-nessie:${ENV:NESSIE_OAUTH_SECRET}
    iceberg.rest-catalog.oauth2.server-uri=${ENV:OIDC_ISSUER}/protocol/openid-connect/token
    iceberg.rest-catalog.oauth2.scope=openid
{{- end }}
    iceberg.register-table-procedure.enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.region=${ENV:S3_REGION}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
  rawlake.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://{{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.nessie" .) "context" .) }}:19120/iceberg/
    iceberg.rest-catalog.warehouse=rawdata
{{- if .Values.auth.oidc.enabled }}
    # Nessie machine-auth — see lakehouse.properties above for the full
    # explanation; identical block, same `svc-trino-nessie` identity (one
    # Trino engine, one Nessie service-account, both catalogs).
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=svc-trino-nessie:${ENV:NESSIE_OAUTH_SECRET}
    iceberg.rest-catalog.oauth2.server-uri=${ENV:OIDC_ISSUER}/protocol/openid-connect/token
    iceberg.rest-catalog.oauth2.scope=openid
{{- end }}
    iceberg.register-table-procedure.enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.region=${ENV:S3_REGION}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
{{- if .Values.sandbox.enabled }}
  # Sandbox v2 (Task 3, şartname 3.5.4.2 — analyst CTAS/view/temp via Trino).
  # Own S3 bucket + Nessie namespace (Tasks 1-2); Trino still commits to
  # Nessie as the SAME broad-write `svc-trino-nessie` identity lakehouse/
  # rawlake use above — per-catalog write scope is enforced purely by
  # rules.json below, not by a separate Nessie principal.
  sandbox.properties: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://{{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.nessie" .) "context" .) }}:19120/iceberg/
    # `sandbox` is the WAREHOUSE NAME (Nessie Iceberg-REST `warehouse` looks
    # up NESSIE_CATALOG_WAREHOUSES_<NAME>_LOCATION — a registry key, not an
    # arbitrary path), same pattern as rawlake.properties' `warehouse=
    # rawdata`. Registered in 04-nessie-ha.yaml as
    # NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION=s3://{{ .Values.sandbox.bucket }}/warehouse
    # (gated the same `sandbox.enabled`, kept in lockstep by that comment).
    iceberg.rest-catalog.warehouse=sandbox
{{- if .Values.auth.oidc.enabled }}
    # Nessie machine-auth — identical block to lakehouse.properties/
    # rawlake.properties above, same `svc-trino-nessie` identity (one Trino
    # engine, one Nessie service-account, all three catalogs).
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=svc-trino-nessie:${ENV:NESSIE_OAUTH_SECRET}
    iceberg.rest-catalog.oauth2.server-uri=${ENV:OIDC_ISSUER}/protocol/openid-connect/token
    iceberg.rest-catalog.oauth2.scope=openid
{{- end }}
    iceberg.register-table-procedure.enabled=false
    fs.native-s3.enabled=true
    s3.endpoint=${ENV:S3_ENDPOINT}
    s3.path-style-access=true
    s3.region=${ENV:S3_REGION}
    s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    s3.aws-secret-key=${ENV:S3_SECRET_KEY}
{{- end }}
{{- if .Values.trino.ldapGroups.enabled }}
  group-provider.properties: |
    group-provider.name=ldap
    ldap.url={{ .Values.trino.ldapGroups.url }}
    ldap.admin-user={{ .Values.trino.ldapGroups.bindDn }}
    ldap.admin-password=${ENV:TRINO_LDAP_BIND_PASSWORD}
    ldap.user-base-dn={{ .Values.trino.ldapGroups.userBaseDn }}
    ldap.user-search-filter={{ .Values.trino.ldapGroups.userSearchFilter }}
    ldap.group-name-attribute={{ .Values.trino.ldapGroups.groupNameAttribute }}
{{- end }}
  access-control.properties: |
    access-control.name=file
    security.config-file=etc/rules.json
  rules.json: |
{{- if not .Values.trino.rbac.enabled }}
    {
      "catalogs": [
        {"user": "alice|admin-group", "catalog": ".*", "allow": "all"},
{{- if .Values.components.dbt }}
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "allow": "all"},
{{- end }}
{{- if .Values.sandbox.enabled }}
        {"user": ".*", "catalog": "sandbox", "allow": "all"},
{{- end }}
        {"user": ".*", "catalog": "lakehouse", "allow": "read-only"},
        {"user": ".*", "catalog": "rawlake",   "allow": "read-only"}
      ]{{- if or .Values.components.dbt .Values.sandbox.enabled }},
      "schemas": [
        {"user": "alice|admin-group", "schema": ".*", "owner": true}{{- if .Values.components.dbt }},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "schema": "gold", "owner": true}{{- end }}{{- if .Values.sandbox.enabled }},
        {"user": ".*", "catalog": "sandbox", "schema": ".*", "owner": true}{{- end }}
      ],
      "tables": [
        {"user": "alice|admin-group", "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]}{{- if .Values.components.dbt }},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "schema": "gold", "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "privileges": ["SELECT"]}{{- end }}{{- if .Values.sandbox.enabled }},
        {"user": ".*", "catalog": "sandbox", "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]}{{- end }},
        {"user": ".*", "privileges": ["SELECT"]}
      ]{{- end }}
    }
{{- else }}
    {
      "catalogs": [
        {"group": {{ .Values.trino.rbac.adminGroup | quote }}, "catalog": ".*", "allow": "all"},
{{- if .Values.components.dbt }}
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "allow": "all"},
{{- end }}
{{- if .Values.sandbox.enabled }}
        {"user": ".*", "catalog": "sandbox", "allow": "all"},
{{- end }}
        {"group": {{ .Values.trino.rbac.analystGroup | quote }}, "catalog": "lakehouse", "allow": "read-only"},
        {"group": {{ .Values.trino.rbac.analystGroup | quote }}, "catalog": "rawlake",   "allow": "read-only"},
        {"group": {{ .Values.trino.rbac.userGroup | quote }}, "catalog": "lakehouse", "allow": "read-only"},
        {"group": {{ .Values.trino.rbac.userGroup | quote }}, "catalog": "rawlake",   "allow": "read-only"},
        {"user": ".*", "catalog": "lakehouse", "allow": "read-only"},
        {"user": ".*", "catalog": "rawlake",   "allow": "read-only"}
      ],
      "schemas": [
        {"group": {{ .Values.trino.rbac.adminGroup | quote }}, "schema": ".*", "owner": true}{{- if .Values.components.dbt }},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "schema": "gold", "owner": true}{{- end }}{{- if .Values.sandbox.enabled }},
        {"user": ".*", "catalog": "sandbox", "schema": ".*", "owner": true}{{- end }}
      ],
      "tables": [
        {"group": {{ .Values.trino.rbac.adminGroup | quote }}, "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]}{{- if .Values.components.dbt }},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "schema": "gold", "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]},
        {"user": "service-account-svc-dbt-trino", "catalog": "lakehouse", "privileges": ["SELECT"]}{{- end }}{{- if .Values.sandbox.enabled }},
        {"user": ".*", "catalog": "sandbox", "privileges": ["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"]}{{- end }},
{{/* TABLE-POLICIES-ANCHOR — Task 4 tablePolicies kuralları BU YORUM SATIRININ YERİNE render eder */}}
        {"user": ".*", "privileges": ["SELECT"]}
      ]
    }
{{- end }}
{{- if and .Values.trino.ldapGroups.enabled .Values.trino.ldapGroups.bindPassword }}
---
# Dev-convenience inline Secret for the Trino LDAP bind password — rendered ONLY
# when ldapGroups.bindPassword supplied. Empty => NOT rendered; provision out-of-band
# under the SAME name/key per `.Values.secrets.mode`. NEVER logged.
apiVersion: v1
kind: Secret
metadata:
  name: trino-ldap-bind
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  password: {{ .Values.trino.ldapGroups.bindPassword | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lakehouse.svc.trino" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: trino, role: coordinator}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trino, role: coordinator}
  template:
    metadata:
      labels: {app: trino, role: coordinator}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      {{- $it := include "lakehouse.s3TrustInitContainer" (dict "context" . "image" .Values.versions.trinoImage) | trim }}
      {{- if $it }}
      initContainers:
        {{- $it | nindent 6 }}
      {{- end }}
      containers:
      - name: trino
        image: {{ .Values.versions.trinoImage | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
        ports:
        - {containerPort: 8080}
        - {containerPort: 8443}
{{- else }}
        ports: [{containerPort: 8080}]
{{- end }}
        env:
        - {name: S3_ENDPOINT,        valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: endpoint}}}
        - {name: S3_REGION,          valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: region}}}
        - {name: S3_ACCESS_KEY,      valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: access-key-id}}}
        - {name: S3_SECRET_KEY,      valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: secret-access-key}}}
{{- if .Values.auth.oidc.enabled }}
        - {name: OIDC_ISSUER,        valueFrom: {secretKeyRef: {name: {{ required "auth.oidc.enabled=true but oidc.secretName is empty — provision the OIDC credentials secret (issuer-url/client-id/...) or set auth.oidc.enabled=false" .Values.oidc.secretName }}, key: issuer-url}}}
        - {name: OIDC_CLIENT_ID,     valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: trino-client-id}}}
        - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: trino-client-secret}}}
        # Nessie machine-auth (`svc-trino-nessie` client-credentials, see
        # lakehouse.properties/rawlake.properties above) — the shared
        # cross-engine Secret from chart/templates/22-nessie-machine-auth.yaml
        # (Task 6), keyed `trino`. NEVER a literal.
        - {name: NESSIE_OAUTH_SECRET, valueFrom: {secretKeyRef: {name: nessie-machine-auth-credentials, key: trino}}}
{{- end }}
        # Coordinator↔worker internal-communication auth (see
        # coordinator.config.properties' `internal-communication.shared-
        # secret=${ENV:TRINO_INTERNAL_SECRET}` above) — both the coordinator
        # and worker Deployments must define this env var, or the missing
        # side crash-loops on 'unset environment variable
        # TRINO_INTERNAL_SECRET'.
        - {name: TRINO_INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: trino-internal-secret, key: shared-secret}}}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
        - {name: KEYSTORE_PASS, valueFrom: {secretKeyRef: {name: trino-internal-tls-pass, key: password}}}
{{- end }}
{{- if .Values.trino.ldapGroups.enabled }}
        - {name: TRINO_LDAP_BIND_PASSWORD, valueFrom: {secretKeyRef: {name: trino-ldap-bind, key: password, optional: true}}}
{{- end }}
        resources:
          requests:
            memory: {{ .Values.trino.coordinator.resources.requests.memory | quote }}
            cpu: {{ .Values.trino.coordinator.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.trino.coordinator.resources.limits.memory | quote }}
            cpu: {{ .Values.trino.coordinator.resources.limits.cpu | quote }}
        volumeMounts:
        {{- include "lakehouse.s3TrustStoreMount" . | nindent 8 }}
        - {name: config, mountPath: /etc/trino/jvm.config,                subPath: jvm.config}
        - {name: config, mountPath: /etc/trino/config.properties,         subPath: coordinator.config.properties}
        - {name: config, mountPath: /etc/trino/node.properties,           subPath: node.properties}
        - {name: config, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties}
        - {name: config, mountPath: /etc/trino/rules.json,                subPath: rules.json}
        - {name: config, mountPath: /etc/trino/catalog/lakehouse.properties, subPath: lakehouse.properties}
        - {name: config, mountPath: /etc/trino/catalog/rawlake.properties,   subPath: rawlake.properties}
{{- if .Values.sandbox.enabled }}
        - {name: config, mountPath: /etc/trino/catalog/sandbox.properties,   subPath: sandbox.properties}
{{- end }}
{{- if .Values.trino.ldapGroups.enabled }}
        - {name: config, mountPath: /etc/trino/group-provider.properties, subPath: group-provider.properties}
{{- end }}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
        - {name: trino-certs, mountPath: /etc/trino/certs}
{{- end }}
      volumes:
      {{- include "lakehouse.s3TrustVolumes" . | nindent 6 }}
      - name: config
        configMap: {name: trino-config}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
      - name: trino-certs
        secret:
          secretName: trino-internal-tls
          items:
          - {key: keystore.p12, path: keystore.p12}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino-worker
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: trino, role: worker}
spec:
  replicas: {{ .Values.trino.worker.replicas }}
  selector:
    matchLabels: {app: trino, role: worker}
  template:
    metadata:
      labels: {app: trino, role: worker}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector: {matchLabels: {app: trino, role: worker}}
              topologyKey: kubernetes.io/hostname
      {{- $it := include "lakehouse.s3TrustInitContainer" (dict "context" . "image" .Values.versions.trinoImage) | trim }}
      {{- if $it }}
      initContainers:
        {{- $it | nindent 6 }}
      {{- end }}
      containers:
      - name: trino
        image: {{ .Values.versions.trinoImage | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        ports: [{containerPort: 8080}]
        env:
        - {name: S3_ENDPOINT,   valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: endpoint}}}
        - {name: S3_REGION,     valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: region}}}
        - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: access-key-id}}}
        - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.storage.s3.secretName }}, key: secret-access-key}}}
        - {name: TRINO_INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: trino-internal-secret, key: shared-secret}}}
{{- if .Values.auth.oidc.enabled }}
        # Nessie machine-auth (`svc-trino-nessie` client-credentials, see
        # lakehouse.properties/rawlake.properties above) — workers mount the
        # SAME catalog properties files as the coordinator and talk to
        # Nessie directly, so they need the same OIDC_ISSUER (server-uri)
        # and NESSIE_OAUTH_SECRET (credential) env. NEVER a literal.
        - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: {{ .Values.oidc.secretName }}, key: issuer-url}}}
        - {name: NESSIE_OAUTH_SECRET, valueFrom: {secretKeyRef: {name: nessie-machine-auth-credentials, key: trino}}}
{{- end }}
        resources:
          requests:
            memory: {{ .Values.trino.worker.resources.requests.memory | quote }}
            cpu: {{ .Values.trino.worker.resources.requests.cpu | quote }}
          limits:
            memory: {{ .Values.trino.worker.resources.limits.memory | quote }}
            cpu: {{ .Values.trino.worker.resources.limits.cpu | quote }}
        volumeMounts:
        - {name: config, mountPath: /etc/trino/jvm.config,                   subPath: jvm.config}
        - {name: config, mountPath: /etc/trino/config.properties,            subPath: worker.config.properties}
        - {name: config, mountPath: /etc/trino/node.properties,              subPath: node.properties}
        - {name: config, mountPath: /etc/trino/catalog/lakehouse.properties, subPath: lakehouse.properties}
        - {name: config, mountPath: /etc/trino/catalog/rawlake.properties,   subPath: rawlake.properties}
{{- if .Values.sandbox.enabled }}
        - {name: config, mountPath: /etc/trino/catalog/sandbox.properties,   subPath: sandbox.properties}
{{- end }}
      volumes:
      {{- include "lakehouse.s3TrustVolumes" . | nindent 6 }}
      - name: config
        configMap: {name: trino-config}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.trino" . }}
  namespace: {{ include "lakehouse.namespace" . }}
{{- if and .Values.components.monitoring .Values.monitoring.targets.trino.enabled }}
  # ServiceMonitor selector target labels (chart/templates/monitoring/
  # servicemonitors.yaml `trino` selector.matchLabels) — a ServiceMonitor
  # selects Services by THEIR metadata.labels, not by spec.selector (pods).
  labels:
    app: trino
    role: coordinator
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
{{- end }}
spec:
  selector: {app: trino, role: coordinator}
{{- if and .Values.auth.oidc.enabled .Values.superset.trino.tls.enabled }}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
  - {name: https, port: 8443, targetPort: 8443}
{{- else }}
  ports: [{name: http, port: 8080, targetPort: 8080}]
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trino-worker
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trino-worker
  minReplicas: {{ .Values.trino.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.trino.worker.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: {{ .Values.trino.worker.hpa.targetCPUUtilizationPercentage }}}
{{- end }}
