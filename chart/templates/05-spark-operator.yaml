# Spark Operator RBAC + SparkApplication templates. Only parameterized +
# made namespace-aware. Gated by `.Values.components.sparkOperator`.
#
# The Spark Operator (kubeflow/spark-operator) must already be installed via
# OperatorHub. Instead of the PoC's "single sandbox pod + interactive
# spark-sql", in prod every job is submitted as a SparkApplication CR; a
# driver + N executors spin up and shut down again once the job finishes.
#
# jobs/*.py (prod-manifests/jobs/iceberg_maintenance.py) is baked into the
# `spark-py` image and referenced via a `local://` path — the image build is
# a separate pipeline (spec §0.3); this chart only references it through the
# `image`/version values and does NOT ship the job files themselves.
#
# Service wiring (spec §3.1/§8): the inline `sparkConf` below (via the
# `lakehouse.spark.baseConf` helper, chart/templates/_helpers.tpl) resolves
# its Iceberg REST catalog URI through the SAME `lakehouse.svc.nessie`
# helper that Nessie itself (04-nessie-ha.yaml) and Trino (06-trino-ha.yaml)
# use — namespace-internal short name, `/iceberg/` path (identical to
# Trino's REST catalog path, no `/v1`). (Was previously resolved via a
# mounted `spark-defaults` ConfigMap; retired — spark-operator v2.x
# auto-mounts its own config at /opt/spark/conf.)
{{- if .Values.components.sparkOperator }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: {{ include "lakehouse.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver-role
  namespace: {{ include "lakehouse.namespace" . }}
rules:
- apiGroups: [""]
  resources: [pods, services, configmaps, persistentvolumeclaims]
  verbs: [get, list, watch, create, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-binding
  namespace: {{ include "lakehouse.namespace" . }}
subjects:
- kind: ServiceAccount
  name: spark-driver
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  kind: Role
  name: spark-driver-role
  apiGroup: rbac.authorization.k8s.io
---
# Iceberg maintenance — hourly compaction + snapshot expiry + orphan-file
# cleanup. jobs/iceberg_maintenance.py is DYNAMIC: no hardcoded tables. The
# script first discovers every namespace/table pair in the lakehouse and
# rawlake catalogs (SHOW NAMESPACES + SHOW TABLES), then for each table runs,
# in order:
#   CALL {catalog}.system.rewrite_data_files(table => '{ns}.{tbl}')
#   CALL {catalog}.system.expire_snapshots(table => '{ns}.{tbl}')
#   CALL {catalog}.system.remove_orphan_files(table => '{ns}.{tbl}')
# When new tables are added, the manifest doesn't change; the script
# discovers them automatically.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: iceberg-maintenance
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  schedule: {{ .Values.sparkOperator.maintenance.schedule | quote }}
  concurrencyPolicy: {{ .Values.sparkOperator.maintenance.concurrencyPolicy }}
  template:
    type: Python
    mode: cluster
    image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
    mainApplicationFile: "local:///opt/spark/jobs/iceberg_maintenance.py"
    sparkVersion: {{ .Values.versions.sparkVersion | quote }}
    sparkConf:
{{ include "lakehouse.spark.baseConf" . | indent 6 }}
      "spark.scheduler.mode": "FAIR"
{{- if .Values.auth.oidc.enabled }}
    volumes:
{{ include "lakehouse.spark.nessieOAuthVolumes" . | indent 4 }}
{{- end }}
    driver:
      cores: {{ .Values.sparkOperator.maintenance.driver.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.maintenance.driver.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.maintenance.driver.memory | quote }}
      serviceAccount: spark-driver
{{- if .Values.auth.oidc.enabled }}
      initContainers:
{{ include "lakehouse.spark.nessieOAuthInitContainer" (dict "context" . "image" (printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag)) | indent 6 }}
{{- end }}
      env:
      - {name: BRONZE_RETENTION_DAYS, value: {{ .Values.sparkOperator.maintenance.bronzeRetentionDays | quote }}}
      # Table-level compaction/expire/orphan-cleanup parallelism (ThreadPoolExecutor,
      # jobs/iceberg_maintenance.py, default 4) — scales alongside pipeline count.
      - {name: MAINTENANCE_MAX_PARALLEL, value: {{ .Values.spark.maintenanceMaxParallel | default 4 | quote }}}
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
{{- if .Values.auth.oidc.enabled }}
      - {name: SPARK_CONF_DIR, value: /spark-conf-rendered}
      volumeMounts:
{{ include "lakehouse.spark.nessieOAuthDriverVolumeMount" . | indent 6 }}
{{- end }}
    executor:
      cores: {{ .Values.sparkOperator.maintenance.executor.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.maintenance.executor.cores 1200) | quote }}
      instances: {{ .Values.sparkOperator.maintenance.executor.instances }}
      memory: {{ .Values.sparkOperator.maintenance.executor.memory | quote }}
      env:
      - {name: BRONZE_RETENTION_DAYS, value: {{ .Values.sparkOperator.maintenance.bronzeRetentionDays | quote }}}
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
---
{{- if .Values.sparkOperator.silverMerge.enabled }}
# Bronze -> Silver incremental CDC MERGE. DYNAMIC (like iceberg-maintenance):
# jobs/merge_cdc.py discovers every `<ns>_raw` namespace in rawlake and
# MERGEs it into Silver. The manifest doesn't change when a new source is
# added. Dynamic Allocation + shuffle-tracking (in this CR's own
# `sparkConf`, below) let executors scale elastically per table.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: silver-merge
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  schedule: {{ .Values.sparkOperator.silverMerge.schedule | quote }}
  concurrencyPolicy: {{ .Values.sparkOperator.silverMerge.concurrencyPolicy }}
  template:
    type: Python
    mode: cluster
    image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
    mainApplicationFile: "local:///opt/spark/jobs/merge_cdc.py"
    arguments: ["--max-parallel", {{ .Values.sparkOperator.silverMerge.mergeParallelism | quote }}]
    sparkVersion: {{ .Values.versions.sparkVersion | quote }}
    sparkConf:
{{ include "lakehouse.spark.baseConf" . | indent 6 }}
      "spark.dynamicAllocation.enabled": "true"
      "spark.dynamicAllocation.shuffleTracking.enabled": "true"
      "spark.dynamicAllocation.shuffleTracking.timeout": "3600s"
      "spark.dynamicAllocation.minExecutors": "0"
      "spark.dynamicAllocation.maxExecutors": {{ .Values.sparkOperator.silverMerge.maxExecutors | quote }}
      "spark.scheduler.mode": "FAIR"
      # Bucketed-MERGE target pruning (runtime counterpart of merge_cdc's
      # SPJ_CONF, jobs/merge_cdc.py) — storage-partitioned join support so
      # Silver MERGE only touches the target buckets a batch actually needs.
      spark.sql.sources.v2.bucketing.enabled: 'true'
      spark.sql.iceberg.planning.preserve-data-grouping: 'true'
    dynamicAllocation:
      enabled: true
      initialExecutors: 0
      minExecutors: 0
      maxExecutors: {{ .Values.sparkOperator.silverMerge.maxExecutors }}
{{- if .Values.auth.oidc.enabled }}
    volumes:
{{ include "lakehouse.spark.nessieOAuthVolumes" . | indent 4 }}
{{- end }}
    driver:
      cores: {{ .Values.sparkOperator.silverMerge.driver.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.silverMerge.driver.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.silverMerge.driver.memory | quote }}
      serviceAccount: spark-driver
{{- if .Values.auth.oidc.enabled }}
      initContainers:
{{ include "lakehouse.spark.nessieOAuthInitContainer" (dict "context" . "image" (printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag)) | indent 6 }}
{{- end }}
      env:
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
{{- if .Values.auth.oidc.enabled }}
      - {name: SPARK_CONF_DIR, value: /spark-conf-rendered}
      volumeMounts:
{{ include "lakehouse.spark.nessieOAuthDriverVolumeMount" . | indent 6 }}
{{- end }}
    executor:
      cores: {{ .Values.sparkOperator.silverMerge.executor.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.silverMerge.executor.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.silverMerge.executor.memory | quote }}
      env:
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
{{- end }}
{{- end }}
