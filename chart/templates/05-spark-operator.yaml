# Spark Operator RBAC + SparkApplication templates. Only parameterized +
# made namespace-aware. Gated by `.Values.components.sparkOperator`.
#
# Spark Operator (kubeflow/spark-operator) OperatorHub'dan önceden kurulu.
# PoC'deki "tek sandbox pod + interaktif spark-sql" yerine, prod'da her iş
# bir SparkApplication CR olarak submit edilir; driver + N executor açılır,
# iş bitince kapanır.
#
# jobs/*.py (prod-manifests/jobs/iceberg_maintenance.py) `spark-py` imajına
# gömülüdür ve `local://` yolu ile referanslanır — imaj build ayrı bir
# pipeline'dır (spec §0.3); bu chart yalnızca `image`/version values ile
# referans verir, job dosyalarını TAŞIMAZ.
#
# Service wiring (spec §3.1/§8): the inline `sparkConf` below (via the
# `lakehouse.spark.baseConf` helper, chart/templates/_helpers.tpl) resolves
# its Iceberg REST catalog URI through the SAME `lakehouse.svc.nessie`
# helper Nessie'nin kendisinin (04-nessie-ha.yaml) ve Trino'nun
# (06-trino-ha.yaml) kullandığı AYNI helper — namespace-içi kısa ad,
# `/iceberg/` path (Trino'nun REST catalog path'i ile birebir aynı, `/v1`
# yok). (Was resolved via a mounted `spark-defaults` ConfigMap; retired —
# spark-operator v2.x auto-mounts its own config at /opt/spark/conf.)
{{- if .Values.components.sparkOperator }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-driver
  namespace: {{ include "lakehouse.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver-role
  namespace: {{ include "lakehouse.namespace" . }}
rules:
- apiGroups: [""]
  resources: [pods, services, configmaps, persistentvolumeclaims]
  verbs: [get, list, watch, create, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver-binding
  namespace: {{ include "lakehouse.namespace" . }}
subjects:
- kind: ServiceAccount
  name: spark-driver
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  kind: Role
  name: spark-driver-role
  apiGroup: rbac.authorization.k8s.io
---
# Iceberg bakım — saatlik compaction + snapshot expire + orphan-file temizliği.
# jobs/iceberg_maintenance.py DİNAMİK: hardcoded tablo YOK. Script önce
# lakehouse ve rawlake kataloglarındaki tüm namespace/tablo çiftlerini
# keşfeder (SHOW NAMESPACES + SHOW TABLES), sonra her tablo için sırayla:
#   CALL {catalog}.system.rewrite_data_files(table => '{ns}.{tbl}')
#   CALL {catalog}.system.expire_snapshots(table => '{ns}.{tbl}')
#   CALL {catalog}.system.remove_orphan_files(table => '{ns}.{tbl}')
# Yeni tablolar eklendiğinde manifest değişmez; script otomatik keşfeder.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: iceberg-maintenance
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  schedule: {{ .Values.sparkOperator.maintenance.schedule | quote }}
  concurrencyPolicy: {{ .Values.sparkOperator.maintenance.concurrencyPolicy }}
  template:
    type: Python
    mode: cluster
    image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
    mainApplicationFile: "local:///opt/spark/jobs/iceberg_maintenance.py"
    sparkVersion: {{ .Values.versions.sparkVersion | quote }}
    sparkConf:
{{ include "lakehouse.spark.baseConf" . | indent 6 }}
    driver:
      cores: {{ .Values.sparkOperator.maintenance.driver.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.maintenance.driver.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.maintenance.driver.memory | quote }}
      serviceAccount: spark-driver
      env:
      - {name: BRONZE_RETENTION_DAYS, value: {{ .Values.sparkOperator.maintenance.bronzeRetentionDays | quote }}}
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
    executor:
      cores: {{ .Values.sparkOperator.maintenance.executor.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.maintenance.executor.cores 1200) | quote }}
      instances: {{ .Values.sparkOperator.maintenance.executor.instances }}
      memory: {{ .Values.sparkOperator.maintenance.executor.memory | quote }}
      env:
      - {name: BRONZE_RETENTION_DAYS, value: {{ .Values.sparkOperator.maintenance.bronzeRetentionDays | quote }}}
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
---
{{- if .Values.sparkOperator.silverMerge.enabled }}
# Bronze -> Silver incremental CDC MERGE. DİNAMİK (iceberg-maintenance gibi):
# jobs/merge_cdc.py rawlake'teki her `<ns>_raw` namespace'ini keşfeder, Silver'a
# MERGE eder. Yeni kaynak eklenince manifest değişmez. Dynamic Allocation +
# shuffle-tracking (bu CR'ın kendi `sparkConf`'unda, aşağıda) ile executor'lar
# tablo başına elastik.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: silver-merge
  namespace: {{ include "lakehouse.namespace" . }}
spec:
  schedule: {{ .Values.sparkOperator.silverMerge.schedule | quote }}
  concurrencyPolicy: {{ .Values.sparkOperator.silverMerge.concurrencyPolicy }}
  template:
    type: Python
    mode: cluster
    image: {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }}
    mainApplicationFile: "local:///opt/spark/jobs/merge_cdc.py"
    arguments: ["--max-parallel", {{ .Values.sparkOperator.silverMerge.mergeParallelism | quote }}]
    sparkVersion: {{ .Values.versions.sparkVersion | quote }}
    sparkConf:
{{ include "lakehouse.spark.baseConf" . | indent 6 }}
      "spark.dynamicAllocation.enabled": "true"
      "spark.dynamicAllocation.shuffleTracking.enabled": "true"
      "spark.dynamicAllocation.shuffleTracking.timeout": "3600s"
      "spark.dynamicAllocation.minExecutors": "0"
      "spark.dynamicAllocation.maxExecutors": {{ .Values.sparkOperator.silverMerge.maxExecutors | quote }}
      "spark.scheduler.mode": "FAIR"
    dynamicAllocation:
      enabled: true
      initialExecutors: 0
      minExecutors: 0
      maxExecutors: {{ .Values.sparkOperator.silverMerge.maxExecutors }}
    driver:
      cores: {{ .Values.sparkOperator.silverMerge.driver.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.silverMerge.driver.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.silverMerge.driver.memory | quote }}
      serviceAccount: spark-driver
      env:
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
    executor:
      cores: {{ .Values.sparkOperator.silverMerge.executor.cores }}
      coreLimit: {{ printf "%dm" (mul .Values.sparkOperator.silverMerge.executor.cores 1200) | quote }}
      memory: {{ .Values.sparkOperator.silverMerge.executor.memory | quote }}
      env:
{{ include "lakehouse.spark.awsEnv" . | indent 6 }}
{{- end }}
{{- end }}
