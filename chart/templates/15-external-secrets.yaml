# Lakehouse — ExternalSecret CRs (`.Values.secrets.mode: external` only).
#
# Chart position in the "generated | external | manual" three-mode secrets
# contract (see chart/values.yaml `secrets:` header comment for the full
# picture):
#   - generated (DEFAULT): the `bootstrap` script (Task 7) seeds every named
#     Secret out-of-band before `helm install`. THIS FILE renders nothing —
#     same as `manual`, rendering-wise. An ExternalSecret would fight
#     bootstrap's own seeded material for ownership (Helm/ArgoCD would
#     overwrite/prune it on the next sync), so the chart must stay hands-off.
#   - external: THIS FILE renders one `ExternalSecret` (external-secrets.io/
#     v1beta1) per named platform Secret, referencing a customer-provided
#     SecretStore/ClusterSecretStore (`.Values.secrets.external.*`). The
#     store itself stays out-of-band — customer/vault-specific config this
#     chart never sees.
#   - manual: THIS FILE renders nothing; NOTES.txt prints the manual
#     `oc create secret` steps.
#
# Gated by BOTH `.Values.secrets.mode == "external"` AND
# `.Values.components.externalSecrets` (default true) — the latter is an
# escape hatch for a cluster that runs `mode: external` but hasn't installed
# the External Secrets Operator CRD yet (see chart/templates/
# _prereq-check.tpl's `external-secrets.io/v1beta1` prereq check for the
# "operator not installed at all" case, which this flag lets an operator
# work around without a hard render failure).
#
# Secret inventory covered here — the SAME named platform Secrets NOTES.txt
# already documents as "provision before install" (chart/templates/
# NOTES.txt's SECRETS section) — verified against each Secret's actual
# consumer template:
#   - `.Values.storage.s3.secretName` (default
#     s3-credentials) — S3 credential Secret, consumed by
#     Trino/Spark/Nessie/Connect (chart/templates/01-storage.yaml doc
#     comment). Always rendered (no component gate — every core component
#     depends on S3).
#   - `.Values.oidc.secretName` (default oidc-credentials) — Nessie/Trino/
#     Console OIDC issuer+client credentials. Always rendered.
#   - `keycloak-admin-credentials` (literal, chart/templates/10-keycloak.yaml)
#     — gated on `.Values.components.keycloak` (only rendered when Keycloak
#     itself is enabled).
#   - `pg` / `mssql` / `mongo` (literals, chart/templates/12-kafka-connect.yaml
#     `spec.template.pod.volumes` — Kafka Connect's DirectoryConfigProvider
#     external-configuration source-DB credentials) — gated on
#     `.Values.components.kafkaConnect`.
# NOT covered here (deliberately): `debezium-src` and `kafka-cluster-ca-cert`
# are Strimzi-managed `KafkaUser`/cluster-CA Secrets — Strimzi's OWN operator
# generates them, so an ExternalSecret here would conflict with that
# ownership (same reasoning as why `generated`/`manual` render nothing: two
# owners fighting over one Secret). The four dev-convenience inline Secrets
# (`trino.internalSharedSecret`, `zeppelin.ad.bindPassword`,
# `keycloak.adminPassword`, `kafkaUi.oidc.clientSecret`) are also excluded —
# they are local/dev-only and, when a real value IS supplied, render inline
# from that value regardless of `secrets.mode` (see chart/values.yaml
# `secrets:` comment); when left empty (the shipped default) they still fall
# under the SAME out-of-band provisioning contract as everything else, but
# are not part of this file's fixed inventory since their Secret NAMES are
# not otherwise referenced by any other template independent of the
# dev-convenience toggle.
{{/*
lakehouse.externalSecret - renders one ExternalSecret document for a named
platform Secret. `dataFrom.extract` (whole-secret extract, not per-key
`data:` entries) keeps this chart agnostic to each Secret's internal key
layout — the remote store's `<remoteKeyPrefix>/<name>` entry is expected to
hold every key the consuming template reads (see each Secret's own doc
comment elsewhere in this chart for its exact key list).
Usage:
  {{ include "lakehouse.externalSecret" (dict "name" "foo" "context" .) }}
*/}}
{{- define "lakehouse.externalSecret" -}}
{{- $name := .name -}}
{{- $ctx := .context -}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "lakehouse.namespace" $ctx }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $ctx.Values.secrets.external.refreshInterval }}
  secretStoreRef:
    name: {{ $ctx.Values.secrets.external.secretStoreName }}
    kind: {{ $ctx.Values.secrets.external.secretStoreKind }}
  target:
    name: {{ $name }}
  dataFrom:
    - extract:
        key: {{ printf "%s/%s" $ctx.Values.secrets.external.remoteKeyPrefix $name }}
{{- end -}}

{{- /* Fail-loud validation runs unconditionally, regardless of mode/component gating below. */}}
{{- $secretsMode := include "lakehouse.secretsMode" . -}}
{{- if and (eq $secretsMode "external") .Values.components.externalSecrets }}
{{ include "lakehouse.externalSecret" (dict "name" .Values.storage.s3.secretName "context" .) }}
{{ include "lakehouse.externalSecret" (dict "name" .Values.oidc.secretName "context" .) }}
{{- if .Values.components.keycloak }}
{{ include "lakehouse.externalSecret" (dict "name" "keycloak-admin-credentials" "context" .) }}
{{- end }}
{{- if .Values.components.kafkaConnect }}
{{ include "lakehouse.externalSecret" (dict "name" "pg" "context" .) }}
{{ include "lakehouse.externalSecret" (dict "name" "mssql" "context" .) }}
{{ include "lakehouse.externalSecret" (dict "name" "mongo" "context" .) }}
{{- end }}
{{- end }}
