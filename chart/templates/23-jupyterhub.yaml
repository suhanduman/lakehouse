# chart/templates/23-jupyterhub.yaml — hand-rolled JupyterHub (per-user
# notebook sandbox). This task lands ONLY the two dev-convenience Secrets;
# later tasks in this slice add the Hub Deployment/Service, the
# configurable-http-proxy, and the KubeSpawner RBAC (ServiceAccount/Role/
# RoleBinding) into this SAME file.
#
# Gated `and .Values.components.jupyter .Values.auth.oidc.enabled` — the Hub
# only makes sense with a real Keycloak `jupyter` client to authenticate
# against (OAuthenticator has no unauthenticated fallback), so unlike
# `nessie-machine-auth-credentials` (gated on auth.oidc.enabled alone) this
# whole file also requires `components.jupyter` to render anything at all.
#
# --- Coherence guard (Task 6, review-routed from Task 5): the pre-existing
# `jupyter` Route/Ingress (chart/templates/08-routes-tls.yaml /
# 08b-ingress-tls.yaml) gate ONLY on `.Values.components.jupyter` — they
# target the `jupyterhub-proxy` Service produced by THIS file, which (see
# the two-gate `if` right below) only renders when `auth.oidc.enabled` is
# ALSO true. Without this guard, `components.jupyter=true` +
# `auth.oidc.enabled=false` renders the Route/Ingress but not the Service
# behind them — a dangling Route (`helm-check.py --service-closure` FAILs)
# for a Hub that could never have worked anyway: JupyterHub's authenticator
# here IS Keycloak GenericOAuthenticator (OAuthenticator has no
# unauthenticated fallback, per the comment above). Fail loudly at render
# time instead — same fail-loud coherence-guard pattern as
# `sandbox.enabled`+`auth.oidc.enabled` (chart/templates/
# 09c-zeppelin-sandbox.yaml) and `superset.trino.authMode=jwt`
# (chart/templates/19-superset.yaml). Placed here, BEFORE the file-wide gate
# below, so it evaluates even when `auth.oidc.enabled` is false (the file-
# wide `if` would otherwise skip the whole file, including this check, in
# exactly the broken case it needs to catch).
{{- if and .Values.components.jupyter (not .Values.auth.oidc.enabled) }}
{{- fail "components.jupyter requires auth.oidc.enabled — JupyterHub authenticates users via Keycloak OIDC (GenericOAuthenticator)" }}
{{- end }}
# --- Sandbox v2 (2026-08-07-sandbox-v2 Task 4): the CN-prefix coherence
# guard that used to live here (every sandbox dept's `adGroup` CN must start
# with "sandbox-") existed ONLY to support the per-dept group->dept mapping
# consumed by the old `DEPTS`-based `pre_spawn_hook` below. The unified
# sandbox has no dept mapping at all -- every `allowed_groups` member gets
# the SAME `svc-sandbox` identity + the SAME `sandbox` Nessie namespace/
# Trino catalog, isolated only by a per-user Trino/Spark/PyIceberg SCHEMA
# convention (`sandbox.<user>`, derived from `spawner.user.name` -- see
# `pre_spawn_hook` below) -- so this guard is removed outright rather than
# reworded; there is no CN-derived lookup key left to protect.
# `.Values.sandbox.departments`/the per-dept `svc-sandbox-<name>` identities
# remain live for the shared Zeppelin path
# (chart/templates/09c-zeppelin-sandbox.yaml) until Task 5 retires them.
{{- if and .Values.components.jupyter .Values.auth.oidc.enabled }}
{{- if .Values.jupyter.oidcClientSecret }}
# Single source with the Keycloak `jupyter` client secret
# (chart/templates/10-keycloak.yaml `clients[].secret`) via
# `.Values.jupyter.oidcClientSecret` — the two can never drift. SAME
# dev-convenience-else-out-of-band contract as `superset-oidc-credentials`
# (chart/templates/19-superset.yaml): rendered ONLY when a value is supplied;
# otherwise provision this Secret's name/key out-of-band per
# `.Values.secrets.mode`, BEFORE install. NEVER logged, NEVER placed in a
# ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: jupyter-oidc-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  client-secret: {{ .Values.jupyter.oidcClientSecret | quote }}
{{- end }}
{{- if .Values.jupyter.proxyToken }}
---
# Hub<->configurable-http-proxy shared auth token (CONFIGPROXY_AUTH_TOKEN)
# via `.Values.jupyter.proxyToken`. SAME dev-convenience-else-out-of-band
# contract as above: rendered ONLY when a value is supplied; otherwise
# provision this Secret's name/key out-of-band (or let a later task generate
# it at install time) per `.Values.secrets.mode`. NEVER logged, NEVER placed
# in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: jupyter-proxy-token
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  proxy-token: {{ .Values.jupyter.proxyToken | quote }}
{{- end }}
{{- if .Values.jupyter.trino.oidc.clientSecret }}
---
# Read-only svc-jupyter-trino service-account client secret (turn-key
# notebook helper's Trino access) via `.Values.jupyter.trino.oidc.
# clientSecret`. SAME dev-convenience-else-out-of-band contract as the two
# Secrets above: rendered ONLY when a value is supplied; otherwise provision
# this Secret's name/key out-of-band per `.Values.secrets.mode`. Single
# source with the Keycloak `svc-jupyter-trino` client's `secret`
# (chart/templates/10-keycloak.yaml) — the two can never drift. NEVER
# logged, NEVER placed in a ConfigMap.
apiVersion: v1
kind: Secret
metadata:
  name: jupyter-trino-oidc-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  client-secret: {{ .Values.jupyter.trino.oidc.clientSecret | quote }}
{{- end }}
{{- if .Values.sandbox.oidc.clientSecret }}
---
# Sandbox v2 (2026-08-07-sandbox-v2 Task 4): the unified `svc-sandbox`
# service-account client's secret, for THIS notebook pod's Nessie/PyIceberg/
# Spark-executor writes into the shared `sandbox` namespace (`pre_spawn_hook`/
# `modify_pod_hook` below read it via secretKeyRef, never a literal). Single
# source with the Keycloak `svc-sandbox` client's `secret`
# (chart/templates/10-keycloak.yaml, `.Values.sandbox.oidc.clientSecret`) —
# the two can never drift. SAME dev-convenience-else-out-of-band contract as
# the Secrets above: rendered ONLY when a value is supplied; otherwise
# provision this Secret's name/key out-of-band per `.Values.secrets.mode`.
# NEVER logged, NEVER placed in a ConfigMap. This is the FIRST chart
# resource to materialize `svc-sandbox`'s secret as an in-cluster Secret
# (Task 1 single-sourced the value into the Keycloak client only); Task 5
# (Zeppelin) reuses this SAME Secret name for the shared Zeppelin's own
# sandbox writes, rather than each consumer inventing its own.
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-oidc-credentials
  namespace: {{ include "lakehouse.namespace" . }}
type: Opaque
stringData:
  client-secret: {{ .Values.sandbox.oidc.clientSecret | quote }}
{{- end }}
---
# jupyterhub_config.py ConfigMap (Task 4, jupyterhub-per-user-sandbox) —
# GenericOAuthenticator(Keycloak `jupyter`) + KubeSpawner + the load-bearing
# `pre_spawn_hook`/`modify_pod_hook`. Transcribed from the spike's exact,
# live-confirmed skeleton (docs/superpowers/spikes/
# 2026-08-06-jupyterhub-config.md §1.2/§2), with the revisions that spike
# flagged as spike-only (`allow_all=True`, no login gate) or missing
# (`enable_auth_state=True` is INTENTIONALLY NOT set — spike-confirmed the
# Hub crashes at boot without `JUPYTERHUB_CRYPT_KEY`, and it isn't needed:
# `spawner.user.groups` is synchronous, populated by `manage_groups` at LOGIN
# time, strictly before `pre_spawn_hook` ever runs).
#
# NO secret literal: OAUTH_CLIENT_SECRET/CONFIGPROXY_AUTH_TOKEN are read from
# process env at runtime — populated by a LATER task's Hub Deployment via
# `secretKeyRef` against `jupyter-oidc-credentials`/`jupyter-proxy-token`
# (this task's Secrets, above) or their out-of-band equivalents. Same
# contract as every other `os.environ[...]`-only config file in this chart
# (superset_config.py, _zeppelin.tpl's spark-conf-render).
#
# Login gate: `allow_all=False` + `allowed_groups` restricted to the
# Keycloak groups listed in `.Values.sandbox.allowedGroups` (a list of AD
# group full DNs, same "CN=...,OU=...,DC=..." shape `sandbox.departments[].
# adGroup` used to carry -- see 10-keycloak.yaml's `group-ldap-mapper`,
# `group.name.ldap.attribute: cn`, `full.path: false` on the `jupyter`
# client's groups mapper above) — a user with none of these groups cannot
# log in at all, not merely fail later in `pre_spawn_hook`.
#
# Sandbox v2 (2026-08-07-sandbox-v2 Task 4): UNIFIED sandbox identity — every
# `allowed_groups` member shares the SAME `svc-sandbox` Nessie/S3 identity
# and the SAME `sandbox` Nessie namespace/Trino catalog
# (`.Values.sandbox.namespace`). There is no more per-dept `DEPTS` lookup —
# isolation between analysts is a CLIENT convention only: a per-user Trino/
# Spark/PyIceberg SCHEMA, `sandbox.<user>` (`NESSIE_SANDBOX_SCHEMA`, set in
# `pre_spawn_hook` from `spawner.user.name` — the SAME `preferred_username`
# claim the Hub authenticated the user with, so it is stable across a given
# user's own spawns and distinct per analyst). This is a SOFT convention,
# NOT enforced by Nessie/Trino authorization (both still see the shared
# `svc-sandbox`/`svc-jupyter-trino` principal) — a hard per-user write lock
# is Day-2 (see the sandbox-v2 design doc's "known limitation").
#
# Sandbox secret injection: KubeSpawner-only for the notebook/driver
# (`modify_pod_hook`, native pod-spec `secretKeyRef` env) — spike-confirmed
# `spark.kubernetes.driver.secretKeyRef.*` is a silent no-op in this
# notebook-as-driver topology (no spark-submit-constructed driver pod to
# inject into). Executors DO go through Spark's own secret injection
# (`spark.kubernetes.executor.secretKeyRef.*`), set in `pre_spawn_hook` as
# real `spark.kubernetes.*` conf via `PYSPARK_SUBMIT_ARGS` (`--conf k=v ...
# pyspark-shell`) — the documented mechanism `pyspark.java_gateway` reads
# when launching `spark-submit` under the hood for a plain
# `SparkSession.builder.getOrCreate()` in the notebook kernel; a bare env var
# named after a Spark conf key has NO effect on its own.
#
# Gated same as the rest of this file: `components.jupyter` AND
# `auth.oidc.enabled`.
{{- if and .Values.components.jupyter .Values.auth.oidc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jupyterhub-config
  namespace: {{ include "lakehouse.namespace" . }}
data:
  jupyterhub_config.py: |
    import os

    c = get_config()  # noqa

    # --- Authenticator: GenericOAuthenticator against Keycloak client "jupyter" ---
    c.JupyterHub.authenticator_class = "generic-oauth"

    c.GenericOAuthenticator.client_id = "jupyter"
    c.GenericOAuthenticator.client_secret = os.environ["OAUTH_CLIENT_SECRET"]
    _OIDC_ISSUER = os.environ["OIDC_ISSUER"]
    c.GenericOAuthenticator.authorize_url = _OIDC_ISSUER + "/protocol/openid-connect/auth"
    c.GenericOAuthenticator.token_url = _OIDC_ISSUER + "/protocol/openid-connect/token"
    c.GenericOAuthenticator.userdata_url = _OIDC_ISSUER + "/protocol/openid-connect/userinfo"
    c.GenericOAuthenticator.oauth_callback_url = {{ printf "https://%s/hub/oauth_callback" (include "lakehouse.routeHost" (dict "name" "jupyter" "context" .)) | quote }}
    c.GenericOAuthenticator.username_claim = "preferred_username"
    c.GenericOAuthenticator.scope = ["openid", "profile", "email"]

    # manage_groups=True is REQUIRED before claim_groups_key does anything
    # (oauthenticator's generic.py `_claim_groups_key_changed` observer raises
    # ValueError at config time otherwise -- spike-confirmed from source).
    # spawner.user.groups is then SYNCHRONOUS -- no auth_state needed for the
    # group-reading mechanism itself, so enable_auth_state is deliberately
    # left unset (spike-confirmed: setting it crashes the Hub at boot without
    # a JUPYTERHUB_CRYPT_KEY, which nothing here needs).
    c.GenericOAuthenticator.manage_groups = True
    c.GenericOAuthenticator.claim_groups_key = "groups"

    # Login gate: only members of a configured .Values.sandbox.allowedGroups
    # group may log in at all (unified sandbox v2 — no more per-dept groups).
    c.Authenticator.allow_all = False
    c.Authenticator.allowed_groups = set()
    {{- range .Values.sandbox.allowedGroups }}
    {{- $cn := splitList "," . | first | trimPrefix "CN=" }}
    c.Authenticator.allowed_groups.add({{ $cn | quote }})
    {{- end }}

    # --- Proxy: ConfigurableHTTPProxy (default class), Hub<->proxy shared secret ---
    c.ConfigurableHTTPProxy.auth_token = os.environ["CONFIGPROXY_AUTH_TOKEN"]
    # Task 5: the proxy runs as its OWN Deployment (the images/jupyterhub image
    # is python-slim+pip only, no bundled Node.js configurable-http-proxy), so
    # the Hub must NOT try to fork/manage a child CHP process -- it talks to
    # the already-running, separately-deployed proxy's api port instead.
    c.ConfigurableHTTPProxy.should_start = False
    c.ConfigurableHTTPProxy.api_url = {{ printf "http://%s:8001" (include "lakehouse.svc.jupyterhubProxyApi" .) | quote }}

    # --- Spawner: KubeSpawner ---
    c.JupyterHub.spawner_class = "kubespawner.KubeSpawner"
    c.KubeSpawner.image = {{ printf "%s/jupyter:%s" .Values.global.imageRegistry .Values.versions.jupyterImageTag | quote }}
    c.KubeSpawner.namespace = {{ include "lakehouse.namespace" . | quote }}

    # Per-user notebook home-directory PVC -- persists `pip install --user`
    # (and any other $HOME state) across restarts. `pvc_name_template` is
    # KubeSpawner's own default (kept explicit for clarity); `volumes`/
    # `volume_mounts` reference that SAME template so the PVC this creates is
    # the one actually mounted at the notebook's home directory (jovyan, per
    # images/jupyter's base image).
    c.KubeSpawner.storage_pvc_ensure = True
    c.KubeSpawner.pvc_name_template = "claim-{user_server}"
    c.KubeSpawner.storage_capacity = {{ .Values.jupyter.storage | quote }}
    c.KubeSpawner.volumes = [{"name": "home", "persistentVolumeClaim": {"claimName": "claim-{user_server}"}}]
    c.KubeSpawner.volume_mounts = [{"name": "home", "mountPath": "/home/jovyan"}]

    # Task 5 (turnkey notebook): copy the baked starter notebook into $HOME
    # at pod start -- the per-user PVC mount at $HOME (above) shadows
    # anything baked into the image there, which is exactly why
    # images/jupyter/Dockerfile bakes starter.ipynb at /opt/lakehouse
    # instead of $HOME. `-n` = never overwrite -- a returning user's own
    # edited copy in $HOME is never clobbered by a later pod restart.
    c.KubeSpawner.lifecycle_hooks = {
        "postStart": {
            "exec": {
                "command": ["/bin/sh", "-c", "cp -n /opt/lakehouse/starter.ipynb \"$HOME/\" || true"],
            }
        }
    }

    def pre_spawn_hook(spawner):
        # Sandbox v2 (unified, 2026-08-07-sandbox-v2 Task 4): no more
        # per-dept DEPTS lookup / group->dept mapping. Every user who made it
        # past the allowed_groups login gate above shares the SAME
        # `svc-sandbox` Nessie/S3 identity and the SAME `sandbox` Nessie
        # namespace/Trino catalog -- isolation between analysts is a CLIENT
        # convention only: a per-user Trino/Spark/PyIceberg SCHEMA
        # (`NESSIE_SANDBOX_SCHEMA`, below), never a separate identity/
        # namespace per user (that would be a hard per-user write lock --
        # Day-2, see the design doc's known limitation).
        spawner.service_account = "sa-sandbox"
        # automount_service_account_token: KubeSpawner's own default (None)
        # already mounts the SA token when service_account is explicitly set
        # (spike-confirmed from source) -- no extra flag needed.

        spawner.environment["NESSIE_SANDBOX_CATALOG"] = {{ .Values.sandbox.namespace | quote }}
        # Per-user schema (şartname 3.5.4.2/3.5.4.3): images/jupyter/
        # lakehouse_nb.py's spark()/iceberg()/trino() helpers default their
        # sandbox writes here. `spawner.user.name` is the SAME
        # `preferred_username` OIDC claim (`username_claim`, above) the Hub
        # authenticated this user with -- stable across a user's own spawns,
        # distinct per analyst.
        spawner.environment["NESSIE_SANDBOX_SCHEMA"] = "%s.%s" % ({{ .Values.sandbox.namespace | quote }}, spawner.user.name)

        # Task 5 (turnkey notebook): plain env consumed by images/jupyter/
        # lakehouse_nb.py's spark()/trino()/iceberg() helpers -- the Nessie
        # REST catalog endpoint/warehouse location, the unified sandbox's
        # Nessie OAuth client_id, and the Trino coordinator's internal
        # host/port. No hardcoded endpoints: all three come from the SAME
        # chart helpers/values every other consumer in this chart reads
        # (lakehouse.svc.nessie/lakehouse.svc.trino/lakehouse.fqdn), never a
        # literal dev-storage hostname.
        #
        # Final-review fix wave: NESSIE_WAREHOUSE carries the FULL warehouse
        # location (`.Values.nessie.catalog.warehouse.location`, e.g.
        # "s3://depo/warehouse"), NOT the bucket-only `s3BucketFromUri` form
        # -- this must match the Zeppelin reference's own
        # `spark.sql.catalog.lakehouse.warehouse` value byte-for-byte
        # (chart/templates/_zeppelin.tpl) since lakehouse_nb.py's
        # `_spark_conf()` builds the SAME Iceberg RESTCatalog config for the
        # SAME Nessie warehouse; a bucket-only value silently mis-scopes
        # every table this helper creates.
        spawner.environment["NESSIE_URI"] = {{ printf "http://%s:19120/iceberg/" (include "lakehouse.svc.nessie" .) | quote }}
        spawner.environment["NESSIE_WAREHOUSE"] = {{ .Values.nessie.catalog.warehouse.location | quote }}
        spawner.environment["NESSIE_CLIENT_ID"] = "svc-sandbox"
        spawner.environment["TRINO_HOST"] = {{ include "lakehouse.fqdn" (dict "svc" (include "lakehouse.svc.trino" .) "context" .) | quote }}
        spawner.environment["TRINO_PORT"] = "8443"

        # --- Spark-on-k8s-from-notebook conf (spike §2): the notebook
        # process itself IS the driver (client mode) -- executors are always
        # spawned by Spark via the k8s API regardless of deploy mode, so
        # secretKeyRef.* DOES work for them (unlike the driver, handled by
        # modify_pod_hook below). Rendered as PYSPARK_SUBMIT_ARGS so a plain
        # `SparkSession.builder.getOrCreate()` in the notebook kernel picks
        # these up with no notebook-side boilerplate.
        spark_confs = {
            "spark.master": "k8s://https://kubernetes.default.svc",
            "spark.kubernetes.namespace": {{ include "lakehouse.namespace" . | quote }},
            "spark.kubernetes.container.image": {{ printf "%s/spark-py:%s" .Values.global.imageRegistry .Values.versions.sparkImageTag | quote }},
            "spark.kubernetes.authenticate.driver.serviceAccountName": "sa-sandbox",
            "spark.kubernetes.executor.secretKeyRef.NESSIE_OAUTH_SECRET": "sandbox-oidc-credentials:client-secret",
            "spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID": "s3-sandbox:access-key-id",
            "spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY": "s3-sandbox:secret-access-key",
        }
        conf_args = " ".join('--conf "%s=%s"' % (k, v) for k, v in spark_confs.items())
        spawner.environment["PYSPARK_SUBMIT_ARGS"] = "%s pyspark-shell" % conf_args


    def modify_pod_hook(spawner, pod):
        # THE LOAD-BEARING SURPRISE (spike §2.4, live negative control):
        # spark.kubernetes.driver.secretKeyRef.* is a silent no-op in this
        # notebook-as-driver topology -- that conf key only takes effect when
        # spark-submit ITSELF constructs the driver pod spec (--deploy-mode
        # cluster). Here the "driver pod" is the notebook pod KubeSpawner
        # already created before pyspark/spark-submit ever runs inside it, so
        # the driver's own S3/Nessie secrets (needed by PyIceberg AND by the
        # Spark driver process itself) must come through KubeSpawner's own
        # pod-spec construction instead -- native secretKeyRef env, injected
        # here. Sandbox v2 (unified): no more per-dept DEPTS lookup -- the
        # secret names below are the fixed unified `s3-sandbox`/
        # `sandbox-oidc-credentials` Secrets (this file + Task 2), the SAME
        # for every user.
        from kubernetes import client as k8s_client

        def _secret_env(name, secret_name, key):
            return k8s_client.V1EnvVar(
                name=name,
                value_from=k8s_client.V1EnvVarSource(
                    secret_key_ref=k8s_client.V1SecretKeySelector(name=secret_name, key=key)
                ),
            )

        extra_env = [
            _secret_env("AWS_ACCESS_KEY_ID", "s3-sandbox", "access-key-id"),
            _secret_env("AWS_SECRET_ACCESS_KEY", "s3-sandbox", "secret-access-key"),
            _secret_env("NESSIE_OAUTH_SECRET", "sandbox-oidc-credentials", "client-secret"),
            # Task 5 (turnkey notebook): platform-wide (not per-dept) secrets
            # the lakehouse_nb.py helper also needs. S3 endpoint/region come
            # from the SAME storage.s3 secret every other S3 consumer in this
            # chart reads (never a literal dev-storage endpoint); the
            # Trino service-account secret from its own dev-convenience-else-
            # out-of-band Secret (Task 2, jupyter-trino-oidc-credentials);
            # OIDC_ISSUER from the SAME oidc.secretName every other OIDC
            # client here reads.
            _secret_env("AWS_ENDPOINT_URL_S3", {{ .Values.storage.s3.secretName | quote }}, "endpoint"),
            _secret_env("AWS_REGION", {{ .Values.storage.s3.secretName | quote }}, "region"),
            _secret_env("SVC_JUPYTER_TRINO_SECRET", "jupyter-trino-oidc-credentials", "client-secret"),
            _secret_env("OIDC_ISSUER", {{ .Values.oidc.secretName | quote }}, "issuer-url"),
        ]
        pod.spec.containers[0].env = (pod.spec.containers[0].env or []) + extra_env

        # Trino :8443 internal CA (trino-internal-tls Secret's ca.crt) --
        # lakehouse_nb.py's trino() verifies against this exact path. Same
        # single-file subPath mount convention as Superset's own trino-ca
        # mount (chart/templates/19-superset.yaml, b1 slice) -- mount_path
        # is the FULL file path (not just the directory), subPath picks the
        # one key out of the Secret's items list.
        pod.spec.volumes = (pod.spec.volumes or []) + [
            k8s_client.V1Volume(
                name="trino-ca",
                secret=k8s_client.V1SecretVolumeSource(
                    secret_name="trino-internal-tls",
                    items=[k8s_client.V1KeyToPath(key="ca.crt", path="ca.crt")],
                ),
            )
        ]
        pod.spec.containers[0].volume_mounts = (pod.spec.containers[0].volume_mounts or []) + [
            k8s_client.V1VolumeMount(
                name="trino-ca",
                mount_path="/etc/trino-ca/ca.crt",
                sub_path="ca.crt",
                read_only=True,
            )
        ]
        return pod


    c.Spawner.pre_spawn_hook = pre_spawn_hook
    c.KubeSpawner.modify_pod_hook = modify_pod_hook
{{- end }}

# --- Task 5: Hub SA + KubeSpawner RBAC + per-dept Spark-executor RBAC +
# the Hub/proxy Deployments + Services. Same file-wide gate
# (`components.jupyter` AND `auth.oidc.enabled`) as everything above. ---

# The Hub's OWN ServiceAccount — KubeSpawner (running inside the Hub pod)
# uses THIS identity's in-cluster token to talk to the k8s API and spawn/
# manage per-user notebook Pods/PVCs. Distinct from `sa-sandbox-<dept>`
# (chart/templates/09c-zeppelin-sandbox.yaml) below, which is the identity
# the SPAWNED notebook/Spark-driver Pod itself runs as.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
---
# KubeSpawner RBAC — spike §2b MINIMUM verbs (docs/superpowers/spikes/
# 2026-08-06-jupyterhub-config.md), namespace-scoped Role (NOT a
# ClusterRole — the Hub only ever spawns/manages Pods/PVCs in its OWN
# release namespace). `deletecollection` on `pods` is DELIBERATELY separate
# from `delete` — Kubernetes RBAC does not imply one from the other, and
# KubeSpawner's own Pod-reflector/cleanup path performs bulk
# delete-by-label-selector operations that need `deletecollection`
# specifically (same class of finding the spike made for Spark's executor
# cleanup, below).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyterhub-kubespawner
  namespace: {{ include "lakehouse.namespace" . }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Distinct name from the Role above (NOT "jupyterhub-kubespawner" for both) —
  # same "-role"/"-binding" naming convention as `spark-driver-role`/
  # `spark-driver-binding` (chart/templates/05-spark-operator.yaml), so a
  # test/tool selecting a document by `metadata.name` alone can never get an
  # ambiguous match between the Role and its RoleBinding.
  name: jupyterhub-kubespawner-binding
  namespace: {{ include "lakehouse.namespace" . }}
subjects:
- kind: ServiceAccount
  name: jupyterhub
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jupyterhub-kubespawner

# Sandbox v2 (unified, 2026-08-07-sandbox-v2 Task 4) — the notebook pod's
# OWN identity (`pre_spawn_hook` above sets `spawner.service_account =
# "sa-sandbox"` for every user, unified — no more per-dept `sa-sandbox-
# <name>`) plus the Spark-on-k8s executor RBAC it needs (spike §2b/§2c,
# same doc as the per-dept block below), granted ONCE instead of per
# department. Same verbs/rationale as the per-dept Role this replaces for
# the JupyterHub path (`services`/`persistentvolumeclaims` granted despite
# not being exercised by client-mode-in-pod — spike-confirmed Spark's
# unconditional teardown sweep otherwise throws non-fatal but alarming
# ERROR-level `Forbidden` stack traces). Namespace-scoped Role (NOT a
# ClusterRole). Rendered under this file's own gate only (components.jupyter
# AND auth.oidc.enabled) — independent of `sandbox.enabled`/departments,
# same as the rest of the unified sandbox env injection above.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-sandbox
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-spark-executor
  namespace: {{ include "lakehouse.namespace" . }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Distinct name from the Role above (see the KubeSpawner RoleBinding's
  # comment, same rationale/convention).
  name: sandbox-spark-executor-binding
  namespace: {{ include "lakehouse.namespace" . }}
subjects:
- kind: ServiceAccount
  name: sa-sandbox
  namespace: {{ include "lakehouse.namespace" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-spark-executor

# Per-dept Spark-on-k8s executor RBAC (LEGACY — retired by Task 5 of this
# same slice; still additive/coexisting per the slice's additive-then-
# contract ruling, kept alive here ONLY for the shared Zeppelin sandbox
# path, chart/templates/09c-zeppelin-sandbox.yaml — JupyterHub itself no
# longer uses these per-dept identities as of the unified `sa-sandbox`
# above) — spike §2b/§2c (same doc). Binds
# EACH department's `sa-sandbox-<name>` SA (chart/templates/
# 09c-zeppelin-sandbox.yaml, created when `sandbox.enabled` is true — this
# RoleBinding is harmless if that SA does not yet exist, it simply has no
# effect until it does) to the verbs Spark's own driver-side k8s-client
# needs to create/watch/tear-down its OWN executor Pods (spawned from
# inside the notebook, which itself runs AS this SA per `pre_spawn_hook`
# above). `services`/`persistentvolumeclaims` are not exercised by
# client-mode-in-pod but are granted anyway — spike-confirmed: without
# them, Spark's unconditional teardown sweep throws non-fatal but
# alarming ERROR-level `Forbidden` stack traces on every job. Namespace-
# scoped Role per dept (NOT a ClusterRole) — one dept's executors can
# never touch another dept's Pods/ConfigMaps.
{{- range .Values.sandbox.departments }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-{{ .name }}-spark-executor
  namespace: {{ include "lakehouse.namespace" $ }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # Distinct name from the Role above (see the KubeSpawner RoleBinding's
  # comment, same rationale/convention, per-dept here).
  name: sandbox-{{ .name }}-spark-executor-binding
  namespace: {{ include "lakehouse.namespace" $ }}
subjects:
- kind: ServiceAccount
  name: sa-sandbox-{{ .name }}
  namespace: {{ include "lakehouse.namespace" $ }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-{{ .name }}-spark-executor
{{- end }}

# configurable-http-proxy — a SEPARATE Deployment from the Hub (see
# `.Values.versions.configurableHttpProxyImage`'s comment). Fronts the Hub
# AND every per-user singleuser server behind one stable public entry
# point (port 8000, the Route/Ingress target — `lakehouse.svc.jupyterhubProxy`)
# while its api port (8001, `lakehouse.svc.jupyterhubProxyApi`) is where the
# Hub pushes routing-table updates (`should_start=False` +
# `api_url=http://<this-svc>:8001` set in the jupyterhub-config ConfigMap
# above) — the Hub never starts/manages a child CHP process itself.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub-proxy
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: jupyterhub-proxy}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jupyterhub-proxy}
  template:
    metadata:
      labels: {app: jupyterhub-proxy}
    spec:
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: configurable-http-proxy
        image: {{ .Values.versions.configurableHttpProxyImage | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["configurable-http-proxy"]
        args:
        - "--ip=0.0.0.0"
        - "--api-ip=0.0.0.0"
        - "--api-port=8001"
        - {{ printf "--default-target=http://%s:8081" (include "lakehouse.svc.jupyterhubHub" .) | quote }}
        - {{ printf "--error-target=http://%s:8081/hub/error" (include "lakehouse.svc.jupyterhubHub" .) | quote }}
        ports:
        - {containerPort: 8000, name: http}
        - {containerPort: 8001, name: api}
        env:
        - {name: CONFIGPROXY_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: jupyter-proxy-token, key: proxy-token}}}
        resources:
          requests: {cpu: {{ .Values.jupyter.proxy.resources.requests.cpu | quote }}, memory: {{ .Values.jupyter.proxy.resources.requests.memory | quote }}}
          limits:   {cpu: {{ .Values.jupyter.proxy.resources.limits.cpu | quote }},   memory: {{ .Values.jupyter.proxy.resources.limits.memory | quote }}}
---
# The Hub Deployment itself — GenericOAuthenticator + KubeSpawner, config
# from the `jupyterhub-config` ConfigMap (Task 4, above). `serviceAccountName:
# jupyterhub` is what lets KubeSpawner actually spawn/manage Pods (the RBAC
# above). Singleton (`replicas` from `.Values.jupyter.replicas`, default 1) —
# the Hub holds the proxy routing table + user database in-process; no
# leader-election/HA yet (see that value's own comment).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {app: jupyterhub}
spec:
  replicas: {{ .Values.jupyter.replicas }}
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: jupyterhub}
  template:
    metadata:
      labels: {app: jupyterhub}
    spec:
      serviceAccountName: jupyterhub
      {{- $psc := include "lakehouse.podSecurityContext" . | trim }}
      {{- if $psc }}
      securityContext:
        {{- $psc | nindent 8 }}
      {{- end }}
      containers:
      - name: jupyterhub
        image: {{ printf "%s/jupyterhub:%s" .Values.global.imageRegistry .Values.versions.jupyterhubImageTag | quote }}
        {{- $csc := include "lakehouse.containerSecurityContext" . | trim }}
        {{- if $csc }}
        securityContext:
          {{- $csc | nindent 10 }}
        {{- end }}
        command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
        ports: [{containerPort: 8081, name: hub}]
        env:
        - {name: OAUTH_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: jupyter-oidc-credentials, key: client-secret}}}
        - {name: CONFIGPROXY_AUTH_TOKEN, valueFrom: {secretKeyRef: {name: jupyter-proxy-token, key: proxy-token}}}
        - {name: OIDC_ISSUER, valueFrom: {secretKeyRef: {name: {{ required "oidc.secretName is empty — provision the OIDC credentials secret (issuer-url for the JupyterHub Hub) or set auth.oidc.enabled=false" .Values.oidc.secretName }}, key: issuer-url}}}
        volumeMounts:
        - {name: jupyterhub-config, mountPath: /etc/jupyterhub}
        resources:
          requests: {cpu: {{ .Values.jupyter.resources.requests.cpu | quote }}, memory: {{ .Values.jupyter.resources.requests.memory | quote }}}
          limits:   {cpu: {{ .Values.jupyter.resources.limits.cpu | quote }},   memory: {{ .Values.jupyter.resources.limits.memory | quote }}}
      volumes:
      - name: jupyterhub-config
        configMap: {name: jupyterhub-config}
---
# Services. `jupyterhub-proxy` (public, port 8000) is the Route/Ingress
# target (chart/templates/08-routes-tls.yaml / 08b-ingress-tls.yaml,
# pre-existing, `.Values.components.jupyter` gate — those hardcode
# `jupyterhub-proxy` because they were added ahead of this Deployment;
# `lakehouse.svc.jupyterhubProxy` is kept a single named constant here so
# the two can never silently drift apart in the future). `jupyterhub-hub`
# is the proxy's `--default-target`/`--error-target` AND where KubeSpawner-
# spawned singleuser servers reach the Hub back. `jupyterhub-proxy-api` is
# where the Hub pushes routing-table updates (`api_url` in the
# jupyterhub-config ConfigMap above).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.jupyterhubProxy" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  selector: {app: jupyterhub-proxy}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.jupyterhubProxyApi" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  selector: {app: jupyterhub-proxy}
  ports: [{name: api, port: 8001, targetPort: 8001}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lakehouse.svc.jupyterhubHub" . }}
  namespace: {{ include "lakehouse.namespace" . }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  selector: {app: jupyterhub}
  ports: [{name: hub, port: 8081, targetPort: 8081}]
{{- end }}
