# Kafka Connectors — per-source ingest (Debezium CDC + scheduled JDBC) + the
# global Iceberg fan-out sink. Only parameterized + made namespace-aware.
#
# TWO independent gates in this one file (see values.yaml `components.connectors`):
#   - `iceberg-sink-cdc` (`cdc.*`/`jdbc.*`, Avro/Apicurio) + `iceberg-sink-mongo`
#     (`mongo.*`, JSON — Mongo has no Avro schema, see that connector's own
#     comment) -> BOTH gated by `.Values.components.connectors.enabled` only.
#     Together they are CORE ingest infrastructure, not an example: the pair
#     is the source-agnostic sink that lands every `cdc.*`/`jdbc.*`/`mongo.*`
#     topic into Iceberg via the `_target_table` SMT field the source
#     connectors below set. Nothing else in this chart (and nothing in the
#     Console, `console/backend/app/render_service.py`) ever generates a
#     replacement for either, so — unlike the three source connectors below —
#     neither is gated behind the `examples` flag; without them the ingest
#     pipeline has no sink at all, in ANY environment.
#   - `dbz-mssql-students` / `jdbc-mssql-scheduled` / `dbz-mongo-lms` (the
#     three EXAMPLE per-source connectors) -> ALSO requires
#     `.Values.components.connectors.examples.enabled` (default `false`).
#     These are demo/reference instances of the ingest pattern for a
#     specific PoC source (MSSQL "OgrenciDB", Mongo "lms") — real
#     per-source CRs are generated at runtime by the scaffold script
#     (`scaffold-source.sh`) or the Console's add-source wizard
#     (`console/backend/app/orchestrator.py`), not by this chart.
#
# LOAD-BEARING (do not change without re-reading spec + sub-project A —
# docs/superpowers/specs/2026-07-17-ingest-omurgasi-design.md):
#   - Debezium SMTs: `unwrap` (ExtractNewRecordState, delete.handling.mode=
#     rewrite, drop.tombstones=false) + `route` (InsertField$Value,
#     `_target_table` static value) — the Iceberg sink's dynamic routing
#     depends on EVERY source connector setting this field.
#   - COLON-form `${directory:/mnt/external-configuration/<vol>:<key>}`
#     credential references — resolved by 12-kafka-connect.yaml's
#     `config.providers=directory` + the matching `externalConfiguration`
#     volume `name:`s. Never rewritten to `${file:...}` or any other form.
#   - `schema.history.internal.*` SASL_SSL/SCRAM-SHA-512 + truststore block
#     (Debezium's own producer/consumer to the `schema-history.*` topic;
#     the `debezium-src` KafkaUser, 03-kafka-strimzi.yaml, only has ACLs
#     for that prefix — nothing else).
#   - `errors.deadletterqueue.*` on the source connectors is a documented
#     no-op (DLQ is a sink-only Connect feature; real DLQ delivery happens
#     via `iceberg-sink-cdc` below) — preserved verbatim anyway, unchanged
#     from source.
#
# Service wiring (spec §3.1/§8):
#   - schema-history bootstrap servers + Apicurio registry URL resolve via
#     `lakehouse.svc.kafkaBootstrap` / `lakehouse.svc.apicurio` — the SAME
#     helpers 12-kafka-connect.yaml / 11-apicurio-registry.yaml render under.
#   - iceberg-sink-cdc's Nessie catalog URI resolves via `lakehouse.svc.nessie`
#     — the SAME helper 05-spark-operator.yaml/04-nessie-ha.yaml/
#     06-trino-ha.yaml use (path stays the source's exact `/iceberg/v1`).
#   - The MSSQL_HOST / MONGO_HOST / S3_ENDPOINT source hostnames
#     are PRE-Helm double-brace placeholder tokens held in `values.yaml`
#     (same convention as `postgres.nessie.backup.endpointURL`) — plain
#     values-file string data, never parsed by Helm's template engine. They
#     are deliberately NOT spelled out with literal double braces in this
#     comment: doing so inside a template file (even in a YAML `#` comment)
#     makes Helm's Go-template engine try to parse them as an action, since
#     it processes raw text before any YAML/comment parsing — the exact
#     `helm lint` failure this phrasing avoids.
{{- if .Values.components.connectors.enabled }}
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaConnector
metadata:
  name: iceberg-sink-cdc
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {strimzi.io/cluster: connect}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: {{ .Values.connectors.icebergSink.tasksMax | default 1 }}
  config:
    # Deterministic dedup tie-break (silver-merge): stamp each record's Kafka
    # offset + partition into Bronze. InsertField's offset/partition fields are
    # sink-only Connect record metadata. Debezium keys by PK -> same key -> same
    # partition -> offset monotonic per key -> the MERGE's final ORDER BY key.
    transforms: "kafkameta"
    transforms.kafkameta.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.kafkameta.offset.field: "__kafka_offset"
    transforms.kafkameta.partition.field: "__kafka_partition"
    # AVRO (Apicurio) sources only — relational CDC (cdc.*) + scheduled JDBC
    # (jdbc.*). Mongo (mongo.*) is JSON, NOT Avro: one Connect sink has a SINGLE
    # value.converter, so a JSON source cannot share this Avro sink. Mongo needs
    # its OWN sink (JsonConverter).
    topics.regex: "cdc\\..*|jdbc\\..*"
    # Sink deserializes Avro via Apicurio (matches Debezium/Aiven relational
    # producers). Without this the sink uses the worker-default JsonConverter and
    # fails with "Illegal character (CTRL-CHAR)" on Avro bytes.
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
    value.converter.apicurio.registry.url: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
    # --- Nessie REST katalog ---
    iceberg.catalog.type: rest
    # Nessie Iceberg REST base — MUST end at /iceberg/ (Trino/Spark use the same).
    # A trailing /v1 makes Nessie parse "v1" as a named reference (branch) →
    # "Named reference 'v1' not found".
    iceberg.catalog.uri: {{ printf "http://%s:19120/iceberg/" (include "lakehouse.svc.nessie" .) | quote }}
    iceberg.catalog.warehouse: {{ .Values.connectors.icebergSink.warehouse | default "rawdata" | quote }}
    # --- S3 ---
    iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    iceberg.catalog.s3.endpoint: {{ .Values.connectors.icebergSink.s3Endpoint | quote }}
    iceberg.catalog.s3.path-style-access: "true"
    iceberg.catalog.s3.access-key-id: "${directory:/mnt/external-configuration/s3:access-key-id}"
    iceberg.catalog.s3.secret-access-key: "${directory:/mnt/external-configuration/s3:secret-access-key}"
    # --- Fan-out (dinamik routing) ---
    iceberg.tables.dynamic-enabled: "true"
    iceberg.tables.route-field: "_target_table"
    iceberg.tables.auto-create-enabled: "true"
    iceberg.tables.evolve-schema-enabled: "true"
    # APPEND-ONLY: the Apache Iceberg sink cannot upsert (no cdc-field/upsert key
    # exists — verified against apache-iceberg-1.9.0 source). This sink writes the
    # raw CDC change-log to Bronze (rawdata warehouse); current-state upsert happens
    # downstream in the `silver-merge` Spark job (MERGE INTO lakehouse.<ns>.<t>).
    # See docs/superpowers/specs/2026-07-21-medallion-cdc-merge-design.md.
    # --- Commit ---
    iceberg.control.commit.interval-ms: {{ .Values.connectors.icebergSink.commitIntervalMs | default "60000" | quote }}
    # commit.timeout-ms: koordinatörün, worker'ların DATA_COMPLETE'ini beklediği
    # süre. Kaynak-kısıtlı tek-worker Connect'te sink'in control-consumer'ı
    # (cg-control-*) Kafka 4.2 grup koordinatörüne karşı ~commit-interval
    # periyoduyla rebalance/flap yaşayabiliyor; varsayılan 30s pencere worker'ın
    # geç DATA_COMPLETE'ini kaçırıp "committed to 0 table(s)" üretiyor. Kısıtlı
    # overlay'de bunu büyütmek (ör. 180000) commit'i güvenilir kılar; prod'da
    # varsayılan yeterli.
    iceberg.control.commit.timeout-ms: {{ .Values.connectors.icebergSink.commitTimeoutMs | default "30000" | quote }}
    # --- Kafka client overrides (iceberg.kafka.* -> all sink Kafka clients) ---
    {{- range $k, $v := .Values.connectors.icebergSink.kafkaClientOverrides }}
    iceberg.kafka.{{ $k }}: {{ $v | quote }}
    {{- end }}
    # --- Hata/DLQ ---
    errors.tolerance: all
    errors.log.enable: "true"
    errors.deadletterqueue.topic.name: "iceberg-sink.dlq"
    # DLQ topic replication factor — Connect auto-creates the DLQ topic with
    # this RF; the default (3) fails on a <3-broker cluster ("Could not
    # initialize dead letter queue"). Tracks broker count via the same knob as
    # Connect's internal topics (1 on microk8s-ingest, 3 in prod).
    errors.deadletterqueue.topic.replication.factor: "{{ .Values.kafkaConnect.internalTopicReplicationFactor }}"
    errors.deadletterqueue.context.headers.enable: "true"
---
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaConnector
metadata:
  name: iceberg-sink-mongo
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {strimzi.io/cluster: connect}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: {{ .Values.connectors.icebergSink.tasksMax | default 1 }}
  config:
    # Deterministic dedup tie-break (silver-merge): stamp each record's Kafka
    # offset + partition into Bronze. InsertField's offset/partition fields are
    # sink-only Connect record metadata. Debezium keys by PK -> same key -> same
    # partition -> offset monotonic per key -> the MERGE's final ORDER BY key.
    transforms: "kafkameta"
    transforms.kafkameta.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.kafkameta.offset.field: "__kafka_offset"
    transforms.kafkameta.partition.field: "__kafka_partition"
    # Mongo (mongo.*) is JSON, NOT Avro (see the topics.regex comment on
    # iceberg-sink-cdc above) — a separate sink with JsonConverter, since one
    # Connect sink can only have a single value.converter. This sink now also
    # serves the B3 Camel JSON lanes (http.*/mqtt.*/amqp.*) alongside Mongo
    # CDC: those source connectors emit plain JSON via the same JsonConverter
    # and set `_target_table` via their own `route` SMT, so they fan out
    # through this sink's existing dynamic routing with no other config change.
    topics.regex: "mongo\\..*|http\\..*|mqtt\\..*|amqp\\..*"
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter.schemas.enable: "false"
    # --- Nessie REST katalog ---
    iceberg.catalog.type: rest
    # Same /iceberg/ (NOT /v1) base as iceberg-sink-cdc above — see that
    # connector's comment on why a trailing /v1 breaks Nessie's ref parsing.
    iceberg.catalog.uri: {{ printf "http://%s:19120/iceberg/" (include "lakehouse.svc.nessie" .) | quote }}
    iceberg.catalog.warehouse: {{ .Values.connectors.icebergSink.warehouse | default "rawdata" | quote }}
    # --- S3 ---
    iceberg.catalog.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    iceberg.catalog.s3.endpoint: {{ .Values.connectors.icebergSink.s3Endpoint | quote }}
    iceberg.catalog.s3.path-style-access: "true"
    iceberg.catalog.s3.access-key-id: "${directory:/mnt/external-configuration/s3:access-key-id}"
    iceberg.catalog.s3.secret-access-key: "${directory:/mnt/external-configuration/s3:secret-access-key}"
    # --- Fan-out (dinamik routing) ---
    iceberg.tables.dynamic-enabled: "true"
    iceberg.tables.route-field: "_target_table"
    iceberg.tables.auto-create-enabled: "true"
    iceberg.tables.evolve-schema-enabled: "true"
    # APPEND-ONLY: the Apache Iceberg sink cannot upsert (no cdc-field/upsert key
    # exists — verified against apache-iceberg-1.9.0 source). This sink writes the
    # raw CDC change-log to Bronze (rawdata warehouse); current-state upsert happens
    # downstream in the `silver-merge` Spark job (MERGE INTO lakehouse.<ns>.<t>).
    # See docs/superpowers/specs/2026-07-21-medallion-cdc-merge-design.md.
    # --- Commit ---
    iceberg.control.commit.interval-ms: {{ .Values.connectors.icebergSink.commitIntervalMs | default "60000" | quote }}
    # commit.timeout-ms — kısıtlı tek-worker Connect'te control-consumer flap'ine
    # karşı büyütülür (iceberg-sink-cdc'deki ayrıntılı nota bkz.).
    iceberg.control.commit.timeout-ms: {{ .Values.connectors.icebergSink.commitTimeoutMs | default "30000" | quote }}
    # --- Kafka client overrides (iceberg.kafka.* -> all sink Kafka clients) ---
    {{- range $k, $v := .Values.connectors.icebergSink.kafkaClientOverrides }}
    iceberg.kafka.{{ $k }}: {{ $v | quote }}
    {{- end }}
    # --- Hata/DLQ ---
    errors.tolerance: all
    errors.log.enable: "true"
    errors.deadletterqueue.topic.name: "iceberg-mongo.dlq"
    errors.deadletterqueue.topic.replication.factor: "{{ .Values.kafkaConnect.internalTopicReplicationFactor }}"
    errors.deadletterqueue.context.headers.enable: "true"
{{- end }}
{{- if and .Values.components.connectors.enabled .Values.components.connectors.examples.enabled }}
---
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaConnector
metadata:
  name: dbz-mssql-students
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {strimzi.io/cluster: connect}
spec:
  class: io.debezium.connector.sqlserver.SqlServerConnector
  tasksMax: 1
  config:
    database.hostname: {{ .Values.connectors.examples.mssqlHost | quote }}
    database.port: "1433"
    database.user: "${directory:/mnt/external-configuration/mssql:user}"
    database.password: "${directory:/mnt/external-configuration/mssql:pass}"
    database.names: {{ .Values.connectors.examples.mssqlDatabase | quote }}
    database.encrypt: "true"
    topic.prefix: "cdc.mssql1"
    table.include.list: "dbo.students"
    schema.history.internal.kafka.bootstrap.servers: {{ printf "%s:9093" (include "lakehouse.svc.kafkaBootstrap" .) | quote }}
    schema.history.internal.kafka.topic: "schema-history.mssql1"
    # Schema-history client (ayrı producer/consumer) — 9093 SCRAM-SHA-512+TLS
    # POC-DOĞRULA: truststore path/secret keys küme'de doğrulanacak
    schema.history.internal.producer.security.protocol: SASL_SSL
    schema.history.internal.producer.sasl.mechanism: SCRAM-SHA-512
    schema.history.internal.producer.sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="debezium-src" password="${directory:/mnt/external-configuration/debezium-src:password}";'
    schema.history.internal.producer.ssl.truststore.location: /mnt/external-configuration/kafka-ca/ca.p12
    schema.history.internal.producer.ssl.truststore.password: ${directory:/mnt/external-configuration/kafka-ca:ca.password}
    schema.history.internal.producer.ssl.truststore.type: PKCS12
    schema.history.internal.consumer.security.protocol: SASL_SSL
    schema.history.internal.consumer.sasl.mechanism: SCRAM-SHA-512
    schema.history.internal.consumer.sasl.jaas.config: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="debezium-src" password="${directory:/mnt/external-configuration/debezium-src:password}";'
    schema.history.internal.consumer.ssl.truststore.location: /mnt/external-configuration/kafka-ca/ca.p12
    schema.history.internal.consumer.ssl.truststore.password: ${directory:/mnt/external-configuration/kafka-ca:ca.password}
    schema.history.internal.consumer.ssl.truststore.type: PKCS12
    # Avro (Apicurio)
    key.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    key.converter.apicurio.registry.url: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
    value.converter.apicurio.registry.url: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
    # Prod-safe default false (values.yaml `connectors.schemaAutoRegister`) —
    # uncontrolled schema evolution is an anti-pattern in prod; dev/test
    # overrides to true (values-microk8s-ingest.yaml).
    key.converter.apicurio.registry.auto-register: {{ .Values.connectors.schemaAutoRegister | quote }}
    value.converter.apicurio.registry.auto-register: {{ .Values.connectors.schemaAutoRegister | quote }}
    # Delete korunur, envelope açılır, _target_table routing alanı eklenir,
    # __ts_ms Timestamp coercion eklenir — __ts_ms hem MERGE sıralaması hem
    # Bronze partition key'i olarak kullanılır, day(__ts_ms).
    transforms: "unwrap,route,tsconv"
    transforms.unwrap.type: "io.debezium.transforms.ExtractNewRecordState"
    transforms.unwrap.delete.handling.mode: "rewrite"
    transforms.unwrap.drop.tombstones: "false"
    transforms.unwrap.add.fields: "op,ts_ms,source.change_lsn:lsn"
    transforms.route.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.route.static.field: "_target_table"
    transforms.route.static.value: "mssql_ogrenci_raw.students"
    transforms.tsconv.type: "org.apache.kafka.connect.transforms.TimestampConverter$Value"
    transforms.tsconv.field: "__ts_ms"
    transforms.tsconv.target.type: "Timestamp"
    errors.tolerance: all
    errors.deadletterqueue.topic.name: "cdc.mssql1.dbo.students.dlq"
    errors.deadletterqueue.context.headers.enable: "true"
---
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaConnector
metadata:
  name: jdbc-mssql-scheduled
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {strimzi.io/cluster: connect}
spec:
  class: io.aiven.connect.jdbc.JdbcSourceConnector
  tasksMax: 1
  config:
    connection.url: {{ printf "jdbc:sqlserver://%s:1433;databaseName=%s;encrypt=true;trustServerCertificate=true" .Values.connectors.examples.mssqlHost .Values.connectors.examples.mssqlDatabase | quote }}
    connection.user: "${directory:/mnt/external-configuration/mssql:user}"
    connection.password: "${directory:/mnt/external-configuration/mssql:pass}"
    mode: "timestamp+incrementing"
    incrementing.column.name: "course_id"
    timestamp.column.name: "updated_at"
    table.whitelist: "courses"
    topic.prefix: "jdbc.mssql1.dbo."
    poll.interval.ms: "3600000"      # saatlik; scheduled kadans
    value.converter: io.apicurio.registry.utils.converter.AvroConverter
    value.converter.apicurio.registry.url: {{ printf "http://%s:8080/apis/registry/v2" (include "lakehouse.svc.apicurio" .) | quote }}
    # Prod-safe default false (values.yaml `connectors.schemaAutoRegister`) —
    # same rationale as dbz-mssql-students above.
    value.converter.apicurio.registry.auto-register: {{ .Values.connectors.schemaAutoRegister | quote }}
    # JDBC has no CDC envelope — __op/__deleted are synthesized constants
    # ("u"/"false": every polled row is an upsert of current state).
    #
    # __ts_ms: Aiven's JDBC source connector (TimestampIncrementingTableQuerier)
    # builds every SourceRecord via the 5-arg constructor (partition, offset,
    # topic, schema, value) — it never passes a timestamp, so
    # SourceRecord.timestamp() is always null. __ts_ms is instead derived from
    # the timestamp.column.name column: `tsfield` (ReplaceField) renames
    # updated_at:__ts_ms in place (keeps its Timestamp value), `tsconv` then
    # normalizes it to a Connect Timestamp. This is what backs the Bronze
    # day(__ts_ms) partition/TTL and the MERGE ORDER BY __ts_ms DESC
    # latest-per-key ordering. Matching console/backend's
    # _render_scheduled_jdbc.
    transforms: "route,setop,setdel,tsfield,tsconv"
    transforms.route.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.route.static.field: "_target_table"
    transforms.route.static.value: "mssql_ogrenci_raw.courses"
    transforms.setop.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.setop.static.field: "__op"
    transforms.setop.static.value: "u"
    transforms.setdel.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.setdel.static.field: "__deleted"
    transforms.setdel.static.value: "false"
    transforms.tsfield.type: "org.apache.kafka.connect.transforms.ReplaceField$Value"
    transforms.tsfield.renames: "updated_at:__ts_ms"
    transforms.tsconv.type: "org.apache.kafka.connect.transforms.TimestampConverter$Value"
    transforms.tsconv.field: "__ts_ms"
    transforms.tsconv.target.type: "Timestamp"
---
apiVersion: kafka.strimzi.io/{{ .Values.versions.strimziApi }}
kind: KafkaConnector
metadata:
  name: dbz-mongo-lms
  namespace: {{ include "lakehouse.namespace" . }}
  labels: {strimzi.io/cluster: connect}
spec:
  class: io.debezium.connector.mongodb.MongoDbConnector
  tasksMax: 1
  config:
    mongodb.connection.string: {{ printf "mongodb://%s:27017/?replicaSet=rs0" .Values.connectors.examples.mongoHost | quote }}
    mongodb.user: "${directory:/mnt/external-configuration/mongo:user}"
    mongodb.password: "${directory:/mnt/external-configuration/mongo:pass}"
    topic.prefix: "mongo.lms"
    collection.include.list: "lms.enrollments"
    capture.mode: "change_streams_update_full"
    # Ham JSON (registry bypass); _id key olarak taşınır
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: "false"
    value.converter.schemas.enable: "false"
    # Full CDC via Debezium's Mongo-specific unwrap SMT (ExtractNewRecordState
    # has no Mongo equivalent — change-stream events have a different envelope
    # shape), matching console/backend's _render_cdc_mongo.
    transforms: "unwrap,route,tsconv"
    transforms.unwrap.type: "io.debezium.connector.mongodb.transforms.ExtractNewDocumentState"
    transforms.unwrap.delete.handling.mode: "rewrite"
    transforms.unwrap.drop.tombstones: "false"
    transforms.unwrap.add.fields: "op,ts_ms"
    transforms.route.type: "org.apache.kafka.connect.transforms.InsertField$Value"
    transforms.route.static.field: "_target_table"
    transforms.route.static.value: "mongo_lms_raw.enrollments"
    transforms.tsconv.type: "org.apache.kafka.connect.transforms.TimestampConverter$Value"
    transforms.tsconv.field: "__ts_ms"
    transforms.tsconv.target.type: "Timestamp"
    errors.tolerance: all
    errors.deadletterqueue.topic.name: "mongo.lms.enrollments.dlq"
    errors.deadletterqueue.context.headers.enable: "true"
{{- end }}

# POC-DOĞRULA (spec §15.1 — en yüksek risk): Iceberg sink v1.6.x tam anahtar
# isimleri; sink'in Bronze (rawdata warehouse) append-only changelog yazdığı
# ve current-state upsert'ün downstream `silver-merge` Spark job'ında
# (MERGE INTO) gerçekleştiği medallion akışı — bkz.
# docs/superpowers/specs/2026-07-21-medallion-cdc-merge-design.md; S3
# credential geçişi (${file:...} external config veya env). Kümede uçtan uca
# doğrulanacak.
