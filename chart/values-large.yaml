# values-large.yaml — high-volume production tier.
#
# Layer OVER the chart defaults (`chart/values.yaml`, already "medium-ish
# HA" by design — see values-medium.yaml). Use this overlay for a production
# install expecting sustained high ingest/query volume beyond the
# medium/default sizing: more Kafka brokers + bigger PVCs, more Trino
# workers + bigger heaps, more Spark Silver-merge executors, longer-lived
# Bronze retention windows, wider console HA. Requests/limits below are
# realistic (~2-4x the chart's medium/default numbers), not invented
# absurd values — retune per your actual cluster capacity before install.
#
#   helm install lakehouse chart/ -f chart/values-large.yaml -n <namespace>

components:
  superset: true
  dbt: true
  sparkHistory: true

# c2 (per-dept analyst sandbox): OFF by default even at this tier, restating
# the chart default — an empty `departments` list means nothing renders
# regardless of `enabled` (see chart/values.yaml's `sandbox:` block comment
# and the coherence guard in chart/templates/09c-zeppelin-sandbox.yaml). The
# operator turns this on PER INSTALL by flipping `enabled: true` and filling
# in `departments` (each needs a scoped S3 credential provisioned
# out-of-band, a dept AD group, and — per the coherence guard — `auth.oidc.
# enabled: true`, already the default at this tier). See the README's "c2"
# section for the full operator checklist before enabling.
sandbox:
  enabled: false
  departments: []

# Consumption slice d (Spark History Server): non-empty S3 endpoint keeps the
# jobs' eventLog conf valid AND is what the History Server itself reads from.
# MUST match the s3-credentials Secret's endpoint; override per environment.
sparkHistory:
  s3Endpoint: "http://minio.CHANGE-ME.svc:9000"

# b2 (dbt-trino Gold): with `components.dbt: true` above, the chart default
# `auth.oidc.enabled: true` (Keycloak present) and `superset.trino.tls.
# enabled: true` (chart default) together satisfy the coherence guard
# (`components.dbt=true` requires both) — so the dbt-build CronJob, dbt
# profiles Secret, and OIDC client render. `dbt.oidc.clientSecret` and
# `dbt.repo.deployKey` stay empty here (out-of-band per `.Values.secrets.
# mode`, same contract as every other credential in this chart) — never put
# real secrets in a sizing overlay.

# b1 (Trino machine-auth): with `components.superset: true` above and the
# chart default `auth.oidc.enabled: true` (Keycloak present in this tier),
# turn on Superset->Trino JWT machine-auth — Superset presents a Keycloak
# service-account JWT to Trino instead of the dev-only `none` (unauthenticated)
# default. `clientSecret`/`tls.keystorePassword` stay empty here (out-of-band
# per `.Values.secrets.mode`, same contract as every other OIDC credential in
# this chart) — never put real secrets in a sizing overlay.
superset:
  trino:
    authMode: jwt

# Nessie machine-auth: with the chart default `auth.oidc.enabled: true`
# (Keycloak present at this tier), Nessie's own authn/authz turns on too
# (04-nessie-ha.yaml) — this FIXES the latent prod 401 (committers were
# never actually authenticating against it) and requires the 4
# `svc-<x>-nessie` client secrets (`nessie.machineAuth.{trino,spark,connect,
# zeppelin}ClientSecret`, chart/values.yaml). All 4 stay empty-string here
# (out-of-band per `.Values.secrets.mode`, same contract as every other
# credential in this file) — never put real secrets in a sizing overlay. See
# the README's "Nessie machine-auth" section for the full 5-identity CEL
# policy + operator checklist before install.

postgres:
  nessie:
    storage:
      size: 200Gi
    walStorage:
      size: 50Gi
    resources:
      requests:
        memory: 2Gi
        cpu: "1"
      limits:
        memory: 4Gi
        cpu: "4"
  apicurio:
    storage:
      size: 50Gi
    walStorage:
      size: 20Gi
  keycloak:
    storage:
      size: 50Gi
    walStorage:
      size: 20Gi
  superset:
    storage:
      size: 50Gi
    walStorage:
      size: 20Gi

kafka:
  nodePools:
    broker:
      replicas: 5
      storage:
        size: 500Gi
      resources:
        requests: {memory: 2Gi, cpu: "1"}
        limits: {memory: 8Gi, cpu: "4"}
  topics:
    # Higher-volume ingest topics get more partitions for parallelism; RF
    # stays at the chart default (3) — 5 brokers gives it more placement
    # headroom, no need to raise RF itself for this tier.
    nginxAccess: {partitions: 24}
    lmsEvents: {partitions: 12}

nessie:
  # Bumped from the chart default (2) to match hpa.minReplicas below — the
  # Deployment's initial replica count should never sit below the HPA's own
  # floor.
  replicas: 3
  hpa:
    minReplicas: 3
    maxReplicas: 8

trino:
  worker:
    replicas: 6
    resources:
      requests:
        memory: 8Gi
        cpu: "2"
      limits:
        memory: 16Gi
        cpu: "8"
    hpa:
      minReplicas: 4
      maxReplicas: 16
  coordinator:
    resources:
      requests:
        memory: 4Gi
        cpu: "1"
      limits:
        memory: 12Gi
        cpu: "8"
  memory:
    jvmXmx: 12G
    queryMaxMemory: 20GB
    queryMaxMemoryPerNodeCoordinator: 3GB
    heapHeadroomPerNode: 2GB
    queryMaxMemoryPerNodeWorker: 6GB

console:
  backend:
    replicas: 3
  frontend:
    replicas: 3

sparkOperator:
  maintenance:
    # Longer retention window for high-volume Bronze — more time before the
    # partition-aligned TTL delete + expire_snapshots reclaim runs.
    bronzeRetentionDays: 90
    executor:
      instances: 8
      memory: 8G
  silverMerge:
    driver: {memory: "2g"}
    executor: {memory: "2g"}
    # Dynamic-allocation ceiling — high-volume Silver-merge needs more
    # executors available under load (minExecutors stays 0, hardcoded in
    # the template: scales down to zero between runs same as every tier).
    maxExecutors: 8
