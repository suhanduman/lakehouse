# chart/tests/jobs-code-delivery_test.yaml — helm-unittest suite for Task 1
# of the s3a job-code delivery feature (docs/superpowers/sdd/
# 2026-07-31-s3a-job-code-delivery/): the shared `storage.s3.endpoint` ->
# `spark.hadoop.fs.s3a.endpoint` conditional in `lakehouse.spark.baseConf`
# (_helpers.tpl, consumed by chart/templates/05-spark-operator.yaml) and the
# dedicated `storage.jobsBucket` bucket-init append (chart/templates/
# 18-bucket-init.yaml). Later tasks (jobs-seed Job, mainApplicationFile ->
# s3a://) build on the values introduced here.
suite: s3a job-code delivery — values + baseConf endpoint + bucket-init
templates:
  - 05-spark-operator.yaml
  - 14-nginx-ingest.yaml
  - 18-bucket-init.yaml
  - 19-jobs-seed.yaml
tests:
  - it: "storage.s3.endpoint set -> merge_cdc sparkConf carries spark.hadoop.fs.s3a.endpoint"
    template: templates/05-spark-operator.yaml
    set: {storage.s3.endpoint: "http://minio.lakehouse-test.svc:9000"}
    documentSelector: {path: metadata.name, value: silver-merge}
    asserts:
      - equal:
          path: spec.template.sparkConf["spark.hadoop.fs.s3a.endpoint"]
          value: "http://minio.lakehouse-test.svc:9000"

  - it: "storage.s3.endpoint empty (default) -> no explicit s3a endpoint key"
    template: templates/05-spark-operator.yaml
    documentSelector: {path: metadata.name, value: silver-merge}
    asserts:
      - notExists:
          path: spec.template.sparkConf["spark.hadoop.fs.s3a.endpoint"]

  - it: "bucket-init creates the dedicated jobs bucket by default"
    template: templates/18-bucket-init.yaml
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "mc mb --ignore-existing s3/spark-jobs"

  - it: "seedJobs=false renders no jobs-seed Job"
    template: templates/19-jobs-seed.yaml
    set: {storage.seedJobs: false}
    asserts:
      - hasDocuments: {count: 0}

  - it: "default renders the jobs-seed Job: spark-py initContainer copies code, mc container uploads to the jobs bucket, dual hooks"
    template: templates/19-jobs-seed.yaml
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: "metadata.annotations[\"helm.sh/hook\"]", value: "post-install,post-upgrade"}
      - equal: {path: "metadata.annotations[\"argocd.argoproj.io/hook\"]", value: "PostSync"}
      - matchRegex:
          path: spec.template.spec.initContainers[0].image
          pattern: "spark-py:"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "quay.io/minio/mc:RELEASE.2024-01-13T08-44-48Z"
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "mc cp /seed/.*s3/spark-jobs/jobs/"

  - it: "merge_cdc reads its main file + merge_lib from s3a"
    template: templates/05-spark-operator.yaml
    documentSelector: {path: metadata.name, value: silver-merge}
    asserts:
      - equal: {path: spec.template.mainApplicationFile, value: "s3a://spark-jobs/jobs/merge_cdc.py"}
      - contains: {path: spec.template.deps.pyFiles, content: "s3a://spark-jobs/jobs/merge_lib.py"}

  - it: "iceberg_maintenance reads its main file from s3a"
    template: templates/05-spark-operator.yaml
    documentSelector: {path: metadata.name, value: iceberg-maintenance}
    asserts:
      - equal: {path: spec.template.mainApplicationFile, value: "s3a://spark-jobs/jobs/iceberg_maintenance.py"}

  - it: "nginx_streaming reads its main file from s3a"
    template: templates/14-nginx-ingest.yaml
    documentSelector: {path: metadata.name, value: nginx-streaming}
    asserts:
      - equal: {path: spec.mainApplicationFile, value: "s3a://spark-jobs/jobs/nginx_streaming.py"}
