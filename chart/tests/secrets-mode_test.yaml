# chart/tests/secrets-mode_test.yaml — helm-unittest suite for
# `values.secrets.mode` (generated | external | manual) branching (optional
# unit-test layer; chart/tests/integrity.sh remains the primary spec
# §3.1/§8 gate).
#
# Three modes, one DECLARATION (`secrets.mode`) branching TWO render
# surfaces:
#   - chart/templates/NOTES.txt's post-install guidance text (three-way
#     `{{- if eq .Values.secrets.mode "generated" }}` / `"external"` /
#     else=manual branch).
#   - chart/templates/15-external-secrets.yaml, which renders `ExternalSecret`
#     CRs ONLY for mode=external (AND `.Values.components.externalSecrets`,
#     default true) — `generated` (the new default) and `manual` both
#     render NOTHING here, by design (see that file's + chart/values.yaml's
#     `secrets:` header comments for why: an ExternalSecret would fight
#     bootstrap's own seeded material for ownership in `generated` mode).
#
# Separately (final-review FIX 4, see chart/tests/component-enabled_test.yaml
# for the concrete assertions): the four dev-convenience credential fields
# (`trino.internalSharedSecret`, `zeppelin.ad.bindPassword`,
# `keycloak.adminPassword`, `kafkaUi.oidc.clientSecret`) DO branch their own
# templates' Secret rendering — but on whether a value was supplied at all
# (empty vs. non-empty), not on the `secrets.mode` string itself, and are
# NOT part of chart/templates/15-external-secrets.yaml's inventory (see that
# file's header comment for why).
suite: secrets.mode (generated | external | manual) branching
templates:
  - NOTES.txt
  - 15-external-secrets.yaml
tests:
  # -------------------- NOTES.txt guidance text --------------------
  - it: mode=generated (default) prints the bootstrap guidance, not the ExternalSecrets/manual steps
    template: NOTES.txt
    asserts:
      - matchRegexRaw:
          pattern: "mode=generated \\(default\\): the `bootstrap` script seeds every named Secret"
      - notMatchRegexRaw:
          pattern: "mode=external: an ExternalSecrets Operator \\+ Vault/AD backend materializes"
      - notMatchRegexRaw:
          pattern: "mode=manual: create each Secret by hand"

  - it: mode=external prints the ExternalSecrets/Vault guidance, not the generated/manual steps
    template: NOTES.txt
    set:
      secrets.mode: external
    asserts:
      - matchRegexRaw:
          pattern: "mode=external: an ExternalSecrets Operator \\+ Vault/AD backend materializes"
      - notMatchRegexRaw:
          pattern: "mode=manual: create each Secret by hand"
      - notMatchRegexRaw:
          pattern: "mode=generated \\(default\\): the `bootstrap` script seeds every named Secret"

  - it: mode=manual prints the manual oc create secret steps, not the generated/ExternalSecrets guidance
    template: NOTES.txt
    set:
      secrets.mode: manual
    asserts:
      - matchRegexRaw:
          pattern: "mode=manual: create each Secret by hand"
      - notMatchRegexRaw:
          pattern: "mode=external: an ExternalSecrets Operator \\+ Vault/AD backend materializes"
      - notMatchRegexRaw:
          pattern: "mode=generated \\(default\\): the `bootstrap` script seeds every named Secret"

  - it: all three modes always print the shared secret-name inventory (name-reference-only contract, independent of mode)
    template: NOTES.txt
    set:
      secrets.mode: manual
    asserts:
      - matchRegexRaw:
          pattern: "SECRETS \\(mode = \"manual\"\\)"
      - matchRegexRaw:
          pattern: "s3-credentials"
      - matchRegexRaw:
          pattern: "oidc-credentials"

  # -------------------- 15-external-secrets.yaml rendering --------------------
  - it: mode=generated (default) renders NO ExternalSecret documents at all
    template: 15-external-secrets.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: mode=manual renders NO ExternalSecret documents either
    template: 15-external-secrets.yaml
    set:
      secrets.mode: manual
    asserts:
      - hasDocuments:
          count: 0

  - it: mode=external renders one ExternalSecret per named platform Secret (default components — keycloak+kafkaConnect on)
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
    asserts:
      - hasDocuments:
          count: 6
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: s3-credentials
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: oidc-credentials
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: keycloak-admin-credentials
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: pg
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: mssql
          any: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: mongo
          any: true

  - it: "mode=external: the S3 ExternalSecret has correct secretStoreRef, target, and whole-secret dataFrom.extract key"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
    documentSelector:
      path: metadata.name
      value: s3-credentials
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: lakehouse-vault
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.refreshInterval
          value: 1h
      - equal:
          path: spec.target.name
          value: s3-credentials
      - equal:
          path: spec.dataFrom[0].extract.key
          value: lakehouse/s3-credentials

  - it: "mode=external: the oidc-credentials ExternalSecret has correct target + dataFrom.extract key"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
    documentSelector:
      path: metadata.name
      value: oidc-credentials
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: lakehouse-vault
      - equal:
          path: spec.target.name
          value: oidc-credentials
      - equal:
          path: spec.dataFrom[0].extract.key
          value: lakehouse/oidc-credentials

  - it: "mode=external: a custom secretStoreName/kind/remoteKeyPrefix/refreshInterval flows through to the rendered CR"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
      secrets.external.secretStoreName: my-vault
      secrets.external.secretStoreKind: SecretStore
      secrets.external.remoteKeyPrefix: custom-prefix
      secrets.external.refreshInterval: 15m
    documentSelector:
      path: metadata.name
      value: oidc-credentials
    asserts:
      - equal:
          path: spec.secretStoreRef.name
          value: my-vault
      - equal:
          path: spec.secretStoreRef.kind
          value: SecretStore
      - equal:
          path: spec.refreshInterval
          value: 15m
      - equal:
          path: spec.dataFrom[0].extract.key
          value: custom-prefix/oidc-credentials

  - it: "mode=external: no ExternalSecret at all when components.externalSecrets is false (ESO-CRD-not-installed escape hatch)"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
      components.externalSecrets: false
    asserts:
      - hasDocuments:
          count: 0

  - it: "mode=external: keycloak-admin-credentials ExternalSecret disappears when components.keycloak is false"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
      components.keycloak: false
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: keycloak-admin-credentials
          any: true
        not: true

  - it: "mode=external: pg/mssql/mongo ExternalSecrets disappear when components.kafkaConnect is false"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
      components.kafkaConnect: false
    asserts:
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: pg
          any: true
        not: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: mssql
          any: true
        not: true
      - containsDocument:
          kind: ExternalSecret
          apiVersion: external-secrets.io/v1beta1
          name: mongo
          any: true
        not: true

  - it: "mode=external: no inline Secret (or any base64/plaintext material) renders anywhere in this file — spec §4"
    template: 15-external-secrets.yaml
    set:
      secrets.mode: external
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          any: true
        not: true
