# chart/tests/console_test.yaml — helm-unittest suite for
# 2026-07-30-gitops-core-slice-a-write-path Task 5: `console.deployMode` +
# `console.gitops.*` wiring into the backend ConfigMap (env names the
# backend — Task 1 — reads: DEPLOY_MODE/GITOPS_REPO_URL/GITOPS_BRANCH/
# GITOPS_PATH/GITOPS_CREDENTIAL_SECRET) and into the backend Deployment's
# credential mount (the backend — Task 4 — reads the git SSH key from a
# file at /var/run/gitops/ssh-privatekey, +optional known_hosts — hence a
# volume/volumeMount, not env vars, for the credential itself).
#
# documentSelector notes (chart/templates/console/console.yaml renders many
# documents from one file):
#   - `{path: kind, value: ConfigMap}` is unique — only one ConfigMap here.
#   - `{path: kind, value: Deployment}` is NOT unique (backend + frontend
#     Deployments both render) and `{path: metadata.name, value:
#     console-backend}` is ALSO not unique (the backend Service shares that
#     exact name — see the file's own header comment on why). Selecting on
#     `spec.template.spec.containers[0].name == console-backend` sidesteps
#     both collisions: only the backend Deployment has that path/value pair
#     (the frontend Deployment's container is named console-frontend; the
#     Service has no spec.template at all, so the path just doesn't match —
#     not an error, per helm-unittest's yamlpath semantics).
suite: console deployMode + gitops config/credential wiring
templates:
  - templates/console/console.yaml
tests:
  - it: "default (deployMode=direct, unset): ConfigMap carries DEPLOY_MODE=direct + the gitops.* defaults, and the backend Deployment has NO gitops-credential volume/mount (control case)"
    asserts:
      - equal:
          path: data.DEPLOY_MODE
          value: "direct"
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: data.GITOPS_REPO_URL
          value: ""
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: data.GITOPS_BRANCH
          value: "main"
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: data.GITOPS_PATH
          value: "pipelines"
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: data.GITOPS_CREDENTIAL_SECRET
          value: "gitops-credential"
        documentSelector: {path: kind, value: ConfigMap}
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: gitops-credential
        documentSelector: {path: "spec.template.spec.containers[0].name", value: console-backend}
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-credential
        documentSelector: {path: "spec.template.spec.containers[0].name", value: console-backend}

  - it: "ConfigMap carries SILVER_DEFAULT_BUCKET_COUNT (2026-08-03 silver-scale-hardening), default 16, feeding Settings.silver_default_bucket_count"
    asserts:
      - equal:
          path: data.SILVER_DEFAULT_BUCKET_COUNT
          value: "16"
        documentSelector: {path: kind, value: ConfigMap}

  - it: "SILVER_DEFAULT_BUCKET_COUNT is scaled by values (console.silverDefaultBucketCount)"
    set:
      console.silverDefaultBucketCount: 32
    asserts:
      - equal:
          path: data.SILVER_DEFAULT_BUCKET_COUNT
          value: "32"
        documentSelector: {path: kind, value: ConfigMap}

  - it: "deployMode=gitops + repoUrl set: ConfigMap reflects the override, backend Deployment mounts the gitops-credential Secret at /var/run/gitops (ssh-privatekey + optional known_hosts)"
    set:
      console.deployMode: gitops
      console.gitops.repoUrl: ssh://x
    asserts:
      - equal:
          path: data.DEPLOY_MODE
          value: "gitops"
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: data.GITOPS_REPO_URL
          value: "ssh://x"
        documentSelector: {path: kind, value: ConfigMap}
      - contains:
          path: spec.template.spec.volumes
          content:
            name: gitops-credential
            secret:
              secretName: gitops-credential
              defaultMode: 256
              items:
                - key: ssh-privatekey
                  path: ssh-privatekey
                - key: known_hosts
                  path: known_hosts
                  optional: true
        documentSelector: {path: "spec.template.spec.containers[0].name", value: console-backend}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: gitops-credential
            mountPath: /var/run/gitops
            readOnly: true
        documentSelector: {path: "spec.template.spec.containers[0].name", value: console-backend}

  - it: "deployMode=gitops with empty repoUrl fails the render loudly (required() guard, mirrors oidc.secretName's fail-loud pattern)"
    set:
      console.deployMode: gitops
    asserts:
      - failedTemplate:
          errorMessage: "console.gitops.repoUrl is required when deployMode=gitops"

  # 2026-07-30-gitops-core-slice-b1-argocd-wiring Task 6: the ArgoCD-read
  # Role/RoleBinding (namespace `.Values.console.argocdNamespace`) + the
  # ConfigMap's ARGOCD_NAMESPACE key. Both the new Role and RoleBinding
  # share `metadata.name: lakehouse-console-argocd-read`, and `kind: Role`
  # alone collides with the file's OTHER (release-namespace) Role
  # `lakehouse-console-role` above — so the positive test below disambiguates
  # via documentSelector on a field unique to each: `rules[0].apiGroups[0]`
  # (argoproj.io, vs the other Role's kafka.strimzi.io) for the Role,
  # `roleRef.name` (lakehouse-console-argocd-read, vs the other RoleBinding's
  # lakehouse-console-role) for the RoleBinding. For THIS absence test,
  # `containsDocument` + `not: true` is used instead of `hasDocuments` +
  # `documentSelector`: helm-unittest's documentSelector hard-errors
  # ("document not found") when zero documents match by default (a prior
  # gotcha), whereas `containsDocument` tolerates a genuine zero-match render.
  - it: "default (deployMode=direct): NO lakehouse-console-argocd-read Role/RoleBinding renders (control case)"
    asserts:
      - containsDocument:
          kind: Role
          apiVersion: rbac.authorization.k8s.io/v1
          name: lakehouse-console-argocd-read
          namespace: argocd
        not: true
      - containsDocument:
          kind: RoleBinding
          apiVersion: rbac.authorization.k8s.io/v1
          name: lakehouse-console-argocd-read
          namespace: argocd
        not: true

  # 2026-08-29-self-service-resource-safety Task 4: the release-namespace
  # Role (`lakehouse-console-role` — disambiguated by `metadata.name` from
  # the file's OTHER Role, `lakehouse-console-argocd-read`, which has no
  # `secrets` rule at all) grants `get` on secrets IN ADDITION TO
  # create/update/delete. `get` is needed ONLY for the fail-closed
  # `create_secret` 409-conflict path (console/backend/app/services/
  # k8s_service.py) to read a colliding secret's metadata/labels — deciding
  # whether it's a Console-created secret (safe to replace) or a foreign/
  # platform secret (SEC-1: must NEVER be overwritten). The secret's VALUE
  # (`.data`) is still never read — see this file's header comment.
  - it: "console Role (release namespace) can get secrets, in addition to create/update/delete (fail-closed conflict label-check, SEC-1)"
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [secrets]
            verbs: [get, create, update, delete]
        documentSelector: {path: metadata.name, value: lakehouse-console-role}

  - it: "deployMode=gitops: the ArgoCD-read Role+RoleBinding render in .Values.console.argocdNamespace (kind: Role, NEVER ClusterRole), bound to the lakehouse-console ServiceAccount, and the ConfigMap carries ARGOCD_NAMESPACE"
    set:
      console.deployMode: gitops
      console.gitops.repoUrl: ssh://x
    asserts:
      - equal:
          path: data.ARGOCD_NAMESPACE
          value: "argocd"
        documentSelector: {path: kind, value: ConfigMap}
      - equal:
          path: kind
          value: Role
        documentSelector: {path: "rules[0].apiGroups[0]", value: "argoproj.io"}
      - equal:
          path: metadata.namespace
          value: argocd
        documentSelector: {path: "rules[0].apiGroups[0]", value: "argoproj.io"}
      - contains:
          path: rules
          content:
            apiGroups: ["argoproj.io"]
            resources: ["applications"]
            verbs: ["get", "list", "watch"]
        documentSelector: {path: "rules[0].apiGroups[0]", value: "argoproj.io"}
      - equal:
          path: kind
          value: RoleBinding
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
      - equal:
          path: metadata.namespace
          value: argocd
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
      - equal:
          path: subjects[0].name
          value: lakehouse-console
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
      - equal:
          path: subjects[0].namespace
          value: NAMESPACE
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
      - equal:
          path: roleRef
          value: {kind: Role, name: lakehouse-console-argocd-read, apiGroup: rbac.authorization.k8s.io}
        documentSelector: {path: roleRef.name, value: lakehouse-console-argocd-read}
