  # --- Task 5: Spark SparkApplication driver SPARK_CONF_DIR injection
  # (svc-spark-nessie) -------------------------------------------------------
  # Inline `sparkConf` (`lakehouse.spark.baseConf` helper, chart/templates/
  # _helpers.tpl) does NOT expand `${VAR}` in spark-submit `--conf` flags
  # (c2 spike finding) — a placeholder there would be unresolved, a resolved
  # secret there would leak into the CR. So the OAuth2 auth keys live in a
  # SEPARATE `spark-nessie-oauth-defaults` ConfigMap TEMPLATE, rendered by a
  # driver-only sed->tmpfs initContainer into `SPARK_CONF_DIR` at pod start
  # (mirrors the c2 sandbox / Task-6 shared-Zeppelin mechanism, chart/
  # templates/_zeppelin.tpl). DRIVER-ONLY — executors get the catalog
  # OAuth2 props via the driver's broadcasted SparkConf, no separate
  # executor initContainer/volume.

  - it: spark-nessie-oauth-defaults ConfigMap has the OAuth2 keys on BOTH lakehouse+rawlake (client-id=svc-spark-nessie, client-secret/issuer-url LITERAL placeholders) when auth on
    templates:
      - 22-nessie-machine-auth.yaml
    documentSelector:
      path: metadata.name
      value: spark-nessie-oauth-defaults
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
    asserts:
      - equal:
          path: kind
          value: ConfigMap
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-id=svc-spark-nessie'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-id=svc-spark-nessie'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER\}'
      # the resolved secret must NEVER appear here — only the literal
      # `${OAUTH_CLIENT_SECRET}`/`${OIDC_ISSUER}` placeholders above; the
      # anchored regexes above already prove the value is EXACTLY that
      # literal (a resolved secret would fail them outright — Go's RE2 has
      # no lookahead, so a real leak-check needs the SENTINEL run below
      # rather than a negative regex here, same convention as the Trino
      # Task-4 tests in this same file).

  - it: spark-nessie-oauth-defaults ConfigMap does NOT render when auth.oidc.enabled is false (whole file renders zero documents — byte-identity control)
    templates:
      - 22-nessie-machine-auth.yaml
    set:
      auth.oidc.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: iceberg-maintenance ScheduledSparkApplication gains the driver sed->tmpfs initContainer + tmpfs volume + OAUTH_CLIENT_SECRET/OIDC_ISSUER/SPARK_CONF_DIR wiring, NO sparkConfigMap, when auth on
    templates:
      - 05-spark-operator.yaml
    documentSelector:
      path: '$[?(@.kind=="ScheduledSparkApplication" && @.metadata.name=="iceberg-maintenance")]'
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
    asserts:
      - contains:
          path: spec.template.volumes
