# chart/tests/nessie-auth_test.yaml — helm-unittest suite for Nessie
# machine-auth (Nessie machine-auth plan, Task 2): the 4 `svc-<x>-nessie`
# Keycloak service-account clients (chart/templates/10-keycloak.yaml) +
# `.Values.nessie.machineAuth.*` client-secret values.
#
# This is the slice's test file — later tasks (Trino/Spark/Connect/Zeppelin
# wiring to authenticate against Nessie with these identities) extend it
# rather than adding a parallel file.
#
# Gated `.Values.auth.oidc.enabled` (default true, UNLIKE the unified
# `svc-sandbox` client which gates on `sandbox.enabled`): when
# auth.oidc.enabled is false, Nessie (04-nessie-ha.yaml) runs fully
# unauthenticated, so these service accounts must not render at all — that
# is the "auth off" control case below.
#
# Each of the 4 clients is asserted by `contains`/`notContains` against the
# FULL rendered client object (clientId-equality via full-content array
# membership), NOT a positional index — the 4 svc-*-nessie clients render
# right after `svc-zeppelin-trino` (auth-oidc_test.yaml's control-case
# clients[0..3]), so they're stably clients[4..7] today, but pinning to that
# would break silently if another auth.oidc.enabled-gated client is ever
# inserted between them. The full-content `contains` naturally also proves
# NO `protocolMappers` key is present (an aud mapper would show up as an
# extra key and break the exact-content match) — Nessie validates the token
# by ISSUER only, same as the unified `svc-sandbox` client.
suite: nessie.machineAuth values + Keycloak svc-<x>-nessie clients
templates:
  - 10-keycloak.yaml
  - 09-zeppelin.yaml
  - 22-nessie-machine-auth.yaml
  - 04-nessie-ha.yaml
  - 06-trino-ha.yaml
  - 05-spark-operator.yaml
  - 14-nginx-ingest.yaml
  - 12-kafka-connect.yaml
  - templates/console/console.yaml
tests:
  # --- Task 3: Nessie server authorization + CEL rules --------------------
  # `04-nessie-ha.yaml` documentIndex:1 is the Deployment (same convention as
  # chart/tests/auth-oidc_test.yaml's existing Nessie assertions — `helm
  # template`'s fixed kind-sort order puts PDB[0]/ServiceAccount before
  # Service/Deployment; helm-unittest preserves that same ordering here).
  #
  # LOAD-BEARING property under test: every one of the 5 identities (trino,
  # spark, connect, zeppelin, sandbox-<dept>) must have the CORRECT allow/
  # deny outcome — a missing writer allow-rule silently breaks that
  # committer (the b2 rules.json catch-all lesson), and any rule
  # accidentally granting zeppelin write access breaks its read-only
  # guarantee. Exact CEL text asserted verbatim (not just presence) so a
  # future edit that subtly narrows/widens a rule fails loudly.
  - it: auth.oidc.enabled=true + sandbox.enabled=true renders NESSIE_SERVER_AUTHORIZATION_ENABLED=true and the full 4-identity CEL policy (trino/spark/connect all role-only, unified sandbox-v2 writer namespace-only, zeppelin absent from every write/commit rule)
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_ENABLED
            value: "true"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_READ_ALL
            value: "op in ['VIEW_REFERENCE','READ_ENTRIES','LIST_COMMIT_LOG','READ_CONTENT_KEY','READ_ENTITY_VALUE','READ_REPOSITORY_CONFIG']"
        documentIndex: 1
      # Ref-level COMMIT_TO_MAIN: trino + spark + connect + the unified
      # sandbox-v2 writer (Task 1, 2026-08-07 sandbox-v2-design; the
      # per-dept writer that used to also appear here was retired in
      # Task 5) all present (every writer that must be able to commit at
      # all); zeppelin absent (read-only — denied at this ref-level gate
      # already).
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          value: "op=='COMMIT_CHANGE_AGAINST_REFERENCE' && ref=='main' && (role=='service-account-svc-trino-nessie' || role=='service-account-svc-spark-nessie' || role=='service-account-svc-connect-nessie' || role=='service-account-svc-sandbox')"
        documentIndex: 1
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          pattern: 'zeppelin'
        documentIndex: 1
      # Per-key writes: trino (all paths), spark (all paths), connect
      # (role-only — the Console-rendered Iceberg sink ALWAYS routes to
      # Bronze `<ns>_raw`, which does NOT start with `rawlake`; see
      # 04-nessie-ha.yaml's ALLOW_CONNECT_WRITE comment), unified
      # svc-sandbox (sandbox namespace only).
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_TRINO_WRITE
            value: "op in ['CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY'] && role=='service-account-svc-trino-nessie'"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SPARK_WRITE
            value: "op in ['CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY'] && role=='service-account-svc-spark-nessie'"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_CONNECT_WRITE
            value: "op in ['CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY'] && role=='service-account-svc-connect-nessie'"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SANDBOX_WRITE
            value: "op in ['CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY'] && role=='service-account-svc-sandbox' && path.startsWith('sandbox')"
        documentIndex: 1
      # svc-zeppelin-nessie must appear in NO write/commit rule at all —
      # a defensive guard against the naming convention every other write
      # rule in this file follows (ALLOW_<IDENTITY>_WRITE), in addition to
      # the exact-content assertions above already proving zeppelin is
      # absent from the read-all/commit-to-main/trino/spark/connect/sandbox
      # rule text verbatim.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_ZEPPELIN_WRITE
        documentIndex: 1

  - it: auth.oidc.enabled=true + sandbox.enabled=false renders NO svc-sandbox CEL rule anywhere (the sandbox CEL rules gate on sandbox.enabled, matching the chart's sandbox contract used by every other sandbox artifact)
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: false
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          value: "op=='COMMIT_CHANGE_AGAINST_REFERENCE' && ref=='main' && (role=='service-account-svc-trino-nessie' || role=='service-account-svc-spark-nessie' || role=='service-account-svc-connect-nessie')"
        documentIndex: 1
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          pattern: 'sandbox'
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SANDBOX_WRITE
        documentIndex: 1

  - it: auth.oidc.enabled=true with NO sandbox departments still covers trino/spark/connect (commit-to-main + per-key) with zeppelin absent
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          value: "op=='COMMIT_CHANGE_AGAINST_REFERENCE' && ref=='main' && (role=='service-account-svc-trino-nessie' || role=='service-account-svc-spark-nessie' || role=='service-account-svc-connect-nessie')"
        documentIndex: 1
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          pattern: 'zeppelin'
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_ZEPPELIN_WRITE
        documentIndex: 1

  - it: auth.oidc.enabled=false renders NO authorization env at all (byte-identity control — authz is entirely absent, not just disabled)
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_ENABLED
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_READ_ALL
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_TRINO_WRITE
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SPARK_WRITE
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_CONNECT_WRITE
        documentIndex: 1

  - it: auth on + keycloak on renders all 4 svc-*-nessie clients with the right fields + secrets + NO aud mapper
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      auth.oidc.enabled: true
      nessie.machineAuth.trinoClientSecret: "dev-trino-nessie"
      nessie.machineAuth.sparkClientSecret: "dev-spark-nessie"
      nessie.machineAuth.connectClientSecret: "dev-connect-nessie"
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-trino-nessie
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: "dev-trino-nessie"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-spark-nessie
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: "dev-spark-nessie"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-connect-nessie
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: "dev-connect-nessie"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-zeppelin-nessie
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: "dev-zeppelin-nessie"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: auth.oidc.enabled=false (dev/smoke path) renders NONE of the 4 svc-*-nessie clients
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      auth.oidc.enabled: false
      nessie.machineAuth.trinoClientSecret: "dev-trino-nessie"
      nessie.machineAuth.sparkClientSecret: "dev-spark-nessie"
      nessie.machineAuth.connectClientSecret: "dev-connect-nessie"
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-trino-nessie
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-spark-nessie
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-connect-nessie
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-zeppelin-nessie
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: default (nessie.machineAuth.* unset) still renders the 4 svc-*-nessie clients with empty-string secrets (dev-convenience default)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-trino-nessie
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: ""
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  # --- Task 6: shared c1 Zeppelin's Spark interpreter authenticates to
  # Nessie as the READ-ONLY svc-zeppelin-nessie identity, reusing the c2
  # sandbox sed->tmpfs mechanism (chart/templates/_zeppelin.tpl) — plus the
  # nessie-machine-auth-credentials Secret (chart/templates/22-nessie-
  # machine-auth.yaml) that all 4 machine-auth identities key into. ---------

  - it: nessie-machine-auth-credentials Secret renders with all 4 keys when auth on + at least one machineAuth.* secret supplied (dev-convenience)
    templates:
      - 22-nessie-machine-auth.yaml
    documentSelector:
      # Task 5 fix: this file now ALSO renders `spark-nessie-oauth-defaults`
      # (a ConfigMap, unconditional whenever auth is on) alongside this
      # Secret — narrow to the Secret document explicitly, since helm-
      # unittest runs unselected assertions against EVERY matched document.
      path: kind
      value: Secret
    set:
      auth.oidc.enabled: true
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - equal:
          path: metadata.name
          value: nessie-machine-auth-credentials
      - equal:
          path: stringData.zeppelin
          value: "dev-zeppelin-nessie"
      - equal:
          path: stringData.trino
          value: ""
      - equal:
          path: stringData.spark
          value: ""
      - equal:
          path: stringData.connect
          value: ""

  - it: nessie-machine-auth-credentials Secret does NOT render when auth on but no machineAuth.* secret is set (out-of-band contract) — spark-nessie-oauth-defaults ConfigMap (Task 5, no secret material, gated ONLY on auth.oidc.enabled) still renders as the file's one document
    templates:
      - 22-nessie-machine-auth.yaml
    set:
      auth.oidc.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: ConfigMap
      - equal:
          path: metadata.name
          value: spark-nessie-oauth-defaults

  - it: nessie-machine-auth-credentials Secret does NOT render when auth.oidc.enabled is false, even with a machineAuth.* secret set
    templates:
      - 22-nessie-machine-auth.yaml
    set:
      auth.oidc.enabled: false
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - hasDocuments:
          count: 0

  - it: shared zeppelin spark-defaults ConfigMap gains the svc-zeppelin-nessie OAuth2 block on lakehouse+rawlake (literal placeholders, NO write catalog) when auth on
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-spark-defaults
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-id=svc-zeppelin-nessie'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-id=svc-zeppelin-nessie'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      # read-only identity: no write catalog when sandbox.enabled is false
      # (default here) — the unified sandbox write catalog (chart/
      # templates/_zeppelin.tpl `$sandboxWrite` gate, Task 5) must NEVER
      # appear on the shared instance unless sandbox.enabled is set.
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox'
      # the resolved secret literal (dev-convenience value supplied via
      # values) must NEVER appear in this ConfigMap — only the `${OAUTH_
      # CLIENT_SECRET}` placeholder above, resolved later by the sed
      # initContainer into a tmpfs, never a ConfigMap.
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'client-secret=dev-zeppelin-nessie'

  - it: shared zeppelin spark-defaults ConfigMap has NO OAuth2/Nessie-machine-auth block when auth.oidc.enabled is false (byte-identity control)
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-spark-defaults
    set:
      components.zeppelin: true
      auth.oidc.enabled: false
    asserts:
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'OAUTH2'
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'svc-zeppelin-nessie'

  - it: shared zeppelin Deployment gains the sed->tmpfs spark-conf-render initContainer with OAUTH_CLIENT_SECRET via secretKeyRef nessie-machine-auth-credentials/zeppelin, SPARK_CONF_DIR pointed at the rendered dir, when auth on
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      nessie.machineAuth.zeppelinClientSecret: "dev-zeppelin-nessie"
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: spark-conf-render
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'sed '
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: nessie-machine-auth-credentials
                key: zeppelin
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spark-conf-rendered
            emptyDir: {medium: Memory}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPARK_CONF_DIR
            value: /spark-conf-rendered
      # the shared instance passes no `saName` — this stays unaffected by
      # the Nessie machine-auth wiring (sandbox-only field).
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: shared zeppelin Deployment has NO spark-conf-render initContainer / spark-conf-rendered volume / rewired SPARK_CONF_DIR when auth.oidc.enabled is false (byte-identity control)
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      components.zeppelin: true
      auth.oidc.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPARK_CONF_DIR
            value: /spark-conf
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: spark-conf-rendered

  # --- Task 4: Trino >= 465 upgrade + Nessie OAuth2 client-credentials
  # (svc-trino-nessie) -------------------------------------------------------
  # Trino 439's iceberg REST-catalog OAuth2 has no auto-refreshing
  # client-credentials mode (the enabling property
  # `iceberg.rest-catalog.oauth2.server-uri` is Trino 465+ only — see
  # docs/superpowers/spikes/2026-08-06-nessie-machine-auth-config.md §1 and
  # versions.trinoImage's comment in values.yaml). Both catalogs
  # (lakehouse/rawlake) share the SAME `svc-trino-nessie` identity + secret;
  # both the coordinator AND worker Deployments need OIDC_ISSUER (server-uri)
  # + NESSIE_OAUTH_SECRET (credential) since both mount the catalog
  # properties files and talk to Nessie directly.

  - it: versions.trinoImage is pinned to a Trino >= 465 tag (the Nessie OAuth2 client-credentials auto-refresh floor)
    templates:
      - 06-trino-ha.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: trinodb/trino:476
        documentSelector:
          path: '$[?(@.kind=="Deployment" && @.metadata.name=="trino-coordinator")]'
      - equal:
          path: spec.template.spec.containers[0].image
          value: trinodb/trino:476
        documentSelector:
          path: '$[?(@.kind=="Deployment" && @.metadata.name=="trino-worker")]'

  - it: auth on renders the Nessie OAuth2 client-credentials block on BOTH lakehouse + rawlake catalogs, secret never a literal
    templates:
      - 06-trino-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
    asserts:
      - matchRegex:
          path: data["lakehouse.properties"]
          pattern: 'iceberg\.rest-catalog\.security=OAUTH2'
        documentSelector: {path: metadata.name, value: trino-config}
      - matchRegex:
          path: data["lakehouse.properties"]
          pattern: 'iceberg\.rest-catalog\.oauth2\.credential=svc-trino-nessie:\$\{ENV:NESSIE_OAUTH_SECRET\}'
        documentSelector: {path: metadata.name, value: trino-config}
      - matchRegex:
          path: data["lakehouse.properties"]
          pattern: 'iceberg\.rest-catalog\.oauth2\.server-uri=\$\{ENV:OIDC_ISSUER\}/protocol/openid-connect/token'
        documentSelector: {path: metadata.name, value: trino-config}
      - matchRegex:
          path: data["rawlake.properties"]
          pattern: 'iceberg\.rest-catalog\.security=OAUTH2'
        documentSelector: {path: metadata.name, value: trino-config}
      - matchRegex:
          path: data["rawlake.properties"]
          pattern: 'iceberg\.rest-catalog\.oauth2\.credential=svc-trino-nessie:\$\{ENV:NESSIE_OAUTH_SECRET\}'
        documentSelector: {path: metadata.name, value: trino-config}
      - matchRegex:
          path: data["rawlake.properties"]
          pattern: 'iceberg\.rest-catalog\.oauth2\.server-uri=\$\{ENV:OIDC_ISSUER\}/protocol/openid-connect/token'
        documentSelector: {path: metadata.name, value: trino-config}
      # The exact-match regexes above already prove the credential line's
      # value is the literal string `${ENV:NESSIE_OAUTH_SECRET}` and nothing
