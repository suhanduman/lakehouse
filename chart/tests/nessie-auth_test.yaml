            name: spark-nessie-oauth-template
            configMap: {name: spark-nessie-oauth-defaults}
      - contains:
          path: spec.template.volumes
          content:
            name: spark-conf-rendered
            emptyDir: {medium: Memory}
      - equal:
          path: spec.template.driver.initContainers[0].name
          value: spark-conf-render
      - matchRegex:
          path: spec.template.driver.initContainers[0].args[0]
          pattern: 'sed '
      - notMatchRegex:
          path: spec.template.driver.initContainers[0].args[0]
          pattern: 'set -x'
      - contains:
          path: spec.template.driver.initContainers[0].env
          content:
            name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: nessie-machine-auth-credentials
                key: spark
      - contains:
          path: spec.template.driver.initContainers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              secretKeyRef:
                name: oidc-credentials
                key: issuer-url
      - contains:
          path: spec.template.driver.env
          content:
            name: SPARK_CONF_DIR
            value: /spark-conf-rendered
      - contains:
          path: spec.template.driver.volumeMounts
          content:
            name: spark-conf-rendered
            mountPath: /spark-conf-rendered
      - notExists:
