# chart/tests/superset-alerts_test.yaml — proves the Alerts & Reports slice
# (Redis + Celery worker/beat + SMTP) renders only when superset.alertsReports.enabled,
# is byte-identical-off, and fails loud without an SMTP host. Negative asserts use
# `any: true` (avoids the vacuous exact-DeepEqual false-green trap).
suite: superset alerts & reports
templates:
  - 19-superset.yaml
tests:
  - it: config has ALERT_REPORTS False when alertsReports disabled
    set:
      components.superset: true
      superset.alertsReports.enabled: false
    asserts:
      - matchRegex:
          path: data["superset_config.py"]
          pattern: '"ALERT_REPORTS": False'
        documentSelector:
          path: metadata.name
          value: superset-config
      - notMatchRegex:
          path: data["superset_config.py"]
          pattern: "class CeleryConfig"
        documentSelector:
          path: metadata.name
          value: superset-config

  - it: config enables ALERT_REPORTS + CeleryConfig + SMTP when on
    set:
      components.superset: true
      superset.alertsReports.enabled: true
      superset.smtp.host: "smtp.example.org"
    asserts:
      - matchRegex:
          path: data["superset_config.py"]
          pattern: '"ALERT_REPORTS": True'
        documentSelector:
          path: metadata.name
          value: superset-config
      - matchRegex:
          path: data["superset_config.py"]
          pattern: "class CeleryConfig"
        documentSelector:
          path: metadata.name
          value: superset-config
      - matchRegex:
          path: data["superset_config.py"]
          pattern: 'SMTP_HOST = os.environ\["SMTP_HOST"\]'
        documentSelector:
          path: metadata.name
          value: superset-config
      - matchRegex:
          path: data["superset_config.py"]
          pattern: "_urlparse\\.quote\\(os\\.environ\\.get\\(\"REDIS_PASSWORD\""
        documentSelector:
          path: metadata.name
          value: superset-config

  - it: fails loud when alertsReports on but no SMTP host
    set:
      components.superset: true
      superset.alertsReports.enabled: true
      superset.smtp.host: ""
    asserts:
      - failedTemplate:
          errorMessage: "superset.alertsReports.enabled requires superset.smtp.host (customer SMTP server) — set it or disable alertsReports"

  - it: renders no redis/secrets when alertsReports off
    set:
      components.superset: true
      superset.alertsReports.enabled: false
    asserts:
      # (superset-redis Deployment/Service ve superset-redis-auth/superset-smtp Secret
      # hiç render olmaz.) `containsDocument` + `not: true` used instead of
      # `notContains`/`metadata.name`: `notContains` requires the target path to be
      # an ARRAY field (it errors "expect to be an array" on a scalar like
      # metadata.name — verified against this repo's installed helm-unittest
      # (v1.1.1) validator source), and `containsDocument` tolerates a genuine
      # zero-match render (same convention as console_test.yaml's absence checks).
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: superset-redis
        not: true
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: superset-redis
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: superset-redis-auth
        not: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: superset-smtp
        not: true

  - it: renders redis Deployment+Service with requirepass + pinned image when on
    set:
      components.superset: true
      superset.alertsReports.enabled: true
      superset.smtp.host: "smtp.example.org"
      superset.redis.password: "devredis"
      superset.smtp.password: "devsmtp"
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: superset-redis
          any: true
      - containsDocument:
          kind: Service
          apiVersion: v1
          name: superset-redis
          any: true
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: superset-redis-auth
          any: true
      # documentSelector on metadata.name=superset-redis is ambiguous (the
      # Deployment AND the Service are both named `superset-redis` ->
      # "multiple indexes found"); metadata.labels.app is unique to the
      # Deployment (Service/Secret docs carry no top-level metadata.labels).
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "redis:7.4-alpine"
        documentSelector:
          path: metadata.labels.app
          value: superset-redis
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--requirepass"
          any: true
        documentSelector:
          path: metadata.labels.app
          value: superset-redis
