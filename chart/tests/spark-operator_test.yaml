# chart/tests/spark-operator_test.yaml — helm-unittest suite for
# chart/templates/05-spark-operator.yaml. Covers the `silver-merge`
# ScheduledSparkApplication (Bronze -> Silver incremental CDC MERGE, dynamic
# allocation) added alongside the existing `iceberg-maintenance` job. See
# docs/superpowers/specs/2026-07-21-medallion-cdc-merge-design.md.
suite: spark-operator — silver-merge ScheduledSparkApplication (dynamic-alloc CDC MERGE)
templates:
  - 05-spark-operator.yaml
tests:
  - it: renders the silver-merge ScheduledSparkApplication with dynamic allocation
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: silver-merge
    asserts:
      - equal:
          path: spec.template.mainApplicationFile
          value: "local:///opt/spark/jobs/merge_cdc.py"
      - equal:
          path: spec.template.dynamicAllocation.enabled
          value: true

  - it: silver-merge sparkConf enables bucketed-MERGE target pruning (SPJ runtime counterpart of merge_cdc's SPJ_CONF)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: silver-merge
    asserts:
      - equal:
          path: 'spec.template.sparkConf["spark.sql.sources.v2.bucketing.enabled"]'
          value: "true"
      - equal:
          path: 'spec.template.sparkConf["spark.sql.iceberg.planning.preserve-data-grouping"]'
          value: "true"

  - it: iceberg-maintenance sparkConf does NOT carry the silver-merge bucketed-MERGE pruning flags (SPJ is silver-merge-only)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    asserts:
      - notExists:
          path: 'spec.template.sparkConf["spark.sql.sources.v2.bucketing.enabled"]'
      - notExists:
          path: 'spec.template.sparkConf["spark.sql.iceberg.planning.preserve-data-grouping"]'

  - it: silver-merge dynamic allocation is scaled by values (min 0, max from silverMerge.maxExecutors)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: silver-merge
    asserts:
      - equal:
          path: spec.template.dynamicAllocation.minExecutors
          value: 0
      - equal:
          path: spec.template.dynamicAllocation.maxExecutors
          value: 4
      - equal:
          path: 'spec.template.sparkConf["spark.dynamicAllocation.maxExecutors"]'
          value: "4"

  - it: silver-merge uses the shared spark-driver ServiceAccount, coreLimit, and mapped AWS creds env (no envFrom)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: silver-merge
    asserts:
      - equal:
          path: spec.template.driver.serviceAccount
          value: spark-driver
      - isNotEmpty:
          path: spec.template.driver.coreLimit
      - notExists:
          path: spec.template.driver.envFrom
      - contains:
          path: spec.template.driver.env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access-key-id

  - it: no spark-defaults ConfigMap renders from this template (spark-operator v2.x owns /opt/spark/conf; F1)
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: spark-defaults
        not: true

  - it: iceberg-maintenance carries the base sparkConf (rawlake catalog warehouse == "rawdata")
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    asserts:
      - equal:
          path: 'spec.template.sparkConf["spark.sql.catalog.rawlake.warehouse"]'
          value: "rawdata"

  - it: silver-merge is gated off by sparkOperator.silverMerge.enabled=false
    set:
      sparkOperator:
        silverMerge:
          enabled: false
    asserts:
      - containsDocument:
          kind: ScheduledSparkApplication
          apiVersion: sparkoperator.k8s.io/v1beta2
          name: silver-merge
        not: true

  - it: iceberg-maintenance still renders alongside silver-merge (SA, Role, RoleBinding + 2 ScheduledSparkApplications, no ConfigMap)
    asserts:
      - hasDocuments:
          count: 5
      - containsDocument:
          kind: ScheduledSparkApplication
          apiVersion: sparkoperator.k8s.io/v1beta2
          name: iceberg-maintenance
          any: true
      - containsDocument:
          kind: ScheduledSparkApplication
          apiVersion: sparkoperator.k8s.io/v1beta2
          name: silver-merge
          any: true

  - it: iceberg-maintenance passes BRONZE_RETENTION_DAYS (Bronze TTL, Task 5) to driver and executor
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    asserts:
      - equal:
          path: spec.template.driver.env[0]
          value:
            name: BRONZE_RETENTION_DAYS
            value: "30"
      - equal:
          path: spec.template.executor.env[0]
          value:
            name: BRONZE_RETENTION_DAYS
            value: "30"

  - it: iceberg-maintenance BRONZE_RETENTION_DAYS is scaled by values (sparkOperator.maintenance.bronzeRetentionDays)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    set:
      sparkOperator:
        maintenance:
          bronzeRetentionDays: 7
    asserts:
      - equal:
          path: spec.template.driver.env[0].value
          value: "7"
      - equal:
          path: spec.template.executor.env[0].value
          value: "7"

  - it: iceberg-maintenance driver gets MAINTENANCE_MAX_PARALLEL (default 4, jobs/iceberg_maintenance.py ThreadPoolExecutor)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    asserts:
      - equal:
          path: spec.template.driver.env[1]
          value:
            name: MAINTENANCE_MAX_PARALLEL
            value: "4"

  - it: iceberg-maintenance MAINTENANCE_MAX_PARALLEL is scaled by values (spark.maintenanceMaxParallel)
    template: templates/05-spark-operator.yaml
    documentSelector:
      path: metadata.name
      value: iceberg-maintenance
    set:
      spark:
        maintenanceMaxParallel: 8
    asserts:
      - equal:
          path: spec.template.driver.env[1].value
          value: "8"
