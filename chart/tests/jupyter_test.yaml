  # --- Task 6 (review-routed from Task 5): coherence guard —
  # components.jupyter requires auth.oidc.enabled. The pre-existing `jupyter`
  # Route/Ingress (chart/templates/08-routes-tls.yaml / 08b-ingress-tls.yaml)
  # gate ONLY on `components.jupyter`, but the `jupyterhub-proxy` Service they
  # target (this file) gates on `components.jupyter` AND `auth.oidc.enabled`
  # — without this guard, `components.jupyter=true` + `auth.oidc.enabled=
  # false` would render the Route/Ingress with no backing Service at all (a
  # dangling Route, `helm-check.py --service-closure` FAILs). JupyterHub
  # genuinely cannot work without OIDC (GenericOAuthenticator has no
  # unauthenticated fallback), so this is a hard render-time error rather
  # than a silent no-op. Same three-case shape as the sandbox+auth.oidc.
  # enabled guard (chart/tests/sandbox_test.yaml, "Task 7" section).

  - it: "Task 6: components.jupyter=true + auth.oidc.enabled=false FAILS the render loudly (coherence guard), with no other values set"
