# chart/tests/jupyter_test.yaml — helm-unittest suite for the hand-rolled
# JupyterHub plan's Task 3: `.Values.jupyter.*` values + the two dev-
# convenience Secrets (chart/templates/23-jupyterhub.yaml) + single-sourcing
# the existing Keycloak `jupyter` client's `secret` (chart/templates/
# 10-keycloak.yaml) from `.Values.jupyter.oidcClientSecret`.
#
# Gated `and .Values.components.jupyter .Values.auth.oidc.enabled` (the two
# Secrets) — the Keycloak `jupyter` client itself is NOT jupyter-gated (it
# already existed pre-task, gated only on `components.keycloak`), so it still
# renders regardless of `components.jupyter`; only its `secret` field value
# is under test here.
suite: jupyter values + oidc/proxy-token Secrets + Keycloak jupyter client-secret single-source
templates:
  - 23-jupyterhub.yaml
  - 10-keycloak.yaml
tests:
  - it: components.jupyter=true + auth.oidc.enabled=true + both values supplied renders both Secrets with the right keys/values
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: jupyter-oidc-credentials
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - equal:
          path: stringData.client-secret
          value: "dev-jupyter-oidc"
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - equal:
          path: metadata.name
          value: jupyter-proxy-token
        documentSelector:
          path: metadata.name
          value: jupyter-proxy-token
      - equal:
          path: stringData.proxy-token
          value: "dev-proxy-token"
        documentSelector:
          path: metadata.name
          value: jupyter-proxy-token

  - it: components.jupyter=true + auth.oidc.enabled=true with only oidcClientSecret supplied renders ONLY jupyter-oidc-credentials (proxy Secret stays out-of-band)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: jupyter-oidc-credentials

  - it: components.jupyter=true + auth.oidc.enabled=true with neither value supplied renders NO Secrets (fully out-of-band, dev-convenience default)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: components.jupyter=false renders NO Secrets even when both values are supplied (jupyter-gated)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: false
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 0

  - it: auth.oidc.enabled=false renders NO Secrets even when components.jupyter=true and both values are supplied (auth-gated)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 0

  - it: components.jupyter=false AND auth.oidc.enabled=false renders NO Secrets (both gates off)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: false
      auth.oidc.enabled: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 0

  - it: jupyter.oidcClientSecret single-sources the Keycloak jupyter client's secret (Keycloak client renders regardless of components.jupyter — it is not jupyter-gated)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      components.jupyter: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: "dev-jupyter-oidc"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: default (jupyter.oidcClientSecret unset) still renders the jupyter Keycloak client with an empty-string secret (dev-convenience default, byte-identical to pre-task shape except the added field)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: ""
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: leak check — SENTINEL jupyter.oidcClientSecret appears ONLY in the realm jupyter client's secret + the jupyter-oidc-credentials Secret, nowhere else
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      jupyter.oidcClientSecret: "LEAKJ-SENTINEL"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: "LEAKJ-SENTINEL"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: leak check — SENTINEL jupyter.oidcClientSecret appears in the jupyter-oidc-credentials Secret's client-secret key
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "LEAKJ-SENTINEL"
    asserts:
      - equal:
          path: stringData.client-secret
          value: "LEAKJ-SENTINEL"
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - notEqual:
          path: metadata.name
          value: jupyter-proxy-token
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
