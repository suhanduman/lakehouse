# chart/tests/jupyter_test.yaml — helm-unittest suite for the hand-rolled
# JupyterHub plan's Task 3: `.Values.jupyter.*` values + the two dev-
# convenience Secrets (chart/templates/23-jupyterhub.yaml) + single-sourcing
# the existing Keycloak `jupyter` client's `secret` (chart/templates/
# 10-keycloak.yaml) from `.Values.jupyter.oidcClientSecret`.
#
# Gated `and .Values.components.jupyter .Values.auth.oidc.enabled` (the two
# Secrets) — the Keycloak `jupyter` client itself is NOT jupyter-gated (it
# already existed pre-task, gated only on `components.keycloak`), so it still
# renders regardless of `components.jupyter`; only its `secret` field value
# is under test here.
#
# Task 4 additions (below): the `jupyterhub-config` ConfigMap
# (`jupyterhub_config.py` — GenericOAuthenticator + KubeSpawner +
# pre_spawn_hook/modify_pod_hook) + the Keycloak `jupyter` client's `groups`
# protocol mapper.
#
# Sandbox v2 (2026-08-07-sandbox-v2 Task 4, later revision of this suite):
# the JupyterHub sandbox injection was MIGRATED from the per-dept
# `sandbox.departments[]`/`DEPTS` design to the UNIFIED sandbox — a single
# `svc-sandbox` identity + `sandbox` Nessie namespace/Trino catalog for
# every allowed user, isolated only by a per-user
# `sandbox.<spawner.user.name>` schema convention. The login gate now reads
# `.Values.sandbox.allowedGroups` (a flat list of AD group full DNs)
# instead of `sandbox.departments[].adGroup`. `sandbox.departments[]` still
# exists in values.yaml and still renders its own (now-legacy,
# JupyterHub-unrelated) per-dept Keycloak client/Nessie CEL/Zeppelin
# instance/executor-RBAC elsewhere in this chart — a few tests below still
# set it purely to exercise THIS file's still-present legacy per-dept
# Spark-executor RBAC block (kept additive for the shared Zeppelin path
# until Task 5 of that slice retires it); it no longer affects the
# jupyterhub-config ConfigMap's own content at all.
suite: jupyter values + oidc/proxy-token Secrets + Keycloak jupyter client-secret single-source
templates:
  - 23-jupyterhub.yaml
  - 10-keycloak.yaml
tests:
  - it: components.jupyter=true + auth.oidc.enabled=true + both values supplied renders both Secrets with the right keys/values
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      # 2 Secrets + the jupyterhub-config ConfigMap (Task 4) + Task 5's
      # always-on-under-this-gate resources (no sandbox dept configured in
      # this test, so no per-dept executor Role/RoleBinding): the
      # `jupyterhub` SA, the KubeSpawner Role + RoleBinding, 3 Services
      # (jupyterhub-proxy/-api, jupyterhub-hub), 2 Deployments (Hub + proxy)
      # + sandbox v2 (Task 4 of 2026-08-07-sandbox-v2): the unified
      # `sa-sandbox` SA + `sandbox-spark-executor` Role + RoleBinding (no
      # `sandbox.oidc.clientSecret` set in this test, so no
      # `sandbox-oidc-credentials` Secret)
      # = 3 + 1 + 1+1+1 + 3 + 2 + 3 = 14.
      - hasDocuments:
          count: 14
      - equal:
          path: metadata.name
          value: jupyter-oidc-credentials
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - equal:
          path: stringData.client-secret
          value: "dev-jupyter-oidc"
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - equal:
          path: metadata.name
          value: jupyter-proxy-token
        documentSelector:
          path: metadata.name
          value: jupyter-proxy-token
      - equal:
          path: stringData.proxy-token
          value: "dev-proxy-token"
        documentSelector:
          path: metadata.name
          value: jupyter-proxy-token

  - it: components.jupyter=true + auth.oidc.enabled=true with only oidcClientSecret supplied renders ONLY jupyter-oidc-credentials (proxy Secret stays out-of-band)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
    asserts:
      # the Secret + the jupyterhub-config ConfigMap (Task 4; proxy Secret
      # still correctly stays out-of-band) + Task 5's 8 always-on resources
      # (SA + Role + RoleBinding + 3 Services + 2 Deployments, see the
      # previous test's comment) + sandbox v2's 3 always-on unified
      # sa-sandbox SA/Role/RoleBinding = 2 + 8 + 3 = 13.
      - hasDocuments:
          count: 13
      - equal:
          path: metadata.name
          value: jupyter-oidc-credentials
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - notEqual:
          path: metadata.name
          value: jupyter-proxy-token
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials

  - it: components.jupyter=true + auth.oidc.enabled=true with neither Secret value supplied renders NO Secrets, but the jupyterhub-config ConfigMap still renders (unconditional under the same gate; Secrets are fully out-of-band, dev-convenience default)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
    asserts:
      # the jupyterhub-config ConfigMap (Task 4) + Task 5's 8 always-on
      # resources (see the first test's comment) + sandbox v2's 3 always-on
      # unified sa-sandbox SA/Role/RoleBinding = 1 + 8 + 3 = 12.
      - hasDocuments:
          count: 12
      - equal:
          path: metadata.name
          value: jupyterhub-config
        documentSelector:
          path: kind
          value: ConfigMap

  - it: components.jupyter=false renders NO Secrets even when both values are supplied (jupyter-gated)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: false
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 0

  - it: components.jupyter=true + auth.oidc.enabled=false FAILS the render loudly (Task 6 coherence guard) instead of silently rendering no Secrets
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - failedTemplate:
          errorMessage: "components.jupyter requires auth.oidc.enabled — JupyterHub authenticates users via Keycloak OIDC (GenericOAuthenticator)"

  - it: components.jupyter=false AND auth.oidc.enabled=false renders NO Secrets (both gates off)
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: false
      auth.oidc.enabled: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
      jupyter.proxyToken: "dev-proxy-token"
    asserts:
      - hasDocuments:
          count: 0

  - it: jupyter.oidcClientSecret single-sources the Keycloak jupyter client's secret (Keycloak client renders regardless of components.jupyter — it is not jupyter-gated)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      components.jupyter: false
      jupyter.oidcClientSecret: "dev-jupyter-oidc"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: "dev-jupyter-oidc"
            protocolMappers:
            - name: groups
              protocol: "openid-connect"
              protocolMapper: "oidc-group-membership-mapper"
              config:
                "claim.name": "groups"
                "full.path": "false"
                "id.token.claim": "true"
                "access.token.claim": "true"
                "userinfo.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: default (jupyter.oidcClientSecret unset) still renders the jupyter Keycloak client with an empty-string secret (dev-convenience default, byte-identical to pre-task shape except the added field)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: ""
            protocolMappers:
            - name: groups
              protocol: "openid-connect"
              protocolMapper: "oidc-group-membership-mapper"
              config:
                "claim.name": "groups"
                "full.path": "false"
                "id.token.claim": "true"
                "access.token.claim": "true"
                "userinfo.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: leak check — SENTINEL jupyter.oidcClientSecret appears ONLY in the realm jupyter client's secret + the jupyter-oidc-credentials Secret, nowhere else
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      jupyter.oidcClientSecret: "LEAKJ-SENTINEL"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: jupyter
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: true
            redirectUris: ["https://jupyter.apps.example.com/hub/oauth_callback"]
            webOrigins: ["https://jupyter.apps.example.com"]
            secret: "LEAKJ-SENTINEL"
            protocolMappers:
            - name: groups
              protocol: "openid-connect"
              protocolMapper: "oidc-group-membership-mapper"
              config:
                "claim.name": "groups"
                "full.path": "false"
                "id.token.claim": "true"
                "access.token.claim": "true"
                "userinfo.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: leak check — SENTINEL jupyter.oidcClientSecret appears in the jupyter-oidc-credentials Secret's client-secret key
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      jupyter.oidcClientSecret: "LEAKJ-SENTINEL"
    asserts:
      - equal:
          path: stringData.client-secret
          value: "LEAKJ-SENTINEL"
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials
      - notEqual:
          path: metadata.name
          value: jupyter-proxy-token
        documentSelector:
          path: metadata.name
          value: jupyter-oidc-credentials

  # --- Sandbox v2 (2026-08-07-sandbox-v2 Task 4): unified sandbox-oidc-credentials Secret ---

  - it: "sandbox v2: sandbox-oidc-credentials Secret renders with the client-secret key when sandbox.oidc.clientSecret set (single-sourced with the Keycloak svc-sandbox client)"
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      sandbox.oidc.clientSecret: "dev-svc-sandbox"
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: sandbox-oidc-credentials
          any: true
      - equal:
          path: stringData.client-secret
          value: "dev-svc-sandbox"
        documentSelector:
          path: metadata.name
          value: sandbox-oidc-credentials

  - it: "sandbox v2: sandbox-oidc-credentials Secret NOT rendered when sandbox.oidc.clientSecret is empty (dev-convenience-else-out-of-band, same contract as the other Secrets in this file)"
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      sandbox.oidc.clientSecret: ""
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: sandbox-oidc-credentials
          any: true
        not: true

  - it: "sandbox v2: leak check — SENTINEL sandbox.oidc.clientSecret appears ONLY in the sandbox-oidc-credentials Secret's client-secret key, never in the jupyterhub-config ConfigMap"
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      sandbox.oidc.clientSecret: "LEAKSVCSANDBOX-SENTINEL"
    asserts:
      - equal:
          path: stringData.client-secret
          value: "LEAKSVCSANDBOX-SENTINEL"
        documentSelector:
          path: metadata.name
          value: sandbox-oidc-credentials
      - notMatchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'LEAKSVCSANDBOX-SENTINEL'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config

  # --- Task 4: jupyterhub-config ConfigMap ---
  #
  # Sandbox v2 (2026-08-07-sandbox-v2 Task 4): the per-dept DEPTS-based
  # injection was MIGRATED to the unified sandbox — every allowed_groups
  # member now gets the SAME `svc-sandbox` identity + SAME `sandbox` Nessie
  # namespace/Trino catalog, isolated only by a per-user
  # `sandbox.<spawner.user.name>` Trino/Spark/PyIceberg SCHEMA convention
  # (`NESSIE_SANDBOX_SCHEMA`). `.Values.sandbox.allowedGroups` (a list of AD
  # group full DNs, same "CN=...,OU=...,DC=..." shape the old per-dept
  # `adGroup` used to carry) now drives the login gate instead of
  # `sandbox.departments[].adGroup`.

  - it: components.jupyter=true + auth.oidc.enabled=true + an allowedGroup renders jupyterhub-config with the authenticator, unified login gate, KubeSpawner, and pre_spawn_hook/modify_pod_hook — and NO secret literal
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
      sandbox.allowedGroups:
        - "CN=lakehouse-analysts,OU=Groups,DC=example,DC=com"
    asserts:
      # any: true -- Task 5 now renders many more documents under this same
      # gate; see the "no sandbox departments configured" test's comment.
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: jupyterhub-config
          any: true
      - equal:
          path: metadata.namespace
          value: NAMESPACE
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # authenticator
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.JupyterHub\.authenticator_class = "generic-oauth"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.GenericOAuthenticator\.client_id = "jupyter"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.GenericOAuthenticator\.oauth_callback_url = "https://jupyter\.apps\.example\.com/hub/oauth_callback"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.GenericOAuthenticator\.manage_groups = True'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.GenericOAuthenticator\.claim_groups_key = "groups"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # secrets ONLY via os.environ[...] — never a literal
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'os\.environ\["OAUTH_CLIENT_SECRET"\]'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.ConfigurableHTTPProxy\.auth_token = os\.environ\["CONFIGPROXY_AUTH_TOKEN"\]'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # NOT enable_auth_state=True (spike: crashes without JUPYTERHUB_CRYPT_KEY, not needed)
      - notMatchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'enable_auth_state\s*=\s*True'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # login gate: allow_all=False + allowed_groups includes the CN of the
      # configured sandbox.allowedGroups entry ("lakehouse-analysts", from
      # "CN=lakehouse-analysts,OU=Groups,DC=example,DC=com")
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.Authenticator\.allow_all = False'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.Authenticator\.allowed_groups\.add\("lakehouse-analysts"\)'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # KubeSpawner: single-user image + namespace + per-user PVC
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.KubeSpawner\.image = "image-registry\.openshift-image-registry\.svc:5000/lakehouse/jupyter:1\.0"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.KubeSpawner\.namespace = "NAMESPACE"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.KubeSpawner\.storage_pvc_ensure = True'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.KubeSpawner\.storage_capacity = "5Gi"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # Sandbox v2: NO per-dept DEPTS dict at all anymore -- unified catalog +
      # per-user schema, both derived from .Values.sandbox.namespace/
      # spawner.user.name, and a fixed "sa-sandbox"/"svc-sandbox" identity.
      - notMatchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'DEPTS\[|DEPTS = '
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - notMatchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'svc-sandbox-'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'def pre_spawn_hook\(spawner\):'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spawner\.service_account = "sa-sandbox"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spawner\.environment\["NESSIE_SANDBOX_CATALOG"\] = "sandbox"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spawner\.environment\["NESSIE_SANDBOX_SCHEMA"\] = "%s\.%s" % \("sandbox", spawner\.user\.name\)'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spawner\.environment\["NESSIE_CLIENT_ID"\] = "svc-sandbox"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # Spark-on-k8s executor secretKeyRef conf (spike: driver secretKeyRef is a no-op,
      # executors DO get secrets this way)
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spark\.kubernetes\.executor\.secretKeyRef\.NESSIE_OAUTH_SECRET'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spark\.kubernetes\.executor\.secretKeyRef\.AWS_ACCESS_KEY_ID'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # modify_pod_hook: driver-side secretKeyRef injection via KubeSpawner (not Spark conf)
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'def modify_pod_hook\(spawner, pod\):'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'secret_key_ref=k8s_client\.V1SecretKeySelector'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.Spawner\.pre_spawn_hook = pre_spawn_hook'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.KubeSpawner\.modify_pod_hook = modify_pod_hook'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config

  - it: components.jupyter=false renders NO jupyterhub-config ConfigMap even with a sandbox dept configured
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: false
      auth.oidc.enabled: true
      sandbox.departments:
        - name: veri-bilimi
          adGroup: "CN=sandbox-veri,OU=Groups,DC=example,DC=com"
          s3SecretName: s3-sandbox-veri-bilimi
    asserts:
      - hasDocuments:
          count: 0

  - it: components.jupyter=true + auth.oidc.enabled=false FAILS the render loudly (Task 6 coherence guard) instead of silently rendering no jupyterhub-config ConfigMap
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: false
      sandbox.departments:
        - name: veri-bilimi
          adGroup: "CN=sandbox-veri,OU=Groups,DC=example,DC=com"
          s3SecretName: s3-sandbox-veri-bilimi
    asserts:
      - failedTemplate:
          errorMessage: "components.jupyter requires auth.oidc.enabled — JupyterHub authenticates users via Keycloak OIDC (GenericOAuthenticator)"

  - it: no sandbox.allowedGroups configured still renders jupyterhub-config, with the unified sandbox env always injected but an empty (fail-closed) allowed_groups set — nobody can log in, but nothing crashes
    templates:
      - 23-jupyterhub.yaml
    set:
      components.jupyter: true
      auth.oidc.enabled: true
    asserts:
      # any: true -- this file now renders many documents under the same
      # gate (Task 5's SA/RBAC/Deployments/Services); containsDocument
      # without `any: true` requires EVERY document in scope to match,
      # which only holds for a single-document render (helm-unittest
      # semantics, see chart/tests/dbt-enabled_test.yaml's own `any: true`
      # usage for the same reason).
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: jupyterhub-config
          any: true
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'c\.Authenticator\.allowed_groups = set\(\)'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      # unified sandbox env is unconditional (independent of allowedGroups/
      # sandbox.enabled) -- it is the login gate (above) that fails closed
      # when nobody is allowed to authenticate, not this injection.
      - matchRegex:
          path: data["jupyterhub_config.py"]
          pattern: 'spawner\.environment\["NESSIE_SANDBOX_CATALOG"\] = "sandbox"'
        documentSelector:
          path: metadata.name
          value: jupyterhub-config
      - notMatchRegex:
