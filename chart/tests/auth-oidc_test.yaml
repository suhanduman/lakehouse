# chart/tests/auth-oidc_test.yaml — helm-unittest suite for
# `values.auth.oidc.enabled` gating (feat/oidc-optional; decouples the core
# ingest slice from Keycloak — see .superpowers/sdd/microk8s-smoke-report.md
# Finding 2 + chart/values.yaml's `auth:` comment for the full rationale).
#
# Covers both templates that read the flag:
#   - 06-trino-ha.yaml: Trino's OAuth2 authenticator does EAGER discovery at
#     startup, so with `auth.oidc.enabled=false` the oauth2 config lines and
#     the coordinator's OIDC_* env vars must be OMITTED entirely (not just
#     pointed at a placeholder) — otherwise the coordinator crash-loops the
#     moment no real IdP is reachable (verified live on microk8s).
#   - 04-nessie-ha.yaml: Nessie's OIDC extension does LAZY discovery (stays
#     "Running" either way), so this is a correctness/intent assertion —
#     `QUARKUS_OIDC_ENABLED`/`NESSIE_SERVER_AUTHENTICATION_ENABLED` must
#     both flip to "false" rather than silently staying "true" against a
#     dead issuer.
#
# Default (auth.oidc.enabled=true, unset) behavior is asserted unchanged in
# both suites as the control case, so neither assertion is vacuously true.
suite: auth.oidc.enabled gates OIDC wiring on Trino + Nessie
templates:
  - 06-trino-ha.yaml
  - 04-nessie-ha.yaml
  - 10-keycloak.yaml
tests:
  - it: default (auth.oidc.enabled unset/true) keeps Trino's oauth2 config + OIDC env vars (control case)
    templates:
      - 06-trino-ha.yaml
    asserts:
      - matchRegex:
          path: data["coordinator.config.properties"]
          pattern: "http-server\\.authentication\\.type=oauth2"
        documentSelector:
          path: '$[?(@.kind=="ConfigMap" && @.metadata.name=="trino-config")]'
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              secretKeyRef: {name: oidc-credentials, key: issuer-url}
        documentSelector:
          path: '$[?(@.kind=="Deployment" && @.metadata.name=="trino-coordinator")]'

  - it: auth.oidc.enabled=false removes Trino's oauth2 config entirely (no-auth mode)
    templates:
      - 06-trino-ha.yaml
    set:
      auth.oidc.enabled: false
    asserts:
      - notMatchRegex:
          path: data["coordinator.config.properties"]
          pattern: "http-server\\.authentication\\.type=oauth2"
        documentIndex: 0
      - notMatchRegex:
          path: data["coordinator.config.properties"]
          pattern: "oauth2\\.issuer"
        documentIndex: 0
      - notMatchRegex:
          path: data["coordinator.config.properties"]
          pattern: "oauth2\\.client-id"
        documentIndex: 0
      - notMatchRegex:
          path: data["coordinator.config.properties"]
          pattern: "oauth2\\.client-secret"
        documentIndex: 0
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER
            valueFrom:
              secretKeyRef: {name: oidc-credentials, key: issuer-url}
        documentIndex: 1

  - it: default (auth.oidc.enabled unset/true) keeps Nessie's OIDC env vars enabled (control case)
    templates:
      - 04-nessie-ha.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_ENABLED
            value: "true"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHENTICATION_ENABLED
            value: "true"
        documentIndex: 1

  - it: auth.oidc.enabled=false flips Nessie to unauthenticated (no OIDC wiring)
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_ENABLED
            value: "false"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHENTICATION_ENABLED
            value: "false"
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: QUARKUS_OIDC_AUTH_SERVER_URL
        documentIndex: 1

  # Single-source check for the `superset` Keycloak client's confidential
  # secret (chart/templates/10-keycloak.yaml). Superset's AUTH_OAUTH login
  # can only complete the confidential authorization_code flow if this
  # client's `secret` matches what the superset-oidc-credentials Secret
  # (chart/templates/19-superset.yaml, from Values.superset.oidc.clientSecret)
  # mounts into the Deployment — both sides read the same value, so they can
  # never drift. clients[8] pins to `superset` (9th entry, after `trino`,
  # `svc-superset-trino`, `svc-dbt-trino`, `svc-zeppelin-trino`, and the 4
  # `svc-*-nessie` machine-auth clients (auth.oidc.enabled default true);
  # `components.ai` default false so `ai-ui` is absent) — the clientId equal
  # guards that index assumption so an array-order change fails loudly
  # instead of silently asserting against the wrong client. (Shifted from
  # clients[4] to clients[8] when the 4 `svc-*-nessie` clients were inserted
  # right after `svc-zeppelin-trino`, Nessie machine-auth plan Task 2.)
  - it: superset.oidc.clientSecret single-sources the Keycloak superset client's secret
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      superset.oidc.clientSecret: "dev-oidc-secret"
    asserts:
      - equal:
          path: spec.realm.clients[8].clientId
          value: superset
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[8].secret
          value: "dev-oidc-secret"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  # b1 machine-auth: `svc-superset-trino` service-account client mints
  # client_credentials JWTs carrying `aud: trino` (oidc-audience-mapper) so
  # Trino's `http-server.authentication.jwt.required-audience=trino`
  # (06-trino-ha.yaml, Task 4) accepts them. Single-sources its confidential
  # `secret` with `.Values.superset.trino.oidc.clientSecret` — the same value
  # the `superset-trino-oidc-credentials` Secret (19-superset.yaml, Task 2)
  # mounts, so they can never drift. Inserted right after the `trino` client
  # (clients[0]), so it lands at clients[1] — the clientId equal guards that
  # index assumption so an array-order change fails loudly instead of
  # silently asserting against the wrong client (and shifts `superset` above
  # from clients[1] to clients[2], updated accordingly).
  - it: superset.trino.oidc.clientSecret provisions the svc-superset-trino service-account client with an aud:trino mapper
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      superset.trino.oidc.clientSecret: "dev-svc"
    asserts:
      - equal:
          path: spec.realm.clients[1].clientId
          value: svc-superset-trino
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[1].serviceAccountsEnabled
          value: true
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[1].standardFlowEnabled
          value: false
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[1].secret
          value: "dev-svc"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients[1].protocolMappers
          content:
            name: aud-trino
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            config:
              "included.client.audience": "trino"
              "id.token.claim": "false"
              "access.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  # b2 machine-auth: `svc-dbt-trino` service-account client mints
  # client_credentials JWTs carrying `aud: trino` (oidc-audience-mapper) so
  # Trino's `http-server.authentication.jwt.required-audience=trino`
  # accepts them as the sole writer of lakehouse.gold. Single-sources its
  # confidential `secret` with `.Values.dbt.oidc.clientSecret` — the same
  # value the `dbt-trino-oidc-credentials` Secret (Task 2) mounts, so they
  # can never drift. Inserted right after `svc-superset-trino` (clients[1]),
  # so it lands at clients[2] — the clientId equal guards that index
  # assumption so an array-order change fails loudly instead of silently
  # asserting against the wrong client.
  - it: dbt.oidc.clientSecret provisions the svc-dbt-trino service-account client with an aud:trino mapper
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      dbt.oidc.clientSecret: "dev-dbt"
    asserts:
      - equal:
          path: spec.realm.clients[2].clientId
          value: svc-dbt-trino
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[2].serviceAccountsEnabled
          value: true
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[2].standardFlowEnabled
          value: false
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[2].secret
          value: "dev-dbt"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients[2].protocolMappers
          content:
            name: aud-trino
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            config:
              "included.client.audience": "trino"
              "id.token.claim": "false"
              "access.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  # c1 read-only machine-auth: `svc-zeppelin-trino` service-account client
  # mints client_credentials JWTs carrying `aud: trino` (oidc-audience-mapper)
  # so Trino's `http-server.authentication.jwt.required-audience=trino`
  # accepts them for Zeppelin's %trino interpreter (read-only, no Gold write
  # grant). Single-sources its confidential `secret` with `.Values.zeppelin.
  # trino.oidc.clientSecret` — the same value the zeppelin-trino-oidc-
  # credentials Secret (Task 2) mounts, so they can never drift. Inserted
  # right after `svc-dbt-trino` (clients[2]), so it lands at clients[3] — the
  # clientId equal guards that index assumption so an array-order change
  # fails loudly instead of silently asserting against the wrong client.
  - it: zeppelin.trino.oidc.clientSecret provisions the svc-zeppelin-trino service-account client with an aud:trino mapper
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      zeppelin.trino.oidc.clientSecret: "dev-z"
    asserts:
      - equal:
          path: spec.realm.clients[3].clientId
          value: svc-zeppelin-trino
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[3].serviceAccountsEnabled
          value: true
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[3].standardFlowEnabled
          value: false
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[3].secret
          value: "dev-z"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - contains:
          path: spec.realm.clients[3].protocolMappers
          content:
            name: aud-trino
            protocol: "openid-connect"
            protocolMapper: "oidc-audience-mapper"
            config:
              "included.client.audience": "trino"
              "id.token.claim": "false"
              "access.token.claim": "true"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
