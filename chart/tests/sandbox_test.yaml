# chart/tests/sandbox_test.yaml — helm-unittest suite for per-department
# analyst sandboxes (Consumption slice c2, Task 2): `sandbox.*` values, the
# Keycloak `svc-sandbox-<dept>` service-account clients
# (chart/templates/10-keycloak.yaml), and the per-dept OIDC credentials
# Secret (chart/templates/09c-zeppelin-sandbox.yaml).
#
# Everything here is gated `.Values.sandbox.enabled` AND a non-empty
# `.Values.sandbox.departments` — dev default (both empty/false) renders
# nothing, asserted below as the control case.
#
# IMPORTANT: the sandbox client is asserted by `clientId`-equality (find the
# client whose clientId == `svc-sandbox-veri`), NOT by a positional index —
# unlike the trino/dbt/zeppelin service-account clients in
# auth-oidc_test.yaml, this client only exists when `sandbox.enabled` is
# true, so a "control case" render (sandbox off) has no such client at all to
# pin a stable index against. (clients[4] below shifted to clients[8] when
# the 4 `svc-*-nessie` machine-auth clients were inserted right after
# `svc-zeppelin-trino` — auth.oidc.enabled default true renders them ahead of
# the sandbox block; shifted again to clients[9] when `svc-jupyter-trino`
# was inserted right after `svc-zeppelin-trino`, jupyter-turnkey-notebook
# plan Task 2; the equal-on-clientId assertion at that index guards against
# silently pinning the wrong client if the order shifts again.)
suite: sandbox.* values + Keycloak svc-sandbox-<dept> clients + per-dept OIDC secret
templates:
  - 10-keycloak.yaml
  - 09c-zeppelin-sandbox.yaml
  - 18-bucket-init.yaml
  - 18b-sandbox-minio-policy.yaml
  - 09-zeppelin.yaml
  - 08-routes-tls.yaml
  - 08b-ingress-tls.yaml
tests:
  - it: sandbox.enabled + one department renders the svc-sandbox-veri service-account client with the right fields + secret, and NO aud-trino mapper
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          oidcClientSecret: devz
    asserts:
      - equal:
          path: spec.realm.clients[9].clientId
          value: svc-sandbox-veri
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[9].enabled
          value: true
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[9].serviceAccountsEnabled
          value: true
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[9].standardFlowEnabled
          value: false
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[9].publicClient
          value: false
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - equal:
          path: spec.realm.clients[9].secret
          value: "devz"
        documentSelector:
          path: kind
          value: KeycloakRealmImport
      - notExists:
          path: spec.realm.clients[9].protocolMappers
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: sandbox.enabled=false (default) renders NO svc-sandbox-* client at all
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
    asserts:
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-sandbox-veri
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: sandbox.enabled=true but departments empty (default) renders NO svc-sandbox-* client either (both gates required)
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      sandbox.enabled: true
    asserts:
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-sandbox-veri
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: sandbox.departments[].oidcClientSecret renders the sandbox-veri-oidc-credentials Secret with the client-secret key
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: kind
      value: Secret
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          oidcClientSecret: devz
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
      - equal:
          path: metadata.name
          value: sandbox-veri-oidc-credentials
      - equal:
          path: stringData.client-secret
          value: "devz"

  - it: sandbox-<dept>-oidc-credentials Secret does NOT render when oidcClientSecret is empty, even with sandbox enabled (the sa-sandbox-veri ServiceAccount + the sandbox Zeppelin instance still do)
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          oidcClientSecret: ""
    asserts:
      # The dev-convenience Secret specifically is gated on oidcClientSecret
      # (out-of-band provisioning contract); everything else the sandbox
      # instance renders (SA + the full `lakehouse.zeppelin.instance`: PDB,
      # 3x ConfigMap, PVC, Service, Deployment — 8 documents total) is
      # NOT — those reference the Secret by name regardless of who
      # provisioned it. `skipEmptyTemplates` lets the Secret-kind selector
      # legitimately match zero documents instead of erroring.
      - hasDocuments:
          count: 8
      - hasDocuments:
          count: 0
          filterAware: true
        documentSelector:
          path: kind
          value: Secret
          skipEmptyTemplates: true
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: sa-sandbox-veri
          any: true
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: zeppelin-sandbox-veri
          any: true

  - it: sandbox-<dept>-oidc-credentials Secret does NOT render when sandbox.enabled is false, even if oidcClientSecret is supplied
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          oidcClientSecret: devz
    asserts:
      - hasDocuments:
          count: 0

  - it: no departments (default) renders nothing from 09c-zeppelin-sandbox.yaml at all
    templates:
      - 09c-zeppelin-sandbox.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sandbox.enabled + one department renders the sa-sandbox-veri ServiceAccount
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - containsDocument:
          kind: ServiceAccount
          apiVersion: v1
          name: sa-sandbox-veri
          any: true

  - it: sandbox.enabled=false (default) renders NO sa-sandbox-* ServiceAccount (nothing at all from 09c)
    templates:
      - 09c-zeppelin-sandbox.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: sandbox.enabled + storage.createBuckets -- bucket-init Job's args include sandbox-veri
    templates:
      - 18-bucket-init.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      storage.createBuckets: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "mc mb --ignore-existing s3/sandbox-veri"

  - it: sandbox.enabled=false (default) bucket-init Job's args do NOT include any sandbox-* bucket
    templates:
      - 18-bucket-init.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      storage.createBuckets: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "sandbox-"

  - it: sandbox.enabled + components.minio=true renders the 18b sandbox-veri-minio-policy Job granting RW sandbox-veri + RO depo/ham-veri, with the user secret via secretKeyRef
    templates:
      - 18b-sandbox-minio-policy.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      sandbox.enabled: true
      components.minio: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sandbox-veri-minio-policy
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::sandbox-veri'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::depo'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::ham-veri'
      # Regression-insurance negative assertion: the prod depo/ham-veri
      # statement's Action array (the one immediately followed by a
      # Resource list starting with the depo ARN — i.e. THIS SAME JSON
      # statement, not the sandbox-veri RW statement above, which is
      # followed by the sandbox-veri ARN instead) must never carry
      # s3:PutObject, s3:DeleteObject, or a wildcard "*" action. Today the
      # rendered RO statement is `["s3:GetObject", "s3:ListBucket"]` only —
      # this pins that against a future accidental widening of prod access.
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"Action": \[[^\]]*(?:PutObject|DeleteObject|"\*")[^\]]*\],\s*"Resource": \[\s*"arn:aws:s3:::depo"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin policy create s3 sandbox-veri-policy'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin user add s3 "\$SANDBOX_ACCESS_KEY" "\$SANDBOX_SECRET_KEY"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin policy attach s3 sandbox-veri-policy --user "\$SANDBOX_ACCESS_KEY"'
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: SANDBOX_ACCESS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: s3-sandbox-veri
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: access-key-id
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: SANDBOX_SECRET_KEY
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.name
          value: s3-sandbox-veri
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.key
          value: secret-access-key

  - it: sandbox.enabled but components.minio=false (default) renders NO 18b policy Job
    templates:
      - 18b-sandbox-minio-policy.yaml
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - hasDocuments:
          count: 0

  - it: dev default (sandbox.enabled=false, components.minio=false) renders NO 18b policy Job
    templates:
      - 18b-sandbox-minio-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- Task 4: sandbox Spark interpreter config — sandbox_<dept> catalog +
  # Nessie OAuth2 (all 3 catalogs) + envsubst/sed secret-injection ---------

  - it: sandbox instance spark-defaults ConfigMap — sandbox_veri write catalog (warehouse s3a://sandbox-veri/) + OAuth2 block (literal placeholders) on ALL THREE catalogs, no resolved secret literal
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-sandbox-veri-spark-defaults
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
          oidcClientSecret: devz
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri-spark-defaults
      # sandbox_veri write catalog
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri=org\.apache\.iceberg\.spark\.SparkCatalog'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri\.warehouse=s3a://sandbox-veri/'
      # OAuth2 block on lakehouse (prod read)
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-id=svc-sandbox-veri'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      # OAuth2 block on rawlake (prod read)
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-id=svc-sandbox-veri'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.rawlake\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      # OAuth2 block on sandbox_veri (write)
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri\.authentication\.oauth2\.client-id=svc-sandbox-veri'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri\.authentication\.oauth2\.client-secret=\$\{OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox_veri\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      # the client-secret value supplied via values (`devz`, dev-convenience
      # path) must NEVER appear resolved in this ConfigMap — only the
      # literal `${OAUTH_CLIENT_SECRET}` placeholder above.
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'client-secret=devz'

  - it: sandbox instance Deployment — tmpfs spark-conf-rendered emptyDir{medium:Memory} + sed-based placeholder-resolution initContainer (envsubst absent from the Zeppelin image) with OAUTH_CLIENT_SECRET via secretKeyRef, SPARK_CONF_DIR pointed at the rendered dir
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
          oidcClientSecret: devz
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri
      - contains:
          path: spec.template.spec.volumes
          content:
            name: spark-conf-rendered
            emptyDir: {medium: Memory}
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: spark-conf-render
      # envsubst is NOT shipped in the Zeppelin image (verified against
      # apache/zeppelin:0.11.2) — a POSIX `sed` substitution is used instead,
      # no new package added to the image.
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'sed '
      - notMatchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'envsubst'
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: sandbox-veri-oidc-credentials
                key: client-secret
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content:
            name: spark-conf-rendered
            mountPath: /spark-conf-rendered
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: spark-conf-rendered
            mountPath: /spark-conf-rendered
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SPARK_CONF_DIR
            value: /spark-conf-rendered

  # --- Task 5: per-dept sandbox Zeppelin instance (range calling
  # `lakehouse.zeppelin.instance` with sandbox params) — full end-to-end
  # Deployment/Service/Shiro correctness, plus two-department isolation ------

  - it: sandbox instance Deployment (dept veri, auth+tls on) — serviceAccountName sa-sandbox-veri, AWS_* from s3-sandbox-veri, c1 %trino interpreter volume/mount present
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
          oidcClientSecret: devz
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri
      # serviceAccountName wired from `saName` (Task 5), gated `sandbox: true`
      # only — see chart/templates/_zeppelin.tpl.
      - equal:
          path: spec.template.spec.serviceAccountName
          value: sa-sandbox-veri
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom: {secretKeyRef: {name: s3-sandbox-veri, key: access-key-id}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom: {secretKeyRef: {name: s3-sandbox-veri, key: secret-access-key}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT_URL_S3
            valueFrom: {secretKeyRef: {name: s3-sandbox-veri, key: endpoint}}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_REGION
            valueFrom: {secretKeyRef: {name: s3-sandbox-veri, key: region}}
      # the c1 %trino read interpreter (chart/templates/_zeppelin.tpl) is
      # carried by the sandbox instance too — same seed ConfigMap + TLS
      # mount, but its OWN per-instance ConfigMap name (Task 5 duplicate-
      # name fix — NOT the shared literal `zeppelin-trino-interpreter`,
      # which would collide with the shared c1 instance's own copy).
      - contains:
          path: spec.template.spec.volumes
          content:
            name: trino-interp
            configMap: {name: zeppelin-sandbox-veri-trino-interpreter}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: trino-interp
            mountPath: /seed
            readOnly: true

  - it: sandbox instance Shiro ConfigMap (dept veri) — groupRolesMap maps the dept adGroup -> sandbox AND the shared admin AD group -> sandbox,admin (so the c1 refresher sidecar keeps roles[admin]); [urls] /** gated roles[sandbox]
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-sandbox-veri-shiro
    set:
      zeppelin.ad.groups.admin: "CN=test-admins"
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
    asserts:
      - matchRegex:
          path: data["shiro.ini"]
          pattern: 'CN=veri-grp:sandbox,'
      # Task 5 fix: the shared `zeppelin.ad.groups.admin` AD group is ALSO
      # mapped, to BOTH `sandbox` and `admin` roles — without this the c1
      # %trino refresher sidecar's admin REST-login account has no role in
      # a sandbox instance and its PUT /api/interpreter/setting/trino 403s
      # forever, so the seeded %trino interpreter's placeholder access
      # token is never replaced (Finding 2).
      - matchRegex:
          path: data["shiro.ini"]
          pattern: 'CN=test-admins:sandbox,admin"'
      # no OTHER shared AD group (analyst/student) leaks into a sandbox
      # instance's groupRolesMap — only the dept group + the admin group.
      - notMatchRegex:
          path: data["shiro.ini"]
          pattern: ':analyst,'
      - notMatchRegex:
          path: data["shiro.ini"]
          pattern: ':student"'
      - matchRegex:
          path: data["shiro.ini"]
          pattern: '/\*\* = authc, roles\[sandbox\]'
      - matchRegex:
          path: data["shiro.ini"]
          pattern: '/api/interpreter/\*\* = authc, roles\[admin\]'
      - matchRegex:
          path: data["shiro.ini"]
          pattern: 'sandbox = \*'
      - matchRegex:
          path: data["shiro.ini"]
          pattern: 'admin = \*'

  - it: sandbox instance Service (dept veri) — zeppelin-sandbox-veri, http:8080
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: kind
      value: Service
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri
      - equal:
          path: spec.selector
          value: {app: zeppelin-sandbox-veri}
      - equal:
          path: spec.ports[0]
          value: {name: http, port: 8080, targetPort: 8080}

  - it: TWO departments (veri + finans) render TWO independent Deployments and Services
    templates:
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: kind
      value: Deployment
      matchMany: true
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
          oidcClientSecret: devz1
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
          oidcClientSecret: devz2
    asserts:
      - hasDocuments:
          count: 2
          filterAware: true
      - matchRegex:
          path: metadata.name
          pattern: '^zeppelin-sandbox-(veri|finans)$'

  - it: TWO departments — veri's Deployment references ONLY its own SA/S3-secret (never finans')
    templates:
      - 09c-zeppelin-sandbox.yaml
    # spec.template.spec.serviceAccountName is unique to this ONE Deployment
    # among all rendered documents (Service/PDB/ConfigMap/PVC don't have it,
    # and the OTHER department's Deployment has a different value) — a
    # precise, unambiguous selector without relying on the (non-unique
    # across kinds) `metadata.name`.
    documentSelector:
      path: spec.template.spec.serviceAccountName
      value: sa-sandbox-veri
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
          oidcClientSecret: devz1
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
          oidcClientSecret: devz2
    asserts:
      - equal:
          path: metadata.name
