  # --- Task 5 review fix (Finding 1, install-breaking duplicate resource
  # names): the trino-interpreter ConfigMap and trino-oidc-credentials
  # Secret were hardcoded (not `{{ $name }}`-prefixed) inside
  # `lakehouse.zeppelin.instance`, so the shared c1 instance + N sandbox
  # departments rendered N+1 documents with the SAME kind/name — `helm
  # install` fails on duplicate resources. Both are now per-instance-named;
  # `ad-bind-credentials` instead stays a fixed shared name but is
  # shared-gated (`sandbox: false`-only emission) since it's ONE shared
  # corporate AD bind credential, not per-instance. These tests render the
  # shared instance (09-zeppelin.yaml) TOGETHER WITH two sandbox departments
  # (09c-zeppelin-sandbox.yaml) and assert each of the three resources
  # renders with a UNIQUE per-instance name (or shared-only, for
  # ad-bind-credentials) — a regression guard for the exact collision the
  # review found. ------------------------------------------------------

  - it: shared instance + TWO sandbox departments — the c1 %trino interpreter ConfigMap renders with THREE distinct per-instance names (no collision)
    # NOTE: `containsDocument`/`hasDocuments` without an explicit per-assert
    # `template:` apply to EVERY template listed at suite/test level and
    # must pass in ALL of them (AND semantics, not "exists in at least
    # one") — per helm-unittest's own doc: "the first assertion... asserts
    # for BOTH deployment.yaml and service.yaml by default". Since the
    # shared instance's copy lives ONLY in 09-zeppelin.yaml's render and
    # each dept's ONLY in 09c-zeppelin-sandbox.yaml's, each assert below
    # pins its own `template:` explicitly.
    templates:
      - 09-zeppelin.yaml
      - 09c-zeppelin-sandbox.yaml
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
    asserts:
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: zeppelin-trino-interpreter
          any: true
        template: 09-zeppelin.yaml
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: zeppelin-sandbox-veri-trino-interpreter
          any: true
        template: 09c-zeppelin-sandbox.yaml
      - containsDocument:
          kind: ConfigMap
          apiVersion: v1
          name: zeppelin-sandbox-finans-trino-interpreter
          any: true
        template: 09c-zeppelin-sandbox.yaml

  - it: shared instance + TWO sandbox departments — the c1 %trino svc-zeppelin-trino oidc-credentials Secret renders with THREE distinct per-instance names (no collision)
    templates:
      - 09-zeppelin.yaml
      - 09c-zeppelin-sandbox.yaml
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      zeppelin.trino.oidc.clientSecret: devsecret
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
    asserts:
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: zeppelin-trino-oidc-credentials
          any: true
        template: 09-zeppelin.yaml
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: zeppelin-sandbox-veri-trino-oidc-credentials
          any: true
        template: 09c-zeppelin-sandbox.yaml
      - containsDocument:
          kind: Secret
          apiVersion: v1
          name: zeppelin-sandbox-finans-trino-oidc-credentials
          any: true
        template: 09c-zeppelin-sandbox.yaml

  - it: shared instance + TWO sandbox departments — ad-bind-credentials renders EXACTLY ONCE from the shared instance and ZERO times from either sandbox department (shared-gated, NOT per-instance/renamed — one shared corporate AD bind credential)
    templates:
      - 09-zeppelin.yaml
      - 09c-zeppelin-sandbox.yaml
    documentSelector:
      path: metadata.name
      value: ad-bind-credentials
      matchMany: true
      skipEmptyTemplates: true
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      zeppelin.ad.bindPassword: devpw
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
        template: 09-zeppelin.yaml
      - hasDocuments:
          count: 0
          filterAware: true
        template: 09c-zeppelin-sandbox.yaml

  # --- Task 6: per-dept sandbox Zeppelin Route (OpenShift, 08-routes-tls.
  # yaml) + mirrored Ingress (vanilla, 08b-ingress-tls.yaml) — one per
  # department, gated `sandbox.enabled` + non-empty `sandbox.departments`
  # ONLY (independent of `components.zeppelin`, matching
  # 09c-zeppelin-sandbox.yaml's own gate), host via `lakehouse.routeHost`
  # (same helper the existing `zeppelin` Route/Ingress entries use), backend
  # the `zeppelin-sandbox-<dept>` Service (Task 5) port `http`. -----------

  - it: "platform: openshift + sandbox.enabled + dept veri — zeppelin-sandbox-veri Route, host via lakehouse.routeHost, targets Service zeppelin-sandbox-veri port http, edge TLS"
    templates:
      - 08-routes-tls.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-sandbox-veri
    set:
      platform: openshift
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - equal:
          path: kind
          value: Route
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri
      - equal:
          path: spec.host
          value: zeppelin-sandbox-veri.apps.example.com
      - equal:
          path: spec.to.kind
          value: Service
      - equal:
          path: spec.to.name
          value: zeppelin-sandbox-veri
      - equal:
          path: spec.port.targetPort
          value: http
      - equal:
          path: spec.tls.termination
          value: edge
      - equal:
          path: spec.tls.insecureEdgeTerminationPolicy
          value: Redirect
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: "platform: vanilla (default) + sandbox.enabled + dept veri — zeppelin-sandbox-veri Ingress, SAME host as the Route above, targets Service zeppelin-sandbox-veri port http, edge TLS via cert-manager"
    templates:
      - 08b-ingress-tls.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-sandbox-veri
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=x"
          s3SecretName: s3-sandbox-veri
    asserts:
      - equal:
          path: kind
          value: Ingress
      - equal:
          path: metadata.name
          value: zeppelin-sandbox-veri
      - equal:
          path: spec.ingressClassName
          value: nginx
      - equal:
          path: spec.rules[0].host
          value: zeppelin-sandbox-veri.apps.example.com
      - equal:
          path: spec.tls[0].hosts[0]
          value: zeppelin-sandbox-veri.apps.example.com
      - equal:
          path: spec.tls[0].secretName
          value: zeppelin-sandbox-veri-tls
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: zeppelin-sandbox-veri
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: http
      - equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod

  - it: "platform: openshift + sandbox.enabled=false (dev default) — NO zeppelin-sandbox-* Route renders (the shared zeppelin Route still does, Route count stays at 3)"
    templates:
      - 08-routes-tls.yaml
    set:
      platform: openshift
    asserts:
      - hasDocuments:
          count: 3
          filterAware: true
        documentSelector:
          path: kind
          value: Route
          matchMany: true
      - containsDocument:
          kind: Route
          apiVersion: route.openshift.io/v1
          name: zeppelin
          any: true

  - it: "platform: vanilla (dev default, sandbox.enabled=false) — NO zeppelin-sandbox-* Ingress renders (the shared zeppelin Ingress still does, Ingress count stays at 7)"
    templates:
      - 08b-ingress-tls.yaml
    asserts:
      - hasDocuments:
          count: 7
          filterAware: true
        documentSelector:
          path: kind
          value: Ingress
          matchMany: true
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: zeppelin
          any: true

  - it: "platform: openshift + sandbox.enabled but departments empty (both gates required) — NO zeppelin-sandbox-* Route renders (Route count stays at 3)"
    templates:
      - 08-routes-tls.yaml
    set:
      platform: openshift
      sandbox.enabled: true
    asserts:
      - hasDocuments:
          count: 3
          filterAware: true
        documentSelector:
          path: kind
          value: Route
          matchMany: true

  - it: "TWO departments (veri + finans) — TWO independent zeppelin-sandbox-* Routes render (OpenShift, total Route count 5), each targeting its own Service"
    templates:
      - 08-routes-tls.yaml
    set:
      platform: openshift
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
    asserts:
      - hasDocuments:
          count: 5
          filterAware: true
        documentSelector:
          path: kind
          value: Route
          matchMany: true
      - containsDocument:
          kind: Route
          apiVersion: route.openshift.io/v1
          name: zeppelin-sandbox-veri
          any: true
      - containsDocument:
          kind: Route
          apiVersion: route.openshift.io/v1
          name: zeppelin-sandbox-finans
          any: true
      # veri's Route targets ONLY its own Service (never finans')
      - equal:
          path: spec.to.name
          value: zeppelin-sandbox-veri
        documentSelector:
          path: metadata.name
          value: zeppelin-sandbox-veri
      # finans' Route targets ONLY its own Service (never veri's)
      - equal:
          path: spec.to.name
          value: zeppelin-sandbox-finans
        documentSelector:
          path: metadata.name
          value: zeppelin-sandbox-finans

  - it: "TWO departments (veri + finans) — TWO independent zeppelin-sandbox-* Ingresses render (vanilla, total Ingress count 9), each targeting its own Service"
    templates:
      - 08b-ingress-tls.yaml
    set:
      sandbox.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
        - name: finans
          adGroup: "CN=finans-grp"
          s3SecretName: s3-sandbox-finans
    asserts:
      - hasDocuments:
          count: 9
          filterAware: true
        documentSelector:
          path: kind
          value: Ingress
          matchMany: true
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: zeppelin-sandbox-veri
          any: true
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: zeppelin-sandbox-finans
          any: true
      # veri's Ingress targets ONLY its own Service (never finans')
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: zeppelin-sandbox-veri
        documentSelector:
          path: metadata.name
          value: zeppelin-sandbox-veri
      # finans' Ingress targets ONLY its own Service (never veri's)
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: zeppelin-sandbox-finans
        documentSelector:
          path: metadata.name
          value: zeppelin-sandbox-finans

  # --- Task 7 (review-routed from Task 4): coherence guard — sandbox
  # requires auth.oidc.enabled. The sandbox Zeppelin's Spark interpreter
  # initContainer (`spark-conf-render`, chart/templates/_zeppelin.tpl)
  # unconditionally reads the `oidc-credentials` Secret (`.Values.oidc.
  # secretName`) for the OIDC issuer-url, but that Secret is only
  # guaranteed to exist when `auth.oidc.enabled` is true (chart/values.yaml
  # `oidc:` block comment) — `sandbox.enabled` alone does not require it.
  # Without this guard, `sandbox.enabled=true` + `auth.oidc.enabled=false`
  # would render a sandbox Zeppelin that crash-loops at runtime on a
  # Secret the chart otherwise says isn't needed. -----------------------

  - it: sandbox.enabled + non-empty departments + auth.oidc.enabled=false FAILS the render loudly (coherence guard)
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: true
      auth.oidc.enabled: false
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
    asserts:
      - failedTemplate:
          errorMessage: "sandbox requires auth.oidc.enabled — the sandbox Zeppelin authenticates to Nessie via OAuth2"

  - it: sandbox.enabled + non-empty departments + auth.oidc.enabled=true (chart default) renders cleanly (guard does NOT fire)
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: true
      auth.oidc.enabled: true
      sandbox.departments:
        - name: veri
          adGroup: "CN=veri-grp"
          s3SecretName: s3-sandbox-veri
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: zeppelin-sandbox-veri
          any: true

  - it: sandbox.enabled=false + auth.oidc.enabled=false does NOT trigger the guard (sandbox not meaningfully enabled — nothing to guard)
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: false
      auth.oidc.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: sandbox.enabled=true but departments empty + auth.oidc.enabled=false does NOT trigger the guard (both gates required before the guard is even relevant)
    templates:
      - 09c-zeppelin-sandbox.yaml
    set:
      sandbox.enabled: true
      auth.oidc.enabled: false
      sandbox.departments: []
    asserts:
      - hasDocuments:
          count: 0
