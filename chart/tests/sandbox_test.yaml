# chart/tests/sandbox_test.yaml — helm-unittest suite for the UNIFIED
# sandbox v2 (2026-08-07-sandbox-v2 design): `sandbox.*` values (enabled|
# bucket|namespace|allowedGroups|oidc — Task 1/2), the Keycloak `svc-sandbox`
# service-account client (chart/templates/10-keycloak.yaml), the unified
# Nessie CEL writer + registered `sandbox` warehouse (chart/templates/
# 04-nessie-ha.yaml), the unified `sandbox` S3 bucket + `sandbox-minio-
# policy` Job (chart/templates/18-bucket-init.yaml /
# 18b-sandbox-minio-policy.yaml), the Trino `sandbox` catalog + rules.json
# (chart/templates/06-trino-ha.yaml), and the shared Zeppelin's unified
# sandbox write catalog (chart/templates/09-zeppelin.yaml /
# _zeppelin.tpl).
#
# Task 5 (this slice's contract task) retired EVERY per-department artifact
# that used to coexist here: the per-dept `svc-sandbox-<name>` Keycloak
# clients, the per-dept Nessie CEL writer/write-rules, the per-dept
# `sandbox-<name>` S3 buckets/MinIO-policy Jobs, the per-dept
# `zeppelin-sandbox-<name>` Zeppelin instances (chart/templates/09c-
# zeppelin-sandbox.yaml, now deleted) and their Routes/Ingresses, and
# `.Values.sandbox.departments` itself. This suite now covers ONLY the
# unified shape — no test here may `set: sandbox.departments`.
#
# Everything is gated `.Values.sandbox.enabled` — dev default (false)
# renders nothing sandbox-specific, asserted below as the control case in
# each section.
suite: sandbox v2 (unified) — values + Keycloak svc-sandbox client + Nessie CEL + S3 bucket/policy + shared Zeppelin write catalog
templates:
  - 10-keycloak.yaml
  - 18-bucket-init.yaml
  - 18b-sandbox-minio-policy.yaml
  - 09-zeppelin.yaml
  - 08-routes-tls.yaml
  - 08b-ingress-tls.yaml
  - 04-nessie-ha.yaml
  - 06-trino-ha.yaml
tests:
  # --- Keycloak: unified svc-sandbox service-account client -------------
  - it: "sandbox v2: unified svc-sandbox service-account client renders when sandbox.enabled, with the right fields + secret, and NO aud-trino mapper"
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      auth.oidc.enabled: true
      sandbox.enabled: true
      sandbox.oidc.clientSecret: "s"
    asserts:
      - contains:
          path: spec.realm.clients
          content:
            clientId: svc-sandbox
            enabled: true
            protocol: "openid-connect"
            publicClient: false
            standardFlowEnabled: false
            serviceAccountsEnabled: true
            secret: "s"
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  - it: "sandbox v2: sandbox.enabled=false renders NO svc-sandbox client"
    templates:
      - 10-keycloak.yaml
    set:
      components.keycloak: true
      auth.oidc.enabled: true
      sandbox.enabled: false
    asserts:
      - notContains:
          path: spec.realm.clients
          content:
            clientId: svc-sandbox
        documentSelector:
          path: kind
          value: KeycloakRealmImport

  # --- Nessie CEL writer `service-account-svc-sandbox` confined to the
  # unified `sandbox` namespace. -----------------------------------------
  - it: "sandbox v2: service-account-svc-sandbox is added to the COMMIT_TO_MAIN writer OR-chain and gets its own ALLOW_SANDBOX_WRITE rule confined to the `sandbox` namespace, when sandbox.enabled"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          pattern: "role=='service-account-svc-sandbox'"
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SANDBOX_WRITE
            value: "op in ['CREATE_ENTITY','UPDATE_ENTITY','DELETE_ENTITY'] && role=='service-account-svc-sandbox' && path.startsWith('sandbox')"
        documentIndex: 1

  - it: "sandbox v2: sandbox.enabled=false renders NO service-account-svc-sandbox writer / ALLOW_SANDBOX_WRITE rule anywhere"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: false
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_COMMIT_TO_MAIN")].value
          pattern: "service-account-svc-sandbox'"
        documentIndex: 1
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_SERVER_AUTHORIZATION_RULES_ALLOW_SANDBOX_WRITE
        documentIndex: 1

  # --- Storage layer: single unified `sandbox` S3 bucket (18-bucket-init.
  # yaml) + single `s3-sandbox` scoped MinIO cred/policy (18b-sandbox-
  # minio-policy.yaml). ----------------------------------------------------
  - it: "sandbox v2: sandbox.enabled renders the single unified `sandbox` bucket in the bucket-init Job args"
    templates:
      - 18-bucket-init.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      storage.createBuckets: true
      sandbox.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "mc mb --ignore-existing s3/sandbox\\b"

  - it: "sandbox v2: sandbox.enabled=false (default) — bucket-init Job args do NOT include the unified sandbox bucket"
    templates:
      - 18-bucket-init.yaml
    documentSelector:
      path: kind
      value: Job
    set:
      storage.createBuckets: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: "s3/sandbox\\b"

  - it: "sandbox v2: sandbox.enabled + components.minio=true renders a single sandbox-minio-policy Job granting RW `sandbox` + RO depo/ham-veri via the fixed s3-sandbox secretKeyRef, with NO per-dept -<dept> naming"
    templates:
      - 18b-sandbox-minio-policy.yaml
    documentSelector:
      path: metadata.name
      value: sandbox-minio-policy
    set:
      sandbox.enabled: true
      components.minio: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sandbox-minio-policy
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::sandbox"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:ListBucket"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::depo'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'arn:aws:s3:::ham-veri'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: '"Action": \[[^\]]*(?:PutObject|DeleteObject|"\*")[^\]]*\],\s*"Resource": \[\s*"arn:aws:s3:::depo"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin policy create s3 sandbox-policy'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin user add s3 "\$SANDBOX_ACCESS_KEY" "\$SANDBOX_SECRET_KEY"'
      - matchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'mc admin policy attach s3 sandbox-policy --user "\$SANDBOX_ACCESS_KEY"'
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[0]
          pattern: 'sandbox-\w+-policy'
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: SANDBOX_ACCESS_KEY
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: s3-sandbox
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.key
          value: access-key-id
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: SANDBOX_SECRET_KEY
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.name
          value: s3-sandbox
      - equal:
          path: spec.template.spec.containers[0].env[4].valueFrom.secretKeyRef.key
          value: secret-access-key

  - it: "sandbox v2 (Task 5 regression guard): 18b-sandbox-minio-policy.yaml renders EXACTLY ONE Job total — the per-department Job block this file used to also render is retired"
    templates:
      - 18b-sandbox-minio-policy.yaml
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    set:
      sandbox.enabled: true
      components.minio: true
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true

  - it: "sandbox v2: sandbox.enabled=false renders NO sandbox-minio-policy Job (even with components.minio=true)"
    templates:
      - 18b-sandbox-minio-policy.yaml
    set:
      components.minio: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "sandbox v2: components.minio=false (default) renders NO sandbox-minio-policy Job (even with sandbox.enabled=true)"
    templates:
      - 18b-sandbox-minio-policy.yaml
    set:
      sandbox.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: "dev default (sandbox.enabled=false, components.minio=false) renders NO 18b policy Job"
    templates:
      - 18b-sandbox-minio-policy.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- Shared Zeppelin (chart/templates/09-zeppelin.yaml / _zeppelin.tpl,
  # Task 5): the SAME (only) Zeppelin instance now ALSO carries the unified
  # sandbox WRITE catalog in its %pyspark interpreter when sandbox.enabled,
  # alongside the pre-existing read-only lakehouse/rawlake OAuth2 blocks
  # (Nessie machine-auth, Task 6). The per-department sandbox Zeppelin
  # instances that used to render from chart/templates/09c-zeppelin-
  # sandbox.yaml are retired — that file is deleted, so it can no longer be
  # exercised by helm-unittest at all. --------------------------------------

  - it: "sandbox v2 (Task 5): shared Zeppelin's spark-defaults ConfigMap gains the unified sandbox WRITE catalog (svc-sandbox OAuth2, warehouse s3a://sandbox/) when sandbox.enabled, alongside the existing read-only lakehouse/rawlake OAuth2 blocks"
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: metadata.name
      value: zeppelin-spark-defaults
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
    asserts:
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox=org\.apache\.iceberg\.spark\.SparkCatalog'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.catalog-impl=org\.apache\.iceberg\.rest\.RESTCatalog'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.uri=http://.*:19120/iceberg/'
      # warehouse mirrors images/jupyter/lakehouse_nb.py's _spark_conf()
      # byte-for-byte: the bare REGISTERED WAREHOUSE NAME ("sandbox"), not
      # an s3a://<bucket>/ location string -- see _zeppelin.tpl's
      # define-header comment (whole-branch review C1 fix, 2026-08-07-
      # sandbox-v2 final review): a location string matches neither the
      # registered NAME nor the exact registered LOCATION, so Nessie falls
      # back to the DEFAULT warehouse (prod `depo` bucket).
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: '(?m)^\s*spark\.sql\.catalog\.sandbox\.warehouse=sandbox$'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.io-impl=org\.apache\.iceberg\.aws\.s3\.S3FileIO'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.authentication\.type=OAUTH2'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.authentication\.oauth2\.client-id=svc-sandbox'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.authentication\.oauth2\.client-secret=\$\{SANDBOX_OAUTH_CLIENT_SECRET\}'
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox\.authentication\.oauth2\.issuer-url=\$\{OIDC_ISSUER_URL\}'
      # the read-only lakehouse/rawlake OAuth2 blocks (svc-zeppelin-nessie,
      # Task 6) are UNCHANGED alongside the new sandbox catalog.
      - matchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.lakehouse\.authentication\.oauth2\.client-id=svc-zeppelin-nessie'
      # no per-department catalog naming (sandbox_<dept>/sandbox-<dept>)
      # survives anywhere in this ConfigMap's actual catalog properties.
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox[-_]\w'

  - it: "sandbox v2 (Task 5): shared Zeppelin's Deployment gets a SECOND OAuth2 secret injected (SANDBOX_OAUTH_CLIENT_SECRET from sandbox-oidc-credentials) via the SAME sed->tmpfs initContainer, when sandbox.enabled — no serviceAccountName override"
    templates:
      - 09-zeppelin.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
      sandbox.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: zeppelin
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SANDBOX_OAUTH_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: sandbox-oidc-credentials
                key: client-secret
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: 'SANDBOX_OAUTH_CLIENT_SECRET'
      # the shared instance never runs as a dedicated ServiceAccount — that
      # was a per-department-only concept, now retired entirely.
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: "sandbox v2 (Task 5): shared Zeppelin has NO sandbox catalog / SANDBOX_OAUTH_CLIENT_SECRET when sandbox.enabled=false (dev default) — byte-identity control"
    templates:
      - 09-zeppelin.yaml
    set:
      components.zeppelin: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
    asserts:
      - notMatchRegex:
          path: data["spark-defaults.conf"]
          pattern: 'spark\.sql\.catalog\.sandbox='
        documentSelector:
          path: metadata.name
          value: zeppelin-spark-defaults
      - notContains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SANDBOX_OAUTH_CLIENT_SECRET
        documentSelector:
          path: kind
          value: Deployment

  # --- Coherence guard (moved from the retired 09c-zeppelin-sandbox.yaml
  # onto the shared instance in Task 5): components.zeppelin + sandbox.
  # enabled requires auth.oidc.enabled — the shared Zeppelin's sandbox
  # catalog authenticates to Nessie via OAuth2 (svc-sandbox), which depends
  # on the same tmpfs/OIDC-issuer mechanism as the read-only catalogs.
  # Without this guard, sandbox.enabled=true + auth.oidc.enabled=false would
  # render a Zeppelin that crash-loops at runtime on a missing Secret. -----

  - it: "sandbox v2 (Task 5): components.zeppelin + sandbox.enabled + auth.oidc.enabled=false FAILS the render loudly (coherence guard)"
    templates:
      - 09-zeppelin.yaml
    set:
      components.zeppelin: true
      sandbox.enabled: true
      auth.oidc.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "components.zeppelin + sandbox.enabled requires auth.oidc.enabled — the shared Zeppelin's unified sandbox catalog authenticates to Nessie via OAuth2 (svc-sandbox)"

  - it: "sandbox v2 (Task 5): components.zeppelin + sandbox.enabled + auth.oidc.enabled=true (chart default) renders cleanly — guard does NOT fire"
    templates:
      - 09-zeppelin.yaml
    set:
      components.zeppelin: true
      sandbox.enabled: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: zeppelin
          any: true

  - it: "sandbox v2 (Task 5): components.zeppelin + sandbox.enabled=false + auth.oidc.enabled=false does NOT trigger the guard (sandbox not meaningfully enabled — nothing to guard)"
    templates:
      - 09-zeppelin.yaml
    set:
      components.zeppelin: true
      sandbox.enabled: false
      auth.oidc.enabled: false
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: zeppelin
          any: true

  # --- Routes/Ingress (chart/templates/08-routes-tls.yaml /
  # 08b-ingress-tls.yaml): the per-department `zeppelin-sandbox-<name>`
  # Route/Ingress `range` blocks are retired in Task 5 — only the shared
  # `zeppelin` Route/Ingress remains (gated `components.zeppelin`, entirely
  # independent of `sandbox.enabled`). -------------------------------------

  - it: "platform: openshift + sandbox.enabled=true (dev default otherwise) — NO zeppelin-sandbox-* Route renders (the shared zeppelin Route still does, Route count stays at 3)"
    templates:
      - 08-routes-tls.yaml
    set:
      platform: openshift
      sandbox.enabled: true
    asserts:
      - hasDocuments:
          count: 3
          filterAware: true
        documentSelector:
          path: kind
          value: Route
          matchMany: true
      - containsDocument:
          kind: Route
          apiVersion: route.openshift.io/v1
          name: zeppelin
          any: true

  - it: "platform: openshift + sandbox.enabled=false (dev default) — NO zeppelin-sandbox-* Route renders (the shared zeppelin Route still does, Route count stays at 3)"
    templates:
      - 08-routes-tls.yaml
    set:
      platform: openshift
    asserts:
      - hasDocuments:
          count: 3
          filterAware: true
        documentSelector:
          path: kind
          value: Route
          matchMany: true
      - containsDocument:
          kind: Route
          apiVersion: route.openshift.io/v1
          name: zeppelin
          any: true

  - it: "platform: vanilla (dev default, sandbox.enabled=false) — NO zeppelin-sandbox-* Ingress renders (the shared zeppelin Ingress still does, Ingress count stays at 7)"
    templates:
      - 08b-ingress-tls.yaml
    asserts:
      - hasDocuments:
          count: 7
          filterAware: true
        documentSelector:
          path: kind
          value: Ingress
          matchMany: true
      - containsDocument:
          kind: Ingress
          apiVersion: networking.k8s.io/v1
          name: zeppelin
          any: true

  - it: "platform: vanilla + sandbox.enabled=true — NO zeppelin-sandbox-* Ingress renders (Ingress count stays at 7)"
    templates:
      - 08b-ingress-tls.yaml
    set:
      sandbox.enabled: true
    asserts:
      - hasDocuments:
          count: 7
          filterAware: true
        documentSelector:
          path: kind
          value: Ingress
          matchMany: true

  # --- Trino `sandbox` catalog + rules.json `.*` read-write (Task 3,
  # KABUL AÇIĞI #2, şartname 3.5.4.2). ADDITIVE alongside the existing
  # lakehouse/rawlake read-only rules and every existing principal (admin,
  # svc-dbt-trino, catch-all SELECT) — those must stay intact (the b2
  # lesson: a `tables` section, once defined, denies any principal not
  # matched by ANY rule). Trino commits to Nessie as the existing broad-
  # write `svc-trino-nessie` identity — same OAuth2 block as lakehouse.
  # properties, copied verbatim. -------------------------------------------

  - it: "sandbox v2 (Task 3 review fix): trino sandbox.properties catalog renders when sandbox.enabled, mirroring lakehouse.properties (iceberg/rest, warehouse=sandbox BY NAME -- not a location string, same svc-trino-nessie OAuth2 block)"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      path: metadata.name
      value: trino-config
    set:
      components.trino: true
      auth.oidc.enabled: true
      sandbox.enabled: true
      sandbox.bucket: sandbox
    asserts:
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "connector\\.name=iceberg"
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.catalog\\.type=rest"
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.rest-catalog\\.uri=http://.*:19120/iceberg/"
      # Nessie's Iceberg-REST `warehouse` param is a lookup key into
      # NESSIE_CATALOG_WAREHOUSES_<NAME>_LOCATION, NOT an arbitrary path --
      # `warehouse=sandbox` is the registered NAME (see 04-nessie-ha.yaml's
      # NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION env below), mirroring
      # rawlake.properties' `warehouse=rawdata` pattern exactly. A bare
      # `s3://.../warehouse` location string here would either fail to
      # resolve or silently fall through to the DEFAULT warehouse's
      # location -- sandbox tables landing in the prod bucket (3.5.4.3
      # isolation violation).
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "(?m)^iceberg\\.rest-catalog\\.warehouse=sandbox$"
      - notMatchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.rest-catalog\\.warehouse=s3://"
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.rest-catalog\\.security=OAUTH2"
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.rest-catalog\\.oauth2\\.credential=svc-trino-nessie:\\$\\{ENV:NESSIE_OAUTH_SECRET\\}"
      - matchRegex:
          path: data["sandbox.properties"]
          pattern: "iceberg\\.rest-catalog\\.oauth2\\.server-uri=\\$\\{ENV:OIDC_ISSUER\\}/protocol/openid-connect/token"
  - it: "sandbox v2 (Task 3): coordinator Deployment mounts sandbox.properties into /etc/trino/catalog when sandbox.enabled -- a catalog ConfigMap key with no matching volumeMount is inert at runtime"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      # trino-coordinator names BOTH the Service and the Deployment; only
      # the Deployment has `spec.selector.matchLabels` (the Service's own
      # `spec.selector` is a flat map with no `matchLabels` wrapper).
      path: spec.selector.matchLabels.role
      value: coordinator
    set:
      components.trino: true
      auth.oidc.enabled: true
      sandbox.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].volumeMounts[?(@.subPath=="sandbox.properties")].mountPath
          pattern: "^/etc/trino/catalog/sandbox\\.properties$"

  - it: "sandbox v2 (Task 3 review fix): 04-nessie-ha.yaml registers a NAMED `sandbox` warehouse (NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION) when sandbox.enabled -- required for Trino's sandbox.properties `warehouse=sandbox` lookup to resolve, alongside the existing WAREHOUSE/RAWDATA registrations"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
      sandbox.bucket: sandbox
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION
            value: "s3://sandbox/warehouse"
        documentIndex: 1
      # existing warehouse/rawdata registrations stay intact (additive) --
      # matchRegex against the env var's own value (not a partial-object
      # `contains`, which requires an exact full-object match against
      # entries that also carry a `value` field pinned to unrelated
      # `nessie.catalog.*.location` defaults).
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION")].name
          pattern: "NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION"
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_CATALOG_WAREHOUSES_RAWDATA_LOCATION")].name
          pattern: "NESSIE_CATALOG_WAREHOUSES_RAWDATA_LOCATION"
        documentIndex: 1

  # --- Coherence guard (whole-branch review I1 fix): several places
  # hardcode the literal "sandbox" (Trino catalog name/warehouse, Nessie
  # NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION env NAME, rules.json's
  # "catalog":"sandbox") while others read `.Values.sandbox.namespace`/
  # `.Values.sandbox.bucket` -- a mismatched operator override would
  # silently misroute engines. The render must fail loudly instead. --------

  - it: "sandbox v2 (I1 coherence guard): sandbox.enabled + sandbox.namespace != 'sandbox' FAILS the render loudly"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
      sandbox.namespace: "kum-havuzu"
    asserts:
      - failedTemplate:
          errorMessage: "sandbox.namespace and sandbox.bucket must both be 'sandbox' in this release — the Trino catalog and Nessie warehouse registration are keyed on that literal; per-name configurability is future work"

  - it: "sandbox v2 (I1 coherence guard): sandbox.enabled + sandbox.bucket != 'sandbox' FAILS the render loudly"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
      sandbox.bucket: "kum-havuzu"
    asserts:
      - failedTemplate:
          errorMessage: "sandbox.namespace and sandbox.bucket must both be 'sandbox' in this release — the Trino catalog and Nessie warehouse registration are keyed on that literal; per-name configurability is future work"

  - it: "sandbox v2 (I1 coherence guard): sandbox.enabled=false + sandbox.namespace != 'sandbox' does NOT trigger the guard (sandbox not meaningfully enabled)"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: false
      sandbox.namespace: "kum-havuzu"
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: nessie
          any: true

  - it: "sandbox v2 (I1 coherence guard): sandbox.enabled + default namespace/bucket ('sandbox') renders cleanly -- guard does NOT fire"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
      sandbox.enabled: true
    asserts:
      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: nessie
          any: true

  - it: "sandbox v2 (Task 3 review fix): sandbox.enabled=false (default) -- NO NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION renders, existing WAREHOUSE/RAWDATA registrations unaffected"
    templates:
      - 04-nessie-ha.yaml
    set:
      auth.oidc.enabled: true
      oidc.secretName: oidc-credentials
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NESSIE_CATALOG_WAREHOUSES_SANDBOX_LOCATION
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION")].name
          pattern: "NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION"
        documentIndex: 1
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="NESSIE_CATALOG_WAREHOUSES_RAWDATA_LOCATION")].name
          pattern: "NESSIE_CATALOG_WAREHOUSES_RAWDATA_LOCATION"
        documentIndex: 1

  - it: "sandbox v2 (Task 3): worker Deployment also mounts sandbox.properties when sandbox.enabled"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      # trino-worker names BOTH the Deployment and the HPA's scaleTargetRef;
      # only the Deployment has `spec.selector.matchLabels`.
      path: spec.selector.matchLabels.role
      value: worker
    set:
      components.trino: true
      auth.oidc.enabled: true
      sandbox.enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].volumeMounts[?(@.subPath=="sandbox.properties")].mountPath
          pattern: "^/etc/trino/catalog/sandbox\\.properties$"

  - it: "sandbox v2 (Task 3): sandbox.enabled=false (default) -- NO sandbox.properties catalog renders (byte-identical dev default otherwise)"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      path: metadata.name
      value: trino-config
    set:
      components.trino: true
      auth.oidc.enabled: true
    asserts:
      - notExists:
          path: data["sandbox.properties"]

  - it: "sandbox v2 (Task 3): rules.json grants .* read-write on the sandbox catalog (catalogs/schemas/tables), while keeping lakehouse/rawlake read-only + the existing service-account-svc-dbt-trino + admin catch-alls intact"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      path: metadata.name
      value: trino-config
    set:
      components.trino: true
      components.dbt: true
      auth.oidc.enabled: true
      sandbox.enabled: true
      superset.trino.tls.enabled: true
    asserts:
      # sandbox catalog: full allow, placed ahead of the lakehouse/rawlake
      # read-only catch-alls (specificity/order).
      - matchRegex:
          path: data["rules.json"]
          pattern: '\{"user": "\.\*", "catalog": "sandbox", "allow": "all"\}'
      - matchRegex:
          path: data["rules.json"]
          pattern: '"catalog": "sandbox", "allow": "all"\},\s*\{"user": "\.\*", "catalog": "lakehouse", "allow": "read-only"\}'
      # sandbox schema-owner + table read-write rules
      - matchRegex:
          path: data["rules.json"]
          pattern: '\{"user": "\.\*", "catalog": "sandbox", "schema": "\.\*", "owner": true\}'
      - matchRegex:
          path: data["rules.json"]
          pattern: '\{"user": "\.\*", "catalog": "sandbox", "privileges": \["SELECT","INSERT","DELETE","UPDATE","OWNERSHIP"\]\}'
      # existing principals/rules MUST remain intact (the b2 lesson)
      - matchRegex:
          path: data["rules.json"]
          pattern: "service-account-svc-dbt-trino"
      - matchRegex:
          path: data["rules.json"]
          pattern: '"catalog": "lakehouse", "allow": "read-only"'
      - matchRegex:
          path: data["rules.json"]
          pattern: '"catalog": "rawlake",   "allow": "read-only"'
      - matchRegex:
          path: data["rules.json"]
          pattern: '\{"user": "alice\|admin-group", "catalog": "\.\*", "allow": "all"\}'
      - matchRegex:
          path: data["rules.json"]
          pattern: '\{"user": "\.\*", "privileges": \["SELECT"\]\}'

  - it: "sandbox v2 (Task 3): sandbox.enabled=false (default) -- rules.json has NO sandbox catalog rule, existing lakehouse/rawlake read-only + dbt rules unaffected"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      path: metadata.name
      value: trino-config
    set:
      components.trino: true
      components.dbt: true
      auth.oidc.enabled: true
      superset.trino.tls.enabled: true
    asserts:
      - notMatchRegex:
          path: data["rules.json"]
          pattern: '"catalog": "sandbox"'
      - matchRegex:
          path: data["rules.json"]
          pattern: "service-account-svc-dbt-trino"
      - matchRegex:
          path: data["rules.json"]
          pattern: '"catalog": "lakehouse", "allow": "read-only"'

  - it: "sandbox v2 (Task 3): rules.json still valid JSON + has NO sandbox/dbt schemas/tables sections when BOTH sandbox.enabled and components.dbt are false (dev default byte-identical)"
    templates:
      - 06-trino-ha.yaml
    documentSelector:
      path: metadata.name
      value: trino-config
    set:
      components.trino: true
      auth.oidc.enabled: true
    asserts:
      - notMatchRegex:
          path: data["rules.json"]
          pattern: '"schemas"'
      - notMatchRegex:
          path: data["rules.json"]
          pattern: '"tables"'
