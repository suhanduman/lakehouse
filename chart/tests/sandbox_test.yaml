      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            valueFrom: {secretKeyRef: {name: s3-sandbox-finans, key: access-key-id}}

  - it: TWO departments — finans' Deployment references ONLY its own SA/S3-secret (never veri's)
    templates:
