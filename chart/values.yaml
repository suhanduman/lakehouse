# Lakehouse — default Helm values.
#
# This is the chart's skeleton default configuration. It intentionally has NO
# component templates behind it yet — those land component-by-component in
# later tasks. The keys below define the stable interface that later tasks
# parametrize against:
#   - `namespace` / `.Release.Namespace` (see chart/templates/_helpers.tpl)
#   - `global.domain` / `global.imageRegistry` (routes + image refs)
#   - per-component `enabled` flags (placeholder — expanded as templates land)
#
# See `values-prod.example.yaml` for a filled-in example configuration.

# Namespace the release is intended for. Templates do NOT read this value —
# they always use `.Release.Namespace` via the `lakehouse.namespace` helper,
# so the chart works correctly no matter what `-n <namespace>` is passed to
# `helm install/upgrade`. This key exists for documentation/tooling only
# (e.g. so `values-prod.example.yaml` can self-describe its target namespace).
namespace: example

# Platform switch — SINGLE SOURCE for which platform-specific rendering path
# this chart takes (chart/templates/_helpers.tpl `lakehouse.isOpenShift`
# helper reads this; every `kind: Route` template + its
# chart/templates/08b-ingress-tls.yaml Ingress equivalent gate on it). Exactly
# two valid values:
#   - "openshift" : `route.openshift.io/v1` Route objects render for every
#                    public endpoint (chart/templates/08-routes-tls.yaml,
#                    the Keycloak Route in 10-keycloak.yaml, and the console/
#                    kafka-ui Routes under chart/templates/console/) — SCC/
#                    OLM conventions apply.
#   - "vanilla"   : plain `networking.k8s.io/v1` Ingress objects render for
#                    the SAME logical endpoint set instead
#                    (chart/templates/08b-ingress-tls.yaml), using
#                    `ingress.className` below; operators are Helm-installed
#                    rather than OLM-managed.
# "vanilla" is the product default (this file); an OpenShift install's
# overlay sets `platform: openshift` (see values-prod.example.yaml). Any
# other value `fail`s the render loudly (see the helper).
#
# NOTE: this switch ONLY controls Route-vs-Ingress rendering (its scope in
# this task). It is platform-CORRELATED with, but does NOT itself flip, a few
# independently-controlled knobs an OpenShift overlay typically also sets:
#   - global.security.restrictedSecurityContext (OpenShift restricted-v2 SCC)
#   - global.security.s3TrustBundle.openshiftInject
#   - kafkaConnect's build path (`spec.build`, see 12-kafka-connect.yaml)
# Set those explicitly per-environment; `platform` does not imply them.
platform: vanilla

global:
  # Base public domain for OpenShift Routes (e.g. trino.<domain>, console.<domain>).
  domain: apps.example.com
  # Registry prefix used for internally-built images (console backend/frontend,
  # streaming jobs, etc.). Overridden per-environment.
  imageRegistry: image-registry.openshift-image-registry.svc:5000/lakehouse

  # --- Prod hardening (OpenShift) — VARSAYILAN KAPALI. -------------------------
  # microk8s'te KAPALI kalır (restricted-v2 SCC yok; runAsNonRoot bazı imajları
  # kırabilir). Prod values (values-prod.example.yaml) AÇAR. Detay + S3-CA
  # per-bileşen JVM truststore runbook: gitops/README.md "Prod hardening".
  security:
    # OpenShift restricted-v2 SCC / PSA-restricted uyumlu pod+container
    # securityContext'i (runAsNonRoot, drop ALL caps, seccomp RuntimeDefault,
    # allowPrivilegeEscalation:false). runAsUser SET EDİLMEZ — OpenShift SCC
    # rastgele UID atar. Helper: _helpers.tpl lakehouse.podSecurityContext /
    # lakehouse.containerSecurityContext.
    restrictedSecurityContext: false
    # S3 Internal-CA truststore. Etkinse chart, OpenShift'in
    # "trusted CA bundle" injection'ı için etiketli bir ConfigMap üretir
    # (00-s3-trust-bundle.yaml); JVM S3 istemcileri (Trino/Nessie/Connect/Spark)
    # bunu mount edip truststore'a ekler — bkz. gitops/README runbook.
    s3TrustBundle:
      enabled: false
      # OpenShift trusted-CA-bundle injection: boş bir ConfigMap'e
      # `config.openshift.io/inject-trusted-cabundle: "true"` etiketi konur;
      # OpenShift `ca-bundle.crt`'yi (sistem + cluster-additional CA'lar) doldurur.
      # false ise `configMapName` mevcut (elle sağlanan) bir CA ConfigMap olmalı.
      openshiftInject: true
      configMapName: s3-trust-bundle
      key: ca-bundle.crt

# Component enable/disable flags. Every component gets its own template +
# values block; this map is expanded (not replaced) as each one lands.
# Keeping the full expected key set here
# now avoids `nil` surprises in later `.Values.components.X` lookups.
components:
  # DEFAULT false — storage neutrality (Product Foundation task 6.5): the
  # two vendor CSI StorageClasses this chart can optionally create
  # (`storage.classes.*`, chart/templates/01-storage.yaml) are opt-in, not
  # assumed. Most customers already have a cluster-scoped StorageClass (or
  # rely on the cluster's default one) and simply point
  # `postgres.*.storage(.walStorage).storageClass` / `zeppelin.
  # storageClassName` / `kafka.nodePools.*.storage.class` at it — every one
  # of those fields defaults to `""` (empty = cluster default StorageClass).
  # Flip this to `true` only when the chart itself should create the two
  # StorageClasses (set `storage.classes.*.provisioner`/`backend` to match
  # your CSI driver first).
  storage: false
  # DEFAULT false — MinIO is DEV/PoC/e2e-ONLY (Product Foundation Task 8):
  # chart/templates/17-minio.yaml's single-replica, single-PVC, no-HA
  # in-cluster S3-compatible object store. Real customers ALWAYS bring
  # their OWN S3-compatible object store (Pure Storage FlashBlade, AWS S3,
  # Ceph RGW, ...) and point `storage.s3.secretName`'s Secret material at
  # it instead — see chart/templates/01-storage.yaml. Flip this to `true`
  # ONLY for a throwaway dev/PoC/e2e cluster with no real S3 endpoint
  # available. NEVER set this to `true` in a real/prod values-<env>.yaml.
  minio: false
  # DEFAULT false — in-cluster Gitea write-path fallback
  # (2026-07-30-gitops-core-slice-a-write-path Task 6,
  # chart/templates/16-gitea.yaml): a single-replica, single-PVC Gitea
  # instance for environments with no external git host reachable from the
  # cluster. Only meaningful alongside `console.deployMode: gitops` — when
  # `console.gitops.repoUrl` is left empty AND this is `true`, the Console
  # backend's GITOPS_REPO_URL defaults to this Gitea's SSH remote (see
  # chart/templates/console/console.yaml). Real installs bring their OWN git
  # host (GitHub/GitLab/Gitea/Gitness) and set `console.gitops.repoUrl`
  # explicitly instead — same "DEV/PoC/no-external-dependency fallback,
  # never for production" posture as `components.minio` above. Bootstrap is
  # responsible for seeding the `gitops-credential` Secret and creating the
  # target repo inside this Gitea (out of this chart's scope).
  gitea: false
  postgres: true
  kafka: true
  nessie: true
  sparkOperator: true
  trino: true
  routesTls: true
  zeppelin: true
  keycloak: true
  # Optional independent override for the `pg-keycloak` CNPG Cluster (see
  # chart/templates/10-keycloak.yaml). Left UNSET here on purpose: the
  # template treats "unset" as "same as `keycloak` above" (dynamic default,
  # not a static true/false), so pg-keycloak automatically tracks whether
  # Keycloak itself is enabled. Only set this explicitly if you want to
  # pre-provision the Keycloak DB ahead of turning Keycloak on (or keep it
  # around after turning Keycloak off) — e.g. `keycloakDb: true` with
  # `keycloak: false`.
  # keycloakDb: true
  apicurio: true
  kafkaConnect: true
  nginxIngest: true
  console: true
  kafkaUi: true
  consoleRoutesOidc: true
  # AI/demo workloads are prod-off by default (per plan: "ai.enabled: false").
  ai: false
  # Superset BI + JupyterHub are follow-up components (sub-project D) — their
  # Deployment/Service are NOT shipped by this chart yet, only their
  # OpenShift Routes exist in chart/templates/08-routes-tls.yaml. Both gated
  # OFF by default so prod never renders a Route pointing at a backing
  # Service the chart doesn't produce (Route-reference-closure gate).
  # Flip to true (and add the backing Service) once each lands in the chart.
  superset: false
  jupyter: false
  # Spark History Server (Consumption slice d). Gated OFF by default (on in
  # medium/large tiers). See the top-level `sparkHistory:` block below.
  sparkHistory: false
  # dbt-trino Certified Gold (Consumption slice b2). CronJob-driven; gated
  # OFF by default (on in medium/large tiers). See the top-level `dbt:`
  # block for the git-source-of-truth + machine-auth contract.
  dbt: false
  # İzleme (D1): ServiceMonitor/PodMonitor/PrometheusRule CR'ları + Grafana.
  # OpenShift user-workload-monitoring (UWM) HEDEFLİ — bu chart UWM'i KURMAZ,
  # yalnızca CR'ları ve Grafana'yı ekler (spec 2026-07-19-monitoring-design §2).
  # Kapalıyken (false) chart/templates/monitoring/* ve tüm metrik-hook
  # eklentileri render'dan tümüyle çıkar; mevcut render birebir korunur.
  monitoring: true
  # Gates chart/templates/15-external-secrets.yaml's `ExternalSecret` CRs
  # (rendered only when ALSO `secrets.mode: external`, see that key's own
  # doc comment below) — an escape hatch for a cluster that runs
  # `secrets.mode: external` but hasn't installed the External Secrets
  # Operator CRD (external-secrets.io/v1beta1) yet, so flipping
  # `secrets.mode` alone never hard-fails a render. Default true (the
  # common case: ESO IS installed whenever `mode: external` is chosen).
  externalSecrets: true

# Namespace-level policy: ResourceQuota + LimitRange sizing for the release
# namespace. Same numbers as before, now parametric so a values-<env>.yaml
# can resize per-cluster without touching the template. This block always
# renders (no `enabled` flag): a namespace without a quota/limit policy is
# not a supported install shape.
namespaceConfig:
  # Namespaces the platform's cluster-scoped OPERATORS run in — sources for
  # the `allow-from-operator-namespaces` NetworkPolicy
  # (chart/templates/00-namespace.yaml): CloudNativePG must poll instance
  # pods' status (:8000) and Strimzi must reach the Kafka pods' KafkaAgent
  # from outside the release namespace, which the default-deny ingress
  # policy would otherwise block on any CNI that enforces NetworkPolicy
  # (Calico, Cilium, kind >= 0.24). Defaults cover BOTH install paths: the
  # vanilla bootstrap's helm-installed operator namespaces
  # (bootstrap/operators.env) and OpenShift's OLM `openshift-operators`;
  # entries for namespaces that don't exist on a given cluster match
  # nothing. Extend/replace per environment if operators live elsewhere.
  operatorNamespaces:
    - strimzi
    - cnpg-system
    - spark-operator
    - keycloak-system
    - openshift-operators
  quota:
    requestsCpu: "34"        # small steady+spark-peak ≈ 28.4 × 1.15 headroom (quota-fits.sh gate)
    requestsMemory: 72Gi     # ≈ 60Gi × 1.15
    limitsCpu: "84"          # ≈ 72 × 1.15
    limitsMemory: 124Gi      # ≈ 107Gi × 1.15
    persistentVolumeClaims: "50"
    requestsStorage: 2Ti
    pods: "100"
    # Prod has no NodePort; Routes are used instead (`kafka.externalListenerType:
    # route`, below). COUPLING: if you flip
    # `kafka.externalListenerType` to `nodeport` (e.g. for a non-OpenShift env),
    # Strimzi creates ONE NodePort Service per broker PLUS the shared
    # bootstrap Service (`kafka.nodePools.broker.replicas + 1` total) —
    # this quota MUST be raised to at least that count, or Strimzi's own
    # Service creation is rejected by this SAME quota
    # ("exceeded quota: lakehouse-quota, requested: services.nodeports=1,
    # limited: 0") and the Kafka CR sits permanently NotReady. `route` (the
    # default) needs 0 NodePort Services, so this stays "0" for prod.
    serviceNodePorts: "0"
    countDeployments: "30"
  limitRange:
    container:
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      max:
        cpu: "8"
        memory: 16Gi
    pvc:
      max:
        storage: 500Gi
      min:
        storage: 1Gi

# Storage: opt-in vendor CSI StorageClasses (`components.storage`, default
# false — see that flag's comment above) + the name of the S3 credential
# Secret for ANY S3-compatible object store (Pure Storage, MinIO,
# AWS S3, Ceph RGW, ...). The Secret's material is NEVER defined here — it is
# provisioned out-of-band (ExternalSecret/Vault or `oc create secret`, see
# `secrets.mode`) under the name below; this chart only
# references that name from consuming templates (Trino/Spark/Nessie S3 env).
storage:
  classes:
    # Neutral default names (NOT vendor-specific) — only rendered at all
    # when `components.storage: true`. `provisioner`/`backend` are LEFT
    # EMPTY on purpose: they are cluster/vendor-specific and MUST be set
    # before enabling this component (e.g. `pure-csi` + `backend: block`/
    # `file` for Pure Storage's PSO CSI driver — any
    # other CSI driver's own provisioner name + StorageClass parameters work
    # the same way; see chart/values-prod.example.yaml for a worked example).
    block:
      name: lakehouse-block
      provisioner: ""
      backend: ""
      reclaimPolicy: Delete
      allowVolumeExpansion: true
      volumeBindingMode: WaitForFirstConsumer
    fileRwx:
      name: lakehouse-file-rwx
      provisioner: ""
      backend: ""
      reclaimPolicy: Retain
      allowVolumeExpansion: true
      volumeBindingMode: WaitForFirstConsumer
  s3:
    # Name only — no access-key/secret-key/endpoint material in this chart.
    secretName: s3-credentials
  # Vendor-generic S3 bucket-init Job (Task 8, chart/templates/
  # 18-bucket-init.yaml) — gated by `createBuckets`, NOT by
  # `components.minio`: it runs `mc mb --ignore-existing` against WHATEVER
  # S3 endpoint `storage.s3.secretName`'s Secret points at (the dev MinIO
  # below, or any real customer S3 — nothing MinIO-specific in the Job
  # itself). DEFAULT true — a fresh install has somewhere for first ingest
  # to land immediately. Disable when the customer pre-provisions buckets
  # out-of-band, or when the install credentials deliberately lack
  # bucket-create rights (least-privilege S3 policies).
  createBuckets: true
  # Explicit bucket-list override. Empty (default, `[]`) — in that case the
  # Job COMPUTES the list from the `s3://` locations already embedded
  # elsewhere in this file (`nessie.catalog.warehouse.location` → "depo",
  # `nessie.catalog.rawdata.location` → "ham-veri",
  # `nginx.streaming.checkpointBucket` → "nginx-web",
  # `postgres.nessie.backup.destinationPath`'s bucket → "backups" — see the
  # `lakehouse.s3BucketFromUri` helper, _helpers.tpl), so this list and
  # those `s3://...` values can never silently drift apart. Set this
  # explicitly only to add buckets beyond those four, or to fully replace
  # the computed list for a non-default warehouse layout.
  buckets: []

# Dev-grade in-cluster MinIO (Product Foundation Task 8, chart/templates/
# 17-minio.yaml). Gated by `components.minio` (DEFAULT FALSE — see that
# flag's own doc comment above). *** DEV/PoC/e2e ONLY — NEVER production.
# *** Root credentials are the SAME `storage.s3.secretName` Secret every
# other S3 consumer in this chart already reads
# (access-key-id/secret-access-key become MINIO_ROOT_USER/
# MINIO_ROOT_PASSWORD) — no second secret to keep in sync; bootstrap's
# `generated`-mode Secret (bootstrap/lib/secrets.sh) works here unchanged.
minio:
  storage:
    size: 20Gi
    # Empty (default) = cluster's default StorageClass (same omit-when-empty
    # convention as `zeppelin.storageClassName` / `kafka.nodePools.*.storage.
    # class` — chart/tests/storage-neutrality_test.yaml).
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# In-cluster Gitea write-path fallback (Task 6, gated `components.gitea`,
# DEFAULT false — see that key's own doc comment above). Only rendered by
# chart/templates/16-gitea.yaml when the gate is on.
gitea:
  image: gitea/gitea:1.22
  storageSize: 5Gi
  # Empty (default) = cluster's default StorageClass (same omit-when-empty
  # convention as `minio.storage.storageClassName` / `zeppelin.
  # storageClassName` — chart/tests/storage-neutrality_test.yaml).
  storageClassName: ""
  repo: pipelines            # org/repo path the Console commits to
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Secret provisioning mode (spec §4). By default this chart
# carries NO real secret material — templates only reference Secret NAMES
# (e.g. `storage.s3.secretName`, `oidc.secretName`, plus the
# Strimzi/CNPG-operator-generated Secrets `pg-*-app`, `connect`,
# `kafka-cluster-ca-cert`, `mssql`/`mongo`/`debezium-src`, etc.).
#
# Four fields are the one exception, and support BOTH external/manual
# provisioning AND an opt-in inline-dev-convenience path:
# `trino.internalSharedSecret`, `zeppelin.ad.bindPassword`,
# `keycloak.adminPassword`, `kafkaUi.oidc.clientSecret`. Each defaults to an
# EMPTY string, in which case the corresponding template (06-trino-ha.yaml /
# 09-zeppelin.yaml / 10-keycloak.yaml / console/routes-oidc.yaml) does NOT
# render that Secret at all — the same name/keys must instead be provisioned
# out-of-band per the mode below, same as every other named Secret in this
# chart. Only if a real value is explicitly set (e.g. in a local/dev
# values-<env>.yaml) does the template render an inline `stringData` Secret
# from it — a convenience for quick local installs, never the shipped
# default, so no real secret material is committed to this chart's own
# values files.
#
# `secrets.mode` is a DECLARATION of how every named Secret (including these
# four, when left empty) gets created out-of-band, surfaced in NOTES.txt so
# an operator follows the right pre-install step. THREE valid values — any
# other value FAILS the render loudly (`lakehouse.secretsMode` helper,
# _helpers.tpl — same fail-loud style as `.Values.platform`):
#   generated (DEFAULT): the `bootstrap` script (Task 7) generates strong
#     random secrets and creates them as Kubernetes Secrets out-of-band,
#     BEFORE `helm install` — the zero-manual-step path for a fresh product
#     install. This chart renders NOTHING for them (same as `manual`,
#     rendering-wise): if the chart rendered even an empty placeholder
#     Secret, Helm/ArgoCD would OWN it and overwrite/prune bootstrap's
#     seeded material on the very next sync — so the chart must stay
#     hands-off in this mode.
#   external : an ExternalSecrets Operator (ESO) + Vault/AD/whatever backend
#     materializes each named Secret from a remote store — RECOMMENDED for
#     prod (no secret ever touches git). Unlike `generated`/`manual`, this
#     chart DOES render something for this mode:
#     chart/templates/15-external-secrets.yaml renders one `ExternalSecret`
#     (external-secrets.io/v1beta1) per named platform Secret, referencing
#     the SecretStore/ClusterSecretStore configured under `secrets.external.*`
#     below. The store itself stays out-of-band — customer/vault-specific
#     config this chart never sees. Also gated by `components.externalSecrets`
#     (default true, see `components:` above).
#   manual   : an operator pre-creates each named Secret by hand
#     (`oc create secret generic <name> ...`) BEFORE `helm install`. Chart
#     renders nothing; NOTES.txt prints the manual steps.
# Rendered manifests are otherwise identical across all three modes for
# every Secret EXCEPT the four dev-convenience fields above (whose rendering
# is conditional on a value being supplied, independent of `secrets.mode`).
secrets:
  mode: generated

  # SecretStore/ClusterSecretStore the ExternalSecrets reference — ONLY
  # consumed when `mode: external` (chart/templates/15-external-secrets.yaml).
  # The store itself is customer/vault-specific and created out-of-band, NOT
  # by this chart, before install.
  external:
    secretStoreName: lakehouse-vault
    secretStoreKind: ClusterSecretStore
    # Remote key prefix: each named Secret's data is read WHOLE from
    # <remoteKeyPrefix>/<secret-name> in the backing store (`dataFrom.extract`
    # — not per-key `data:` entries), keeping this chart agnostic to each
    # Secret's internal key layout (see each Secret's own doc comment
    # elsewhere in this chart for its exact key list).
    remoteKeyPrefix: lakehouse
    refreshInterval: 1h

# İzleme (D1 — spec 2026-07-19-monitoring-design). Tümü `components.monitoring`
# arkasında. Metrik toplama motoru OpenShift UWM'dir; bu blok yalnızca CR'ları
# ve Grafana'yı yapılandırır.
monitoring:
  # ServiceMonitor scrape aralığı (tüm hedefler için ortak varsayılan).
  serviceMonitorInterval: 30s

  # Namespace the vanilla-Kubernetes Prometheus Operator (kube-prometheus-
  # stack convention) runs in. Consumed ONLY by chart/templates/
  # 00-namespace.yaml's `allow-from-ingress-and-monitoring` NetworkPolicy's
  # `platform: vanilla` branch — a `kubernetes.io/metadata.name`
  # namespaceSelector (see `ingress.controllerNamespace` above for why:
  # same reasoning, OpenShift's `network.openshift.io/policy-group:
  # monitoring` label doesn't exist on vanilla clusters). Ignored on
  # `platform: openshift`.
  prometheusNamespace: monitoring

  # Hedef-başına açma/kapama. Her biri AYRICA `components.monitoring`'e bağlı:
  # bir hedefin ServiceMonitor/PodMonitor'ı ancak ikisi de true ise render edilir.
  targets:
    kafka:    {enabled: true}   # Strimzi Kafka broker JMX-Prometheus exporter
    connect:  {enabled: true}   # Kafka Connect JMX exporter (connect-metrics zaten var)
    trino:    {enabled: true}   # Trino OpenMetrics endpoint
    nessie:   {enabled: true}   # Nessie/Quarkus micrometer (/q/metrics)
    apicurio: {enabled: true}   # Apicurio micrometer (/metrics)
    console:  {enabled: true}   # Lakehouse Console FastAPI /metrics
    spark:    {enabled: true}   # Spark PrometheusServlet (PodMonitor)
    postgres: {enabled: true}   # CNPG PodMonitor (operatör üretir; sadece gate)

  # Grafana'nın okuyacağı UWM Thanos-querier endpoint'i. OpenShift'te sabit
  # platform namespace'i `openshift-monitoring`'tedir (cross-namespace,
  # kasıtlı — helm-check bunu "recognized external" olarak tanır).
  # Port :9091 = tenancy-aware Thanos (namespace-scoped okuma).
  datasource:
    thanosUrl: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091

  grafana:
    image: docker.io/grafana/grafana:11.3.0
    replicas: 1
    route:
      host: grafana            # -> grafana.<global.domain> (lakehouse.routeHost)
    oidc:
      # Keycloak OIDC login. microk8s testinde false (anonim/admin login yeterli),
      # prod'da values-prod.example.yaml'da true.
      enabled: false
      clientId: grafana
      # Client secret'ın DURDUĞU Secret adı (materyal burada DEĞİL — secrets.mode).
      secretName: grafana-oidc
      # Confidential client secret DEĞERİ. Varsayılan boş (secrets.mode): materyal
      # burada DEĞİL — `grafana-oidc` Secret'ı ExternalSecret/Vault ya da elle
      # `oc create secret` ile sağlanır. Dolu verilirse (yalnız dev/test) hem
      # 10-keycloak.yaml grafana client `secret:` alanını hem de monitoring/
      # grafana.yaml'ın render ettiği `grafana-oidc` Secret'ını AYNI kaynaktan
      # tohumlar (kafkaUi.oidc.clientSecret ile birebir aynı desen — tek kaynak,
      # drift yok).
      clientSecret: ""
    # Grafana admin kimlik bilgisinin durduğu Secret adı (materyal burada DEĞİL).
    adminSecretName: grafana-admin
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits:   {cpu: 500m, memory: 512Mi}

  # PrometheusRule alert eşikleri. Değerler values ile ayarlanabilir.
  alerts:
    connectorFailedFor: 5m           # KafkaConnector FAILED bu süre boyunca
    consumerLagThreshold: 100000     # toplam consumer lag (mesaj)
    dlqRatePerSec: 1                 # DLQ topic'ine yazım hızı (msg/s)
    cnpgReplicationLagSeconds: 30    # CNPG streaming replication gecikmesi
    trinoErrorRatePerSec: 5          # Trino başarısız sorgu hızı (query/s)
    trinoCoordinatorDownFor: "2m"    # Trino coordinator scrape hedefi (up==0) bu süre down ise alert
    podRestartThreshold: 5           # 1 saatte pod restart sayısı
    pvcFreeFraction: 0.15            # PVC boş oranı bunun altına düşerse (kubelet_volume_stats) → dolma uyarısı
    cnpgBackupStaleHours: 26         # son başarılı CNPG yedeği bu saatten eskiyse → yedek başarısız/eski
    hpaMaxedFor: "15m"               # HPA current==max bu süre boyunca → autoscaler tavanda (kapasite doygun)
    kafkaUnderReplicatedFor: "10m"   # under-replicated partition >0 bu süre → broker down / ISR daralması

  # Dashboard-as-code toggle'ları (ConfigMap'ler koşullu).
  dashboards:
    kafka: true
    cnpg: true
    trino: true
    iceberg: true
    console: true
    platform: true

# Component version/image pins. Single place per pinned image so
# environments override one line instead of hunting through templates.
versions:
  # Used by BOTH `pg-nessie` and `pg-apicurio` CNPG Clusters
  # (chart/templates/02-postgres-ha.yaml, 11-apicurio-registry.yaml) — one
  # value so the two clusters can never drift apart on Postgres version.
  cnpgPostgresImage: ghcr.io/cloudnative-pg/postgresql:16.4
  apicurioImage: quay.io/apicurio/apicurio-registry:3.0.6
  # *****************************************************************
  # *** COHERENT STRIMZI VERSION TRIPLE — `strimziApi` / `kafka` /   ***
  # *** `kafkaMetadata` MOVE TOGETHER AND MUST MATCH THE STRIMZI     ***
  # *** OPERATOR ACTUALLY INSTALLED ON THE TARGET CLUSTER.           ***
  # *****************************************************************
  # This chart's customer target is UPSTREAM COMMUNITY Strimzi (via OLM's
  # `community-operators` catalog package `strimzi-kafka-operator` — see
  # `operators/03-strimzi.yaml` — NOT Red Hat's certified "Streams for Apache
  # Kafka"/AMQ Streams). Upstream Strimzi >=1.1.0 serves the `Kafka`/
  # `KafkaNodePool`/`KafkaTopic`/`KafkaUser`/`KafkaConnect`/`KafkaConnector`
  # CRDs ONLY as `kafka.strimzi.io/v1` — `v1beta2` is gone entirely on that
  # build. Since this project's actual target is upstream (not Red Hat's
  # paid product), the default below is `v1`, not `v1beta2`.
  #
  # The three values below are a SINGLE compatible combination (Strimzi
  # operator 0.51.0 — which, usefully, serves BOTH `v1` and `v1beta2` from
  # the same CRD in this transition window — on microk8s/k8s 1.33):
  # `strimziApi: v1` + `kafka: 4.2.0` + `kafkaMetadata: 4.2-IV1` reconciles
  # the `Kafka` CR to `Ready=True` under `apiVersion: kafka.strimzi.io/v1`.
  #
  # DO NOT treat this triple as fire-and-forget on a different cluster/
  # operator build. Before every install/upgrade against a NEW target
  # (e.g. a real OpenShift cluster), re-verify all three against the
  # operator ACTUALLY installed there:
  #   oc get crd kafkas.kafka.strimzi.io -o jsonpath='{.spec.versions[*].name}'
  #   # -> confirm it lists `v1` (and whether `v1beta2` is still also served,
  #   #    for a safe rollback path) — then set `versions.strimziApi`
  #   #    to whichever the CRD actually serves.
  #   oc logs deploy/strimzi-cluster-operator -n <ns> | grep -i "supported"
  #   # or consult that operator build's release notes for its supported
  #   # Kafka version list, then pin `versions.kafka` to one it accepts and
  #   # `versions.kafkaMetadata` to the matching KRaft metadata log format.
  #
  # `kafka.strimzi.io/v1beta2` + Kafka `3.7.0` + metadataVersion `3.7-IV2`
  # remains a valid, supported combination ONLY on Red Hat's certified
  # "Streams for Apache Kafka" (paid, OpenShift-only) operator channel —
  # that is explicitly NOT this project's target. An environment that is
  # genuinely pinned to that Red Hat product should override all three back:
  # `strimziApi: v1beta2`, `kafka: "3.7.0"`, `kafkaMetadata: "3.7-IV2"`.
  #
  # `versions.strimziApi` parameterizes `apiVersion: kafka.strimzi.io/<...>`
  # across EVERY Strimzi CR this chart renders: `Kafka`/`KafkaNodePool`/
  # `KafkaTopic`/`KafkaUser` (03-kafka-strimzi.yaml), `KafkaUser` `spark-nginx`
  # (14-nginx-ingest.yaml), `KafkaConnect` (12-kafka-connect.yaml), and
  # `KafkaUser` `kafka-ui` (console/kafka-ui.yaml) — one switch, no template
  # edits needed to flip
  # between `v1`/`v1beta2`. `chart/templates/_prereq-check.tpl`'s
  # `.Capabilities.APIVersions.Has` check reads this same value.
  strimziApi: v1
  # Strimzi `Kafka` CR `spec.kafka.version` (chart/templates/03-kafka-strimzi.yaml).
  # Part of the coherent version triple above — see that comment block before
  # changing this value in isolation. With Strimzi operator 0.51.0, 3.7.0
  # (paired with the Red Hat-certified-only v1beta2 combination) is rejected
  # by every upstream Strimzi build (0.45.0 wants 3.8.x/3.9.x; 1.1.0 and
  # 0.51.0 both want 4.x) — 4.2.0 is the version this chart's Kafka backbone
  # reconciles Ready with.
  kafka: "4.2.0"
  # Strimzi `Kafka` CR `spec.kafka.metadataVersion` (KRaft metadata log
  # format version, chart/templates/03-kafka-strimzi.yaml). Part of the
  # coherent version triple above — MUST move in lockstep with `kafka` (and,
  # transitively, with whatever `strimziApi` the installed operator actually
  # serves). Pinned explicitly so a future `versions.kafka` bump never
  # silently drags the KRaft metadata log format along with it (a one-way
  # upgrade). "4.2-IV1" is the matching metadataVersion for Strimzi 0.51.0 +
  # Kafka 4.2.0 (`kubectl get kafka -o
  # jsonpath='{.status.kafkaMetadataVersion}'` on a reconciled cluster) —
  # re-verify against the target operator build's own supported
  # metadataVersion list if `kafka` above is ever re-pinned.
  kafkaMetadata: "4.2-IV1"
  # Used by chart/templates/04-nessie-ha.yaml / 06-trino-ha.yaml.
  nessieImage: ghcr.io/projectnessie/nessie:0.104.3
  # PINNED >= 465 (NOT `latest` — air-gapped/GitOps platform requires an
  # exact, mirror-able tag). `iceberg.rest-catalog.oauth2.server-uri` (the
  # property that lets Trino's Iceberg REST-catalog OAuth2 client
  # auto-refresh a client-credentials token against a separate IdP, instead
  # of only accepting a static non-refreshing bearer `.oauth2.token`) was
  # only added in Trino Release 465 (20 Nov 2024) — this chart's prior pin
  # (439) predates it and CANNOT do Nessie machine-auth client-credentials
  # at all (proven live in
  # docs/superpowers/spikes/2026-08-06-nessie-machine-auth-config.md §1 —
  # `.credential` alone 439-side fails with "please configure ... the
  # oauth2-server-uri property", and 439 has no way to set it). 476 was
  # live-verified in a Podman spike (Keycloak 26 + Nessie 0.104.3 + this
  # exact Trino tag): `iceberg.rest-catalog.oauth2.{credential,server-uri,
  # scope}` all accepted, CREATE TABLE/INSERT/SELECT against Nessie
  # succeeded as `service-account-svc-trino-nessie`, AND a follow-up query
  # after the Keycloak realm's access-token lifespan (90s) elapsed still
  # succeeded — confirmed real auto-refresh, not a coincidentally-long-lived
  # token. Also matches the already-pinned Iceberg 1.9.0 / Nessie 0.104.3
  # version matrix (icebergSparkRuntime/icebergKafkaConnect below) — Trino
  # 476 bundles a compatible Iceberg core. Re-verify against the target
  # cluster's own air-gapped mirror before bumping again.
  trinoImage: trinodb/trino:476
  # chart/templates/05-spark-operator.yaml: driver/executor image + the
  # `spark.jars.packages` pins baked into `spark-defaults` (Spark-side
  # Iceberg support — an independent artifact/release cadence from Kafka
  # Connect's `icebergKafkaConnect` below; the two do NOT need to match).
  sparkImageTag: "1.0"
  # Also reused for `org.apache.spark:spark-sql-kafka-0-10_2.12` below AND
  # `ScheduledSparkApplication.spec.sparkVersion` — single source, same
  # Spark minor release (parity hardening, same convention as
  # `cnpgPostgresImage` above).
  sparkVersion: "3.5.1"
  icebergSparkRuntime: "1.9.0"      # org.apache.iceberg:iceberg-spark-runtime-3.5_2.12
                                    # AND :iceberg-aws-bundle (version-matched S3FileIO AWS SDK v2)
  hadoopAws: "3.3.4"                # org.apache.hadoop:hadoop-aws
  # chart/templates/12-kafka-connect.yaml: custom Connect image tag + the
  # `spec.build.plugins` version pins (single source per plugin, so an
  # environment overrides one line instead of hunting through the template).
  connectImageTag: "1.0"
  debezium: "2.7.3"                 # io.debezium debezium-connector-{sqlserver,mongodb} (".Final" suffix appended in template)
  aivenJdbc: "6.10.0"               # Aiven JDBC source connector
  mssqlJdbc: "12.8.1.jre11"         # com.microsoft.sqlserver:mssql-jdbc (bundled into the aiven-jdbc plugin dir)
  postgresqlJdbc: "42.7.4"          # org.postgresql:postgresql (bundled into the aiven-jdbc plugin dir)
  icebergKafkaConnect: "1.9.0"      # org.apache.iceberg:iceberg-kafka-connect-runtime (sink plugin;
                                    # aligned to icebergSparkRuntime above — single Iceberg version everywhere)
  apicurioConverter: "2.6.5"        # io.apicurio apicurio-registry-distro-connect-converter (".Final" suffix appended in template)
  # Apache Camel Kafka Connector source-connector pin (http-source /
  # mqtt-source / spring-rabbitmq-source), baked into the connect image
  # (images/connect/Dockerfile, ARG CAMEL_KC_VERSION). Backs the Console
  # stream/http, stream/mqtt, stream/rabbitmq source types (Plan B3).
  camelKafkaConnector: "4.10.3"
  # chart/templates/09-zeppelin.yaml: internally-built Zeppelin image
  # (images/zeppelin/Dockerfile — apache/zeppelin, which bundles the Spark
  # interpreter, + the trino-jdbc driver baked onto the JDBC interpreter
  # classpath for the %trino interpreter). Same `.Values.global.imageRegistry`
  # + tag convention as `supersetImageTag`/`dbtImageTag`. Independent release
  # cadence from `sparkImageTag` above (Zeppelin is an interactive notebook,
  # not a submitted SparkApplication).
  zeppelinImageTag: "1.0"
  # chart/templates/10-keycloak.yaml: OPTIONAL override for the Keycloak
  # Operator CR's `spec.image`. Empty string (default) means the field is
  # OMITTED from the rendered CR entirely — matching prod-manifests/
  # 10-keycloak.yaml exactly, which never sets `spec.image` and lets the
  # Keycloak Operator pick its own bundled default image. Set a real value
  # here only if a specific Keycloak build/version needs to be pinned.
  keycloakImage: ""
  # chart/templates/console/console.yaml: internally-built console
  # backend/frontend images (same `.Values.global.imageRegistry` + tag
  # convention as `connectImageTag`/`sparkImageTag` above).
  consoleBackendImageTag: "1.0"
  consoleFrontendImageTag: "1.0"
  # chart/templates/console/kafka-ui.yaml: external (community) image, same
  # full-string-pin convention as `nessieImage`/`trinoImage` above (not built
  # via `.Values.global.imageRegistry` — kafbat-ui is pulled straight from ghcr.io).
  kafkaUiImage: ghcr.io/kafbat/kafka-ui:v1.5.0
  # Superset Alerts & Reports için Celery broker/results-backend Redis'i.
  # Üçüncü-parti → full-string-pin (kafkaUiImage/configurableHttpProxyImage gibi),
  # global.imageRegistry+tag DEĞİL. `--save ""`+`--appendonly no` ile diske yazmaz
  # → OpenShift arbitrary-UID uyumlu. Air-gapped'te mirror'lanmalı.
  redisImage: "docker.io/library/redis:7.4-alpine"
  # chart/templates/19-superset.yaml: internally-built Superset image (same
  # `.Values.global.imageRegistry` + tag convention as `consoleBackendImageTag`
  # above). Custom-built (images/superset/Dockerfile) because the stock
  # `apache/superset:4.1.1` ships with NO trino driver — the Superset<->Trino
  # connection/mutator would crash without `trino[sqlalchemy]` installed
  # (docker-verified spike finding, 2026-08-04 consumption-b1 plan). Task 7's
  # OIDC-refresher sidecar reuses this same built ref.
  supersetImageTag: "1.0"
  # chart/templates/20-dbt.yaml: dbt-trino Certified Gold CronJob image
  # (Consumption slice b2). Same `.Values.global.imageRegistry` + tag
  # convention as `supersetImageTag` above.
  dbtImageTag: "1.0"
  # chart/templates/23-jupyterhub.yaml: internally-built Hub image (same
  # `.Values.global.imageRegistry` + tag convention as `supersetImageTag`/
  # `dbtImageTag` above). Custom-built (images/jupyterhub/Dockerfile) because
  # stock jupyterhub/jupyterhub ships neither the KubeSpawner nor the
  # Keycloak OAuthenticator this platform's Hub needs — pins JupyterHub 5.5.0
  # + jupyterhub-kubespawner 7.1.0 + oauthenticator 17.4.0 +
  # jupyterhub-idle-culler 2.0.0 (compatible matrix, see that Dockerfile's
  # header comment). Gated by `components.jupyter`.
  jupyterhubImageTag: "1.0"
  # chart/templates/23-jupyterhub.yaml: internally-built single-user notebook
  # image the Hub's KubeSpawner launches per user (same
  # `.Values.global.imageRegistry` + tag convention as `jupyterhubImageTag`
  # above — an INDEPENDENT release cadence, the Hub and the per-user image
  # are separate artifacts). Custom-built (images/jupyter/Dockerfile) —
  # quay.io/jupyter/pyspark-notebook:spark-3.5.1 (matches `sparkVersion`
  # above) + pyiceberg[s3fs,pyarrow]/trino[sqlalchemy] + the
  # iceberg-spark-runtime-3.5_2.12/iceberg-aws-bundle jars pinned to
  # `icebergSparkRuntime` = 1.9.0 (same Iceberg/Nessie/Spark matrix as
  # `sparkImageTag` above). Gated by `components.jupyter`.
  jupyterImageTag: "1.0"
  # chart/templates/23-jupyterhub.yaml: the Hub's configurable-http-proxy —
  # a SEPARATE Deployment from the Hub itself, because the internally-built
  # `jupyterhubImageTag` image (images/jupyterhub/Dockerfile) is python-slim
  # + pip only and does NOT bundle Node.js/npm's `configurable-http-proxy`
  # (that's JupyterHub's own default proxy implementation, a standalone npm
  # package, not a Python one). External full-string pin (same convention as
  # `kafkaUiImage` above — not built via `.Values.global.imageRegistry`),
  # matching the npm version (5.3.0) exercised live in the
  # 2026-08-06-jupyterhub-config.md spike.
  configurableHttpProxyImage: jupyterhub/configurable-http-proxy:5.3.0
  # chart/templates/17-minio.yaml: DEV/PoC/e2e-only in-cluster MinIO
  # (components.minio, default false — see that flag's comment). MinIO has
  # no semver; pinned to a specific RELEASE tag. POC-VERIFY before bumping
  # against a real cluster (`docker pull` + smoke-test first).
  minioImage: "quay.io/minio/minio:RELEASE.2024-01-16T16-07-38Z"
  # chart/templates/18-bucket-init.yaml: vendor-generic `mc` (MinIO Client)
  # image used ONLY to run `mc alias set` + `mc mb` against WHATEVER S3
  # endpoint `storage.s3.secretName` points at — works against any
  # S3-compatible store (not just the dev MinIO above). POC-VERIFY before
  # bumping.
  mcImage: "quay.io/minio/mc:RELEASE.2024-01-13T08-44-48Z"
  # chart/templates/20-connect-acl-seed.yaml: vendor-generic kubectl+jq image
  # used ONLY to `kubectl get`/`kubectl patch` the `connect` KafkaUser CR
  # (merge-add its static base ACLs — see `kafkaConnect.connectBaseAcls`
  # below). Overridable for air-gapped/OpenShift environments that mirror
  # their own kubectl image instead of pulling from docker.io.
  kubectlImage: "alpine/k8s:1.29.2"

# CNPG (CloudNativePG) HA Postgres clusters: pg-nessie and pg-apicurio
# (pg-apicurio gated separately from the Apicurio app itself — see
# chart/templates/11-apicurio-registry.yaml). Both clusters' Service DNS
# names are resolved by consumers ONLY via the `lakehouse.svc.pgNessieRw` /
# `lakehouse.svc.pgApicurioRw` helpers in _helpers.tpl — never hardcoded.
# `walStorage`/`resources`/`monitoring`/backup `compression: gzip` are
# present on BOTH clusters, even though the two clusters are sized
# differently for their workloads.
postgres:
  nessie:
    instances: 3
    primaryUpdateStrategy: unsupervised
    database: nessie
    owner: nessie
    storage:
      # Empty (default) = the cluster's default StorageClass (CNPG omits the
      # field entirely when unset — chart/templates/02-postgres-ha.yaml).
      # Set a real StorageClass name here if the cluster has no default one,
      # or `components.storage: true` + `storage.classes.block.name` to use
      # this chart's own opt-in StorageClass.
      storageClass: ""
      size: 50Gi
    walStorage:
      storageClass: ""
      size: 20Gi
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: "2"
    monitoring:
      enablePodMonitor: true
    backup:
      destinationPath: s3://backups/nessie-pg
      # S3 endpoint — pre-Helm placeholder token, same
      # `{{TOKEN}}` convention used throughout prod-manifests/ (see e.g.
      # 01-storage.yaml's S3 Secret); NOT Helm template syntax —
      # this is plain values-file string data, so Helm's template engine
      # never parses it. Override in a real values-<env>.yaml.
      endpointURL: "{{S3_ENDPOINT}}"
      retentionPolicy: 30d
      walMaxParallel: 4
      dataJobs: 2
  apicurio:
    instances: 3
    database: apicurio
    owner: apicurio
    storage:
      storageClass: ""
      size: 10Gi
    walStorage:
      storageClass: ""
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    monitoring:
      enablePodMonitor: true
    backup:
      destinationPath: s3://backups/pg-apicurio
      endpointURL: "{{S3_ENDPOINT}}"
      retentionPolicy: 30d
      walMaxParallel: 4
      dataJobs: 2
  superset:
    instances: 3
    database: superset
    owner: superset
    storage:
      storageClass: ""
      size: 10Gi
    walStorage:
      storageClass: ""
      size: 5Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    monitoring:
      enablePodMonitor: true
    backup:
      destinationPath: s3://backups/pg-superset
      endpointURL: "{{S3_ENDPOINT}}"
      retentionPolicy: 30d
      walMaxParallel: 4
      dataJobs: 2
  # Keycloak's own CNPG cluster (`pg-keycloak`). Gated by the SAME
  # `.Values.components.postgres` toggle as
  # pg-nessie/pg-apicurio above (one "postgres subsystem" switch, see
  # chart/templates/02-postgres-ha.yaml header) — the app itself
  # (Keycloak CR/RealmImport/Route) is gated separately by
  # `.Values.components.keycloak` in chart/templates/10-keycloak.yaml.
  # NOTE: unlike pg-nessie/pg-apicurio, pg-keycloak has NO
  # `postgresql.parameters` block, NO `monitoring.enablePodMonitor` block,
  # uses `zstd` (not `gzip`) backup compression, and has NO ScheduledBackup
  # CR at all.
  keycloak:
    instances: 3
    primaryUpdateStrategy: unsupervised
    database: keycloak
    owner: keycloak
    storage:
      storageClass: ""
      size: 20Gi
    walStorage:
      storageClass: ""
      size: 10Gi
    resources:
      requests:
        memory: 512Mi
        cpu: 200m
      limits:
        memory: 1Gi
        cpu: "1"
    backup:
      destinationPath: s3://backups/keycloak-pg
      endpointURL: "{{S3_ENDPOINT}}"
      retentionPolicy: 30d
      walMaxParallel: 4
      dataJobs: 2

# Apicurio Registry application (Deployment/Service/PodDisruptionBudget).
# Datasource host is built from the
# `lakehouse.svc.pgApicurioRw` helper in the template — never hardcoded.
apicurio:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Strimzi Kafka (KRaft) backbone. The Kafka cluster NAME itself is
# NOT parametrized here (stays hardcoded `kafka` in the template) — Strimzi
# derives the bootstrap Service name from it (`kafka-kafka-bootstrap`),
# which MUST match `lakehouse.svc.kafkaBootstrap` in _helpers.tpl. Only
# sizing/version/topic counts/external listener type are values-driven;
# listener auth types (plain / tls+scram-sha-512 / external+scram-sha-512)
# and every KafkaUser ACL are preserved verbatim in the template (not
# values — they are the load-bearing security model from sub-project A/B).
kafka:
  # `storage.class` empty (default) = the cluster's default StorageClass —
  # chart/templates/03-kafka-strimzi.yaml omits `storage.class` entirely
  # when unset (same storage-neutrality convention as
  # `postgres.*.storage.storageClass` / `zeppelin.storageClassName` above).
  nodePools:
    controller:
      replicas: 3
      storage:
        size: 10Gi
        class: ""
      resources:
        requests: {memory: 512Mi, cpu: 250m}
        limits: {memory: 1Gi, cpu: 500m}
    broker:
      replicas: 3
      storage:
        size: 100Gi
        class: ""
      resources:
        requests: {memory: 1Gi, cpu: 500m}
        limits: {memory: 4Gi, cpu: "2"}
  # External (route) listener type — `route` on OpenShift w/ Strimzi's
  # Route-based external listener. Kept overridable for non-OpenShift envs
  # (e.g. `loadbalancer`/`nodeport`) without touching the template.
  # COUPLING: switching this to `nodeport` requires raising
  # `namespaceConfig.quota.serviceNodePorts` to at least
  # `nodePools.broker.replicas + 1` (see that key's comment above) —
  # Strimzi's per-broker + bootstrap NodePort Services get rejected by this
  # chart's OWN default quota otherwise. `route` needs no NodePort quota at all.
  externalListenerType: route
  topics:
    nginxAccess: {partitions: 12, replicas: 3}
    lmsEvents: {partitions: 6, replicas: 3}
    connectConfigs: {partitions: 1, replicas: 3}
    connectOffsets: {partitions: 25, replicas: 3}
    connectStatus: {partitions: 5, replicas: 3}
    # Shared Debezium control topics (snapshot-lifecycle Task 4) — always
    # present, not per-source. debeziumSignals MUST stay single-partition:
    # Debezium signal topics require ordering (all connectors read all
    # signals via the same KafkaSignalChannel).
    debeziumSignals: {partitions: 1, replicas: 3}
    debeziumNotifications: {partitions: 3, replicas: 3}
  # Kafka iç-topic replication ayarları. Prod default = 3/3/2/3/2 (3+ broker
  # gerektirir). Tek-broker ortam (microk8s-ingest) hepsini 1'e çeker.
  replication:
    offsetsTopic: 3
    txnStateLog: 3
    txnStateLogMinIsr: 2
    default: 3
    minInsync: 2

# Core-slice/Keycloak decoupling switch (feat/oidc-optional). Trino's OAuth2
# authenticator does *eager* OIDC-discovery at startup and crash-loops
# forever if the issuer isn't reachable, meaning Trino has a hard,
# undocumented install-order dependency on Keycloak being up FIRST — even
# though `components.keycloak` implies Keycloak is independently optional.
# This switch decouples Nessie (04-nessie-ha.yaml) and Trino
# (06-trino-ha.yaml) from the `oidc-credentials` Secret entirely when set to
# `false`.
#
#   auth.oidc.enabled: true  (DEFAULT) — unchanged prod behavior. Trino
#     renders `http-server.authentication.type=oauth2` + the oauth2
#     issuer/client-id/client-secret lines; Nessie renders
#     `QUARKUS_OIDC_ENABLED=true` + the OIDC auth-server-url/client-id env
#     vars. Keycloak MUST be up and its realm/OIDC discovery endpoint
#     reachable BEFORE Trino's coordinator can start at all (see NOTES.txt
#     install-ordering section) — this is a hard prod requirement, not a bug.
#
#   auth.oidc.enabled: false — DEV/SMOKE-TEST ONLY. Trino renders with NO
#     authentication.type at all (no-auth mode: web UI + client connections
#     are unauthenticated) and omits the oauth2 issuer/client lines
#     entirely; Nessie omits `QUARKUS_OIDC_*`/`NESSIE_SERVER_AUTHENTICATION_
#     ENABLED` and runs unauthenticated too. This decouples the whole core
#     ingest slice (Postgres/Kafka/Nessie/Apicurio/Trino/S3) from Keycloak
#     entirely, so it can be smoke-tested (or run in a throwaway dev
#     namespace) without ever standing up an IdP. NEVER set this to `false`
#     in a real/prod values-<env>.yaml — there is no authentication on
#     Trino's HTTP/JDBC endpoints or Nessie's REST API in this mode.
auth:
  oidc:
    enabled: true

# OIDC credentials Secret NAME reference only. Material
# (issuer-url, per-client id/secret) is NEVER defined here — provisioned
# out-of-band under this name (same "name reference only" convention as
# `storage.s3.secretName`, see chart/templates/01-storage.yaml).
# Consumed by Nessie (04-nessie-ha.yaml, `QUARKUS_OIDC_AUTH_SERVER_URL`) and
# Trino (06-trino-ha.yaml, `OIDC_ISSUER`/`OIDC_CLIENT_ID`/`OIDC_CLIENT_SECRET`);
# Keycloak/Console (later tasks) reuse the same Secret name. Only actually
# referenced by the templates when `auth.oidc.enabled` is true (see above);
# when false, neither template reads this Secret at all, so it does not even
# need to exist on the cluster.
oidc:
  secretName: oidc-credentials

# Nessie HA. Replicas/resources/HPA-PDB thresholds and the two Iceberg warehouse S3
# locations are values-driven; the warehouse NAMES themselves
# ("warehouse"/"rawdata") stay fixed literals in the template env var KEYS
# (`NESSIE_CATALOG_WAREHOUSES_<NAME>_LOCATION`) — same convention as Kafka
# topic names in 03-kafka-strimzi.yaml, since Trino's `lakehouse`/`rawlake`
# catalogs (06-trino-ha.yaml) are coupled to them by name, not by value.
# Image pinned under `versions.nessieImage` (single source, see that key).
nessie:
  replicas: 2
  # QUARKUS_OIDC_CLIENT_ID literal from prod-manifests/04-nessie-ha.yaml.
  oidcClientId: nessie
  # Machine-auth: confidential service-account client secrets for the 4
  # `svc-<x>-nessie` Keycloak clients (chart/templates/10-keycloak.yaml
  # `clients[].secret`, single source — the two can never drift), one per
  # engine/service that talks to Nessie's Iceberg REST catalog directly with
  # its own identity: Trino, Spark (batch/streaming jobs), Kafka Connect
  # (Iceberg sink), and Zeppelin (%spark interpreter). Gated conceptually by
  # `auth.oidc.enabled` — the clients themselves only render when that's
  # true (04-nessie-ha.yaml's OIDC validation is off entirely when false, so
  # these service accounts would be dead weight). Same dev-convenience
  # contract as `superset.trino.oidc.clientSecret`/`dbt.oidc.clientSecret`:
  # empty default => no dev-convenience Secret rendered inline; provision a
  # real value out-of-band per `.Values.secrets.mode` for non-dev tiers.
  # NO audience mapper on any of these — Nessie validates the token by
  # ISSUER only (not audience), same as the c2 `svc-sandbox-<dept>` clients.
  machineAuth:
    trinoClientSecret: ""     # svc-trino-nessie
    sparkClientSecret: ""     # svc-spark-nessie
    connectClientSecret: ""   # svc-connect-nessie
    zeppelinClientSecret: ""  # svc-zeppelin-nessie
  catalog:
    defaultWarehouse: warehouse
    warehouse:
      # Also read directly by Trino's `lakehouse` catalog
      # (`trino.catalogs.lakehouse.warehouse` in 06-trino-ha.yaml, single
      # source — MUST match `NESSIE_CATALOG_WAREHOUSES_WAREHOUSE_LOCATION`).
      location: s3://depo/warehouse
    rawdata:
      location: s3://ham-veri/warehouse
  resources:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: "1"
  pdb:
    minAvailable: 1
  hpa:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# Trino HA: coordinator + worker, OIDC, internal shared-secret,
# Iceberg/Nessie catalogs. Coordinator/worker counts, memory tuning, and image are values-driven;
# JVM flags/OIDC wiring/access-control rules/S3 catalog config are
# preserved verbatim in the template (load-bearing, not values). Image
# pinned under `versions.trinoImage`.
trino:
  # 32+ char random string for `internal-communication.shared-secret`
  # (pod-to-pod auth, HMAC). Empty by default: chart/templates/06-trino-ha.yaml
  # then does NOT render the `trino-internal-secret` Secret at all, following
  # the SAME "name reference only" contract as `storage.s3.secretName`
  # — an ExternalSecrets Operator/Vault backend or a manual
  # `oc create secret generic trino-internal-secret ...` must provision it
  # out-of-band before install (per `.Values.secrets.mode`). Set a real value
  # here only for local/dev convenience — that renders the Secret inline.
  internalSharedSecret: ""
  # node-scheduler.include-coordinator (06-trino-ha.yaml). HA prod = false
  # (dedicated workers). Single-node (worker.replicas=0) MUST be true, else
  # queries have no execution node.
  includeCoordinator: false
  # Opsiyonel pod scheduling önceliği (coordinator + worker). Boş (default) =
  # priorityClassName RENDER EDİLMEZ (byte-identical). Set edilirse mevcut bir
  # PriorityClass adı olmalı — chart cluster-scoped PriorityClass CR YARATMAZ
  # (namespace-scoped/no-ClusterRole duruşu; İdare/OpenShift built-in'i sağlar,
  # örn. openshift-user-critical / system-cluster-critical).
  priorityClassName: ""
  coordinator:
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 6Gi
        cpu: "4"
    # PodDisruptionBudget (Trino OSS tek-coordinator → SPOF-koruma). minAvailable:1
    # voluntary eviction'ı (node drain / autoscaler) bloklar. Rutin drain için
    # operatör bunu geçici 0'a çeker VEYA scale-then-drain uygular (README).
    pdb:
      minAvailable: 1
  worker:
    replicas: 3
    resources:
      requests:
        memory: 4Gi
        cpu: "1"
      limits:
        memory: 8Gi
        cpu: "4"
    hpa:
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
  # JVM heap + Trino query-memory tuning (prod-manifests/06-trino-ha.yaml
  # ConfigMap: jvm.config shared by coordinator+worker; coordinator plans
  # only (small per-node budget), worker executes (larger per-node budget).
  memory:
    jvmXmx: 6G
    queryMaxMemory: 10GB
    queryMaxMemoryPerNodeCoordinator: 1.5GB
    heapHeadroomPerNode: 1GB
    queryMaxMemoryPerNodeWorker: 3GB
  jvm:
    # `-XX:G1HeapRegionSize` (jvm.config, shared ConfigMap key for both
    # coordinator + worker — see `memory:` comment above). Default `32M` is
    # prod-preserving (this chart's HA prod worker/coordinator heaps are
    # sized well above 32GB, where G1's own heuristic would also land near
    # 32M). 32M is inefficient when a node's heap is well UNDER 32GB (fewer,
    # oversized regions -> coarser GC granularity) — use a smaller value like
    # "16M" in that case (e.g. a memory-minimal single-node overlay; see
    # values-microk8s-ingest.yaml).
    g1HeapRegionSize: "32M"
  rbac:
    # Rol/grup-bazlı satır-filtresi + kolon-maskesi (şartname 3.5.3). Açınca rules.json
    # grup-modeline geçer; kapalı = bugünkü .*-permissive kurallar. Bir grup kaynağı gerektirir
    # → ldapGroups.enabled=true zorunlu (fail-loud). Tüm sizing tier'larında off.
    enabled: false
    adminGroup: "lakehouse-admins"
    analystGroup: "lakehouse-analysts"
    userGroup: "lakehouse-users"
    # [{group, catalog, schema, table, filter?, columns?: [{name, mask}]}]
    # BİR girdi = BİR Trino tablo kuralı (filter satır + columns[].mask kolon AYNI kuralda).
    tablePolicies: []
    # rbac.enabled=false (dev/smoke): admin identity as a Trino user-regex.
    # EMPTY (default) = NO catalog-admin in rbac-off mode (removes the old
    # hardcoded `alice` footgun — a user literally named alice was catalog-admin).
    # For real admin use rbac.enabled=true (AD groups).
    offModeAdminUser: ""
    # rbac.enabled=true: when true, DROP the permissive `.*` read-only catalog +
    # `.*`-SELECT table floors so an unmatched principal gets NO access
    # (deny-by-default). Default false = current permissive floors (backward-compat).
    denyUnmatched: false
  ldapGroups:
    # Trino, kimliği doğrulanan kullanıcının gruplarını doğrudan AD/LDAP'tan çözer.
    enabled: false
    url: "ldaps://ad.example.local:636"
    bindDn: ""
    bindPassword: ""     # dev-convenience; prod out-of-band Secret trino-ldap-bind/key=password
    userBaseDn: ""
    userSearchFilter: "(&(objectClass=person)(sAMAccountName={0}))"
    groupNameAttribute: "cn"
  # Worker spill-to-disk (Slice C2): bellek-üstü hash-join/aggregation/sort
  # operatörleri diske taşar → RESOURCE_EXHAUSTED yerine yavaş tamamlanır.
  # Ayrı sizeLimit'li emptyDir'e yazar (/data/trino/spill) — node rootfs'ini
  # DOLDURAMAZ. Sadece worker (HA prod'da coordinator plan-only). Default açık.
  spill:
    enabled: true
    sizeLimit: "10Gi"                # worker spill emptyDir tavanı
    memoryRevokingThreshold: 0.9     # bu doluluğun üstünde spill'e revoke başlar
    memoryRevokingTarget: 0.5        # revoke hedef doluluğu
  # Coordinator resource-groups (Slice C2): sorgu admission + adil paylaşım.
  # Ağaç: bi (BI/notebook/dbt servis hesapları — garantili), admin
  # (lakehouse-admins, YALNIZ ldapGroups.enabled iken), adhoc (catch-all —
  # analyst+herkes, concurrency-capped → kaçak sorgu KUYRUKLANIR, reddedilmez).
  # Limitler kasıtlı gevşek; koruma yalnız contention altında devreye girer.
  # Memory yüzde-bazlı (cluster ile ölçeklenir). Default açık.
  resourceGroups:
    enabled: true
    global: {softMemoryLimit: "100%", hardConcurrencyLimit: 100, maxQueued: 1000}
    bi:     {softMemoryLimit: "40%",  hardConcurrencyLimit: 20,  maxQueued: 100, weight: 3}
    admin:  {softMemoryLimit: "60%",  hardConcurrencyLimit: 10,  maxQueued: 100, weight: 2}
    adhoc:  {softMemoryLimit: "30%",  hardConcurrencyLimit: 10,  maxQueued: 200, weight: 1}

# Cross-cutting Spark job tuning knobs, not scoped to a single
# ScheduledSparkApplication (see `sparkOperator.*` below for the
# per-CR schedule/sizing knobs).
spark:
  # jobs/iceberg_maintenance.py's ThreadPoolExecutor parallelism (table-level
  # compaction/expire_snapshots/remove_orphan_files fan-out, env
  # MAINTENANCE_MAX_PARALLEL) — scale alongside discovered
  # namespace/table-pair count.
  maintenanceMaxParallel: 4

# Spark Operator RBAC + SparkApplication templates. Only the
# `iceberg-maintenance` ScheduledSparkApplication's schedule/concurrency/driver+executor sizing
# and the shared `spark-defaults` image/package pins (see `versions.*`
# above) are values-driven; the Iceberg/S3/shuffle-tracking config in
# `spark-defaults.conf` and the RBAC rules are preserved verbatim in the
# template (load-bearing, not values). Jobs (prod-manifests/jobs/*.py) are
# baked into the `spark-py` image and referenced by `local://` path — they
# are NOT chart templates, only referenced by name/image here.
sparkOperator:
  maintenance:
    schedule: "0 * * * *"          # hourly; expire/orphan-cleanup cadence lives in the job script itself
    concurrencyPolicy: Forbid
    # Bronze retention TTL: jobs/iceberg_maintenance.py issues a
    # partition-aligned metadata DELETE (WHERE __ts_ms < date_sub(current_date(), N))
    # against every rawlake `<ns>_raw` Bronze table before rewrite_data_files/
    # expire_snapshots — expire_snapshots then physically reclaims the TTL'd files.
    bronzeRetentionDays: 30
    driver:
      cores: 1
      memory: 2G
    executor:
      cores: 2
      instances: 4
      memory: 4G
  silverMerge:
    enabled: true
    schedule: "*/15 * * * *"          # every 15 min (values-driven; Silver freshness SLO)
    concurrencyPolicy: Forbid          # never overlap runs
    driver: {cores: 1, memory: "1g"}
    executor: {cores: 1, memory: "1g"}
    maxExecutors: 4                    # Dynamic Allocation ceiling (minExecutors=0)
    mergeParallelism: 4                # tables MERGEd concurrently (silver-merge --max-parallel)

# Kafka Connect — single ingest plane, custom-built image. Replicas/resources are
# values-driven; `spec.build.plugins` version pins live under `versions.*`
# above (single source per plugin); `config.providers`/converters/topic
# names/authentication are preserved verbatim in the template (load-bearing
# — every `${directory:...}` reference in `connectors.*` below depends on
# these exact volume names).
kafkaConnect:
  replicas: 2
  # Pre-built Connect image (prod-grade, RECOMMENDED). When set, the KafkaConnect
  # CR uses `spec.image` (Strimzi just runs it — no in-cluster build) instead of
  # `spec.build`. The image (images/connect/Dockerfile) bakes in every plugin,
  # incl. the Apache Iceberg sink runtime built from source (Apache publishes no
  # downloadable binary). Empty default keeps the `spec.build` path (downloads
  # plugins at cluster build time). Prod: image-registry.../connect-lakehouse:<tag>; F test:
  # 192.168.2.5:32000/connect-lakehouse:<tag> (see values-microk8s-ingest.yaml).
  image: ""
  # Connect'in iç config/offset/status topic'lerinin replication factor'ü.
  # Prod default = 3 (3+ broker gerektirir). Tek-broker ortam
  # (microk8s-ingest) 1'e çeker — aksi halde Connect RF=3 auto-create'i,
  # Topic Operator'ın RF=1 KafkaTopic CR'larını reconcile etmesiyle yarışır.
  internalTopicReplicationFactor: 3
  # Strimzi `spec.build.output` push ayarları. Prod default = OpenShift iç
  # registry (pushSecret'li). microk8s'te insecure yerel registry
  # (container-registry addon) için: pushSecret boş (auth yok) +
  # additionalPushOptions ile builder'a insecure push söylenir. Bu değerler
  # yalnız `spec.build.output` push davranışını etkiler; prod byte-unchanged.
  # NOT: Strimzi v1 (0.51 default builder = Buildah) `additionalPushOptions`
  # kullanır — v1beta2/Kaniko'nun `additionalKanikoOptions` alanı v1'de
  # kaldırıldı (kafka.strimzi.io/v1 `unknown field` hatası verir).
  build:
    pushSecret: connect-build-push-secret
    # v1 böldü: additionalBuildOptions = build komutu (Kaniko executor bayrakları
    # burada — Strimzi 0.51 default builder KANIKO); additionalPushOptions = push
    # komutu (Buildah). İnsecure yerel registry'ye push için Kaniko: --insecure
    # --skip-tls-verify (additionalBuildOptions'a konur).
    additionalBuildOptions: []
    additionalPushOptions: []
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Seed the `connect` KafkaUser's static base ACLs at install/upgrade. The
  # connect ACLs are RUNTIME-OWNED (03-kafka-strimzi.yaml declares the user
  # without `acls` so helm/ArgoCD never clobber the per-source ACLs the Console
  # adds). This Job merge-ADDS the base set (never removes), so it is safe to
  # re-run on upgrade and preserves Console-added per-source ACLs.
  seedConnectAcls: true
  connectBaseAcls:
    - {resource: {type: group, name: connect, patternType: prefix}, operations: [Read]}
    - {resource: {type: group, name: cg-control-, patternType: prefix}, operations: [Read, Describe]}
    - {resource: {type: topic, name: connect-cluster-, patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: cdc., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: jdbc., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: mongo., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: http., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: mqtt., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: amqp., patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: control, patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: iceberg, patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: topic, name: kafka-ingest-, patternType: prefix}, operations: [Read, Write, Create, Describe]}
    - {resource: {type: transactionalId, name: coordinator-txn-, patternType: prefix}, operations: [Write, Describe]}
    - {resource: {type: transactionalId, name: worker-txn-, patternType: prefix}, operations: [Write, Describe]}
    # Shared Debezium signal/notification control topics (snapshot-lifecycle
    # Task 4). The Console PRODUCES signals as `connect` (Write on
    # debezium-signals); the CDC connector's main Kafka producer PRODUCES
    # notifications as `connect` (Write on debezium-notifications), and the
    # Console READS notifications as `connect` (Read on
    # debezium-notifications). Read on debezium-signals belongs to
    # `debezium-src` (see that KafkaUser's acls in 03-kafka-strimzi.yaml),
    # NOT connect.
    - {resource: {type: topic, name: debezium-signals, patternType: literal}, operations: [Write, Describe]}
    - {resource: {type: topic, name: debezium-notifications, patternType: literal}, operations: [Read, Write, Describe]}
  # External-Kafka CA trust for `stream+kafka` sources whose external broker
  # uses TLS (security.protocol SSL/SASL_SSL). The customer creates the secret
  # out of band (their broker CA as ca.p12 + ca.password); it mounts at
  # /mnt/external-configuration/ext-kafka-ca (the path render_service references).
  externalKafkaCa:
    enabled: false
    secretName: ""

# nginx-access ingest. Gated by `.Values.components.nginxIngest`. Driver/executor sizing is
# values-driven; the job itself (prod-manifests/jobs/nginx_streaming.py) is
# baked into the `spark-py` image (same `local://` convention as
# `sparkOperator.maintenance` — see chart/templates/05-spark-operator.yaml) —
# its Kafka SASL_SSL/SCRAM wiring, S3 checkpoint location, and IP-hash logic
# are NOT chart-templated and stay verbatim (load-bearing, see
# chart/templates/14-nginx-ingest.yaml header comment).
nginx:
  streaming:
    driver:
      cores: 1
      memory: "1G"
    executor:
      cores: 1
      instances: 2
      memory: "2G"
    restartPolicy:
      onFailureRetries: 5
    # NOT read by the running job (baked into the image, see above) — this
    # mirrors the identical constant hardcoded in the job's
    # `checkpointLocation` (`s3://nginx-web/_checkpoints/access_log`) and the
    # `lakehouse.web` namespace location from
    # prod-manifests/14-nginx-ingest/README.md's Trino setup step. Kept here
    # so chart/templates/NOTES.txt's operator instructions and the job's
    # baked-in constant can be kept in sync across environments (same
    # "values mirrors a job-baked constant" convention as
    # `sparkOperator.maintenance.schedule`).
    checkpointBucket: nginx-web
  # FluentBit VM-agent (installed on external nginx hosts, NOT in-cluster —
  # see chart/templates/14-nginx-ingest.yaml's ConfigMap + NOTES.txt). Same
  # `{{TOKEN}}` plain-placeholder convention as
  # `postgres.nessie.backup.endpointURL` (values-file string data, NEVER
  # Helm-template-parsed) — required here specifically because a literal
  # `{{KAFKA_EXTERNAL_BOOTSTRAP}}` inside the ConfigMap's `fluent-bit.conf`
  # template body would be parsed (and fail) as a Helm template action.
  fluentbit:
    kafkaExternalBootstrap: "{{KAFKA_EXTERNAL_BOOTSTRAP}}"
    kafkaPassword: "{{FLUENTBIT_KAFKA_PASSWORD}}"

# Apache Zeppelin. Gated by `.Values.components.zeppelin`. Internally-built
# image pinned under `versions.zeppelinImageTag` (single source, same
# `.Values.global.imageRegistry` + tag convention as
# `versions.supersetImageTag`/`versions.dbtImageTag`). AD/LDAPS bind DN/search-base
# fields follow the SAME `{{TOKEN}}` plain-placeholder convention as
# `postgres.nessie.backup.endpointURL` — override with real values in a
# values-<env>.yaml. `bindPassword` (the actual secret material) is
# different: it defaults EMPTY, in which case
# chart/templates/09-zeppelin.yaml does NOT render the `ad-bind-credentials`
# Secret at all (name-reference-only contract, ExternalSecret/Vault or
# manual `oc create secret` provisions it out-of-band); set a real value
# here only for local/dev convenience (renders the Secret inline).
zeppelin:
  replicas: 1
  notebooks:
    storage: 20Gi
  # Empty (default) = the cluster's default StorageClass —
  # chart/templates/09-zeppelin.yaml omits `storageClassName` entirely when
  # unset (same storage-neutrality convention as `postgres.*.storage.
  # storageClass` above; no longer coupled to the opt-in `storage.classes.
  # fileRwx` SC-creation block, `components.storage`). Set a real
  # StorageClass name here, or (if `components.storage: true`) `storage.
  # classes.fileRwx.name` to use this chart's own opt-in RWX StorageClass.
  storageClassName: ""
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 6Gi
      cpu: "2"
  ad:
    url: "ldaps://ad.example.com:636"
    principalSuffix: "@example.com"
    bindDn: "{{AD_BIND_DN}}"
    bindPassword: ""
    userSearchBase: "{{AD_USER_SEARCH_BASE}}"
    groupSearchBase: "{{AD_GROUP_SEARCH_BASE}}"
    # AD group DN -> Zeppelin role eşlemesi.
    groups:
      admin: "CN=lakehouse-admins,OU=Groups,DC=example,DC=com"
      analyst: "CN=lakehouse-analysts,OU=Groups,DC=example,DC=com"
      student: "CN=lakehouse-students,OU=Groups,DC=example,DC=com"
    sessionTimeoutMs: 28800000   # 8 saat
  # %trino read interpreter (Consumption slice c1). Gated by components.zeppelin
  # + auth.oidc.enabled. Read-only svc-zeppelin-trino identity (b1 pattern).
  trino:
    oidc:
      # Confidential client secret for svc-zeppelin-trino (10-keycloak.yaml
      # clients[].secret, single source). Empty => Secret NOT rendered.
      clientSecret: ""
    # Longer refresh than Superset's: each rotation recycles the Zeppelin
    # interpreter (interrupts running paragraphs, spike finding), so refresh
    # infrequently. Must stay below the svc-zeppelin-trino token lifespan (3600).
    tokenRefreshSeconds: 3000
    catalog: "lakehouse"
    refresher:
      # AD service account the token-refresher sidecar uses to authenticate to
      # Zeppelin's REST API (POST /api/login). MUST be a member of the Zeppelin
      # admin AD group (zeppelin.ad.groups.admin) so it can PUT interpreter
      # settings. restPassword follows the same dev-convenience/out-of-band
      # contract as zeppelin.ad.bindPassword and zeppelin.trino.oidc.clientSecret.
      restUsername: "svc-zeppelin-refresher"
      restPassword: ""

# Spark History Server (Consumption slice d). Gated by components.sparkHistory
# (default false; on in medium/large). Reuses the spark-py image; reads event
# logs the Spark jobs write to s3a://spark-events/. Edge-only auth (no OIDC).
sparkHistory:
  # S3 endpoint URL (NON-secret) for the s3a filesystem — MUST match the
  # s3-credentials Secret's `endpoint`. hadoop-aws needs it explicitly for
  # MinIO/non-AWS. Set in medium/large; empty in dev (sparkHistory off there).
  s3Endpoint: ""
  # Spike-confirmed (docker, Task 1) working default. Two gotchas if UAT
  # hits them: (1) hadoop-aws has a known bucket-root eventLogDir bug on some
  # versions — if writes/reads against the bare bucket root fail, switch to
  # "s3a://spark-events/logs/" and pre-create that prefix; (2) the eventLog
  # dir itself must pre-exist before Spark writes to it — the bucket root
  # already exists once bucket-init has run, so that part is covered.
  eventLogDir: "s3a://spark-events/"
  eventsBucket: "spark-events"
  routeHost: "spark-history"
  resources:
    requests: {cpu: "100m", memory: "512Mi"}
    limits:   {cpu: "500m", memory: "1Gi"}

# Apache Superset (BI) — Consumption slice (a). Hand-rolled Deployment/Service/
# ConfigMap (chart/templates/19-superset.yaml), gated by `components.superset`
# (default false; on in medium/large tiers). Metadata store: pg-superset CNPG
# (postgres.superset). Login: native AUTH_OAUTH against the Keycloak `superset`
# client (10-keycloak.yaml). Trino connection auth-mode is spike-driven (see
# docs/superpowers/spikes/2026-08-04-superset-trino-oidc.md).
superset:
  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  # Bootstrap admin — a fallback identity even though OIDC is primary. SAME
  # dev-convenience inline-Secret contract as keycloak.adminPassword: empty
  # default => the `superset` Secret is NOT rendered; provision out-of-band.
  adminUser: admin
  adminPassword: ""
  # Flask SECRET_KEY (session signing). Empty default => not rendered inline;
  # provision the `superset` Secret out-of-band. NEVER logged.
  secretKey: ""
  oidc:
    # Confidential client secret for the `superset` OIDC client
    # (chart/templates/10-keycloak.yaml `clients[].secret`, single source — the
    # two can never drift). Empty default => the `superset-oidc-credentials`
    # Secret is NOT rendered (same contract as kafkaUi.oidc.clientSecret);
    # provision out-of-band per `.Values.secrets.mode`.
    clientSecret: ""
  trino:
    # Superset->Trino connection auth. `none` = unauthenticated Trino (works
    # only when `auth.oidc.enabled: false`, the dev/smoke path) — v1 default
    # per the spike. `jwt` = present a Keycloak JWT (requires a Trino jwt
    # authenticator, the documented NEXT slice). See the spike doc.
    authMode: none
    # Trino catalog Superset connects to by default (Silver medallion).
    catalog: lakehouse
    # Machine-auth (b1): service-account client secret for `svc-superset-trino`
    # (10-keycloak.yaml `clients[].secret`, single source — the two can never
    # drift). Empty default => the `superset-trino-oidc-credentials` Secret is
    # NOT rendered; provision out-of-band per `.Values.secrets.mode`.
    oidc:
      clientSecret: ""
    # Sidecar re-fetch cadence (seconds) — MUST be well under the Keycloak
    # svc-superset-trino access-token lifespan (900s, 10-keycloak.yaml).
    tokenRefreshSeconds: 600
    # SQLAlchemy pool_recycle (seconds) on the registered Trino connection —
    # MUST be below the token lifespan (900s) so no pooled connection outlives
    # its JWT.
    poolRecycleSeconds: 800
    # Coordinator client-facing internal TLS (:8443) for JWT machine-auth.
    tls:
      enabled: true
      # PKCS12 keystore passphrase (dev-convenience; out-of-band otherwise).
      keystorePassword: ""
  exampleDashboard:
    # Best-effort import of a committed example dashboard bundle by the
    # init-Job. Default false: the connection + one dataset are the v1 "it
    # works" proof; the dashboard bundle is authored/imported during UAT
    # (a committed Superset export is version-brittle — kept opt-in).
    enabled: false
  alertsReports:
    # Zamanlanmış rapor (chart→CSV) + SQL-koşullu alert e-postaları (şartname 3.6.2.1.5).
    # Redis + Celery worker + Celery beat ekler. Default off — açmak için bunu true
    # yapıp superset.smtp.host'u müşterinin SMTP sunucusuna ayarla (ikisi birlikte).
    # Tüm sizing tier'larında off kalır (SMTP host müşteriye özgü). Tarayıcı YOK:
    # dashboard/grafik PNG görseli kapsam dışı (Day-2); rapor formatı CSV/veri.
    enabled: false
  smtp:
    host: ""                # müşteri SMTP sunucusu — alertsReports.enabled ise ZORUNLU (fail-loud)
    port: 587
    startTLS: true
    ssl: false
    user: ""
    mailFrom: "lakehouse-reports@example.local"
    password: ""            # dev-convenience inline Secret; prod out-of-band (secrets.mode)
  redis:
    password: ""            # dev-convenience inline Secret; prod out-of-band (secrets.mode)

# dbt-trino Certified Gold (Consumption slice b2). CronJob-driven; gated by
# components.dbt (default false; on in medium/large). Sole writer of
# lakehouse.gold via the svc-dbt-trino service account (10-keycloak.yaml +
# 06-trino-ha.yaml rules.json). Git source-of-truth.
dbt:
  # Confidential service-account client secret for svc-dbt-trino
  # (10-keycloak.yaml clients[].secret, single source). Empty default =>
  # dbt-trino-oidc-credentials Secret NOT rendered; provision out-of-band.
  oidc:
    clientSecret: ""
  # Customer's dbt project git repo (SSH). Empty => CronJob has nothing to
  # clone (UAT/customer provides it). deployKey read-only.
  repo:
    url: ""
    branch: "main"
    # Read-only SSH deploy key (dev-convenience inline when supplied, else
    # out-of-band under the same name/key). NEVER logged.
    deployKey: ""
  schedule: "0 3 * * *"
  catalog: "lakehouse"
  goldSchema: "gold"
  resources:
    requests: {cpu: "250m", memory: "512Mi"}
    limits:   {cpu: "1",    memory: "1Gi"}

# Sandbox v2 (2026-08-07 sandbox-v2 design): unified sandbox — a single
# shared S3 bucket + Nessie namespace/Trino catalog + `svc-sandbox` Keycloak
# service-account identity for ALL analysts, isolated only by a per-user
# Trino/Spark/PyIceberg SCHEMA convention (`sandbox.<user>`), NOT by
# per-department buckets/catalogs/identities — the earlier per-department
# design (each dept with its own bucket/catalog/Secret/Keycloak client/K8s
# SA/AD-group-gated Zeppelin) was retired in the slice's final task (Task 5)
# in favor of this single unified shape. Prod data stays untouched — a
# separate bucket + Nessie namespace from `lakehouse`/`rawlake` (şartname
# 3.5.4.3).
sandbox:
  enabled: false
  bucket: "sandbox"            # S3 bucket + warehouse location kökü
  namespace: "sandbox"         # Nessie namespace + Trino katalog adı
  # Notebook (Jupyter/Zeppelin) erişimine izinli AD grupları (login gate). Rol modeli = Slice B.
  allowedGroups: []            # ör. ["CN=lakehouse-analysts,OU=Groups,DC=example,DC=com"]
  oidc:
    clientSecret: ""           # svc-sandbox service-account client secret (single-source; boş => Secret render edilmez)

# Hand-rolled JupyterHub (per-user notebook sandbox). Gated by
# `components.jupyter` (default false) AND `auth.oidc.enabled` (the Hub's
# OAuthenticator needs a real Keycloak `jupyter` client — no unauthenticated
# path is supported). chart/templates/23-jupyterhub.yaml.
jupyter:
  # Confidential client secret for the Keycloak `jupyter` client
  # (chart/templates/10-keycloak.yaml `clients[].secret`, single source — the
  # two can never drift). Empty default => the `jupyter-oidc-credentials`
  # Secret is NOT rendered (same dev-convenience-else-out-of-band contract as
  # `superset.oidc.clientSecret`); provision out-of-band per
  # `.Values.secrets.mode`.
  oidcClientSecret: ""
  # Hub<->configurable-http-proxy shared auth token (CONFIGPROXY_AUTH_TOKEN).
  # Dev-convenience single value inline when supplied; else provision
  # out-of-band/generate at install time (same contract as oidcClientSecret
  # above) — the `jupyter-proxy-token` Secret is NOT rendered when empty.
  proxyToken: ""
  # Turn-key notebook helper's read-only Trino access (Consumption slice,
  # jupyter-turnkey-notebook). Mirrors `zeppelin.trino.oidc.*` above.
  trino:
    oidc:
      # Confidential client secret for svc-jupyter-trino (10-keycloak.yaml
      # clients[].secret, single source — the two can never drift). Empty
      # default => the `jupyter-trino-oidc-credentials` Secret is NOT
      # rendered (same dev-convenience-else-out-of-band contract as
      # `oidcClientSecret` above); provision out-of-band per
      # `.Values.secrets.mode`.
      clientSecret: ""
  # Hub Deployment replica count. JupyterHub's Hub is a singleton by design
  # (holds the proxy routing table + user database) — keep at 1 unless a
  # future task adds leader-election/HA.
  replicas: 1
  # Hub pod requests/limits (NOT per-user singleuser server sizing, which a
  # later task adds separately once the KubeSpawner profile lands).
  resources:
    requests: {cpu: "250m", memory: "512Mi"}
    limits:   {cpu: "1",    memory: "1Gi"}
  # Per-user notebook home-directory PVC size (KubeSpawner storage claim,
  # wired in a later task).
  storage: "5Gi"
  # configurable-http-proxy — a SEPARATE Deployment from the Hub (see
  # `.Values.versions.configurableHttpProxyImage`'s comment: the Hub image has
  # no bundled Node.js CHP). Singleton by design (in-memory routing table,
  # same rationale as `replicas` above) — not independently scalable, so no
  # `replicas` knob here.
  proxy:
    resources:
      requests: {cpu: "100m", memory: "128Mi"}
      limits:   {cpu: "500m", memory: "256Mi"}

# Yerel/harici (BYO) notebook erişimi (şartname 3.6.1.2). Keycloak public device-flow
# client `lakehouse-token` render eder; kullanıcı `tools/lakehouse-cli login` ile token alır.
byoNotebook:
  enabled: false

# Kurumsal AD LDAP federation settings for Keycloak (prod-manifests/
# 10-keycloak.yaml KeycloakRealmImport
# `components["org.keycloak.storage.UserStorageProvider"]` + its
# `group-ldap-mapper`). Same corporate AD service account as
# `zeppelin.ad.*` above (SAME real bind DN/password/search bases), but kept
# as an INDEPENDENT values block rather than reusing `zeppelin.ad.*` — the
# two integration surfaces (Zeppelin's Shiro realm vs. Keycloak's
# KeycloakRealmImport) are configured separately. Same plain `{{TOKEN}}`
# placeholder convention as `postgres.nessie.backup.endpointURL` /
# `zeppelin.ad.bindPassword` (values-file string data, NEVER Helm-template
# -parsed) for the credential fields — override with real values in a
# values-<env>.yaml (Vault/SealedSecret in prod). `url` is not secret
# material (just an LDAPS endpoint) so, like `zeppelin.ad.url`, it defaults
# to the real value verbatim.
ad:
  url: "ldaps://ad.example.com:636"
  bindDn: "{{AD_BIND_DN}}"
  bindPassword: "{{AD_BIND_PASSWORD}}"
  userSearchBase: "{{AD_USER_SEARCH_BASE}}"
  groupSearchBase: "{{AD_GROUP_SEARCH_BASE}}"

# OpenShift Routes + cert-manager TLS. Gated by `.Values.components.routesTls`
# (flag already reserved in the `components` map above). Every
# Route's `spec.host` in chart/templates/08-routes-tls.yaml AND the Keycloak
# Route/OIDC-client redirect hosts in chart/templates/10-keycloak.yaml all
# resolve through the SAME `lakehouse.routeHost` helper (_helpers.tpl) from
# `global.domain` — a route host and its client's redirect host can never
# drift apart (task brief acceptance criterion).
routes:
  # cert-manager ClusterIssuer name (source placeholder `{{CERT_ISSUER}}`,
  # e.g. `letsencrypt-prod` or a corporate CA issuer — see
  # prod-manifests/08-routes-tls.yaml header comment). Single source for
  # every Route's `cert-manager.io/cluster-issuer` annotation AND the
  # Keycloak `Certificate`'s `issuerRef.name` (10-keycloak.yaml) — AND (since
  # this task) every Ingress's SAME annotation in chart/templates/
  # 08b-ingress-tls.yaml (`platform: vanilla` path).
  certIssuer: letsencrypt-prod

# Ingress — vanilla Kubernetes only (see top-level `platform`). Mirrors
# `routes:` above for the Route-less path: chart/templates/
# 08b-ingress-tls.yaml renders one `networking.k8s.io/v1` Ingress per Route
# in 08-routes-tls.yaml / 10-keycloak.yaml / console/console.yaml / console/
# kafka-ui.yaml, gated on the SAME `.Values.components.*` flags, using the
# SAME `lakehouse.routeHost` helper for `spec.rules[].host` and the SAME
# `.Values.routes.certIssuer` for the cert-manager annotation.
ingress:
  # IngressClass name (nginx-ingress-controller convention). Ignored entirely
  # on `platform: openshift` (no Ingress renders there at all).
  className: nginx
  # Namespace the ingress-nginx controller itself runs in. Consumed by the
  # vanilla branch of chart/templates/00-namespace.yaml's
  # `allow-from-ingress-and-monitoring` NetworkPolicy AND chart/templates/
  # console/console.yaml's `console-frontend-ingress` NetworkPolicy — both
  # allow inbound traffic FROM this namespace via a `kubernetes.io/
  # metadata.name` namespaceSelector (k8s-standard label, always present on
  # every namespace, unlike OpenShift's `network.openshift.io/policy-group`
  # which vanilla clusters never set). On `platform: openshift` this value
  # is ignored — those NetworkPolicies use the OpenShift policy-group
  # selector instead (see `lakehouse.isOpenShift`, _helpers.tpl).
  controllerNamespace: ingress-nginx

# Keycloak — OIDC provider + AD LDAP federation. Gated by `.Values.components.keycloak`
# (also gates the `pg-keycloak` app-facing Secret/Certificate/CR/RealmImport
# /Route — the `pg-keycloak` CNPG *Cluster* itself is gated separately by
# `.Values.components.postgres`, see `postgres.keycloak` above). DB host is
# resolved via the `lakehouse.svc.pgKeycloakRw` helper (_helpers.tpl) —
# never hardcoded.
keycloak:
  # Keycloak Operator CR `spec.instances` (HA replica count).
  instances: 2
  adminUsername: admin
  # Empty by default: chart/templates/10-keycloak.yaml then does NOT render
  # the `keycloak-admin-credentials` Secret at all, following the SAME "name
  # reference only" contract as `storage.s3.secretName` — an
  # ExternalSecrets Operator/Vault backend or a manual
  # `oc create secret generic keycloak-admin-credentials ...` must provision
  # it out-of-band before install (per `.Values.secrets.mode`). Set a real
  # value here only for local/dev convenience (renders the Secret inline).
  adminPassword: ""
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: "2"
  realm:
    # Realm/KeycloakRealmImport-CR-name identifier. Uses `lakehouse` rather
    # than the cluster's actual `example` namespace because this chart's
    # bundled `values.yaml` / `values-prod.example.yaml` are BOTH exercised
    # against multiple release namespaces (`example` AND `lakehouse-test`) by
    # this project's own test harness (chart/scripts/helm-check.py
    # `--no-stray example`), so a literal `example` default here would fail that
    # portability check the moment either values file renders under a
    # namespace other than `example`. A real deployment that wants the realm
    # id `example` can override `keycloak.realm.name: example` in its own
    # (non-bundled) values-<env>.yaml.
    name: lakehouse
    # Display name only (free text, no namespace-portability concern).
    displayName: "Lakehouse"

# Self-Service Lakehouse Console. Gated by `.Values.components.console`
# (flag already reserved in the `components` map above).
# Backend/frontend images built under `.Values.global.imageRegistry` (single
# source, `versions.consoleBackendImageTag`/`consoleFrontendImageTag` above).
# Backend Service name/DNS, frontend Service name/Route target, and every
# Trino/Connect/Apicurio reference resolve through the `lakehouse.svc.*`
# helpers in _helpers.tpl (namespace-portable, service-closure-clean) — never
# hardcoded, so the render always matches `console/frontend/nginx.conf`'s
# `/api` proxy target contract regardless of `-n <namespace>`.
# The built `console-frontend` image's `nginx.conf` proxies `/api/*` to the
# bare same-namespace service name `console-backend:8080` (baked in at
# Docker-build time — see console/frontend/nginx.conf) rather than a
# namespace-qualified FQDN, so it resolves correctly under any release
# namespace as long as frontend and backend are co-located in the same
# namespace (which this chart always does).
console:
  backend:
    replicas: 2
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  frontend:
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  oidc:
    # Must match the `lakehouse-console` OIDC client's `clientId` in
    # chart/templates/10-keycloak.yaml (literal there too — both sides kept
    # in sync by convention, same as `console/backend/app/config.py`'s
    # `oidc_audience` default). `OIDC_ISSUER` itself is NOT set here — the
    # backend env var is sourced from the SAME `.Values.oidc.secretName`
    # Secret (key `issuer-url`) that Trino/Nessie already consume (see
    # `oidc:` block above), so every OIDC consumer in this chart shares one
    # issuer-URL source of truth (must match `keycloak.realm.name`
    # = `lakehouse`).
    audience: lakehouse-console
  # GitOps write-path (2026-07-30-gitops-core-slice-a-write-path Task 5).
  # `deployMode` selects the backend's write path for generated
  # connector/job artifacts (console/backend/app/config.py `deploy_mode`,
  # env `DEPLOY_MODE`):
  #   direct (DEFAULT): backend applies CRs straight to the k8s API (today's
  #     behavior, unchanged) — no repo, no credential needed.
  #   gitops: backend instead commits rendered manifests to a git repo
  #     (`gitops.repoUrl`/`branch`/`path`) for an external reconciler
  #     (Argo CD/Flux) to apply. Requires `gitops.repoUrl` to be set — the
  #     Deployment template `required()`-guards this at render time (mirrors
  #     `oidc.secretName`'s fail-loud pattern in 06-trino-ha.yaml/
  #     04-nessie-ha.yaml) so a misconfigured `gitops` install fails loudly
  #     at `helm install/upgrade`, not silently at backend runtime.
  deployMode: direct
  gitops:
    # ssh://git@host/org/pipelines.git (or an in-cluster Gitea/Gitness
    # instance). Empty by default (direct mode needs no repo); REQUIRED when
    # `deployMode: gitops` (see comment above).
    repoUrl: ""
    branch: main
    path: pipelines
    # k8s Secret name providing the git credential — mounted read-only at
    # /var/run/gitops on console-backend (keys `ssh-privatekey` +
    # optional `known_hosts`), matching the deploy-key path the backend
    # reads (console/backend/app/services/gitops_service.py, Task 4). Same
    # "name reference only" convention as `storage.s3.secretName`/
    # `oidc.secretName` — the Secret's own material is provisioned
    # out-of-band per `.Values.secrets.mode`, never defined in this chart.
    # Only actually consumed (volume + mount rendered) when
    # `deployMode: gitops`.
    credentialSecret: gitops-credential
  # ArgoCD's own namespace (2026-07-30-gitops-core-slice-b1-argocd-wiring
  # Task 6). Consumed two ways: (1) plain config, `ARGOCD_NAMESPACE` in the
  # backend ConfigMap, feeding `settings.argocd_namespace`
  # (console/backend/app/config.py, Task 4) — the `/gitops/status` reader
  # (Task 5) looks up the Application CR here regardless of `deployMode`;
  # (2) the namespace the namespace-scoped `lakehouse-console-argocd-read`
  # Role/RoleBinding below is rendered into, gated `deployMode: gitops`
  # only. openshift-gitops is the OpenShift OperatorHub ArgoCD's default
  # namespace; "argocd" is the vanilla/community-manifest default.
  argocdNamespace: argocd   # openshift-gitops on OpenShift
  # Silver bucket-count default (2026-08-03 silver-scale-hardening) —
  # sourced into the backend ConfigMap's `SILVER_DEFAULT_BUCKET_COUNT`
  # (chart/templates/console/console.yaml), feeding
  # `Settings.silver_default_bucket_count` (console/backend/app/config.py):
  # the orchestrator's fallback bucket count for a pipeline spec that
  # doesn't set its own `silver_bucket_count`. Same bucket-count knob
  # merge_cdc.py's SPJ_CONF prunes against at runtime (silver-merge's
  # sparkConf, chart/templates/05-spark-operator.yaml).
  silverDefaultBucketCount: 16
  networkPolicy:
    # S3 endpoint CIDR/IP block (egress allow-list) — same plain
    # `{{TOKEN}}` placeholder convention as `postgres.nessie.backup.endpointURL`
    # (values-file string data, NEVER Helm-template-parsed; a real
    # values-<env>.yaml supplies the actual CIDR).
    s3Cidr: "{{S3_CIDR}}"
    # Namespace CoreDNS/kube-dns runs in — consumed ONLY by
    # `console-backend-egress`'s DNS egress rule (chart/templates/console/
    # console.yaml) on its `platform: vanilla` branch (`lakehouse.
    # isOpenShift`, _helpers.tpl): a `kubernetes.io/metadata.name`
    # namespaceSelector, same reasoning + same k8s-standard-label pattern as
    # `ingress.controllerNamespace` / `monitoring.prometheusNamespace`
    # above (OpenShift's `network.openshift.io/policy-group: dns` label
    # doesn't exist on vanilla clusters). Reused this EXISTING
    # `console.networkPolicy` block (already home to `s3Cidr`,
    # another console-backend-egress knob) instead of a new top-level block
    # — this is a console-backend-egress-scoped setting, not chart-wide.
    # "kube-system" is the k8s-standard CoreDNS home on vanilla
    # distributions (kubeadm, k3s, kind, minikube, EKS, GKE, AKS all agree).
    # Ignored entirely on `platform: openshift`.
    dnsNamespace: kube-system

# Kafka UI (kafbat-ui). Gated by `.Values.components.kafkaUi`. Image pinned under
# `versions.kafkaUiImage` (single source). Kafka bootstrap/Connect/Apicurio
# references resolve through the `lakehouse.svc.*` helpers — never hardcoded.
# The `kafka-ui` KafkaUser's SCRAM password Secret and `kafka-cluster-ca-cert`
# are Strimzi-managed (fixed naming convention, same as `connect`'s own
# credentials in chart/templates/12-kafka-connect.yaml) — not values-driven,
# nothing to parametrize there.
kafkaUi:
  replicas: 2
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  oidc:
    # Confidential client secret for the `kafka-ui` OIDC client
    # (chart/templates/10-keycloak.yaml) — same client both sides must
    # agree on. Referenced verbatim by 10-keycloak.yaml's `clients[].secret`
    # field (single source, so the two can never drift apart). Empty by
    # default: in that case chart/templates/console/routes-oidc.yaml does NOT
    # render the `kafka-ui-oidc-credentials` Secret at all, following the
    # SAME "name reference only" contract as `storage.s3.secretName`
    # — an ExternalSecrets Operator/Vault backend or a manual
    # `oc create secret generic kafka-ui-oidc-credentials ...` must
    # provision it out-of-band before install (per `.Values.secrets.mode`).
    # Set a real value here only for local/dev convenience (renders the
    # Secret inline).
    clientSecret: ""

# Chart prereq-check. Verifies the
# cluster-scoped OLM operator prerequisites (Strimzi, CloudNativePG, Spark
# Operator, Keycloak Operator, ExternalSecrets Operator, cert-manager — see
# operators/README.md) are installed BEFORE this chart submits CRs that
# depend on their CRDs. Two independent, cluster-verified mechanisms, both
# gated by this ONE flag — see chart/templates/_prereq-check.tpl (template-time
# `.Capabilities.APIVersions.Has` check) and chart/templates/prereq-check-job.yaml
# (pre-install/pre-upgrade hook Job that runs `kubectl get crd` for real).
#
# DEFAULT `false`: `.Capabilities.APIVersions.Has` can NEVER distinguish "not
# connected to any cluster" (e.g. `helm template`, this chart's own CI via
# prod-manifests/validate.sh --helm) from "connected, CRD genuinely missing"
# — both look identical (`false`) to the template engine, verified
# empirically. A default of `true` would therefore hard-fail `helm template`
# in CI on every run, even against a correctly-provisioned cluster. Real
# installs turn this on explicitly once operators/ has been applied and every
# CSV shows `Succeeded` (see operators/README.md "Doğrulama"):
#   helm install lakehouse chart/ -f values-<env>.yaml -n example \
#     --set prereqCheck.enabled=true
prereqCheck:
  enabled: false
