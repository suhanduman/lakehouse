# nginx erişim günlüğü: combined biçimi ve nginx'in VARSAYILAN "main" biçimi (resmi imaj + RHEL paketi: sonda
# "$http_x_forwarded_for"). Sondaki ek tırnaklı alanlar kabul edilir ama YAKALANMAZ: yeni kolon Trino'daki remote
# maskesinin dışında kalır, son kullanıcıya istemci IP'si açılırdı (OpenShift provası 2026-11-08: "main" hiç eşleşmiyordu,
# satırlar yalnız `log` kolonuyla tabloya girdi).
[PARSER]
    Name        nginx
    Format      regex
    Regex       ^(?<remote>[^ ]*) (?<host>[^ ]*) (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>\S+)(?: +(?<path>[^\"]*?)(?: +\S*)?)?" (?<code>[^ ]*) (?<size>[^ ]*)(?: "(?<referer>[^\"]*)" "(?<agent>[^\"]*)"(?: "[^\"]*")*)?$
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z
    Time_Keep   Off
    Types       code:integer size:integer
