apiVersion: v1
kind: Secret
metadata: {name: zeppelin-shiro, namespace: {{ $ns }}}
stringData:
  shiro.ini: |
    [users]
    analyst1 = analyst1-dev, analyst
    user1 = user1-dev, user
    # DEV-ONLY: hiçbir lakehouse rolü OLMAYAN kullanıcı — rol kapısının canlı negatif kanıtı
    # (test/e2e/zeppelin-path.sh: giriş 200, ardından /api/notebook 401). Prod'da karşılığı yoktur.
    nogroup1 = nogroup1-dev, nogroup
    [main]
    # Rol kapısı (prod şablonuyla AYNI şekil — examples/zeppelin/shiro-ad.ini): Shiro'nun yerleşik roles[]
    # filtresi TÜM rolleri ister, Zeppelin'inki HERHANGİ birini yeterli sayar. Sınıf adı imajdan doğrulandı
    # (apache/zeppelin:0.12.1 -> org/apache/zeppelin/utils/AnyOfRolesUserAuthorizationFilter.class).
    anyofroles = org.apache.zeppelin.utils.AnyOfRolesUserAuthorizationFilter
    sessionManager = org.apache.shiro.web.session.mgt.DefaultWebSessionManager
    securityManager.sessionManager = $sessionManager
    securityManager.sessionManager.globalSessionTimeout = 86400000
    shiro.loginUrl = /api/login
    # [roles] YOK: rol kapısı yalnız üyeliğe bakar, izin istemez (wildcard `analyst = *` footgun'dur).
    [urls]
    /api/version = anon
    /api/cluster/address = anon
    # Giriş uç noktasında rol kapısı OLAMAZ: authc loginUrl'de başarısız girişten sonra da zinciri sürdürür ->
    # rol filtresi kimliksiz subject'te NPE atar (`/api/login` 500, 2026-09-18 canlı). Prod şablonuyla aynı.
    /api/login = authc
    /api/login/** = authc
    /api/interpreter/** = authc, roles[analyst]
    /api/notebook-repositories/** = authc, roles[analyst]
    /api/configurations/** = authc, roles[analyst]
    /api/credential/** = authc, roles[analyst]
    # Kimlik doğrulanmış OLMAK YETMEZ: rolsüz kullanıcı 401 alır (dev'de admin rolü kimseye verilmez)
    /** = authc, anyofroles[admin, analyst, user]
---
apiVersion: v1
kind: Secret
metadata: {name: zeppelin-interpreter, namespace: {{ $ns }}}
stringData:
  # Zeppelin bu dosyayı her açılışta YENİDEN YAZAR: yalnız tohum (PVC'de /data/conf, initContainer kopyalar)
  interpreter.json: |
{{ tpl (.Files.Get "files/zeppelin/interpreter.json") (dict "Values" .Values "Template" .Template "url" (printf "jdbc:trino://trino.%s.svc:8443/lakehouse?SSL=true&SSLTrustStorePath=/etc/lakehouse-ca/tls.crt" $ns) "user" "zeppelin" "password" "zeppelin-dev") | indent 4 }}
---
# z2jh `hub.existingSecret` (platform/values/jupyterhub.yaml): hub SÜRECİ cookie_secret ve CryptKeeper.keys'i
# chart'ın ÜRETTİĞİ Secret yerine BURADAN okur (chart files/hub/z2jh.py get_secret_value: önce existing-secret/,
# sonra secret/) -> pod her döndüğünde aynı kalır: oturum çerezleri ve auth_state şifresi ayakta kalır.
# Değerler SABİT sentetiktir (rastgele ÜRETİLMEZ): şablon her render'da aynı çıktıyı vermeli, yoksa ArgoCD
# her sync'te Secret'ı yeniden yazar — düzeltilmek istenen kusurun ta kendisi (CI 35451232616).
# Prod'da bu Secret elle yaratılır (docs/30-kurulum.md §5.12, `openssl rand -hex 32`).
apiVersion: v1
kind: Secret
metadata: {name: jupyterhub-secrets, namespace: {{ $ns }}}
stringData:
  # `openssl rand -hex 32` ile AYNI biçim (64 hex). SADECE bu iki anahtar: hub<->proxy token'ı
  # (ConfigurableHTTPProxy.auth_token) BURADAN OKUNMAZ — chart'ın kendi `hub` Secret'ından env ile gelir
  # (platform/apps/30-jupyterhub.yaml ignoreDifferences onu dondurur). Buraya konsaydı ölü anahtar olurdu.
  hub.config.JupyterHub.cookie_secret: "89abcdef0123456789abcdef0123456789abcdef0123456789abcdef01234567"
  # CryptKeeper.keys ";" ile ayrılmış liste olarak okunur (chart jupyterhub_config.py) — tek anahtar yeterli.
  hub.config.CryptKeeper.keys: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
{{- end }}
