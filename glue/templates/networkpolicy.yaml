{{- if .Values.networkPolicy.enabled }}
# Tüm politikalar YALNIZ Ingress (`policyTypes: [Ingress]`); egress kısıtlanmaz (Connect'in Maven/registry çekişi, S3, LDAP serbest).
# Prod enforcement (OpenShift SDN/OVN) OpenShift pre-ship ortamında doğrulanacak; kind'ın kindnetd'si (F4 canlı) NetworkPolicy'yi ENFORCE EDER.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: {{ include "glue.ns" . }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-same-namespace, namespace: {{ include "glue.ns" . }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {}}]
---
# Operatörler (cnpg-system), ArgoCD, ingress/router, izleme ve yedekleme namespace'leri
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-platform-namespaces, namespace: {{ include "glue.ns" . }}}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: cnpg-system}}
    # ArgoCD ns'i DEĞERDEN gelir: OpenShift GitOps `openshift-gitops` kullanır, sabit `argocd` eşleşmezdi.
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.argocdNamespace }}}}
{{- if .Values.velero.enabled }}
    # Velero: node-agent pod hacimlerini hostPath (/var/lib/kubelet/pods) üzerinden okur, AĞ gerekmez; sunucu da
    # yalnız kube-apiserver + S3 ile konuşur. Yine de yedek hook'ları (exec/HTTP) ileride eklenirse kapı kapalı kalmasın.
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.velero.namespace }}}}
{{- end }}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ ternary "openshift-ingress" "ingress-nginx" (eq (include "glue.isOpenShift" .) "true") }}}}
{{- if eq (include "glue.isOpenShift" .) "true" }}
    # Router HostNetwork modundaysa (bare-metal/assisted kurulumların varsayılanı) Route trafiği openshift-ingress
    # pod'larından DEĞİL düğüm ağından gelir ve yukarıdaki ad alanı seçicisine uymaz -> Route'lar zaman aşımı verir
    # (ocpphy provası 2026-11-08: zeppelin 000, pod içinden 200). OVN-Kubernetes bu trafiği bu etiketle eşler;
    # etiket her iki yayınlama modunu da (HostNetwork, LoadBalancerService) kapsar.
    - namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}
    # OpenShift'te platform izleme (openshift-monitoring) ve kullanıcı iş yükü izleme (openshift-user-workload-monitoring) ayrı ns'lerde
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-monitoring}}
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}}
{{- else }}
    # dev/vanilla: Prometheus ns'i DEĞERDEN gelir (sabit yazılırsa monitoring.namespace değiştirildiğinde
    # scrape sessizce bloklanırdı — netpol eski ns'i geçirmeye devam ederdi).
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}}}
{{- end }}
{{- end }}
{{- with .Values.s3.egressCidrs }}
{{- $port := 443 }}
{{- with (regexFind ":[0-9]+$" (trimSuffix "/" $.Values.s3.endpoint)) }}{{ $port = (trimPrefix ":" .) | int }}{{ end }}
---
# Not defterleri -> iç ağdaki S3 (gerekçe: glue/values.yaml s3.egressCidrs). z2jh'nin singleuser politikasına
# EKLENİR (NetworkPolicy'ler toplanır); yalnız bu adresler ve S3 portu açılır, özel ağın geri kalanı kapalı kalır.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: notebook-s3-egress, namespace: {{ include "glue.ns" $ }}}
spec:
  podSelector: {matchLabels: {app: jupyterhub, component: singleuser-server}}
  policyTypes: [Egress]
  egress:
  - to:
    {{- range . }}
    - ipBlock: {cidr: {{ . | quote }}}
    {{- end }}
    ports: [{port: {{ $port }}, protocol: TCP}]
{{- end }}
