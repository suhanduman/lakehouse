{{- if .Values.zeppelin.enabled }}
{{- $ns := include "glue.ns" . }}{{ $z := .Values.zeppelin }}
apiVersion: v1
kind: PersistentVolumeClaim
# sync-wave Deployment ile AYNI olmalı: StorageClass WaitForFirstConsumer ise PVC ancak tüketici pod yaratılınca
# Bound olur; PVC daha erken bir wave'de olursa ArgoCD "Healthy" beklerken sonraki wave'i (Deployment'ı) hiç
# uygulamaz -> kilitlenme (CI 35276782791: glue 45 dk OutOfSync/Progressing, wave 1+ hiç koşmadı).
metadata: {name: zeppelin-data, namespace: {{ $ns }}, annotations: {argocd.argoproj.io/sync-wave: "2"}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ $z.storageSize }}}}
{{- with $z.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: zeppelin, namespace: {{ $ns }}, annotations: {argocd.argoproj.io/sync-wave: "2"}}
spec:
  replicas: 1
  strategy: {type: Recreate}                 # RWO PVC
  # apache/zeppelin:0.12.1 ~2,7 GB: soğuk çekim 13 dk 48 sn ölçüldü (2026-09-18, kubelet "Successfully pulled"),
  # k8s varsayılanı 600 s ise aşılıyor -> Deployment Progressing=False/ProgressDeadlineExceeded olur ve
  # `helm --wait` (bootstrap.sh) kurulumu "not ready" diye DÜŞÜRÜR (pod aslında sağlıklı, sonradan Ready oluyor).
  progressDeadlineSeconds: 1800
  selector: {matchLabels: {app: zeppelin}}
  template:
    metadata: {labels: {app: zeppelin}}
    spec:
      {{- if ne (include "glue.isOpenShift" .) "true" }}
      securityContext: {fsGroup: 1000}       # imaj uid 1000 / gid 0; OpenShift SCC kendi gid'ini verir
      {{- end }}
      # interpreter.json her açılışta Zeppelin tarafından YENİDEN YAZILIR (atomik temp+rename) -> salt-okunur mount olmaz;
      # ZEPPELIN_CONFIG_FS_DIR PVC'de, tohum yalnız dosya yokken kopyalanır (plan R6). Tohumu değiştirmek: PVC'deki dosyayı sil ya da UI.
      initContainers:
      - name: seed
        image: {{ $z.image }}
        command: ["sh", "-c", "mkdir -p /data/conf /data/notebook /data/local-repo && ([ -f /data/conf/interpreter.json ] || cp /seed/interpreter.json /data/conf/interpreter.json)"]
        volumeMounts: [{name: data, mountPath: /data}, {name: seed, mountPath: /seed, readOnly: true}]
      {{- with $.Values.keycloak.ldap.caSecret }}
      # AD LDAPS güven deposu. Shiro'nun ActiveDirectoryGroupRealm'i (examples/zeppelin/shiro-ad.ini) JVM'in
      # güven deposunu kullanır; AD sertifikası özel bir kökten geliyorsa imajın cacerts'inde YOKTUR.
      # ÖZEL İMAJ YOK / ELLE cacerts DÜZENLEME YOK: aynı resmi imaj, imajın kendi keytool'u.
      # cacerts ÖNCE KOPYALANIR, AD kökü ÜSTÜNE eklenir: yalnız AD CA'sı içeren bir truststore JVM
      # varsayılanını EZER ve Maven Central'dan trino-jdbc indirmesini, Keycloak/Trino TLS'ini kırardı.
      # Depo parolası SIR DEĞİLDİR (yalnız public sertifika taşır) — sabit `changeit`.
      # Son `grep -c` bilerek kalıcıdır: depo boş çıkarsa initContainer düşer ve pod hiç açılmaz.
      - name: ad-truststore
        image: {{ $z.image }}
        command: ["sh", "-c", "set -e; keytool -importkeystore -noprompt -srckeystore \"$JAVA_HOME/lib/security/cacerts\" -srcstoretype JKS -srcstorepass changeit -destkeystore /truststore/ad-truststore.p12 -deststoretype PKCS12 -deststorepass changeit; keytool -importcert -noprompt -trustcacerts -alias ad-ca -file /ad-ca/ca.crt -keystore /truststore/ad-truststore.p12 -storetype PKCS12 -storepass changeit; keytool -list -keystore /truststore/ad-truststore.p12 -storetype PKCS12 -storepass changeit | grep -c trustedCertEntry"]
        volumeMounts: [{name: ad-truststore, mountPath: /truststore}, {name: ad-ca, mountPath: /ad-ca, readOnly: true}]
      {{- end }}
      containers:
      - name: zeppelin
        image: {{ $z.image }}
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: ZEPPELIN_ADDR, value: "0.0.0.0"}
        # auto, küme içinde k8s modunu seçer ve her interpreter için AYRI POD açar (default SA'da pod RBAC'ı yok,
        # "pods ... is forbidden" ile düşer). Yorumlayıcılar bu pod içinde yerel süreç olarak koşar (ZEPPELIN_INTP_MEM).
        - {name: ZEPPELIN_RUN_MODE, value: local}
        - {name: ZEPPELIN_PORT, value: "8080"}
        - {name: ZEPPELIN_NOTEBOOK_DIR, value: /data/notebook}
        # zeppelin.notebook.public varsayılanı TRUE: yeni her not defteri BÜTÜN oturum açmış kullanıcılara
        # açık olur (Shiro rol kapısı yalnız girişi sınırlar, not sahipliğini değil). Servis hesabı modelinde
        # (paylaşımlı `zeppelin` Trino hesabı) bu, bir analistin notunun kullanıcılarca okunması demektir ->
        # varsayılan private; paylaşım not bazında UI'dan (Note permissions) verilir.
        - {name: ZEPPELIN_NOTEBOOK_PUBLIC, value: "false"}
        - {name: ZEPPELIN_CONFIG_FS_DIR, value: /data/conf}
        - {name: ZEPPELIN_DEP_LOCALREPO, value: /data/local-repo}
        # ZEPPELIN_METRIC_ENABLE_PROMETHEUS BİLEREK YOK: izleme kapsamı "boru hattı sağlığı"na daraltıldı
        # (kullanıcı kararı 2026-09-18, Task 2b) — Zeppelin ServiceMonitor kaldırıldı (glue monitoring.yaml).
        - {name: ZEPPELIN_MEM, value: {{ $z.mem | quote }}}
        - {name: ZEPPELIN_INTP_MEM, value: {{ $z.intpMem | quote }}}
        {{- if .Values.keycloak.ldap.caSecret }}
        # Hem sunucu JVM'i (Shiro/AD girişi) hem yorumlayıcı JVM'leri AD kökünü içeren KOPYA depoyu kullanır.
        - {name: ZEPPELIN_JAVA_OPTS, value: "-Djavax.net.ssl.trustStore=/truststore/ad-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"}
        - {name: ZEPPELIN_INTP_JAVA_OPTS, value: "-Djavax.net.ssl.trustStore=/truststore/ad-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"}
        {{- end }}
        resources: {{ toJson $z.resources }}
        readinessProbe: {httpGet: {path: /api/version, port: http}, initialDelaySeconds: 20, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /api/version, port: http}, initialDelaySeconds: 90, periodSeconds: 20}
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: shiro, mountPath: /opt/zeppelin/conf/shiro.ini, subPath: shiro.ini, readOnly: true}
        - {name: lakehouse-ca, mountPath: /etc/lakehouse-ca, readOnly: true}
        {{- if .Values.keycloak.ldap.caSecret }}
        - {name: ad-truststore, mountPath: /truststore, readOnly: true}
        {{- end }}
      volumes:
      - {name: data, persistentVolumeClaim: {claimName: zeppelin-data}}
      - {name: seed, secret: {secretName: {{ $z.interpreterSecret }}}}
      - {name: shiro, secret: {secretName: {{ $z.shiroSecret }}}}
      - {name: lakehouse-ca, secret: {secretName: lakehouse-ca, items: [{key: tls.crt, path: tls.crt}]}}
      {{- with .Values.keycloak.ldap.caSecret }}
      - {name: ad-truststore, emptyDir: {}}
      - {name: ad-ca, secret: {secretName: {{ . | quote }}, items: [{key: ca.crt, path: ca.crt}]}}
      {{- end }}
---
apiVersion: v1
kind: Service
# label app: zeppelin — Service'in kendi selector'ı ve NetworkPolicy/`kubectl -l` seçimleri içindir.
# (ServiceMonitor DEĞİL: Zeppelin ServiceMonitor'ü Task 2b'de kaldırıldı — glue/templates/monitoring.yaml.)
metadata: {name: zeppelin, namespace: {{ $ns }}, labels: {app: zeppelin}}
spec: {selector: {app: zeppelin}, ports: [{name: http, port: 8080, targetPort: http}]}
{{- end }}
