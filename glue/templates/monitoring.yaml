{{- if .Values.monitoring.enabled }}
{{- $ns := include "glue.ns" . }}
# Strimzi jmx_exporter kural setleri (glue/files/metrics/*.yml; Strimzi 1.2.0 örneklerinden birebir).
# Kafka/KafkaConnect CR'larının metricsConfig'i bu ConfigMap'leri gösterir -> her broker/worker pod'u
# tcp-prometheus (9404) portunda /metrics açar.
apiVersion: v1
kind: ConfigMap
metadata: {name: kafka-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
data:
  kafka-metrics-config.yml: |
{{ .Files.Get "files/metrics/kafka-metrics.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: connect-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
data:
  metrics-config.yml: |
{{ .Files.Get "files/metrics/kafka-connect-metrics.yml" | indent 4 }}
---
# Strimzi examples/metrics/prometheus-install/pod-monitors/kafka-resources-metrics.yaml (Kafka + KafkaConnect tek PodMonitor)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: kafka-resources-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
spec:
  selector: {matchExpressions: [{key: strimzi.io/kind, operator: In, values: [Kafka, KafkaConnect]}]}
  namespaceSelector: {matchNames: [{{ $ns }}]}
  podMetricsEndpoints:
  - path: /metrics
    port: tcp-prometheus
    relabelings:
    - {separator: ";", regex: __meta_kubernetes_pod_label_(strimzi_io_.+), replacement: $1, action: labelmap}
    - {sourceLabels: [__meta_kubernetes_namespace], separator: ";", regex: (.*), targetLabel: namespace, replacement: $1, action: replace}
    - {sourceLabels: [__meta_kubernetes_pod_name], separator: ";", regex: (.*), targetLabel: kubernetes_pod_name, replacement: $1, action: replace}
---
# z2jh hub: /hub/metrics (Service `hub`, port adı `hub` — canlı doğrulandı). authenticate_prometheus: false
# (platform/values/jupyterhub.yaml) olmadan bu uç nokta token ister; hub netpol'ü dev'de Prometheus pod etiketiyle,
# prod'da openshift-user-workload-monitoring namespaceSelector'ı ile açılır.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: hub, namespace: {{ $ns }}, labels: {app: jupyterhub}}
spec:
  selector: {matchLabels: {app.kubernetes.io/name: jupyterhub, app.kubernetes.io/component: hub}}
  namespaceSelector: {matchNames: [{{ $ns }}]}
  endpoints:
  - {port: hub, path: /hub/metrics, interval: 30s}
{{- if .Values.zeppelin.enabled }}
---
# Zeppelin: ZEPPELIN_METRIC_ENABLE_PROMETHEUS=true (zeppelin.metric.enable.prometheus) -> /metrics (Micrometer).
# fallbackScrapeProtocol ZORUNLU: Zeppelin 0.12.1 /metrics'i BOŞ Content-Type ile döner ve Prometheus 3.x
# bunu "non-compliant scrape target sending blank Content-Type" diyerek reddeder (canlı doğrulandı).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: zeppelin, namespace: {{ $ns }}, labels: {app: zeppelin}}
spec:
  fallbackScrapeProtocol: PrometheusText0.0.4
  selector: {matchLabels: {app: zeppelin}}
  namespaceSelector: {matchNames: [{{ $ns }}]}
  endpoints:
  - {port: http, path: /metrics, interval: 30s}
{{- end }}
{{- end }}
