{{- if .Values.monitoring.enabled }}
{{- $ns := include "glue.ns" . }}
# Strimzi jmx_exporter kural setleri (glue/files/metrics/*.yml; Strimzi 1.2.0 örneklerinden birebir).
# Kafka/KafkaConnect CR'larının metricsConfig'i bu ConfigMap'leri gösterir -> her broker/worker pod'u
# tcp-prometheus (9404) portunda /metrics açar.
apiVersion: v1
kind: ConfigMap
metadata: {name: kafka-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
data:
  kafka-metrics-config.yml: |
{{ .Files.Get "files/metrics/kafka-metrics.yml" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: connect-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
data:
  metrics-config.yml: |
{{ .Files.Get "files/metrics/kafka-connect-metrics.yml" | indent 4 }}
---
# Strimzi examples/metrics/prometheus-install/pod-monitors/kafka-resources-metrics.yaml (Kafka + KafkaConnect tek PodMonitor).
# kafka-exporter (Kafka.spec.kafkaExporter, glue kafka.yaml) pod'u da strimzi.io/kind: Kafka etiketi + AYNI
# port adı/numarası (tcp-prometheus/9404) taşır -> bu PodMonitor onu da yakalar (canlı doğrulandı); ayrı bir
# PodMonitor GEREKMEDİ. Consumer lag: kafka_consumergroup_lag{consumergroup,topic,partition}.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: kafka-resources-metrics, namespace: {{ $ns }}, labels: {app: strimzi}}
spec:
  selector: {matchExpressions: [{key: strimzi.io/kind, operator: In, values: [Kafka, KafkaConnect]}]}
  namespaceSelector: {matchNames: [{{ $ns }}]}
  podMetricsEndpoints:
  - path: /metrics
    port: tcp-prometheus
    relabelings:
    - {separator: ";", regex: __meta_kubernetes_pod_label_(strimzi_io_.+), replacement: $1, action: labelmap}
    - {sourceLabels: [__meta_kubernetes_namespace], separator: ";", regex: (.*), targetLabel: namespace, replacement: $1, action: replace}
    - {sourceLabels: [__meta_kubernetes_pod_name], separator: ";", regex: (.*), targetLabel: kubernetes_pod_name, replacement: $1, action: replace}
---
# hub/zeppelin ServiceMonitor'ları BİLEREK YOK: izleme kapsamı "boru hattı sağlığı"na daraltıldı (kullanıcı
# kararı 2026-09-18) — gösterim bileşenlerinin (JupyterHub hub, Zeppelin) uygulama metriği toplanmaz.
# platform/values/jupyterhub{,-dev}.yaml'daki authenticate_prometheus/networkPolicy override'ları ve
# glue/templates/zeppelin.yaml'daki ZEPPELIN_METRIC_ENABLE_PROMETHEUS env'i de bu kararla kaldırıldı.
# Lakehouse alarm kuralları. alertmanager kapalı (dev) -> hiçbir yere bildirim gitmez; doğrulama
# /api/v1/rules (health) + /api/v1/alerts (ALERTS serisi) üzerinden yapılır.
# runbook annotation'ları docs/50-isletme/sorun-giderme.md'nin BÖLÜM ÇAPALARINA işaret eder. Çapalar o
# sayfada başlığın hemen üstündeki HTML <a id="..."></a> satırlarıdır (GitHub Türkçe başlıklardan bu
# slug'ları üretmez, {#id} sözdizimi de GitHub'da çalışmaz). Çapa adları kilitlidir: glue/tests/monitoring_test.yaml
# her alarmın runbook'unun bu dosya + geçerli bir çapa ile başladığını doğrular; çapayı değiştirmeden
# ÖNCE sorun-giderme.md'deki <a id> satırını değiştirin.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: lakehouse, namespace: {{ $ns }}}
spec:
  groups:
  - name: lakehouse
    rules:
    - alert: LakehouseConnectTaskFailed
      expr: kafka_connect_connector_task_status{status="failed"} == 1
      for: 5m
      labels: {severity: critical}
      annotations: {summary: "Connect task FAILED: {{ "{{ $labels.connector }}" }}/{{ "{{ $labels.task }}" }}", runbook: docs/50-isletme/sorun-giderme.md#connect}
    - alert: LakehouseSinkStalled
      # lag tabanlı (kapsam kararı): kafka-exporter'ın kafka_consumergroup_lag'i (glue kafka.yaml
      # kafkaExporter). Iceberg sink upstream commit aralığı 300 s (prod) / 30 s (dev, connect.sinkCommitIntervalMs)
      # -> 15 dk pencere birkaç commit'i kapsar; birikim gerçek takılma demektir (yalnız consumer geride kalma
      # DEĞİL, offset commit döngüsünün durduğu senaryo dahil). connect-sink-* öneki: sink connector grupları
      # (connect-sink-shop, connect-sink-shop-coord, connect-sink-nginx, connect-sink-nginx-coord — canlı
      # doğrulandı, -coord grupları da lag üretiyor ve BİLEREK dışlanmadı).
      expr: sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup=~"connect-sink-.*"}) > {{ .Values.monitoring.sinkLagThreshold }}
      for: 15m
      labels: {severity: warning}
      annotations: {summary: "Iceberg sink lag eşiği aştı: {{ "{{ $labels.consumergroup }}" }}/{{ "{{ $labels.topic }}" }}", runbook: docs/50-isletme/sorun-giderme.md#sink}
    - alert: LakehouseSilverMergeStale
      # en son COMPLETED silver-merge koşusundan bu yana > eşik (prod 45 dk; dev gecelik cron -> 2 gün).
      # BİLİNÇLİ absence-safe tasarım: kube_customresource_sparkapp_* yalnız CR VARKEN üretilir;
      # taze kümede (e2e run_spark_once SparkApplication'ları siler) seri hiç yoktur. `max(...)` boş vektör
      # üzerinde SONUÇSUZ döner (0 değil) -> `time() - max(...)` de sonuçsuz kalır -> kural INACTIVE olur,
      # YANLIŞ ateşlemez. `or absent()` bilerek eklenmedi: absent() dev'de CR hiç yokken sürekli true döner ve
      # sahte "stale" alarmı üretirdi (glue-dev eşiği 172800 s olsa bile).
      expr: time() - max(kube_customresource_sparkapp_termination_time{name=~"silver-merge-.*"} and on (name) kube_customresource_sparkapp_state{state="COMPLETED"} == 1) > {{ .Values.monitoring.silverMergeStaleSeconds }}
      for: 10m
      labels: {severity: warning}
      annotations: {summary: "silver-merge son başarı yaşı eşiği aştı", runbook: docs/50-isletme/sorun-giderme.md#silver-merge}
    - alert: LakehouseSparkScheduledRunFailed
      expr: kube_customresource_sparkapp_state{state="FAILED", name=~"(silver-merge|maint-.*|mongo-bronze)-[0-9]+"} == 1
      for: 1m
      labels: {severity: warning}
      annotations: {summary: "Zamanlanmış Spark koşusu FAILED: {{ "{{ $labels.name }}" }}", runbook: docs/50-isletme/sorun-giderme.md#spark}
    - alert: LakehouseSparkRunTooLong
      # spark_application_success_execution_time_seconds bir SUMMARY'dir (canlı /api/v1/metadata doğrulandı) VE
      # spark-operator 2.5.2'nin exporter'ı per-app etiket YAYMAZ (tüm seriler app_type="Unknown", canlı
      # doğrulandı — kube_customresource_sparkapp_* KSM metrikleri de tek başlarına per-run süre vermiyor: yalnız
      # termination_time var, başlangıç zamanı yok). Bu kural SON 6 SAATTEKİ başarılı koşuların ortalama
      # süresidir (rate(_sum[6h]) / rate(_count[6h])) — operator per-app etiket vermediği için KÜME GENELİ.
      # Düzeltme (review bulgusu, fix round 1/5): _sum/_count'un HAM (windowsuz) oranı operator pod'u
      # başladığından beri TÜM ZAMANLARIN ortalamasıdır — yüzlerce koşudan sonra tek bir 5000 sn'lik koşu
      # ortalamayı neredeyse hiç oynatmaz ve kural tam da geçmiş biriktiğinde gerçek yavaşlamaları kaçırır.
      # rate(...) pencereyi son 6 saate sabitler, taze bir yavaşlama HER ZAMAN görünür kalır. Pencerede hiç
      # koşu yoksa (taze küme/sessiz dönem) rate() sayaç için SONUÇSUZ döner (extrapolation verisi yok) ->
      # oran NaN -> NaN > eşik hiçbir zaman doğru DEĞİLDİR -> kural absence-safe, taze kümede INACTIVE.
      expr: rate(spark_application_success_execution_time_seconds_sum[6h]) / rate(spark_application_success_execution_time_seconds_count[6h]) > {{ .Values.monitoring.sparkRunMaxSeconds }}
      for: 10m
      labels: {severity: warning}
      annotations: {summary: "Spark koşularının son 6 saatteki ortalama süresi eşiği aştı (>{{ .Values.monitoring.sparkRunMaxSeconds }}s)", runbook: docs/50-isletme/sorun-giderme.md#spark-duration}
---
# Grafana dashboard ConfigMap'leri: sidecar etiketi grafana_dashboard, searchNamespace ALL (monitoring-dev.yaml) ->
# bu ns'te (lakehouse) olabilirler. Kaynak/lisans/datasource notu: glue/files/dashboards/README.md.
# Yalnız Strimzi (Kafka Connect pipeline sağlığı) — kapsam kontrolör kararıyla daraltıldı (2026-09-18): izleme
# "pipeline health" odaklı, sunum bileşenleri (Trino dashboard'u) dışarıda bırakıldı; 5 PrometheusRule (Kafka
# consumer lag/Connect/Spark tabanlı) etkilenmedi. Superset: /metrics yok (glue/templates/superset.yaml) -> Superset
# dashboard'u YOK.
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-strimzi-kafka, namespace: {{ $ns }}, labels: {grafana_dashboard: "1"}}
data:
  strimzi-kafka.json: {{ .Files.Get "files/dashboards/strimzi-kafka.json" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-dashboard-strimzi-kafka-connect, namespace: {{ $ns }}, labels: {grafana_dashboard: "1"}}
data:
  strimzi-kafka-connect.json: {{ .Files.Get "files/dashboards/strimzi-kafka-connect.json" | quote }}
{{- end }}
