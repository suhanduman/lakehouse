{{- if .Values.components.minio }}
# DEV-ONLY (kind/PoC): tek replika MinIO. Prod'da müşterinin S3'ü kullanılır; components.minio=false ile render edilmez.
apiVersion: v1
kind: Secret
metadata: {name: s3-creds, namespace: {{ include "glue.ns" . }}}
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.rootPassword | quote }}
{{- if .Values.backup.enabled }}
---
# DEV-ONLY: CNPG yedek bucket'ının kimliği = MinIO root kimliği. Prod'da bu Secret kurulumdan ÖNCE elle yaratılır
# (ayrı S3 hesabı/anahtarı; docs/30-kurulum.md §5.3) ve components.minio=false olduğu için burası render EDİLMEZ.
apiVersion: v1
kind: Secret
metadata: {name: {{ .Values.backup.s3.secret }}, namespace: {{ include "glue.ns" . }}}
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.rootPassword | quote }}
{{- end }}
{{- if .Values.minio.persistence.enabled }}
---
# PVC: emptyDir'de MinIO yeniden başlayınca Iceberg dosyaları VE CNPG yedekleri kaybolur (Polaris'te yetim kayıt kalır)
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-data, namespace: {{ include "glue.ns" . }}}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.minio.persistence.size }}}}
{{- with .Values.minio.persistence.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: {{ include "glue.ns" . }}}
spec:
  replicas: 1
  # RWO PVC tek pod'a bağlanır: rolling update'te yeni pod eskisini bekler -> Recreate
  strategy: {type: Recreate}
  selector: {matchLabels: {app: minio}}
  template:
    metadata:
      labels: {app: minio}
{{- if .Values.velero.enabled }}
      # Velero fs-backup dışlaması: MinIO PVC'si lakehouse'un KENDİSİ (Iceberg dosyaları + CNPG yedekleri).
      # Veri gölünü kendi yedek deposuna kopyalamak döngüseldir; Velero'nun kapsamı ns nesneleri + notebook PVC'leridir.
      annotations: {backup.velero.io/backup-volumes-excludes: {{ .Values.velero.excludeVolumes.minio | quote }}}
{{- end }}
    spec:
      containers:
      - name: minio
        # Topluluk imajları 2026-09'da geri çekildi (quay/Docker Hub 401) -> aynı etiketten
        # kaynaktan derlenmiş kendi AGPL-3.0 aynamız (scripts/build-minio-mirror.sh).
        image: ghcr.io/suhanduman/minio:RELEASE.2025-09-07T16-13-09Z
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - {name: MINIO_ROOT_USER, value: {{ .Values.minio.rootUser | quote }}}
        - {name: MINIO_ROOT_PASSWORD, value: {{ .Values.minio.rootPassword | quote }}}
        ports: [{containerPort: 9000}, {containerPort: 9001}]
        volumeMounts: [{name: data, mountPath: /data}]
{{- if .Values.minio.persistence.enabled }}
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio-data}}]
{{- else }}
      volumes: [{name: data, emptyDir: {}}]
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: {{ include "glue.ns" . }}}
spec:
  selector: {app: minio}
  ports: [{name: api, port: 9000}, {name: console, port: 9001}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/hook: Sync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation}
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        # Yukarıdakiyle aynı neden: kaynaktan derlenmiş GHCR aynası.
        image: ghcr.io/suhanduman/mc:RELEASE.2025-08-13T08-35-41Z
        command: ["/bin/sh","-c"]
        args:
        - |
          until mc alias set m http://minio.{{ include "glue.ns" . }}.svc:9000 {{ .Values.minio.rootUser | quote }} {{ .Values.minio.rootPassword | quote }}; do sleep 3; done
          {{- range .Values.minio.buckets }}
          mc mb -p m/{{ . }}
          {{- end }}
          mc ls m
{{- end }}
