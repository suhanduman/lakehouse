# Realm import — AD/LDAP federation + OIDC clients in a single YAML. Ported
# from v1 chart/templates/10-keycloak.yaml (KeycloakRealmImport block); realm
# content (LDAP storage-provider component + its mappers, roles, groups)
# preserved as-is. Client set narrowed to F1 platform scope (trino, superset,
# jupyterhub, polaris); redirectUris türetilir (servis hostname + sabit yol) +
# keycloak.extraRedirectUris.* — v1's downstream-app clients (console, kafka-ui,
# grafana, sandbox, dbt, zeppelin, nessie machine-auth, ai-ui, device-flow)
# belong to subsystems not yet built in this chart and will get their own
# clients when those tasks land.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: {{ printf "%s-realm" .Values.keycloak.realm.name }}
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  keycloakCRName: keycloak
  # Realm secret'ları düz metin DEĞİL: Secret keycloak.clientsSecret'tan placeholder ile enjekte edilir (${NAME} -> realm içinde kullanılır)
  placeholders:
    TRINO_CLIENT_SECRET:      {secret: {name: {{ .Values.keycloak.clientsSecret }}, key: trino}}
    SUPERSET_CLIENT_SECRET:   {secret: {name: {{ .Values.keycloak.clientsSecret }}, key: superset}}
    JUPYTERHUB_CLIENT_SECRET: {secret: {name: {{ .Values.keycloak.clientsSecret }}, key: jupyterhub}}
    LDAP_BIND_CREDENTIAL:     {secret: {name: {{ .Values.keycloak.clientsSecret }}, key: ldap-bind}}
  realm:
    realm: {{ .Values.keycloak.realm.name }}
    displayName: {{ .Values.keycloak.realm.displayName | quote }}
    enabled: true
    registrationAllowed: false
    loginWithEmailAllowed: true
    sslRequired: "external"

    {{- if .Values.keycloak.ldap.enabled }}
    # --- AD/LDAP Federation ---
    components:
      "org.keycloak.storage.UserStorageProvider":
      - name: "Kurumsal AD"
        providerId: "ldap"
        config:
          enabled: ["true"]
          priority: ["0"]
          editMode: ["READ_ONLY"]
          vendor: ["ad"]
          connectionUrl: [{{ .Values.keycloak.ldap.connectionUrl | quote }}]
          bindDn: [{{ .Values.keycloak.ldap.bindDn | quote }}]
          bindCredential: ["${LDAP_BIND_CREDENTIAL}"]
          usersDn: [{{ .Values.keycloak.ldap.usersDn | quote }}]
          userObjectClasses: ["person,organizationalPerson,user"]
          usernameLDAPAttribute: ["sAMAccountName"]
          rdnLDAPAttribute: ["cn"]
          uuidLDAPAttribute: ["objectGUID"]
          searchScope: ["2"]
          useTruststoreSpi: ["ldapsOnly"]
          connectionPooling: ["true"]
          pagination: ["true"]
          batchSizeForSync: ["1000"]
          fullSyncPeriod: ["86400"]
          changedSyncPeriod: ["3600"]
          importEnabled: ["true"]
          syncRegistrations: ["false"]

      "org.keycloak.storage.ldap.mappers.LDAPStorageMapper":
      - name: "email-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["email"]
          ldap.attribute: ["mail"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["false"]
      - name: "last-name-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["lastName"]
          ldap.attribute: ["sn"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["true"]
      - name: "first-name-mapper"
        providerId: "user-attribute-ldap-mapper"
        config:
          user.model.attribute: ["firstName"]
          ldap.attribute: ["givenName"]
          read.only: ["true"]
          is.mandatory.in.ldap: ["true"]
      - name: "group-mapper"
        providerId: "group-ldap-mapper"
        config:
          groups.dn: [{{ .Values.keycloak.ldap.groupsDn | quote }}]
          group.name.ldap.attribute: ["cn"]
          group.object.classes: ["group"]
          preserve.group.inheritance: ["false"]
          membership.ldap.attribute: ["member"]
          membership.attribute.type: ["DN"]
          membership.user.ldap.attribute: ["sAMAccountName"]
          mode: ["READ_ONLY"]
    {{- end }}

    # --- OIDC Clients (F1 platform scope) --- redirectUris türetilir: ilgili
    # servisin hostname'i + sabit callback yolu, artı keycloak.extraRedirectUris.*
    # (lokal port-forward vb. ek URI'ler)
    clients:
    - clientId: trino
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      secret: "${TRINO_CLIENT_SECRET}"
      standardFlowEnabled: true
      directAccessGrantsEnabled: {{ if .Values.keycloak.devUsers }}true{{ else }}false{{ end }}   # yalnız dev: e2e password grant
      redirectUris: {{ toJson (concat (list (printf "https://%s/oauth2/callback" (include "glue.hostFor" (dict "name" "trino" "ctx" $)))) .Values.keycloak.extraRedirectUris.trino) }}
      webOrigins: ["+"]
      attributes: {access.token.lifespan: "3600"}
      protocolMappers:
      - name: trino-audience          # Trino OAuth2: aud içinde client-id olmalı (Bearer JWT doğrulaması)
        protocol: "openid-connect"
        protocolMapper: "oidc-audience-mapper"
        config: {"included.client.audience": "trino", "access.token.claim": "true", "id.token.claim": "false"}
    - clientId: superset
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      secret: "${SUPERSET_CLIENT_SECRET}"
      standardFlowEnabled: true
      redirectUris: {{ toJson (concat (list (printf "https://%s/oauth-authorized/keycloak" (include "glue.hostFor" (dict "name" "superset" "ctx" $)))) .Values.keycloak.extraRedirectUris.superset) }}
      webOrigins: ["+"]
      protocolMappers:
      - name: groups                  # FAB keycloak provider: role_keys = userinfo.groups
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config: {"claim.name": "groups", "full.path": "false", "id.token.claim": "true", "access.token.claim": "true", "userinfo.token.claim": "true"}
    - clientId: jupyterhub
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      secret: "${JUPYTERHUB_CLIENT_SECRET}"
      standardFlowEnabled: true
      redirectUris: {{ toJson (concat (list (printf "https://%s/hub/oauth_callback" (include "glue.hostFor" (dict "name" "jupyterhub" "ctx" $)))) .Values.keycloak.extraRedirectUris.jupyterhub) }}
      webOrigins: ["+"]
      # `groups` claim mapper — without it Keycloak's userinfo response has no
      # `groups` key at all; jupyterhub_config.py's GenericOAuthenticator
      # (`claim_groups_key = "groups"`) reads this exact claim to gate
      # login/spawn on AD group membership.
      protocolMappers:
      - name: groups
        protocol: "openid-connect"
        protocolMapper: "oidc-group-membership-mapper"
        config:
          "claim.name": "groups"
          "full.path": "false"
          "id.token.claim": "true"
          "access.token.claim": "true"
          "userinfo.token.claim": "true"
    - clientId: polaris
      enabled: true
      protocol: "openid-connect"
      publicClient: false
      standardFlowEnabled: true
      redirectUris: {{ toJson .Values.keycloak.extraRedirectUris.polaris }}
      webOrigins: ["+"]

    # Realm roles — assigned at runtime based on AD group membership
    roles:
      realm:
      - name: admin
        description: "Lakehouse yöneticisi"
      - name: analyst
        description: "Veri analisti / Araştırmacı"
      - name: student
        description: "Öğrenci (salt-okunur)"

    groups:
    - name: lakehouse-admins
      realmRoles: [admin]
    - name: lakehouse-analysts
      realmRoles: [analyst]
    - name: lakehouse-students
      realmRoles: [student]

    {{- with .Values.keycloak.devUsers }}
    # DEV-ONLY statik kullanıcılar (e2e password grant); prod'da kullanıcılar AD federasyonundan gelir
    users:
    {{- range . }}
    - username: {{ .username }}
      enabled: true
      email: {{ printf "%s@example.com" .username }}
      firstName: {{ .username | title }}
      lastName: Dev
      emailVerified: true
      credentials: [{type: password, value: {{ .password | quote }}, temporary: false}]
      groups: [{{ printf "/%s" .group | quote }}]
    {{- end }}
    {{- end }}
