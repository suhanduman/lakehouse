apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: {{ include "glue.ns" . }}
  labels: {strimzi.io/cluster: lakehouse}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
    - id: 0
      type: persistent-claim
      size: {{ .Values.kafka.storageSize }}
      kraftMetadata: shared
{{- with .Values.kafka.storageClass }}
      class: {{ . | quote }}
{{- end }}
{{- if .Values.velero.enabled }}
  # Velero fs-backup dışlaması (pod annotation'ı): Kafka dayanıklılığı replikasyonla sağlanır; jbod hacmini
  # Kopia'ya kopyalamak hem tutarsız (canlı segment/indeks dosyaları) hem de pahalıdır. Hacim adı jbod id'sinden
  # türer: id 0 -> data-0 (canlı doğrulandı).
  template:
    pod:
      metadata:
        annotations: {backup.velero.io/backup-volumes-excludes: {{ .Values.velero.excludeVolumes.kafka | quote }}}
{{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lakehouse
  namespace: {{ include "glue.ns" . }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
    argocd.argoproj.io/sync-wave: "0"
spec:
  kafka:
    version: {{ .Values.versions.kafka | quote }}
    metadataVersion: {{ .Values.versions.kafkaMetadata | quote }}
    listeners:
    - {name: tls, port: 9093, type: internal, tls: true, authentication: {type: scram-sha-512}}
{{- if .Values.kafka.plainListener }}
    - {name: plain, port: 9092, type: internal, tls: false}
{{- end }}
{{- if .Values.kafka.externalListener }}
    - {name: external, port: 9094, type: {{ ternary "route" "nodeport" (eq (include "glue.isOpenShift" .) "true") }}, tls: true, authentication: {type: scram-sha-512}}
{{- end }}
    authorization:
      type: simple
{{- if .Values.kafka.plainListener }}
      superUsers: [ANONYMOUS]      # yalnız dev: plain listener kimliksiz erişir
{{- end }}
    config:
{{ toYaml .Values.kafka.config | indent 6 }}
{{- if .Values.monitoring.enabled }}
    # jmx_exporter: her broker pod'unda tcp-prometheus (9404) /metrics — kurallar glue monitoring.yaml ConfigMap'inde
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom: {configMapKeyRef: {name: kafka-metrics, key: kafka-metrics-config.yml}}
{{- end }}
  entityOperator: {topicOperator: {}, userOperator: {}}
{{- if .Values.monitoring.enabled }}
  # kafka-exporter: consumer group lag (kafka_consumergroup_lag) — jmx_exporter broker metrikleri lag VERMEZ
  # (yalnız throughput/partition sayaçları). LakehouseSinkStalled kuralı bu metriğe dayanır (glue monitoring.yaml).
  # Canlı doğrulandı: exporter pod'u strimzi.io/kind: Kafka etiketini TAŞIR ve container portu 9404 adı
  # tcp-prometheus'tur (broker jmx_exporter'ıyla AYNI ad/numara) -> mevcut kafka-resources-metrics PodMonitor'ü
  # (selector strimzi.io/kind In [Kafka,KafkaConnect], podMetricsEndpoints port: tcp-prometheus) exporter'ı da
  # YAKALAR; ayrı bir PodMonitor GEREKMEDİ (Prometheus hedefi "up", job lakehouse/kafka-resources-metrics).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 128Mi}}
{{- end }}
