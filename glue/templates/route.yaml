{{- if and (eq (include "glue.isOpenShift" .) "true") .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: keycloak, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ include "glue.host" .Values.keycloak.hostname }}
  to: {kind: Service, name: keycloak-service}
  port: {targetPort: http}
  tls: {termination: edge}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: polaris, namespace: {{ include "glue.ns" . }}}
spec:
  to: {kind: Service, name: polaris}
  port: {targetPort: 8181}
  tls: {termination: edge}
---
# Trino kendi TLS'ini sonlandırır (kimlik doğrulama TLS ister): edge YOK.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: trino, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ .Values.trino.hostname }}
  to: {kind: Service, name: trino}
  port: {targetPort: https}
  tls:
  {{- if .Values.tls.caBundle }}
    termination: reencrypt
    destinationCACertificate: {{ .Values.tls.caBundle | quote }}
  {{- else }}
    termination: passthrough        # tarayıcı lakehouse-ca'ya güvenmeli (runbooks/install.md)
  {{- end }}
{{- end }}
