{{- if and (eq (include "glue.isOpenShift" .) "true") .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: keycloak, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ include "glue.host" .Values.keycloak.hostname }}
  to: {kind: Service, name: keycloak-service}
  port: {targetPort: http}
  tls: {termination: edge}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: polaris, namespace: {{ include "glue.ns" . }}}
spec:
  to: {kind: Service, name: polaris}
  port: {targetPort: 8181}
  tls: {termination: edge}
---
# Trino kendi TLS'ini sonlandırır (kimlik doğrulama TLS ister): edge YOK.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: trino, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ .Values.trino.hostname }}
  to: {kind: Service, name: trino}
  port: {targetPort: https}
  tls:
  {{- if .Values.tls.caBundle }}
    termination: reencrypt
    destinationCACertificate: {{ .Values.tls.caBundle | quote }}
  {{- else }}
    termination: passthrough        # tarayıcı lakehouse-ca'ya güvenmeli (runbooks/install.md)
  {{- end }}
{{- if .Values.superset.enabled }}
---
# Superset kendi TLS'ini sonlandırmaz (operator Service'i düz HTTP 8088): edge.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: superset, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ .Values.superset.hostname }}
  to: {kind: Service, name: superset-web-server}   # operator adlandırması: <CR adı>-web-server
  port: {targetPort: http}
  tls: {termination: edge}
{{- end }}
---
# z2jh kendi TLS'ini sonlandırmaz (proxy-public düz HTTP 80): edge.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: jupyterhub, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ .Values.jupyterhub.hostname }}
  to: {kind: Service, name: proxy-public}
  port: {targetPort: http}
  tls: {termination: edge}
{{- if .Values.zeppelin.enabled }}
---
# Zeppelin kendi TLS'ini sonlandırmaz (düz HTTP 8080): edge.
apiVersion: route.openshift.io/v1
kind: Route
metadata: {name: zeppelin, namespace: {{ include "glue.ns" . }}}
spec:
  host: {{ .Values.zeppelin.hostname }}
  to: {kind: Service, name: zeppelin}
  port: {targetPort: http}
  tls: {termination: edge}
{{- end }}
{{- end }}
