{{- if and .Values.ingress.enabled (ne (include "glue.isOpenShift" .) "true") }}   {{/* openshift'te Route kullanılır */}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: keycloak, namespace: {{ include "glue.ns" . }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ include "glue.host" .Values.keycloak.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: keycloak-service, port: {number: 8080}}}
---
# keycloak Ingress'i İLK belge kalmalı (glue/tests: documentIndex 0). Trino'ya trafik HTTPS olarak iletilir (uçtan uca TLS).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trino
  namespace: {{ include "glue.ns" . }}
  annotations: {nginx.ingress.kubernetes.io/backend-protocol: HTTPS}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.trino.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: trino, port: {number: 8443}}}
{{- if .Values.superset.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: superset, namespace: {{ include "glue.ns" . }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.superset.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: superset-web-server, port: {number: 8088}}}   # operator adlandırması: <CR adı>-web-server
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: jupyterhub, namespace: {{ include "glue.ns" . }}}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
  - host: {{ .Values.jupyterhub.hostname }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend: {service: {name: proxy-public, port: {number: 80}}}
{{- end }}
