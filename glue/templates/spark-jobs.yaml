{{- /* jobs kodu + pipelines.json tek ConfigMap; ScheduledSparkApplication'lar koşullu: silver-merge (pipelines), 3 bakım (pipelines|mongo|nginx),
       mongo-bronze (mongodb kaynağı) (spec §6). Credential: Secret -> env (plan P4). */ -}}
{{- $ns := include "glue.ns" . }}
{{- $s := .Values.spark }}
{{- /* Bakım işi Bronze tablolarını katalogdan bulur: her kaynağın Bronze namespace'i (pipeline'ı olmayan append-only tablolar da). */ -}}
{{- $nsList := list }}
{{- range .Values.sources }}
{{- $nsList = append $nsList (.bronzeNamespace | default (printf "%s_raw" .name)) }}
{{- end }}
{{- $nsList = uniq $nsList }}
{{- /* mongo-bronze'un okuyacağı Kafka topic'i -> Bronze tablo eşlemesi (Task 1 mongo_bronze.py pipelines.json.mongo sözleşmesi) */ -}}
{{- $mongoList := list }}
{{- range .Values.sources }}{{ if eq .type "mongodb" }}
{{- $bn := .bronzeNamespace | default (printf "%s_raw" .name) }}{{ $pfx := .topicPrefix | default .name }}
{{- range .collections }}{{ $mongoList = append $mongoList (dict "topic" (printf "%s.%s" $pfx .) "bronze" (printf "%s.%s" $bn (last (splitList "." .)))) }}{{ end }}
{{- end }}{{ end }}
{{- /* Bakım kapsamına giren ama pipeline/mongo dışı namespace'ler (şimdilik yalnız nginx_raw) — TTL YOK, saklama F5 */ -}}
{{- $maintList := list }}
{{- if .Values.nginx.enabled }}
{{- $maintList = append $maintList (first (splitList "." .Values.nginx.table)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: lakehouse-jobs
  namespace: {{ $ns }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
data:
{{ (.Files.Glob "jobs/*.py").AsConfig | indent 2 }}
  pipelines.json: {{ toJson (dict "pipelines" .Values.pipelines "bronze_namespaces" $nsList "mongo" $mongoList "maintain_namespaces" $maintList) | quote }}
{{- $m := $s.maintenance }}
{{- /* bakım SSA'ları (maint-*) pipeline, mongo ya da nginx'ten HERHANGİ biri varsa çalışır: nginx_raw da bakım görsün (TTL hariç, F5) */ -}}
{{- $maintGate := or .Values.pipelines $mongoList .Values.nginx.enabled }}
{{- $jobs := list
  (dict "name" "silver-merge"            "file" "merge_cdc.py"           "schedule" $s.schedules.silverMerge     "args" list                                                                                                                                     "when" .Values.pipelines)
  (dict "name" "maint-position-deletes"  "file" "iceberg_maintenance.py" "schedule" $s.schedules.positionDeletes "args" (list "--mode" "position-deletes")                                                                                                       "when" $maintGate)
  (dict "name" "maint-compact"           "file" "iceberg_maintenance.py" "schedule" $s.schedules.compact         "args" (list "--mode" "compact")                                                                                                                "when" $maintGate)
  (dict "name" "maint-expire-orphan-ttl" "file" "iceberg_maintenance.py" "schedule" $s.schedules.expireOrphanTtl "args" (list "--mode" "expire-orphan-ttl" "--snapshot-days" (toString $m.snapshotDays) "--orphan-days" (toString $m.orphanDays) "--bronze-ttl-days" (toString $m.bronzeTtlDays)) "when" $maintGate)
  (dict "name" "mongo-bronze"            "file" "mongo_bronze.py"        "schedule" $s.schedules.mongoBronze     "args" list                                                                                                                                     "kafka" true "when" $mongoList) }}
{{- /* pipelines boşken (F1 kurulumu, kaynak eklenmeden) zamanlanmış iş üretme: her koşu "atlandı" logundan ibaret olurdu. ConfigMap hep render edilir.
   her iş kendi "when"ini taşır: mongo-bronze mongo kaynağına, silver-merge pipelines'a, bakım işleri üçünün BİRLEŞİMİNE bağlı. */ -}}
{{- range $job := $jobs }}
{{- if $job.when }}
---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: {{ $job.name }}
  namespace: {{ $ns }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  schedule: {{ $job.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: {{ $s.image }}
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/job/{{ $job.file }}
    {{- if $job.args }}
    arguments: {{ toJson $job.args }}
    {{- end }}
    sparkVersion: {{ $s.version | quote }}
    restartPolicy: {type: Never}
    timeToLiveSeconds: 86400
    sparkConf:
      {{- /* Iceberg runtime + AWS bundle sürümü versions.iceberg'den (values'ta ikinci bir literal sürüm tutulmaz) */}}
      spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:{{ $.Values.versions.iceberg }},org.apache.iceberg:iceberg-aws-bundle:{{ $.Values.versions.iceberg }}{{ if $job.kafka }},org.apache.spark:spark-sql-kafka-0-10_2.13:{{ $s.version }}{{ end }}"
      spark.jars.ivy: /tmp/.ivy2
      spark.redaction.regex: "(?i)secret|password|token|credential"   # driver/executor log ve Spark UI'da sır sızdırma
      spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
      spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
      spark.sql.catalog.lakehouse.type: rest
      spark.sql.catalog.lakehouse.uri: {{ $.Values.iceberg.catalogUri | quote }}
      spark.sql.catalog.lakehouse.warehouse: {{ $.Values.iceberg.warehouse | quote }}
      spark.sql.catalog.lakehouse.scope: PRINCIPAL_ROLE:ALL
      spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
      spark.sql.catalog.lakehouse.s3.endpoint: {{ $.Values.s3.endpoint | quote }}
      spark.sql.catalog.lakehouse.s3.path-style-access: {{ $.Values.s3.pathStyleAccess | quote }}
      spark.sql.catalog.lakehouse.client.region: {{ $.Values.s3.region | quote }}
      spark.sql.catalog.lakehouse.header.X-Iceberg-Access-Delegation: {{ ternary "vended-credentials" "none" $.Values.s3.vendedCredentials }}
      spark.sql.defaultCatalog: lakehouse
      spark.sql.session.timeZone: UTC            # bakım TIMESTAMP literal'leri ve _cdc.ts karşılaştırmaları UTC (F2-B)
      spark.sql.shuffle.partitions: {{ $s.shufflePartitions | quote }}
      spark.default.parallelism: {{ $s.shufflePartitions | quote }}
      spark.driver.memoryOverhead: {{ $s.driver.memoryOverhead }}
      spark.executor.memoryOverhead: {{ $s.executor.memoryOverhead }}
    driver:
      cores: {{ $s.driver.cores }}
      memory: {{ $s.driver.memory }}
      serviceAccount: {{ $s.serviceAccount }}
      env:
      - {name: AWS_REGION, value: {{ $.Values.s3.region | quote }}}
      - {name: POLARIS_CREDENTIAL, valueFrom: {secretKeyRef: {name: {{ $s.credentialSecret }}, key: credential}}}
      {{- if not $.Values.s3.vendedCredentials }}
      - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
      - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
      {{- end }}
      {{- if $job.kafka }}
      - {name: KAFKA_JAAS, valueFrom: {secretKeyRef: {name: {{ $s.kafkaSecret }}, key: sasl.jaas.config}}}
      - {name: KAFKA_BOOTSTRAP, value: "lakehouse-kafka-bootstrap:9093"}
      - {name: KAFKA_CA, value: "/etc/kafka-ca/ca.crt"}
      {{- end }}
      volumeMounts:
      - {name: job, mountPath: /opt/job}
      {{- if $job.kafka }}
      - {name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true}
      {{- end }}
    executor:
      cores: {{ $s.executor.cores }}
      instances: {{ $s.executor.instances }}
      memory: {{ $s.executor.memory }}
      env:
      - {name: AWS_REGION, value: {{ $.Values.s3.region | quote }}}
      {{- if not $.Values.s3.vendedCredentials }}
      - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_ACCESS_KEY_ID}}}
      - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: s3-creds, key: AWS_SECRET_ACCESS_KEY}}}
      {{- end }}
      {{- if $job.kafka }}
      - {name: KAFKA_JAAS, valueFrom: {secretKeyRef: {name: {{ $s.kafkaSecret }}, key: sasl.jaas.config}}}
      - {name: KAFKA_BOOTSTRAP, value: "lakehouse-kafka-bootstrap:9093"}
      - {name: KAFKA_CA, value: "/etc/kafka-ca/ca.crt"}
      {{- end }}
      volumeMounts:
      - {name: job, mountPath: /opt/job}
      {{- if $job.kafka }}
      - {name: kafka-ca, mountPath: /etc/kafka-ca, readOnly: true}
      {{- end }}
    volumes:
    - name: job
      configMap: {name: lakehouse-jobs}
    {{- if $job.kafka }}
    - name: kafka-ca
      secret: {secretName: lakehouse-cluster-ca-cert, items: [{key: ca.crt, path: ca.crt}]}
    {{- end }}
{{- end }}
{{- end }}
