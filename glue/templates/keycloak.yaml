apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw
    port: 5432
    database: keycloak
    usernameSecret: {name: keycloak-db-app, key: username}
    passwordSecret: {name: keycloak-db-app, key: password}
  hostname:
    hostname: {{ include "glue.keycloakUrl" . }}
    strict: {{ eq (include "glue.isOpenShift" .) "true" }}
    # Sunucudan sunucuya OIDC çağrıları (metadata/token/jwks/userinfo: Superset, JupyterHub hub, Trino) küme içi
    # http://keycloak-service.<ns>.svc:8080'e gider; o istekler için backchannel uç noktaları İÇ adresle döner.
    # issuer ve authorization_endpoint (tarayıcı) dış adreste kalır. Neden: pod'lar dış Route'a giderse router
    # sertifikasına (kurumsal/self-signed CA) güvenmeleri gerekir -> Superset "CERTIFICATE_VERIFY_FAILED" ile giriş
    # döngüsü (ocpphy provası 2026-11-08); ayrıca küme içi trafik router'dan dolaşmaz.
    backchannelDynamic: true
  http:
    httpEnabled: true            # TLS kenarda (Route edge / Ingress); kind'da düz HTTP
  proxy: {headers: xforwarded}
{{- if eq (include "glue.isOpenShift" .) "true" }}
  # OpenShift'te dış erişim glue'nun Route'udur (templates/route.yaml). Operatörün varsayılan Ingress'i açık
  # kalırsa OpenShift onu AYNI host için ikinci bir Route'a çevirir -> `keycloak-ingress-xxxxx  HostAlreadyClaimed`
  # (ocpphy provası 2026-11-08). kind'da bu Ingress dış erişimin kendisidir, orada açık kalır.
  ingress: {enabled: false}
{{- end }}
  bootstrapAdmin:
    user: {secret: {{ .Values.keycloak.adminSecret }}}   # keys: username, password
{{- with .Values.keycloak.ldap.caSecret }}
  # AD LDAPS güven kökü: operatör bu Secret'taki PEM'leri /opt/keycloak/conf/truststores altına bağlar.
  # KC 24'ten beri o dizindeki sertifikalar SİSTEM güven deposuyla BİRLEŞİR -> LDAP federasyonu dâhil
  # bütün giden TLS bağlantıları bu kökü görür (realm'deki useTruststoreSpi: always yalnız depoyu
  # kullanmayı seçer, güveni O KURMAZ). Alan operator 26.7.3 CRD'sinden canlı doğrulandı
  # (kubectl explain keycloak.spec.truststores.secret.name). Boşsa blok hiç render edilmez.
  truststores:
    ad-ca:
      secret: {name: {{ . | quote }}}
{{- end }}
