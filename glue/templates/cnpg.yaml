{{/* Yedek kablolaması (3 Cluster'da ortak): WAL arşivleyici eklenti + Velero hariç tutma */}}
{{- define "glue.cnpgBackup" -}}
{{- if .Values.backup.enabled }}
  # Barman Cloud eklentisi (CNPG-I): WAL arşivi + base backup. isWALArchiver: en çok BİR eklenti olabilir.
  # `enabled: true` AÇIKÇA yazılır (CRD varsayılanı zaten true): `plugins` şemada x-kubernetes-list-type
  # taşımayan DÜZ bir dizidir -> ServerSideApply onu ATOMİK değer olarak görür. Alanı yazmazsak API sunucusu
  # `enabled: true`'yu default'layıp saklar, ArgoCD'nin desired'ı ise onsuz kalır -> Cluster SONSUZA DEK
  # OutOfSync olur (selfHeal her seferinde "serverside-applied" der, diff kapanmaz). CI 35358635069'da
  # application/glue tam da bu yüzden 45 dk boyunca Synced olamadı; helm modu diff yapmadığı için bu sınıf
  # hata YALNIZ ArgoCD yolunda görünür.
  plugins: [{name: barman-cloud.cloudnative-pg.io, enabled: true, isWALArchiver: true, parameters: {barmanObjectName: lakehouse-backups}}]
  # Velero (Task 4): pgdata PVC'si dosya-sistemi yedeğinden HARİÇ — Postgres verisi CNPG/Barman PITR ile korunur
  # (canlı doğrulandı: CNPG pod'unun veri volume adı `pgdata`). inheritedMetadata pod'lara/PVC'lere miras kalır.
  inheritedMetadata:
    annotations: {backup.velero.io/backup-volumes-excludes: pgdata}
{{- end }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: polaris-db
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  instances: {{ .Values.cnpg.polarisDb.instances }}
  storage:
    size: {{ .Values.cnpg.polarisDb.storageSize }}
{{- with .Values.cnpg.polarisDb.storageClass }}
    storageClass: {{ . | quote }}
{{- end }}
  bootstrap:
    initdb: {database: polaris, owner: polaris}
{{- include "glue.cnpgBackup" . }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  instances: {{ .Values.cnpg.keycloakDb.instances }}
  storage:
    size: {{ .Values.cnpg.keycloakDb.storageSize }}
{{- with .Values.cnpg.keycloakDb.storageClass }}
    storageClass: {{ . | quote }}
{{- end }}
  bootstrap:
    initdb: {database: keycloak, owner: keycloak}
{{- include "glue.cnpgBackup" . }}
{{- if .Values.superset.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: superset-db
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  instances: {{ .Values.cnpg.supersetDb.instances }}
  storage:
    size: {{ .Values.cnpg.supersetDb.storageSize }}
{{- with .Values.cnpg.supersetDb.storageClass }}
    storageClass: {{ . | quote }}
{{- end }}
  bootstrap:
    initdb: {database: superset, owner: superset}
{{- include "glue.cnpgBackup" . }}
{{- end }}
{{- if .Values.backup.enabled }}
---
# Tek ObjectStore, üç Cluster: barman-cloud her küme için destinationPath altına serverName (= Cluster adı) klasörü açar.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: lakehouse-backups
  namespace: {{ include "glue.ns" . }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  retentionPolicy: {{ .Values.backup.retentionPolicy | quote }}
  configuration:
    destinationPath: s3://{{ .Values.backup.s3.bucket }}/cnpg
    endpointURL: {{ .Values.backup.s3.endpoint | quote }}
    s3Credentials:
      accessKeyId:     {name: {{ .Values.backup.s3.secret }}, key: AWS_ACCESS_KEY_ID}
      secretAccessKey: {name: {{ .Values.backup.s3.secret }}, key: AWS_SECRET_ACCESS_KEY}
    wal: {compression: gzip}
    data: {compression: gzip}
{{- range $db := (list "polaris" "keycloak" "superset") }}
{{- if or (ne $db "superset") $.Values.superset.enabled }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $db }}-db-daily
  namespace: {{ include "glue.ns" $ }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  # 6 alanlı cron (saniye önce) — Kubernetes CronJob biçimi DEĞİL
  schedule: {{ $.Values.backup.schedule | quote }}
  immediate: true
  backupOwnerReference: self
  method: plugin
  pluginConfiguration: {name: barman-cloud.cloudnative-pg.io}
  cluster: {name: {{ $db }}-db}
{{- end }}
{{- end }}
{{- end }}
