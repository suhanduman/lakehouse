{{- /* sources[].initialLoad: kaynak ilk eklendiğinde var olan verinin nasıl yükleneceği.
   snapshot (varsayılan): Debezium'un ilk yüklemesi (snapshot.mode=initial) — basit; yarıda kalırsa baştan başlar.
   incremental: bağlayıcı yüklemesiz başlar (no_data), yalnız değişiklikleri izler; var olan satırlar sinyal tablosuna
   yazılan artımlı snapshot isteğiyle parça parça gelir — kaldığı yerden sürer, tabloyu kilitlemez (büyük tablolar).
   docs/50-isletme/yeni-kaynak-ve-pipeline.md "İlk yükleme". */ -}}
{{- define "glue.snapshotMode" -}}
{{- $m := .initialLoad | default "snapshot" -}}
{{- if eq $m "snapshot" }}initial{{ else if eq $m "incremental" }}no_data{{ else }}{{ fail (printf "sources[%s].initialLoad: snapshot | incremental olmalı (verilen: %s)" .name $m) }}{{ end -}}
{{- end -}}
{{- /* Sinyal tablosunun Debezium'daki tam adı. SQL Server'da Debezium bütün adlara veritabanını ekler
   (<veritabanı>.<şema>.<tablo>; konu adı da <önek>.<veritabanı>.<şema>.<tablo>) — signal.data.collection ve
   sink'in konu dışlaması bunu bekler; PostgreSQL'de <şema>.<tablo>. */ -}}
{{- define "glue.signalCollection" -}}
{{- $t := required (printf "sources[%s].signalTable zorunlu (incremental snapshot)" .name) .signalTable -}}
{{- if eq .type "sqlserver" }}{{ printf "%s.%s" .database $t }}{{ else }}{{ $t }}{{ end -}}
{{- end -}}
{{- /* Kaynak-DB başına 1 Debezium + 1 Iceberg sink (spec §5.2). Ayarlar spec §12 korunan bilgi + F0 S2/S2d/S3. Runtime mutasyon yok. */ -}}
{{- $ns := include "glue.ns" . }}
{{- $rf := index .Values.kafka.config "default.replication.factor" }}
{{- range .Values.sources }}
{{- $prefix := .topicPrefix | default .name }}
{{- $bronzeNs := .bronzeNamespace | default (printf "%s_raw" .name) }}
{{- if not (or (eq .type "postgres") (eq .type "sqlserver") (eq .type "mongodb")) }}{{ fail (printf "sources[%s].type = %q; postgres|sqlserver|mongodb olmalı" .name .type) }}{{ end }}
{{- if eq .type "mongodb" }}
{{- $cfg := dict
  "mongodb.connection.string" .connectionString
  "mongodb.user" (printf "${secrets:%s/%s-db:username}" $ns .name)
  "mongodb.password" (printf "${secrets:%s/%s-db:password}" $ns .name)
  "topic.prefix" $prefix
  "collection.include.list" (join "," .collections)
  "capture.mode" "change_streams_update_full"
  "snapshot.mode" (include "glue.snapshotMode" .)
  "tombstones.on.delete" "false"
  "heartbeat.interval.ms" "10000"
  "key.converter" "org.apache.kafka.connect.json.JsonConverter"
  "value.converter" "org.apache.kafka.connect.json.JsonConverter"
  "key.converter.schemas.enable" "false"
  "value.converter.schemas.enable" "false"
  "topic.creation.default.replication.factor" $rf
  "topic.creation.default.partitions" $.Values.connect.topicPartitions }}
{{- with .signalCollection }}{{ $_ := set $cfg "signal.data.collection" . }}{{ $_ := set $cfg "signal.enabled.channels" "source" }}{{ end }}
{{- $_ := mergeOverwrite $cfg (.extraConfig | default (dict)) }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: dbz-{{ .name }}
  namespace: {{ $ns }}
  labels: {strimzi.io/cluster: connect}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  class: io.debezium.connector.mongodb.MongoDbConnector
  tasksMax: 1
{{- if .state }}
  {{- if not (has .state (list "running" "paused" "stopped")) }}{{ fail (printf "sources[%s].state: running | paused | stopped olmalı (verilen: %s)" .name .state) }}{{ end }}
  # sources[].state: kaynağı Git'ten durdurma (offset sıfırlama için şart — Strimzi spec'teki durumu geri getirir;
  # REST'ten elle `stop` birkaç saniyede `resume` edilir). docs/50-isletme/kaynak-veya-tablo-silme.md §3
  state: {{ .state }}
{{- end }}
  autoRestart: {enabled: true}
  config:
    {{- range $k, $v := $cfg }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
{{- else }}
{{- /* config bir dict olarak kurulur (literal YAML satırları değil): extraConfig/sinkExtraConfig statik anahtarları
   gerçekten EZEBİLSİN (values.yaml'daki "ek/ezen" sözü) — iki kez aynı anahtarı yazmak geçersiz YAML üretir. */ -}}
{{- $cfg := dict
  "database.hostname" .host
  "database.port" .port
  "database.user" (printf "${secrets:%s/%s-db:username}" $ns .name)
  "database.password" (printf "${secrets:%s/%s-db:password}" $ns .name)
  "topic.prefix" $prefix
  "table.include.list" (join "," (append .tables .signalTable))
  "snapshot.mode" (include "glue.snapshotMode" .)
  "signal.data.collection" (include "glue.signalCollection" .)
  "signal.enabled.channels" "source"
  "time.precision.mode" "connect"
  "decimal.handling.mode" "precise"
  "tombstones.on.delete" "false"
  "heartbeat.interval.ms" "10000"
  "key.converter" "org.apache.kafka.connect.json.JsonConverter"
  "value.converter" "org.apache.kafka.connect.json.JsonConverter"
  "key.converter.schemas.enable" "true"
  "value.converter.schemas.enable" "true"
  "topic.creation.default.replication.factor" $rf
  "topic.creation.default.partitions" $.Values.connect.topicPartitions }}
{{- if eq .type "postgres" }}
{{- $_ := set $cfg "database.dbname" .database }}
{{- $_ := set $cfg "plugin.name" "pgoutput" }}
{{- $_ := set $cfg "slot.name" (printf "debezium_%s" .name) }}
{{- $_ := set $cfg "publication.name" (printf "dbz_%s_pub" .name) }}
{{- $_ := set $cfg "publication.autocreate.mode" "disabled" }}
{{- /* publication.autocreate.mode=disabled: publication'ı (dbz_<ad>_pub) kaynak DB yöneticisi yaratır ve tablo
   eklerken ALTER PUBLICATION ... ADD TABLE der. Debezium'un kendisi yaratsaydı (filtered/all_tables) tablolara
   sahip olması gerekirdi (PostgreSQL kuralı) — üretimde tablo sahipliği devredilmez. CDC rolüne yalnız
   REPLICATION + SELECT (+ sinyal tablosuna yazma) verilir. Gerekirse extraConfig ile ezilir. */ -}}
{{- else }}
{{- $_ := set $cfg "database.names" .database }}
{{- $_ := set $cfg "database.encrypt" "true" }}
{{- $_ := set $cfg "database.trustServerCertificate" (.trustServerCertificate | default false) }}
{{- /* TLS varsayılan AÇIK. Özel CA'lı laboratuvarda sources[].trustServerCertificate: true; üretimde truststore'u
   extraConfig ile ver (database.trustServerCertificate=true sertifika doğrulamasını kapatır). */ -}}
{{- $_ := set $cfg "schema.history.internal.kafka.topic" (printf "schema-history.%s" .name) }}
{{- $_ := set $cfg "schema.history.internal.kafka.bootstrap.servers" "lakehouse-kafka-bootstrap:9093" }}
{{- $_ := set $cfg "schema.history.internal.store.only.captured.tables.ddl" "false" }}
{{- /* Şema değişikliği olaylarını kaynak adlı konuya (ör. `erp`) YAZMA: ürün bu konuyu kullanmaz; bağlayıcı DDL'i
   kendi schema-history.<ad> konusunda tutar. Açık kalsaydı connect kullanıcısının `<ad>.` ön ek ACL'i bu nokta-
   suz konuyu kapsamaz ve görev "Not authorized to describe topic(s) '<ad>'" ile düşerdi. */ -}}
{{- $_ := set $cfg "include.schema.changes" "false" }}
{{- range $c := list "producer" "consumer" }}
{{- /* Debezium'un kendi Kafka istemcileri worker ayarlarını devralmaz: Connect KafkaUser Secret'ı + Strimzi CA (PEM).
   CA dosya olarak DEĞİL, satır içi PEM olarak verilir (ssl.truststore.certificates): Strimzi 1.x Connect pod'una
   CA'yı bağlamaz, worker'ın kendisi de aynı yolu kullanır (strimzisecrets sağlayıcısı). Burada ürünün `secrets`
   sağlayıcısı lakehouse-cluster-ca-cert Secret'ından okur (kafka-connect.yaml Role resourceNames). */ -}}
{{- $_ := set $cfg (printf "schema.history.internal.%s.security.protocol" $c) "SASL_SSL" }}
{{- $_ := set $cfg (printf "schema.history.internal.%s.sasl.mechanism" $c) "SCRAM-SHA-512" }}
{{- $_ := set $cfg (printf "schema.history.internal.%s.sasl.jaas.config" $c) (printf "${secrets:%s/connect:sasl.jaas.config}" $ns) }}
{{- $_ := set $cfg (printf "schema.history.internal.%s.ssl.truststore.type" $c) "PEM" }}
{{- $_ := set $cfg (printf "schema.history.internal.%s.ssl.truststore.certificates" $c) (printf "${secrets:%s/lakehouse-cluster-ca-cert:ca.crt}" $ns) }}
{{- end }}
{{- end }}
{{- $_ := mergeOverwrite $cfg (.extraConfig | default (dict)) }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: dbz-{{ .name }}
  namespace: {{ $ns }}
  labels: {strimzi.io/cluster: connect}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  {{- if eq .type "postgres" }}
  class: io.debezium.connector.postgresql.PostgresConnector
  {{- else }}
  class: io.debezium.connector.sqlserver.SqlServerConnector
  {{- end }}
  tasksMax: 1
{{- if .state }}
  {{- if not (has .state (list "running" "paused" "stopped")) }}{{ fail (printf "sources[%s].state: running | paused | stopped olmalı (verilen: %s)" .name .state) }}{{ end }}
  # sources[].state: kaynağı Git'ten durdurma (offset sıfırlama için şart — Strimzi spec'teki durumu geri getirir;
  # REST'ten elle `stop` birkaç saniyede `resume` edilir). docs/50-isletme/kaynak-veya-tablo-silme.md §3
  state: {{ .state }}
{{- end }}
  autoRestart: {enabled: true}     # Strimzi: FAILED task/connector'ı geri-çekilmeli yeniden başlatır (deklaratif; F5 alarmı kalır)
  config:
    {{- range $k, $v := $cfg }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: sink-{{ .name }}
  namespace: {{ $ns }}
  labels: {strimzi.io/cluster: connect}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: {{ .sinkTasks | default 1 }}
  autoRestart: {enabled: true}
  {{- /* Snapshot saklama TEK sahipli: bakım işi expire_snapshots(--snapshot-days, vars. 7 gün). Auto-create'te
     1 günlük history.expire.max-snapshot-age-ms bununla çelişiyordu -> kaldırıldı (iceberg_maintenance sahibi). */ -}}
  {{- /* iceberg.control.commit.timeout-ms 120 s: az trafikte işçi denetim konusunu ancak bir sonraki put() çağrısında
     (Connect'in ofset yazma aralığı, ~60 s) okur; varsayılan 30 s'lik bekleme kaçar ve tur "0 tablo" ile kapanır,
     veri bir sonraki tura (+5 dk) kalırdı (ocpphy: START_COMMIT 55 s geç işlendi). */ -}}
  {{- $sinkCfg := dict
    "topics.regex" (printf "%s\\.(?!dlq$)(?!%s$).*" $prefix (replace "." "\\." (include "glue.signalCollection" .)))
    "key.converter" "org.apache.kafka.connect.json.JsonConverter"
    "value.converter" "org.apache.kafka.connect.json.JsonConverter"
    "key.converter.schemas.enable" "true"
    "value.converter.schemas.enable" "true"
    "transforms" "dbz"
    "transforms.dbz.type" "org.apache.iceberg.connect.transforms.DebeziumTransform"
    "transforms.dbz.cdc.target.pattern" (printf "%s.{table}" $bronzeNs)
    "iceberg.tables.dynamic-enabled" "true"
    "iceberg.tables.route-field" "_cdc.target"
    "iceberg.tables.auto-create-enabled" "true"
    "iceberg.tables.evolve-schema-enabled" "true"
    "iceberg.tables.default-partition-by" "day(_cdc.ts)"
    "iceberg.tables.auto-create-props.write.metadata.delete-after-commit.enabled" "true"
    "iceberg.catalog.type" "rest"
    "iceberg.catalog.uri" $.Values.iceberg.catalogUri
    "iceberg.catalog.warehouse" $.Values.iceberg.warehouse
    "iceberg.catalog.credential" (printf "${secrets:%s/polaris-connect:credential}" $ns)
    "iceberg.catalog.scope" "PRINCIPAL_ROLE:ALL"
    "iceberg.catalog.io-impl" "org.apache.iceberg.aws.s3.S3FileIO"
    "iceberg.catalog.s3.endpoint" $.Values.s3.endpoint
    "iceberg.catalog.s3.path-style-access" $.Values.s3.pathStyleAccess
    "iceberg.catalog.client.region" $.Values.s3.region
    "iceberg.kafka.session.timeout.ms" "120000"
    "iceberg.kafka.heartbeat.interval.ms" "15000"
    "iceberg.kafka.max.poll.interval.ms" "300000"
    "iceberg.kafka.request.timeout.ms" "130000"
    "iceberg.control.commit.timeout-ms" "120000"
    "errors.tolerance" "all"
    "errors.log.enable" "true"
    "errors.deadletterqueue.topic.name" (printf "%s.dlq" $prefix)
    "errors.deadletterqueue.topic.replication.factor" $rf }}
  {{- if $.Values.s3.vendedCredentials }}
  {{- $_ := set $sinkCfg "iceberg.catalog.header.X-Iceberg-Access-Delegation" "vended-credentials" }}
  {{- else }}
  {{- $_ := set $sinkCfg "iceberg.catalog.header.X-Iceberg-Access-Delegation" "none" }}
  {{- $_ := set $sinkCfg "iceberg.catalog.s3.access-key-id" (printf "${secrets:%s/s3-creds:AWS_ACCESS_KEY_ID}" $ns) }}
  {{- $_ := set $sinkCfg "iceberg.catalog.s3.secret-access-key" (printf "${secrets:%s/s3-creds:AWS_SECRET_ACCESS_KEY}" $ns) }}
  {{- end }}
  {{- /* F0 S2: control consumer flap'ına karşı ZORUNLU (veri yokken put() 60 s bloke -> 45 s session düşer -> "committed to 0 table(s)") */ -}}
  {{- with $.Values.connect.sinkCommitIntervalMs }}
  {{- $_ := set $sinkCfg "iceberg.control.commit.interval-ms" . }}
  {{- end }}
  {{- $_ := mergeOverwrite $sinkCfg (.sinkExtraConfig | default (dict)) }}
  config:
    {{- range $k, $v := $sinkCfg }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
{{- end }}
{{- end }}
{{- if .Values.nginx.enabled }}
---
# Fluent Bit -> nginx.access -> Iceberg sink (Debezium yok: transforms yalnız ts; F3 spec §5.1)
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: sink-nginx
  namespace: {{ $ns }}
  labels: {strimzi.io/cluster: connect}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: {{ .Values.nginx.sinkTasks }}
  autoRestart: {enabled: true}
  {{- $nginxCfg := include "glue.jsonSinkConfig" (dict "ctx" $ "topic" .Values.nginx.topic "table" .Values.nginx.table "partitionBy" "day(ts)" "dlq" "nginx.dlq") | fromJson }}
  {{- /* ajan ts'yi epoch milisaniye olarak yazar -> Timestamp */ -}}
  {{- $_ := set $nginxCfg "transforms" "ts" }}
  {{- $_ := set $nginxCfg "transforms.ts.type" "org.apache.kafka.connect.transforms.TimestampConverter$Value" }}
  {{- $_ := set $nginxCfg "transforms.ts.field" "ts" }}
  {{- $_ := set $nginxCfg "transforms.ts.unix.precision" "milliseconds" }}
  {{- $_ := set $nginxCfg "transforms.ts.target.type" "Timestamp" }}
  {{- $_ := mergeOverwrite $nginxCfg (.Values.nginx.sinkExtraConfig | default (dict)) }}
  config:
    {{- range $k, $v := $nginxCfg }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
{{- end }}
{{- range .Values.streams }}
---
# JSON olay akışı "{{ .name }}": {{ .name }}.events -> Iceberg {{ include "glue.streamTable" . }} (Debezium yok; docs/50-isletme/json-akisi-ekleme.md).
# Gövde şemasız JSON'dur; kolonlar ilk kayıtlardan çıkarılır, yeni alanlar kolon olarak eklenir (evolve-schema).
# _kafka_ts: kaydın Kafka'ya varış zamanı -> güne bölümleme; kayıt içindeki zaman alanlarının biçimine bağlı kalınmaz.
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: sink-{{ .name | replace "_" "-" }}
  namespace: {{ $ns }}
  labels: {strimzi.io/cluster: connect}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  class: org.apache.iceberg.connect.IcebergSinkConnector
  tasksMax: {{ .sinkTasks | default 1 }}
  autoRestart: {enabled: true}
{{- if .state }}
  {{- if not (has .state (list "running" "paused" "stopped")) }}{{ fail (printf "streams[%s].state: running | paused | stopped olmalı" .name) }}{{ end }}
  state: {{ .state }}                  # bozuk kaydı atlamak için akışı Git'ten durdurma (json-akisi-ekleme.md)
{{- end }}
  {{- $cfg := include "glue.jsonSinkConfig" (dict "ctx" $ "topic" (printf "%s.events" .name) "table" (include "glue.streamTable" .) "partitionBy" "day(_kafka_ts)" "dlq" (printf "%s.dlq" .name)) | fromJson }}
  {{- /* InsertField şemasız JSON'da zamanı epoch milisaniye (sayı) yazar -> ardından Timestamp'e çevrilir; aksi hâlde
     kolon bigint olur ve day(_kafka_ts) bölümlemesi sessizce uygulanmaz (ocpphy denemesi) */ -}}
  {{- $_ := set $cfg "transforms" "kafkats,kafkatsconv" }}
  {{- $_ := set $cfg "transforms.kafkats.type" "org.apache.kafka.connect.transforms.InsertField$Value" }}
  {{- $_ := set $cfg "transforms.kafkats.timestamp.field" "_kafka_ts" }}
  {{- $_ := set $cfg "transforms.kafkatsconv.type" "org.apache.kafka.connect.transforms.TimestampConverter$Value" }}
  {{- $_ := set $cfg "transforms.kafkatsconv.field" "_kafka_ts" }}
  {{- $_ := set $cfg "transforms.kafkatsconv.unix.precision" "milliseconds" }}
  {{- $_ := set $cfg "transforms.kafkatsconv.target.type" "Timestamp" }}
  {{- /* fields: veri sözleşmesi. Bildirilen alanlar Cast ile dönüştürme AŞAMASINDA bu tipe çevrilir; uymayan kayıt
     errors.tolerance=all ile <ad>.dlq'ya gider ve akış sürer. Bildirilmeyen bir alanın tipi kayıttan kayda değişirse
     Iceberg yazıcısı hata verir ve sink görevi DURUR (ocpphy denemesi: "yirmi iki" -> NumberFormatException). */ -}}
  {{- with .fields }}
  {{- $spec := list }}
  {{- range $f, $t := . }}
  {{- if not (has $t (list "int32" "int64" "float32" "float64" "boolean" "string")) }}{{ fail (printf "streams[].fields.%s: tip int32|int64|float32|float64|boolean|string olmalı (verilen: %s)" $f $t) }}{{ end }}
  {{- $spec = append $spec (printf "%s:%s" $f $t) }}
  {{- end }}
  {{- $_ := set $cfg "transforms" "kafkats,kafkatsconv,contract" }}
  {{- $_ := set $cfg "transforms.contract.type" "org.apache.kafka.connect.transforms.Cast$Value" }}
  {{- $_ := set $cfg "transforms.contract.spec" (join "," $spec) }}
  {{- end }}
  {{- $_ := mergeOverwrite $cfg (.sinkExtraConfig | default (dict)) }}
  config:
    {{- range $k, $v := $cfg }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
{{- end }}
