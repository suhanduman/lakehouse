# Connect'in Kafka kimliği. ACL'ler deklaratif: her kaynak (Debezium topic.prefix) için prefix ACL'i.
# Yeni kaynak = values.sources'a bir satır (docs/50-isletme/yeni-kaynak-ve-pipeline.md); runtime ACL mutasyonu YOK.
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: connect
  namespace: {{ include "glue.ns" . }}
  labels: {strimzi.io/cluster: lakehouse}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
    # Connect'in kendi iç topic'leri ve grubu
    - {resource: {type: topic, name: "connect-", patternType: prefix}, operations: [Read, Write, Describe, Create]}
    - {resource: {type: group, name: "connect", patternType: prefix}, operations: [Read]}
    # Iceberg sink coordinator control topic'leri + consumer grupları
    - {resource: {type: topic, name: "control-iceberg", patternType: prefix}, operations: [Read, Write, Describe, Create]}
    - {resource: {type: group, name: "cg-control-", patternType: prefix}, operations: [Read]}
    # Debezium schema-history + signal/notification topic'leri
    - {resource: {type: topic, name: "schema-history.", patternType: prefix}, operations: [Read, Write, Describe, Create]}
    - {resource: {type: topic, name: "debezium-", patternType: prefix}, operations: [Read, Write, Describe, Create]}
    # Debezium heartbeat (heartbeat.interval.ms): __debezium-heartbeat.<topic.prefix>
    - {resource: {type: topic, name: "__debezium-heartbeat.", patternType: prefix}, operations: [Read, Write, Describe, Create]}
{{- range .Values.sources }}
{{- if eq .type "mongodb" }}
    # mongodb: Connect bu prefix'e yalnız YAZAR (Debezium kaynak connector'ı; Iceberg sink yok — Bronze'u Spark
    # `mongo-bronze` işi kendi KafkaUser'ı (spark) ile okur). En az yetki: Read verilmez (F3 kalanı, R15).
    - {resource: {type: topic, name: "{{ .topicPrefix | default .name }}.", patternType: prefix}, operations: [Write, Describe, Create]}
{{- else }}
    - {resource: {type: topic, name: "{{ .topicPrefix | default .name }}.", patternType: prefix}, operations: [Read, Write, Describe, Create]}
{{- end }}
{{- end }}
{{- if .Values.nginx.enabled }}
    # nginx yolu: sink-nginx nginx.access'i okur, nginx.dlq'yu yaratır/yazar (F3 canlı: aksi hâlde DLQ init TopicAuthorizationException)
    - {resource: {type: topic, name: "nginx.", patternType: prefix}, operations: [Read, Write, Describe, Create]}
{{- end }}
    - {resource: {type: transactionalId, name: "connect", patternType: prefix}, operations: [Write, Describe]}
    # Iceberg sink'in transactional producer'ları: coordinator-txn-<uuid> ve worker-txn-<uuid> (F2 e2e: aksi hâlde task
    # TransactionalIdAuthorizationException ile ölür)
    - {resource: {type: transactionalId, name: "coordinator-txn-", patternType: prefix}, operations: [Write, Describe]}
    - {resource: {type: transactionalId, name: "worker-txn-", patternType: prefix}, operations: [Write, Describe]}
    - {resource: {type: cluster}, operations: [IdempotentWrite]}
{{- $mongo := list }}
{{- range .Values.sources }}{{ if eq .type "mongodb" }}{{ $mongo = append $mongo . }}{{ end }}{{ end }}
{{- if $mongo }}
---
# mongo-bronze Spark işinin Kafka kimliği: yalnız mongo prefix'lerini okur (plan Q4)
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: spark
  namespace: {{ include "glue.ns" . }}
  labels: {strimzi.io/cluster: lakehouse}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
{{- range $mongo }}
    - {resource: {type: topic, name: "{{ .topicPrefix | default .name }}.", patternType: prefix}, operations: [Read, Describe]}
{{- end }}
    - {resource: {type: group, name: "spark-lakehouse", patternType: prefix}, operations: [Read]}
{{- end }}
{{- if .Values.nginx.enabled }}
---
# Müşteri sunucusundaki Fluent Bit ajanı: yalnız nginx.* prefix'ine yazabilir (topic'i yaratamaz — kafka-topics.yaml)
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: fluentbit
  namespace: {{ include "glue.ns" . }}
  labels: {strimzi.io/cluster: lakehouse}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  authentication: {type: scram-sha-512}
  authorization:
    type: simple
    acls:
    - {resource: {type: topic, name: "nginx.", patternType: prefix}, operations: [Write, Describe]}
{{- end }}
