{{- if .Values.superset.enabled }}
{{- $ns := include "glue.ns" . }}
apiVersion: v1
kind: ConfigMap
metadata: {name: superset-datasources, namespace: {{ $ns }}}
data:
  # superset legacy-import-datasources -p /app/configs/trino.yaml  (runbooks/user-facing.md; parola SQLALCHEMY_CUSTOM_PASSWORD_STORE ile env'den)
  trino.yaml: |
    databases:
    - database_name: lakehouse
      # SABİT uuid (tek kaynak: _helpers.tpl "glue.supersetDbUuid") — asset bundle'ındaki
      # databases/lakehouse.yaml ve datasets/.../database_uuid ile AYNI olmak ZORUNDA. Superset import'u
      # nesneleri uuid ile eşleştirir (superset/models/helpers.py import_from_dict: uuid hem içe aktarılan
      # alan hem tekil kısıt). Taze kurulumda önce bu legacy-import koşar; uuid sabitlenmezse rastgele
      # üretilir ve sonraki bundle import'u ikinci bir "lakehouse" satırı yazmaya kalkar → dbs.database_name
      # tekil kısıtı düşer.
      uuid: {{ include "glue.supersetDbUuid" . }}
      sqlalchemy_uri: trino://superset@trino.{{ $ns }}.svc:8443/lakehouse
      expose_in_sqllab: true
      allow_ctas: true
      allow_cvas: true
      allow_dml: false
      extra: '{"engine_params": {"connect_args": {"http_scheme": "https", "verify": "/etc/lakehouse-ca/tls.crt"}}}'
      tables: []
---
# Superset asset bundle'ı (dashboard export formatı, canlı Superset'ten üretildi): Iceberg tablo-düzeyi
# veri metrikleri dashboard'u. ConfigMap anahtarı alt dizin taşıyamaz -> "dizin__dosya" adlandırması;
# runbooks/data-metrics.md import adımı adları dizin ağacına geri açar.
# SIR YOK: databases/lakehouse.yaml parolasızdır (Trino parolası SQLALCHEMY_CUSTOM_PASSWORD_STORE ile env'den).
# Dosyalar `tpl` ile işlenir: bundle'daki databases/lakehouse.yaml YAPISAL OLARAK yukarıdaki ürün
# datasource'u (trino.yaml) ile aynı olsun diye ad alanını aynı ifadeden alır. Import overwrite=True ile
# çalıştığı için farklı bir URI/extra ürün datasource'unu bozardı. Diğer bundle dosyaları şablon ifadesi
# içermez, `tpl` onları değiştirmeden geçirir.
apiVersion: v1
kind: ConfigMap
metadata: {name: superset-assets, namespace: {{ $ns }}}
data:
{{- range $path, $_ := .Files.Glob "files/superset/iceberg-metadata/**.yaml" }}
  {{ $path | trimPrefix "files/superset/" | replace "/" "__" }}: |
{{- /* Bundle dosyaları Helm şablonudur; canlı bir Superset'ten yeniden üretilirse SQL içinde kalan bir "{{" render'ı kırar (bkz. runbooks/data-metrics.md §5). */}}
{{ tpl ($.Files.Get $path) $ | indent 4 }}
{{- end }}
---
apiVersion: superset.apache.org/v1alpha1
kind: Superset
metadata:
  name: superset
  namespace: {{ $ns }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  environment: Production                  # sırlar yalnız *From Secret referansı (CRD CEL: secretKey/uri/password yalnız Development)
  image: {tag: {{ .Values.superset.imageTag | quote }}}
  replicas: {{ .Values.superset.replicas }}
  secretKeyFrom: {name: {{ .Values.superset.secretName }}, key: secret-key}
  metastore:
    uriFrom: {name: superset-db-app, key: uri}      # CNPG: postgresql://superset:…@superset-db-rw:5432/superset
  # Valkey/Redis YOK (plan R9): SimpleCache, worker/beat yok. Alerts&Reports için runbooks/user-facing.md
  config: |
    import os
    from flask_appbuilder.security.manager import AUTH_OAUTH
    ENABLE_PROXY_FIX = True
    CACHE_CONFIG = {"CACHE_TYPE": "SimpleCache", "CACHE_DEFAULT_TIMEOUT": 300}
    DATA_CACHE_CONFIG = CACHE_CONFIG
    FILTER_STATE_CACHE_CONFIG = CACHE_CONFIG
    EXPLORE_FORM_DATA_CACHE_CONFIG = CACHE_CONFIG
    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"
    AUTH_ROLES_SYNC_AT_LOGIN = True
    AUTH_ROLES_MAPPING = {{ toJson .Values.superset.roleMapping }}
    _KC = os.environ["KEYCLOAK_URL"] + "/realms/" + os.environ["KEYCLOAK_REALM"]
    OAUTH_PROVIDERS = [{
        "name": "keycloak", "icon": "fa-key", "token_key": "access_token",
        "remote_app": {
            "client_id": "superset", "client_secret": os.environ["OIDC_CLIENT_SECRET"],
            "api_base_url": _KC + "/protocol/",                 # FAB: GET openid-connect/userinfo (göreli yol)
            "server_metadata_url": _KC + "/.well-known/openid-configuration",
            "client_kwargs": {"scope": "openid email profile"},
        }}]
    def _trino_password(url):                                 # URI'de parola yok; Trino servis hesabı env'den
        return os.environ["TRINO_PASSWORD"] if url.drivername.startswith("trino") else None
    SQLALCHEMY_CUSTOM_PASSWORD_STORE = _trino_password
  # GENEL podTemplate (operator 0.2.0: webServer.podTemplate ile toplanarak birleşir): lifecycle
  # (migrate/init) Job'ları da bu env'i alır — spec.config onların superset_config.py'sine de yazılır
  # ve oradaki os.environ[...] okumaları da çözülmek zorunda.
  podTemplate:
    container:
      env:
      - {name: KEYCLOAK_URL, value: {{ .Values.keycloak.hostname | quote }}}
      - {name: KEYCLOAK_REALM, value: {{ .Values.keycloak.realm.name | quote }}}
      - {name: OIDC_CLIENT_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.keycloak.clientsSecret }}, key: superset}}}
      - {name: TRINO_PASSWORD, valueFrom: {secretKeyRef: {name: trino-service-accounts, key: superset}}}
      volumeMounts:
      # REQUESTS_CA_BUNDLE YOK: tek kök olarak lakehouse-ca'yı dayatmak prod'da Keycloak'ı (edge Route, router
      # sertifikası) doğrulanamaz yapardı. Keycloak sistem kökleriyle; Trino datasource'un connect_args.verify'ı ile.
      - {name: lakehouse-ca, mountPath: /etc/lakehouse-ca, readOnly: true}
    volumes:
    - {name: lakehouse-ca, secret: {secretName: lakehouse-ca, items: [{key: tls.crt, path: tls.crt}]}}
  # spec.monitoring.serviceMonitor BİLEREK YOK: operator ServiceMonitor'ü superset-web-server:8088/metrics'e
  # kurar ama Superset 6.1.0'da böyle bir uç nokta YOKTUR (canlı: 404; imajda prometheus_flask_exporter yok).
  # Etkinleştirilirse KALICI down hedef oluşur. Özel imaj yasak (global kısıt) -> Superset app metrikleri F5 kapsamı dışı;
  # Superset sağlığı Deployment/pod metrikleriyle (kube-state-metrics) izlenir.
  webServer:
    podTemplate:
      container:
        resources: {{ toJson .Values.superset.resources }}
        # startupProbe EZİLMİYOR: -dev imajında açılışta pip kurulumu yok, gunicorn anında dinlemeye geçiyor
        # (ölçüm: konteyner başlangıcı == "Listening at" aynı saniye) -> operator'ün /health varsayılanı (15s+3x10s) fazlasıyla yeter
        volumeMounts:
        - {name: datasources, mountPath: /app/configs, readOnly: true}
        - {name: assets, mountPath: /app/assets, readOnly: true}
      volumes:
      - {name: datasources, configMap: {name: superset-datasources}}
      - {name: assets, configMap: {name: superset-assets}}
  lifecycle:
    # Operator varsayılanı 3 deneme (~15 s içinde tükenir) ve CNPG'nin hazır olmasını BEKLEYEMEZ: taze kümede
    # superset-db ~4-5 dk sonra bağlantı kabul ediyor, migrate kalıcı "TaskFailed"e düşüyordu (2026-09-17 canlı).
    migrate: {maxRetries: 120}
    init: {}                       # admin kullanıcı YOK (CRD CEL: init.adminUser yalnız Development): yönetici AUTH_ROLES_MAPPING (lakehouse-admins -> Admin) ile OIDC'den gelir
{{- end }}
