suite: spark jobs
templates: [spark-jobs.yaml]
tests:
  - it: configmap carries job code and pipelines.json
    set:
      sources: [{name: shop, type: postgres, host: h, port: 5432, database: shop, tables: [public.orders], signalTable: public.debezium_signal}]
      pipelines: [{bronze: shop_raw.orders, keys: [id], bucket_count: 4, casts: {updated_at: timestamp}}]
    documentSelector: {path: kind, value: ConfigMap}
    asserts:
      - equal: {path: metadata.name, value: lakehouse-jobs}
      - isNotNull: {path: 'data["merge_cdc.py"]'}
      - isNotNull: {path: 'data["merge_lib.py"]'}
      - isNotNull: {path: 'data["iceberg_maintenance.py"]'}
      - matchRegex: {path: 'data["pipelines.json"]', pattern: '"bronze":"shop_raw.orders"'}
      - matchRegex: {path: 'data["pipelines.json"]', pattern: '"casts":\{"updated_at":"timestamp"\}'}
      # bakım işi Bronze tablolarını bu namespace listesinden katalogda arar (pipeline'ı olmayan tablolar dahil)
      - matchRegex: {path: 'data["pipelines.json"]', pattern: '"bronze_namespaces":\["shop_raw"\]'}
  - it: coreRequest only renders when set (dar düğümlerde kesirli CPU isteği)
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
    asserts:
      - documentSelector: {path: metadata.name, value: silver-merge}
        isNull: {path: spec.template.driver.coreRequest}
      - documentSelector: {path: metadata.name, value: silver-merge}
        isNull: {path: spec.template.executor.coreRequest}
  - it: coreRequest renders for driver and executor when values set it
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
      spark.driver.coreRequest: "500m"
      spark.executor.coreRequest: "500m"
    asserts:
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: spec.template.driver.coreRequest, value: "500m"}
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: spec.template.driver.cores, value: 1}
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: spec.template.executor.coreRequest, value: "500m"}
  - it: four scheduled spark applications with schedules and args
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
    asserts:
      - hasDocuments: {count: 5}
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: spec.schedule, value: "*/15 * * * *"}
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: spec.template.mainApplicationFile, value: local:///opt/job/merge_cdc.py}
      - documentSelector: {path: metadata.name, value: maint-compact}
        equal: {path: spec.template.arguments, value: ["--mode", "compact"]}
      - documentSelector: {path: metadata.name, value: maint-expire-orphan-ttl}
        equal: {path: spec.template.arguments, value: ["--mode", "expire-orphan-ttl", "--snapshot-days", "7", "--orphan-days", "3", "--bronze-ttl-days", "30"]}
      - documentSelector: {path: metadata.name, value: maint-position-deletes}
        equal: {path: spec.concurrencyPolicy, value: Forbid}
  - it: no pipelines renders only the ConfigMap
    set:
      pipelines: []
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: kind, value: ConfigMap}
  - it: ivySettingsXml empty (default) — no spark-ivysettings ConfigMap, no mount, no sparkConf key
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
    asserts:
      - hasDocuments: {count: 5}
      - documentSelector: {path: metadata.name, value: silver-merge}
        isNull: {path: 'spec.template.sparkConf["spark.jars.ivySettings"]'}
      - documentSelector: {path: metadata.name, value: silver-merge}
        notContains: {path: spec.template.driver.volumeMounts, content: {name: ivysettings, mountPath: /opt/ivy/ivysettings.xml, subPath: ivysettings.xml}}
  - it: ivySettingsXml set — spark-ivysettings ConfigMap + mounts + sparkConf key present
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
      spark.ivySettingsXml: |
        <ivysettings><settings defaultResolver="mirror"/></ivysettings>
    asserts:
      - documentSelector: {path: metadata.name, value: spark-ivysettings}
        equal: {path: kind, value: ConfigMap}
      - documentSelector: {path: metadata.name, value: spark-ivysettings}
        matchRegex: {path: 'data["ivysettings.xml"]', pattern: 'defaultResolver="mirror"'}
      - documentSelector: {path: metadata.name, value: silver-merge}
        equal: {path: 'spec.template.sparkConf["spark.jars.ivySettings"]', value: /opt/ivy/ivysettings.xml}
      - documentSelector: {path: metadata.name, value: silver-merge}
        contains: {path: spec.template.driver.volumeMounts, content: {name: ivysettings, mountPath: /opt/ivy/ivysettings.xml, subPath: ivysettings.xml}}
      - documentSelector: {path: metadata.name, value: silver-merge}
        contains: {path: spec.template.executor.volumeMounts, content: {name: ivysettings, mountPath: /opt/ivy/ivysettings.xml, subPath: ivysettings.xml}}
      - documentSelector: {path: metadata.name, value: silver-merge}
        contains: {path: spec.template.volumes, content: {name: ivysettings, configMap: {name: spark-ivysettings}}}
  - it: credential comes from Secret via env, never from sparkConf
    set:
      pipelines: [{bronze: shop_raw.orders, keys: [id]}]
    documentSelector: {path: metadata.name, value: silver-merge}
    asserts:
      - contains:
          path: spec.template.driver.env
          content: {name: POLARIS_CREDENTIAL, valueFrom: {secretKeyRef: {name: polaris-spark, key: credential}}}
      - isNull: {path: 'spec.template.sparkConf["spark.sql.catalog.lakehouse.credential"]'}
      - equal: {path: 'spec.template.sparkConf["spark.jars.packages"]', value: "org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0"}
      - equal: {path: 'spec.template.sparkConf["spark.sql.shuffle.partitions"]', value: "8"}
      - equal: {path: 'spec.template.sparkConf["spark.sql.session.timeZone"]', value: UTC}
      - equal: {path: 'spec.template.sparkConf["spark.redaction.regex"]', value: "(?i)secret|password|token|credential"}
      - equal: {path: spec.template.image, value: apache/spark:4.1.0-java21-python3}
      - equal: {path: spec.template.driver.serviceAccount, value: spark-operator-spark}
