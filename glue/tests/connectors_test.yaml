suite: connectors
templates: [connectors.yaml]
tests:
  # İlk yükleme seçeneği: varsayılan Debezium snapshot'ı; incremental -> no_data (artımlı snapshot sinyalle)
  - it: initialLoad defaults to snapshot and incremental maps to no_data
    set:
      sources:
        - {name: a, type: sqlserver, host: h, port: 1433, database: A, tables: [dbo.t], signalTable: dbo.s}
        - {name: b, type: postgres, host: h, port: 5432, database: b, tables: [public.t], signalTable: public.s, initialLoad: incremental}
        - {name: c, type: mongodb, connectionString: "mongodb://x", collections: [c.t], initialLoad: incremental}
    asserts:
      - documentIndex: 0
        equal: {path: 'spec.config["snapshot.mode"]', value: initial}
      - documentIndex: 2
        equal: {path: 'spec.config["snapshot.mode"]', value: no_data}
      - documentIndex: 4
        equal: {path: 'spec.config["snapshot.mode"]', value: no_data}
  - it: initialLoad rejects unknown values
    set:
      sources:
        - {name: a, type: postgres, host: h, port: 5432, database: a, tables: [public.t], signalTable: public.s, initialLoad: hepsi}
    asserts:
      - failedTemplate: {errorPattern: "initialLoad: snapshot \\| incremental"}
  # Kaynağı Git'ten durdurma (offset sıfırlama; docs/50-isletme/kaynak-veya-tablo-silme.md §3). Varsayılan: alan yok (= running).
  - it: sources[].state stops the debezium connector, sink is untouched, default renders no state
    set:
      sources:
        - {name: shop, type: postgres, host: h, port: 5432, database: shop, tables: [public.orders], signalTable: public.s, state: stopped}
        - {name: crm, type: mongodb, connectionString: "mongodb://x", collections: [crm.c], state: stopped}
        - {name: erp, type: postgres, host: h, port: 5432, database: erp, tables: [public.o], signalTable: public.s}
    asserts:
      - documentIndex: 0
        equal: {path: spec.state, value: stopped}
      - documentIndex: 1
        notExists: {path: spec.state}
      - documentIndex: 2
        equal: {path: spec.state, value: stopped}
      - documentIndex: 3
        notExists: {path: spec.state}
  - it: sources[].state rejects unknown values
    set:
      sources:
        - {name: shop, type: postgres, host: h, port: 5432, database: shop, tables: [public.orders], signalTable: public.s, state: durdur}
    asserts:
      - failedTemplate: {errorPattern: "sources\\[shop\\].state: running \\| paused \\| stopped"}
  - it: no sources renders nothing
    asserts:
      - hasDocuments: {count: 0}
  - it: postgres source renders debezium + sink pair
    set:
      connect.topicPartitions: 3
      sources:
        - {name: shop, type: postgres, host: demo-pg-rw.lakehouse.svc, port: 5432, database: shop, tables: [public.orders, public.items], signalTable: public.debezium_signal}
    asserts:
      - hasDocuments: {count: 2}
      - documentIndex: 0
        equal: {path: metadata.name, value: dbz-shop}
      - documentIndex: 0
        equal: {path: spec.class, value: io.debezium.connector.postgresql.PostgresConnector}
      - documentIndex: 0
        equal: {path: 'spec.config["table.include.list"]', value: "public.orders,public.items,public.debezium_signal"}
      - documentIndex: 0
        equal: {path: 'spec.config["database.password"]', value: "${secrets:lakehouse/shop-db:password}"}
      - documentIndex: 0
        equal: {path: 'spec.config["publication.autocreate.mode"]', value: disabled}
      - documentIndex: 0
        equal: {path: 'spec.config["signal.data.collection"]', value: public.debezium_signal}
      - documentIndex: 0
        equal: {path: 'spec.config["decimal.handling.mode"]', value: precise}
      - documentIndex: 0
        equal: {path: 'spec.config["topic.creation.default.partitions"]', value: "3"}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.control.commit.timeout-ms"]', value: "120000"}
      - documentIndex: 0
        equal: {path: 'spec.config["slot.name"]', value: debezium_shop}
      # heartbeat: düşük trafikli kaynakta replication slot/LSN ilerlesin (pg WAL birikmesi)
      - documentIndex: 0
        equal: {path: 'spec.config["heartbeat.interval.ms"]', value: "10000"}
      - documentIndex: 1
        equal: {path: metadata.name, value: sink-shop}
      - documentIndex: 1
        equal: {path: spec.class, value: org.apache.iceberg.connect.IcebergSinkConnector}
      - documentIndex: 1
        equal: {path: 'spec.config["topics.regex"]', value: 'shop\.(?!dlq$)(?!public\.debezium_signal$).*'}
      - documentIndex: 1
        equal: {path: 'spec.config["transforms.dbz.cdc.target.pattern"]', value: "shop_raw.{table}"}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.tables.default-partition-by"]', value: day(_cdc.ts)}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.kafka.session.timeout.ms"]', value: "120000"}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.catalog.credential"]', value: "${secrets:lakehouse/polaris-connect:credential}"}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.catalog.header.X-Iceberg-Access-Delegation"]', value: vended-credentials}
      - documentIndex: 1
        equal: {path: 'spec.config["errors.deadletterqueue.topic.name"]', value: shop.dlq}
      - documentIndex: 1
        isNull: {path: 'spec.config["iceberg.control.commit.interval-ms"]'}
      # snapshot saklama yalnız bakım işinin (expire_snapshots): auto-create-props'ta çelişen 1 günlük ayar yok
      - documentIndex: 1
        isNull: {path: 'spec.config["iceberg.tables.auto-create-props.history.expire.max-snapshot-age-ms"]'}
  - it: dev commit interval and no-STS mode
    set:
      connect.sinkCommitIntervalMs: "30000"
      s3.vendedCredentials: false
      sources:
        - {name: shop, type: postgres, host: h, port: 5432, database: shop, tables: [public.orders], signalTable: public.debezium_signal}
    asserts:
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.control.commit.interval-ms"]', value: "30000"}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.catalog.header.X-Iceberg-Access-Delegation"]', value: none}
      - documentIndex: 1
        equal: {path: 'spec.config["iceberg.catalog.s3.access-key-id"]', value: "${secrets:lakehouse/s3-creds:AWS_ACCESS_KEY_ID}"}
  - it: sqlserver source
    set:
      sources:
        - {name: erp, type: sqlserver, host: mssql.example.com, port: 1433, database: ERP, tables: [dbo.Orders], signalTable: dbo.debezium_signal}
    asserts:
      - documentIndex: 0
        equal: {path: spec.class, value: io.debezium.connector.sqlserver.SqlServerConnector}
      - documentIndex: 0
        equal: {path: 'spec.config["database.names"]', value: ERP}
      - documentIndex: 0
        equal: {path: 'spec.config["schema.history.internal.kafka.topic"]', value: schema-history.erp}
      - documentIndex: 0
        equal: {path: 'spec.config["schema.history.internal.store.only.captured.tables.ddl"]', value: "false"}
      - documentIndex: 0
        equal: {path: 'spec.config["include.schema.changes"]', value: "false"}
      # SQL Server'da Debezium adları veritabanıyla yazar: sinyal koleksiyonu ve sink'in konu dışlaması <db>.<şema>.<tablo>
      - documentIndex: 0
        equal: {path: 'spec.config["signal.data.collection"]', value: ERP.dbo.debezium_signal}
      - documentIndex: 1
        equal: {path: 'spec.config["topics.regex"]', value: 'erp\.(?!dlq$)(?!ERP\.dbo\.debezium_signal$).*'}
      - documentIndex: 0
        equal: {path: 'spec.config["schema.history.internal.producer.sasl.jaas.config"]', value: "${secrets:lakehouse/connect:sasl.jaas.config}"}
      # Kafka küme CA'sı satır içi PEM (Strimzi 1.x Connect pod'una CA dosyası bağlamaz; dosya yolu NoSuchFile verirdi)
      - documentIndex: 0
        equal: {path: 'spec.config["schema.history.internal.producer.ssl.truststore.certificates"]', value: "${secrets:lakehouse/lakehouse-cluster-ca-cert:ca.crt}"}
      - documentIndex: 0
        equal: {path: 'spec.config["schema.history.internal.consumer.ssl.truststore.certificates"]', value: "${secrets:lakehouse/lakehouse-cluster-ca-cert:ca.crt}"}
      - documentIndex: 0
        notExists: {path: 'spec.config["schema.history.internal.producer.ssl.truststore.location"]'}
      # TLS varsayılan açık; sertifika doğrulaması varsayılan KAPALI DEĞİL (trustServerCertificate=false)
      - documentIndex: 0
        equal: {path: 'spec.config["database.encrypt"]', value: "true"}
      - documentIndex: 0
        equal: {path: 'spec.config["database.trustServerCertificate"]', value: "false"}
  - it: sqlserver private-CA lab may trust the server certificate
    set:
      sources:
        - {name: erp, type: sqlserver, host: h, port: 1433, database: ERP, tables: [dbo.Orders], signalTable: dbo.debezium_signal, trustServerCertificate: true}
    asserts:
      - documentIndex: 0
        equal: {path: 'spec.config["database.trustServerCertificate"]', value: "true"}
  - it: unknown type fails
    set:
      sources: [{name: x, type: oracle, host: h, port: 1, database: d, tables: [a.b], signalTable: a.s}]
    asserts:
      - failedTemplate: {errorPattern: "postgres\\|sqlserver"}
  - it: connectors auto-restart failed tasks
    set:
      sources:
        - {name: shop, type: postgres, host: h, port: 5432, database: shop, tables: [public.orders], signalTable: public.debezium_signal}
    asserts:
      - documentIndex: 0
        equal: {path: spec.autoRestart.enabled, value: true}
      - documentIndex: 1
        equal: {path: spec.autoRestart.enabled, value: true}
