suite: keycloak
templates: [keycloak.yaml, keycloak-realm.yaml, ingress.yaml]
# appsDomain: hostname'ler boş varsayılandan türetilir (glue.hostFor) — <bileşen>-<ns>.<appsDomain>
set: {appsDomain: apps.ocp.example.net}
tests:
  - it: Keycloak CR uses CNPG secret and hostname
    template: keycloak.yaml
    asserts:
      - equal: {path: spec.db.vendor, value: postgres}
      - equal: {path: spec.db.usernameSecret.name, value: keycloak-db-app}
      - equal: {path: spec.hostname.hostname, value: https://keycloak-lakehouse.apps.ocp.example.net}
  - it: realm import carries the four platform clients
    template: keycloak-realm.yaml
    asserts:
      - contains: {path: spec.realm.clients, content: {clientId: trino}, any: true}
      - contains: {path: spec.realm.clients, content: {clientId: superset}, any: true}
      - contains: {path: spec.realm.clients, content: {clientId: jupyterhub}, any: true}
      - contains: {path: spec.realm.clients, content: {clientId: polaris}, any: true}
  - it: ldap federation only when enabled
    template: keycloak-realm.yaml
    asserts:
      - isNull: {path: spec.realm.components}
  - it: ldap federation renders when enabled
    template: keycloak-realm.yaml
    set: {keycloak.ldap.enabled: true}
    asserts:
      - isNotNull: {path: spec.realm.components}
      - equal: {path: 'spec.realm.components["org.keycloak.storage.UserStorageProvider"][0].config.bindCredential[0]', value: "${LDAP_BIND_CREDENTIAL}"}
  - it: realm import carries placeholders and trino audience mapper
    template: keycloak-realm.yaml
    asserts:
      - equal: {path: spec.placeholders.TRINO_CLIENT_SECRET.secret.key, value: trino}
      - contains: {path: 'spec.realm.clients[0].protocolMappers', content: {name: trino-audience}, any: true}
      - equal: {path: 'spec.realm.clients[0].directAccessGrantsEnabled', value: false}
      - contains: {path: 'spec.realm.clients[0].redirectUris', content: https://trino-lakehouse.apps.ocp.example.net/oauth2/callback}
  - it: dev users enable password grant
    template: keycloak-realm.yaml
    set: {keycloak.devUsers: [{username: u1, password: p1, group: lakehouse-users}]}
    asserts:
      - equal: {path: 'spec.realm.clients[0].directAccessGrantsEnabled', value: true}
      - equal: {path: 'spec.realm.users[0].groups[0]', value: /lakehouse-users}
  - it: ingress host strips scheme
    template: ingress.yaml
    set: {ingress.enabled: true}
    documentIndex: 0
    asserts:
      - equal: {path: 'spec.rules[0].host', value: keycloak-lakehouse.apps.ocp.example.net}
  # AD LDAPS güven kökü (ad-ca). Keycloak operator 26.7.3 CRD alanı CANLI doğrulandı:
  # `kubectl explain keycloak.spec.truststores.secret.name` (v2alpha1 ve v2beta1'de var). Operatör
  # Secret'taki PEM'leri /opt/keycloak/conf/truststores altına bağlar ve truststore SPI'sine ekler —
  # KC 24'ten beri bu dizin SİSTEM güven deposuyla birleşir; realm useTruststoreSpi: always ile onu seçer.
  - it: ad-ca truststore absent while caSecret empty
    template: keycloak.yaml
    asserts:
      - isNull: {path: spec.truststores}
  - it: ad-ca truststore wired when caSecret set
    template: keycloak.yaml
    set: {keycloak.ldap.caSecret: ad-ca}
    asserts:
      - equal: {path: 'spec.truststores["ad-ca"].secret.name', value: ad-ca}
  # Keycloak 26'da "ldapsOnly" kullanımdan kalktı; güven zaten conf/truststores + sistem deposu
  # birleşiminden gelir (glue/templates/keycloak.yaml). Bu test eski değerin geri sızmasını engeller.
  - it: ldap federation uses the non-deprecated truststore spi value
    template: keycloak-realm.yaml
    set: {keycloak.ldap.enabled: true}
    asserts:
      - equal: {path: 'spec.realm.components["org.keycloak.storage.UserStorageProvider"][0].config.useTruststoreSpi[0]', value: always}
