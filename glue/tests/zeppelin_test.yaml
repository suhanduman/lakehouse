suite: zeppelin
templates: [zeppelin.yaml, dev-secrets.yaml]
tests:
  - it: deployment seeds interpreter.json into writable config dir
    template: zeppelin.yaml
    documentIndex: 1
    asserts:
      - containsDocument: {kind: Deployment, apiVersion: apps/v1, name: zeppelin}
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: ZEPPELIN_CONFIG_FS_DIR, value: /data/conf}}
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: ZEPPELIN_RUN_MODE, value: local}}
      # Not defterleri varsayılan olarak PRIVATE (zeppelin.notebook.public varsayılanı true'dur)
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: ZEPPELIN_NOTEBOOK_PUBLIC, value: "false"}}
      - equal: {path: 'spec.template.spec.initContainers[0].name', value: seed}
      - equal: {path: 'spec.template.spec.securityContext.fsGroup', value: 1000}
      - equal: {path: 'spec.template.spec.containers[0].image', value: apache/zeppelin:0.12.1}
      - equal: {path: 'spec.strategy.type', value: Recreate}
      # 2,7 GB imajın soğuk çekimi 600 s varsayılanını aşıyor (13 dk 48 sn ölçüldü) -> helm --wait düşmesin
      - equal: {path: 'spec.progressDeadlineSeconds', value: 1800}
      - contains: {path: 'spec.template.spec.containers[0].volumeMounts', content: {name: shiro, mountPath: /opt/zeppelin/conf/shiro.ini, subPath: shiro.ini, readOnly: true}}
      - contains: {path: 'spec.template.spec.volumes', content: {name: seed, secret: {secretName: zeppelin-interpreter}}}
      - contains: {path: 'spec.template.spec.volumes', content: {name: lakehouse-ca, secret: {secretName: lakehouse-ca, items: [{key: tls.crt, path: tls.crt}]}}}
  - it: pvc and service back the deployment
    template: zeppelin.yaml
    asserts:
      - hasDocuments: {count: 3}
      # PVC, Deployment ile aynı wave'de olmalı (WaitForFirstConsumer kilitlenmesi — CI 35276782791)
      - documentIndex: 0
        equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "2"}
      - documentIndex: 1
        equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "2"}
      - containsDocument: {kind: PersistentVolumeClaim, apiVersion: v1, name: zeppelin-data, any: true}
      - documentIndex: 0
        equal: {path: 'spec.resources.requests.storage', value: 10Gi}
      - documentIndex: 0
        isNull: {path: 'spec.storageClassName'}
      - documentIndex: 2
        equal: {path: 'spec.ports', value: [{name: http, port: 8080, targetPort: http}]}
  - it: openshift leaves fsGroup to SCC
    template: zeppelin.yaml
    set: {platform: openshift}
    documentIndex: 1
    asserts:
      - isNull: {path: 'spec.template.spec.securityContext'}
  - it: disabled renders nothing
    template: zeppelin.yaml
    set: {zeppelin.enabled: false}
    asserts:
      - hasDocuments: {count: 0}
  - it: dev shiro gates every url behind a role (not merely authc)
    template: dev-secrets.yaml
    set: {components.devSecrets: true}
    documentIndex: 4
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: zeppelin-shiro}
      - matchRegex: {path: 'stringData["shiro.ini"]', pattern: 'anyofroles = org\.apache\.zeppelin\.utils\.AnyOfRolesUserAuthorizationFilter'}
      - matchRegex: {path: 'stringData["shiro.ini"]', pattern: '/\*\* = authc, anyofroles\[admin, analyst, user\]'}
      # giriş uç noktası rol kapısından MUAF olmalı (aksi halde Zeppelin'in filtresi NPE -> /api/login 500)
      - matchRegex: {path: 'stringData["shiro.ini"]', pattern: '(?m)^\s*/api/login = authc\s*$'}
      # rol kapısının negatif kanıtı için rolsüz dev kullanıcısı
      - matchRegex: {path: 'stringData["shiro.ini"]', pattern: 'nogroup1 = nogroup1-dev, nogroup'}
      # wildcard izin tanımı kalmamalı (footgun): `analyst = *` / `user = *`
      - notMatchRegex: {path: 'stringData["shiro.ini"]', pattern: '(?m)^\s*(admin|analyst|user) = \*\s*$'}
  - it: dev interpreter seed targets trino jdbc over TLS
    template: dev-secrets.yaml
    set: {components.devSecrets: true}
    documentIndex: 5
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: zeppelin-interpreter}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: "io.trino:trino-jdbc:483"}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: "SSL=true"}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: 'jdbc:trino://trino\.lakehouse\.svc:8443/lakehouse'}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: 'io\.trino\.jdbc\.TrinoDriver'}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: 'SSLTrustStorePath=/etc/lakehouse-ca/tls\.crt'}
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: '"default\.user":\s*\{[^}]*"value": "zeppelin"'}
      # Zeppelin'in kendi {{applicationId}} yer tutucusu tpl'de kaçırılmış olmalı (aksi halde render boşaltır)
      - matchRegex: {path: 'stringData["interpreter.json"]', pattern: '\{\{applicationId\}\}'}
  # AD LDAPS güven kökü (ad-ca): Shiro'nun ActiveDirectoryGroupRealm'i JVM güven deposunu kullanır.
  # caSecret BOŞKEN hiçbir şey değişmez (mevcut kurulumlar etkilenmez).
  - it: ad truststore pieces absent while caSecret empty
    template: zeppelin.yaml
    documentIndex: 1
    asserts:
      - isNull: {path: 'spec.template.spec.initContainers[1]'}
      - notContains: {path: 'spec.template.spec.volumes', content: {name: ad-truststore, emptyDir: {}}}
  # initContainer imajdaki VARSAYILAN cacerts'i kopyalar, üstüne AD kökünü ekler: yalnız AD CA'lı bir
  # truststore JVM varsayılanını EZER ve Maven Central (trino-jdbc indirmesi) / Keycloak TLS'i kırardı.
  - it: ad truststore initContainer copies cacerts and JVM opts point at it
    template: zeppelin.yaml
    set: {keycloak.ldap.caSecret: ad-ca}
    documentIndex: 1
    asserts:
      - equal: {path: 'spec.template.spec.initContainers[1].name', value: ad-truststore}
      - equal: {path: 'spec.template.spec.initContainers[1].image', value: apache/zeppelin:0.12.1}
      - matchRegex: {path: 'spec.template.spec.initContainers[1].command[2]', pattern: 'importkeystore .*JAVA_HOME/lib/security/cacerts'}
      - matchRegex: {path: 'spec.template.spec.initContainers[1].command[2]', pattern: '-alias ad-ca -file /ad-ca/ca\.crt'}
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: ZEPPELIN_JAVA_OPTS, value: "-Djavax.net.ssl.trustStore=/truststore/ad-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"}}
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: ZEPPELIN_INTP_JAVA_OPTS, value: "-Djavax.net.ssl.trustStore=/truststore/ad-truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit"}}
      - contains: {path: 'spec.template.spec.containers[0].volumeMounts', content: {name: ad-truststore, mountPath: /truststore, readOnly: true}}
      - contains: {path: 'spec.template.spec.volumes', content: {name: ad-truststore, emptyDir: {}}}
      - contains: {path: 'spec.template.spec.volumes', content: {name: ad-ca, secret: {secretName: ad-ca, items: [{key: ca.crt, path: ca.crt}]}}}
