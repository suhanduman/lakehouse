suite: platform pieces
templates: [cnpg.yaml, polaris-bootstrap.yaml, minio.yaml, networkpolicy.yaml, route.yaml, ingress.yaml]
tests:
  - it: renders three CNPG clusters
    template: cnpg.yaml
    asserts:
      - hasDocuments: {count: 3}
      - documentIndex: 0
        equal: {path: metadata.name, value: polaris-db}
      - documentIndex: 1
        equal: {path: metadata.name, value: keycloak-db}
      - documentIndex: 2
        equal: {path: metadata.name, value: superset-db}
      - documentIndex: 2
        equal: {path: spec.bootstrap.initdb, value: {database: superset, owner: superset}}
  - it: superset db is dropped when superset is disabled
    template: cnpg.yaml
    set: {superset.enabled: false}
    asserts:
      - hasDocuments: {count: 2}
  - it: polaris bootstrap job reads CNPG app secret and root credential secret
    template: polaris-bootstrap.yaml
    asserts:
      - equal: {path: 'spec.template.spec.containers[0].image', value: apache/polaris-admin-tool:1.7.0}
      - contains: {path: 'spec.template.spec.containers[0].env', content: {name: QUARKUS_DATASOURCE_JDBC_URL, valueFrom: {secretKeyRef: {name: polaris-db-app, key: jdbc-uri}}}}
      - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-wave"]', value: "1"}
  - it: minio is absent unless components.minio
    template: minio.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: minio renders in dev
    template: minio.yaml
    set: {components.minio: true}
    asserts:
      - hasDocuments: {count: 4}
  - it: routes only on openshift
    template: route.yaml
    set: {platform: openshift, route.enabled: true}
    asserts:
      - hasDocuments: {count: 6}
      - documentIndex: 2
        containsDocument: {kind: Route, apiVersion: route.openshift.io/v1, name: trino}
      - documentIndex: 3
        containsDocument: {kind: Route, apiVersion: route.openshift.io/v1, name: superset}
      - documentIndex: 4
        containsDocument: {kind: Route, apiVersion: route.openshift.io/v1, name: jupyterhub}
      - documentIndex: 5
        containsDocument: {kind: Route, apiVersion: route.openshift.io/v1, name: zeppelin}
  - it: jupyterhub Route terminates TLS at the edge onto proxy-public
    template: route.yaml
    set: {platform: openshift, route.enabled: true}
    documentSelector: {path: metadata.name, value: jupyterhub}
    asserts:
      - equal: {path: spec.host, value: jupyterhub.lakehouse.example.com}
      - equal: {path: spec.to, value: {kind: Service, name: proxy-public}}
      - equal: {path: spec.port.targetPort, value: http}
      - equal: {path: spec.tls.termination, value: edge}
  - it: zeppelin Route terminates TLS at the edge onto the zeppelin Service
    template: route.yaml
    set: {platform: openshift, route.enabled: true}
    documentSelector: {path: metadata.name, value: zeppelin}
    asserts:
      - equal: {path: spec.host, value: zeppelin.lakehouse.example.com}
      - equal: {path: spec.to, value: {kind: Service, name: zeppelin}}
      - equal: {path: spec.port.targetPort, value: http}
      - equal: {path: spec.tls.termination, value: edge}
  - it: superset Route terminates TLS at the edge onto the operator web Service
    template: route.yaml
    set: {platform: openshift, route.enabled: true}
    documentSelector: {path: metadata.name, value: superset}
    asserts:
      - equal: {path: spec.host, value: superset.lakehouse.example.com}
      - equal: {path: spec.to, value: {kind: Service, name: superset-web-server}}
      - equal: {path: spec.port.targetPort, value: http}
      - equal: {path: spec.tls.termination, value: edge}
  - it: trino route is passthrough without a CA bundle, reencrypt with one
    template: route.yaml
    set: {platform: openshift, route.enabled: true}
    documentSelector: {path: metadata.name, value: trino}
    asserts:
      - equal: {path: spec.tls.termination, value: passthrough}
      - isNull: {path: spec.tls.destinationCACertificate}
      - equal: {path: spec.host, value: trino.lakehouse.example.com}
      - equal: {path: spec.port.targetPort, value: https}
  - it: trino route reencrypts when tls.caBundle is set
    template: route.yaml
    set: {platform: openshift, route.enabled: true, tls.caBundle: PEM}
    documentSelector: {path: metadata.name, value: trino}
    asserts:
      - equal: {path: spec.tls.termination, value: reencrypt}
      - equal: {path: spec.tls.destinationCACertificate, value: PEM}
  - it: ingress absent by default
    template: ingress.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: default-deny networkpolicy present
    template: networkpolicy.yaml
    documentIndex: 0
    asserts:
      - equal: {path: metadata.name, value: default-deny-ingress}
  - it: openshift renders all Routes and no Ingress even if ingress.enabled
    template: route.yaml
    set: {platform: openshift, route.enabled: true, ingress.enabled: true}
    asserts:
      - hasDocuments: {count: 6}
  - it: ingress is never rendered on openshift
    template: ingress.yaml
    set: {platform: openshift, route.enabled: true, ingress.enabled: true}
    asserts:
      - hasDocuments: {count: 0}
  - it: vanilla renders the Ingresses (keycloak first, then trino over HTTPS, then superset, jupyterhub, zeppelin)
    template: ingress.yaml
    set: {platform: vanilla, ingress.enabled: true}
    asserts:
      - hasDocuments: {count: 5}
      - equal: {path: spec.ingressClassName, value: nginx}
      - documentIndex: 0
        equal: {path: metadata.name, value: keycloak}
      - documentIndex: 1
        equal: {path: metadata.name, value: trino}
      - documentIndex: 1
        equal: {path: 'metadata.annotations["nginx.ingress.kubernetes.io/backend-protocol"]', value: HTTPS}
      - documentIndex: 1
        equal: {path: 'spec.rules[0].http.paths[0].backend.service.port.number', value: 8443}
      - documentIndex: 2
        equal: {path: metadata.name, value: superset}
      - documentIndex: 2
        equal: {path: 'spec.rules[0].host', value: superset.lakehouse.example.com}
      - documentIndex: 2
        equal: {path: 'spec.rules[0].http.paths[0].backend.service', value: {name: superset-web-server, port: {number: 8088}}}
      - documentIndex: 3
        equal: {path: metadata.name, value: jupyterhub}
      - documentIndex: 3
        equal: {path: 'spec.rules[0].host', value: jupyterhub.lakehouse.example.com}
      - documentIndex: 3
        equal: {path: 'spec.rules[0].http.paths[0].backend.service', value: {name: proxy-public, port: {number: 80}}}
      - documentIndex: 4
        equal: {path: metadata.name, value: zeppelin}
      - documentIndex: 4
        equal: {path: 'spec.rules[0].host', value: zeppelin.lakehouse.example.com}
      - documentIndex: 4
        equal: {path: 'spec.rules[0].http.paths[0].backend.service', value: {name: zeppelin, port: {number: 8080}}}
  - it: openshift networkpolicy allows both monitoring namespaces
    template: networkpolicy.yaml
    set: {platform: openshift}
    documentSelector: {path: metadata.name, value: allow-platform-namespaces}
    asserts:
      - contains: {path: 'spec.ingress[0].from', content: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-ingress}}}}
      - contains: {path: 'spec.ingress[0].from', content: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-monitoring}}}}
      - contains: {path: 'spec.ingress[0].from', content: {namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-user-workload-monitoring}}}}
      - equal: {path: spec.policyTypes, value: [Ingress]}
  - it: CNPG storageClass omitted by default, emitted when set
    template: cnpg.yaml
    documentIndex: 0
    asserts:
      - isNull: {path: spec.storage.storageClass}
      - equal: {path: spec.storage.size, value: 10Gi}
  - it: CNPG storageClass emitted when set
    template: cnpg.yaml
    set: {cnpg.polarisDb.storageClass: fast-ssd}
    documentIndex: 0
    asserts:
      - equal: {path: spec.storage.storageClass, value: fast-ssd}
