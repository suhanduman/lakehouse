suite: tls + dev secrets
templates: [tls.yaml, dev-secrets.yaml]
# appsDomain: hostname'ler boş varsayılandan türetilir (glue.hostFor) — <bileşen>-<ns>.<appsDomain>
set: {appsDomain: apps.ocp.example.net}
tests:
  - it: prod renders only Issuer and trino Certificate
    template: tls.yaml
    asserts:
      - hasDocuments: {count: 2}
      - containsDocument: {kind: Issuer, apiVersion: cert-manager.io/v1, name: lakehouse-ca, any: true}
      - containsDocument: {kind: Certificate, apiVersion: cert-manager.io/v1, name: trino-tls, any: true}
  - it: dev adds selfsigned bootstrap and combined PEM
    template: tls.yaml
    set: {tls.selfSignedCA: true}
    asserts:
      - hasDocuments: {count: 4}
      - containsDocument: {kind: ClusterIssuer, apiVersion: cert-manager.io/v1, name: lakehouse-selfsigned, any: true}
      - documentIndex: 3
        equal: {path: "spec.additionalOutputFormats[0].type", value: CombinedPEM}
  - it: dev secrets off by default
    template: dev-secrets.yaml
    asserts:
      - hasDocuments: {count: 0}
  - it: dev secrets render password.db
    template: dev-secrets.yaml
    set: {components.devSecrets: true}
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: trino-service-accounts, any: true}
      - documentIndex: 1
        matchRegex: {path: 'stringData["password.db"]', pattern: "e2e:\\$2y\\$10\\$"}
  # z2jh hub.existingSecret sözleşmesi: hub SÜRECİ cookie_secret/CryptKeeper.keys'i bu Secret'tan okur
  # (chart files/hub/z2jh.py get_secret_value: önce existing-secret/, sonra secret/). Prod'da kurulumcu
  # yaratır (docs/30-kurulum.md §5.12); dev'de sentetik ve SABİT olmalı — şablonda rastgele
  # üretmek render'ı belirsizleştirir ve ArgoCD'yi her sync'te yeniden yazmaya iter.
  - it: dev secrets pin jupyterhub z2jh keys deterministically
    template: dev-secrets.yaml
    set: {components.devSecrets: true}
    documentIndex: 6
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: jupyterhub-secrets}
      - matchRegex: {path: 'stringData["hub.config.JupyterHub.cookie_secret"]', pattern: "^[0-9a-f]{64}$"}
      - matchRegex: {path: 'stringData["hub.config.CryptKeeper.keys"]', pattern: "^[0-9a-f]{64}$"}
      # hub<->proxy token'ı BİLEREK yok: chart'ın `hub` Secret'ından env ile gelir, buradan okunmaz.
      # Konulsaydı operatör onu döndürdüğünde hiçbir şeyin değişmediğini fark etmezdi.
      - isNull: {path: 'stringData["hub.config.ConfigurableHTTPProxy.auth_token"]'}
  # DEV-ONLY sentetik AD kök CA'sı: kind'da AD/LDAP YOKTUR — bu Secret yalnız mount yolunu ve Zeppelin
  # truststore initContainer'ını canlı koşturmak içindir. Değer SABİTTİR (üretilmez): ArgoCD her sync'te
  # yeniden yazmasın. Prod'da kurulumcu yaratır (docs/30-kurulum.md §5.13).
  - it: dev secrets render a synthetic ad-ca root
    template: dev-secrets.yaml
    set: {components.devSecrets: true}
    documentIndex: 7
    asserts:
      - containsDocument: {kind: Secret, apiVersion: v1, name: ad-ca}
      - matchRegex: {path: 'stringData["ca.crt"]', pattern: '^-----BEGIN CERTIFICATE-----'}
      - matchRegex: {path: 'stringData["ca.crt"]', pattern: '-----END CERTIFICATE-----'}
