# kube-state-metrics CustomResourceStateMetrics: Spark CR'larının durumu (operator metrikleri anlık; CR durumu kalıcı).
# Alan yolları canlı doğrulandı (kubectl explain sparkapplication.status / scheduledsparkapplication.status --recursive):
#   status.applicationState.state, status.terminationTime, status.lastRun
# KAYNAK DOSYA: içerik platform/values/monitoring-dev.yaml altındaki
# `kube-state-metrics.customResourceState.config` anahtarına KOPYALANIR (KSM chart 8.5.0 yerel anahtarı).
# OpenShift'te KSM platform tarafından işletilir; bu dosya oradaki CRS yapılandırmasının kaynağıdır (runbooks).
kind: CustomResourceStateMetrics
spec:
  resources:
  - groupVersionKind: {group: sparkoperator.k8s.io, version: v1beta2, kind: SparkApplication}
    metricNamePrefix: kube_customresource_sparkapp
    labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
    metrics:
    - name: state
      help: SparkApplication applicationState.state
      each:
        type: StateSet
        stateSet:
          labelName: state
          path: [status, applicationState, state]
          list: [SUBMITTED, RUNNING, COMPLETED, FAILED, SUBMISSION_FAILED, PENDING_RERUN, INVALIDATING, SUCCEEDING, FAILING, UNKNOWN]
    - name: termination_time
      help: SparkApplication terminationTime (epoch s)
      each:
        type: Gauge
        gauge: {path: [status, terminationTime]}
  - groupVersionKind: {group: sparkoperator.k8s.io, version: v1beta2, kind: ScheduledSparkApplication}
    metricNamePrefix: kube_customresource_ssa
    labelsFromPath: {name: [metadata, name], namespace: [metadata, namespace]}
    metrics:
    - name: last_run
      help: ScheduledSparkApplication lastRun (epoch s)
      each:
        type: Gauge
        gauge: {path: [status, lastRun]}
