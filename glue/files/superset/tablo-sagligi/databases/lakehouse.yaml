# Bu dosya ConfigMap şablonunda `tpl` ile işlenir (glue/templates/superset.yaml): URI'deki ad alanı ürün
# datasource'uyla (aynı dosyadaki trino.yaml) AYNI ifadeden gelir. Import overwrite=True ile çalıştığından
# buradaki tanım ürün datasource'unun üzerine yazılır; bu yüzden ikisi inşa gereği birebir aynı olmalıdır.
database_name: lakehouse
sqlalchemy_uri: trino://superset@trino.{{ include "glue.ns" . }}.svc:8443/lakehouse
cache_timeout: null
expose_in_sqllab: true
allow_run_async: false
allow_ctas: true
allow_cvas: true
allow_dml: false
allow_file_upload: false
extra:
  engine_params:
    connect_args:
      http_scheme: https
      verify: /etc/lakehouse-ca/tls.crt
impersonate_user: false
configuration_method: sqlalchemy_form
# SABİT uuid — ürün datasource'undaki (trino.yaml) ile AYNI değer; tek kaynak _helpers.tpl
# "glue.supersetDbUuid". Superset import'u veritabanını uuid ile eşleştirir; taze kurulumda legacy-import
# bu uuid'yi yarattığı için bundle import'u ikinci satır açmaz.
uuid: {{ include "glue.supersetDbUuid" . }}
version: 1.0.0
