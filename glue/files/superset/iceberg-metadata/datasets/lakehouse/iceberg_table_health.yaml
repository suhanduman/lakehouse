catalog: lakehouse
schema: shop
sql: "WITH t AS (\n  SELECT 'shop.orders' AS tbl, * FROM lakehouse.shop.\"orders$snapshots\"\
  \n  UNION ALL SELECT 'crm.customers', * FROM lakehouse.crm.\"customers$snapshots\"\
  \n  UNION ALL SELECT 'nginx_raw.access_log', * FROM lakehouse.nginx_raw.\"access_log$snapshots\"\
  \n)\nSELECT tbl,\n       max(committed_at)                                     \
  \                   AS son_commit,\n       count(*)                            \
  \                                     AS snapshot_sayisi,\n       max_by(CAST(summary['total-records']\
  \ AS bigint), committed_at)           AS kayit,\n       max_by(CAST(summary['total-data-files']\
  \ AS bigint), committed_at)        AS veri_dosyasi,\n       max_by(CAST(summary['total-delete-files']\
  \ AS bigint), committed_at)      AS delete_dosyasi,\n       max_by(CAST(summary['total-files-size']\
  \ AS bigint), committed_at)/1048576.0 AS boyut_mib\nFROM t GROUP BY tbl ORDER BY\
  \ tbl\n"
