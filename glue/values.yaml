# platform: vanilla | openshift  (Route <-> Ingress)
platform: vanilla
namespace: lakehouse
# OpenShift apps alanı — `oc get ingresses.config cluster -o jsonpath='{.spec.domain}'`.
# Bileşen hostname'leri BOŞKEN buradan türetilir: <bileşen>-<namespace>.<appsDomain>
# (glue.hostFor). Müşteri değeri TEK YERDE: platform/values/site/glue.yaml.
appsDomain: ""

versions:
  kafka: "4.3.1"
  kafkaMetadata: "4.3-IV0"
  debezium: "3.6.2.Final"
  iceberg: "1.11.0"
  hadoopClient: "3.4.3"
  polarisAdminTool: "1.7.0"

kafka:
  replicas: 3
  storageSize: 100Gi
  storageClass: ""              # boş = kümenin varsayılan StorageClass'ı (Strimzi volume alanı: class)
  plainListener: false          # dev/kind: true (9092, TLS'siz); prod: yalnız tls 9093 SCRAM
  externalListener: false       # Fluent Bit ajanları için (F3) — openshift: route, vanilla: nodeport
  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2

connect:
  # İşçi (pod) sayısı. Bağlayıcı görevleri işçilere kendiliğinden dağılır; bir işçi düşerse görevleri ~6 sn içinde
  # diğerlerine geçer (ocpphy provası 2026-11-11: 13 görev 2 işçide 6/7, pod silinince 13'ü tek işçide).
  # Strimzi PDB'si (maxUnavailable 1) düğüm boşaltmada işçileri tek tek indirir.
  replicas: 2
  # spec.build çıktısı. Varsayılan YOK: prod'da zorunlu (registry/repo:tag, ör.
  # image-registry.openshift-image-registry.svc:5000/<ns>/connect:2.0.0); dev: ttl.sh (platform/values/glue-dev.yaml)
  buildImage: ""
  buildPushSecret: ""           # özel registry için docker-registry Secret adı; boş = anonim (ttl.sh)
  topicPartitions: 6            # Debezium topic.creation.default.partitions (dev: 3)
  sinkCommitIntervalMs: ""      # Iceberg sink commit aralığı; BOŞ = upstream 300 s (prod). Yalnız dev/e2e: "30000"
  # İşçi başına bellek. İstek = sınır: JVM yığını açılışta ayrılır (-Xms = -Xmx), kullanım dalgalanmaz.
  # 2 GiB yetmedi (ocpphy provası 2026-11-11: 8 kaynak + sink tek işçide boşta 1954 MiB; 12 tabloluk ilk okumada
  # OOMKilled -> okuma baştan alındı, Bronze'a tekrar satır yazıldı).
  resources:
    requests: {cpu: 500m, memory: 4Gi}
    limits: {memory: 4Gi}
  # JVM yığını (-Xms/-Xmx) — limits.memory'nin ~%60'ı. Kalan pay yığın dışı belleğe (sınıf meta verisi, iş
  # parçacıkları, ağ ve Parquet tamponları) gider; yığın sınırın %75'ine çıkarsa pod OOMKilled olur.
  # limits.memory büyütülürse bu da orantılı büyütülür.
  heap: 2400m

# Kaynak DB'ler → KafkaUser ACL'leri + KafkaConnector çifti (dbz-<name>, sink-<name>). Secret: <name>-db (username, password).
# Bronze namespace <name>_raw (Polaris setup.yaml'da yaratılmış olmalı — docs/50-isletme/yeni-kaynak-ve-pipeline.md)
sources: []
#  - name: shop                       # topic.prefix, slot/publication adı, Secret <name>-db
#    type: postgres                   # postgres | sqlserver
#    host: demo-pg-rw.lakehouse.svc
#    port: 5432
#    database: shop                   # pg: database.dbname; sqlserver: database.names
#    tables: [public.orders]          # table.include.list
#    signalTable: public.debezium_signal   # zorunlu: incremental snapshot sinyal tablosu (kaynakta yaratılır)
#    topicPrefix: shop                # opsiyonel, varsayılan name
#    bronzeNamespace: shop_raw        # opsiyonel, varsayılan <name>_raw
#    sinkTasks: 1
#    extraConfig: {}                  # Debezium'a ek/ezen anahtarlar
#    sinkExtraConfig: {}              # sink'e ek/ezen anahtarlar
#  - name: crm                        # mongodb: topic.prefix; topic'ler <prefix>.<db>.<coll>; Bronze <name>_raw.<coll>
#    type: mongodb
#    connectionString: mongodb://demo-mongo.lakehouse.svc:27017/?replicaSet=rs0   # kimlik bilgisi YOK: Secret <name>-db (username,password)
#    collections: [crm.customers]     # collection.include.list (db.coll)
#    signalCollection: crm.debezium_signal   # opsiyonel: incremental snapshot sinyal koleksiyonu
#    extraConfig: {}

# JSON olay akışları (uygulamalar, IoT cihazları): her akış için Kafka konusu <ad>.events, yalnız o konuya yazabilen
# üretici kimliği stream-<ad> (KafkaUser, SCRAM), Iceberg sink'i ve Bronze tablosu (varsayılan <ad>_raw.events).
# Tablo kayıtların Kafka'ya varış zamanına (_kafka_ts) göre güne bölünür. Silver yoktur (olaylar yalnız eklenir).
# docs/50-isletme/json-akisi-ekleme.md
streams: []
#  - name: sensors                  # [a-z][a-z0-9_]* ; kaynak adlarıyla ve "nginx" ile çakışmaz
#    partitions: 3                  # konu bölüm sayısı (paralel tüketim üst sınırı)
#    retentionDays: 365             # bu günden eski satırları bakım işi siler; yok/0 = süresiz saklanır
#    fields:                        # veri sözleşmesi (önerilir): tipine uymayan kayıt <ad>.dlq'ya gider, akış durmaz
#      temperature_c: float64       # int32 | int64 | float32 | float64 | boolean | string
#      humidity_pct: int64
#    state: running                 # running | paused | stopped — bozuk kaydı atlarken durdurmak için
#    table: sensors_raw.events      # isteğe bağlı; Polaris ad alanı setup.yaml'da açılmış olmalı
#    sinkTasks: 1
#    sinkExtraConfig: {}

nginx:
  enabled: false                   # Fluent Bit ajanları (müşteri sunucusu) -> Kafka dış listener -> Iceberg sink
  topic: nginx.access
  partitions: 6
  table: nginx_raw.access_log      # Polaris namespace nginx_raw setup.yaml'da (F1'de var)
  sinkTasks: 1
  sinkExtraConfig: {}
  retentionDays: 0                 # nginx_raw.access_log: bu günden eski satırları bakım işi siler; 0 = süresiz

cnpg:
  # storageClass boş = kümenin varsayılan StorageClass'ı; prod'da HA için instances: 2 (platform/values/glue.yaml)
  polarisDb: {instances: 1, storageSize: 10Gi, storageClass: ""}
  keycloakDb: {instances: 1, storageSize: 10Gi, storageClass: ""}
  supersetDb: {instances: 1, storageSize: 10Gi, storageClass: ""}

polaris:
  realm: POLARIS
  rootCredentialSecret: polaris-root   # keys: clientId, clientSecret (Git'e girmez; kurulumdan önce yaratılır)

keycloak:
  # TAM URL (hostname v2): token iss = bu değer. BOŞ -> https://keycloak-<ns>.<appsDomain> türetilir
  # (glue.keycloakUrl). Dev'de küme içi URL açıkça verilir (platform/values/glue-dev.yaml).
  hostname: ""    # ör. https://keycloak-lakehouse.apps.ocp.example.net
  realm: {name: lakehouse, displayName: Lakehouse}
  adminSecret: keycloak-admin          # keys: username, password
  clientsSecret: keycloak-clients      # keys: trino, superset, jupyterhub, ldap-bind -> realm import placeholders (spec.placeholders)
  ldap:
    enabled: false
    connectionUrl: ldaps://ad.example.com:636
    usersDn: "OU=Users,DC=example,DC=com"
    groupsDn: "OU=Groups,DC=example,DC=com"   # v1'in ayrı groupSearchBase'inin karşılığı yoktu (task 3); nötr varsayılan eklendi
    bindDn: "CN=svc-lakehouse,OU=Service,DC=example,DC=com"
    # bindCredential values'ta DEĞİL: keycloak-clients Secret'ının ldap-bind anahtarı (${LDAP_BIND_CREDENTIAL})
    # AD kök CA'sını taşıyan Secret'ın ADI (anahtar ca.crt, PEM) — docs/30-kurulum.md §5.13.
    # BOŞ = hiçbir yere bağlanmaz (AD sertifikası zaten imajların güven deposundaki bir kökten geliyorsa).
    # Doluyken TEK anahtar İKİ tüketiciyi birden açar: Keycloak CR spec.truststores (operatör PEM'i
    # /opt/keycloak/conf/truststores'a bağlar, oradan sistem güven deposuyla birleşir) ve Zeppelin'in
    # ad-truststore initContainer'ı (cacerts kopyası + keytool import). Trino AYRI chart'tadır: aynı
    # Secret platform/values/trino-ldap.yaml ile bağlanır, yol site/trino.yaml'daki group-provider
    # bloğunda (ldap.ssl.truststore.path). Üçünün tutarlılığını scripts/check-site.sh denetler.
    caSecret: ""
  extraRedirectUris: {trino: [], superset: [], jupyterhub: [], polaris: []}   # türetilenlere ek (ör. lokal port-forward)
  devUsers: []                         # DEV-ONLY: [{username, password, group}] -> statik parolalı kullanıcılar + trino client'ında password grant

tls:
  selfSignedCA: false          # dev/kind: true -> ClusterIssuer selfsigned + CA Certificate -> Secret lakehouse-ca. Prod: false, lakehouse-ca (tls.crt, tls.key) kurulumdan önce
  caBundle: ""                 # prod: Route reencrypt destinationCACertificate (PEM, lakehouse-ca tls.crt). Boş -> passthrough
trino:
  hostname: ""                     # boş -> trino-<ns>.<appsDomain>; kurumsal DNS adı için site/glue.yaml'da doldurun
superset:
  enabled: true
  hostname: ""                     # boş -> superset-<ns>.<appsDomain>
  # resmi -dev etiketi sürücüleri (psycopg2, trino, authlib) İÇERİR; düz 6.1.0 içermez ve
  # site-packages salt-okunur -> açılışta pip yok, PyPI erişimi gerekmez
  imageTag: "6.1.0-dev"
  replicas: 1
  secretName: superset-secret          # key: secret-key (Superset SECRET_KEY; Git'e girmez)
  resources: {requests: {cpu: 250m, memory: 768Mi}, limits: {memory: 2Gi}}
  # Keycloak grup adı -> Superset rolleri (AUTH_ROLES_MAPPING); grup talebi realm'in superset client'ındaki groups mapper'ından gelir
  roleMapping: {lakehouse-admins: [Admin], lakehouse-analysts: [Alpha], lakehouse-users: [Gamma]}
jupyterhub:
  hostname: ""                     # boş -> jupyterhub-<ns>.<appsDomain>
zeppelin:
  enabled: true
  hostname: ""                     # boş -> zeppelin-<ns>.<appsDomain>
  image: docker.io/apache/zeppelin:0.12.1
  storageSize: 10Gi
  storageClass: ""                 # boş = kümenin varsayılan StorageClass'ı
  mem: "-Xmx1024m"                 # ZEPPELIN_MEM (sunucu JVM); dev: -Xmx768m
  intpMem: "-Xmx1024m"             # ZEPPELIN_INTP_MEM (interpreter JVM); dev: -Xmx512m
  trinoJdbcVersion: "483"          # interpreter dependencies (Maven Central, ilk çalıştırmada indirilir)
  shiroSecret: zeppelin-shiro                # key shiro.ini — prod: examples/zeppelin/shiro-ad.ini (AD LDAPS), dev: dev-secrets
  interpreterSecret: zeppelin-interpreter    # key interpreter.json — Trino JDBC url/user/password (files/zeppelin/interpreter.json şablonu)
  resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {memory: 2560Mi}}

# Küme içi Maven önbelleği (Reposilite, tek pod + disk). Spark işleri Iceberg/Kafka kütüphanelerini her koşuda
# buradan çözer; sunucu bir kütüphaneyi Maven Central'dan YALNIZ İLK İSTEKTE indirir ve diskte tutar -> internet
# kesintisinde işler çalışmaya devam eder. Sürüm yükseltmesinde yeni sürüm ilk koşuda bir kez indirilir.
# Kurumun kendi Maven aynası (Nexus/Artifactory) varsa: enabled: false + spark.ivySettingsXml.
mavenProxy:
  enabled: true
  image: docker.io/dzikoysk/reposilite:3.6.4
  upstream: https://repo1.maven.org/maven2   # önbelleğin kaynağı; kurum aynası da yazılabilir
  storageSize: 5Gi                 # bir Iceberg sürümünün kütüphaneleri ~110 MB
  storageClass: ""                 # boş = kümenin varsayılan StorageClass'ı
  javaOpts: "-Xmx192m"
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 512Mi}}

components:
  minio: false                  # DEV-ONLY tek-replika S3 (kind). Prod: müşterinin S3'ü
  devSecrets: false             # DEV-ONLY: keycloak-clients, trino-service-accounts, trino-shared-secret, superset-secret, zeppelin-shiro, zeppelin-interpreter, jupyterhub-secrets (sentetik; prod'da kurulumcu yaratır)
minio:
  rootUser: minioadmin
  rootPassword: minioadmin
  buckets: [lakehouse, backups]        # backups: CNPG yedekleri (AYRI bucket, backup.s3.bucket ile aynı olmalı)
  persistence: {enabled: true, size: 5Gi, storageClass: ""}   # emptyDir kaldırıldı: MinIO yeniden başlarsa veri kalmalı (Deployment strategy Recreate)

# CNPG PITR yedekleri (Barman Cloud eklentisi, CNPG-I). Kapatmak: backup.enabled=false -> ObjectStore/ScheduledBackup/plugins render EDİLMEZ.
backup:
  enabled: true
  s3:
    endpoint: http://minio.lakehouse.svc:9000     # prod: FARKLI endpoint/bucket (spec §8) — kurulumda doldur
    bucket: backups                               # veri bucket'ından (s3.* / iceberg.warehouse) AYRI olmalı
    region: us-east-1
    secret: backup-s3-creds                       # keys AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (dev: MinIO şablonu üretir; prod: kurulumdan ÖNCE)
  schedule: "0 0 2 * * *"                         # CNPG ScheduledBackup: 6 alan (saniye dâhil) -> her gün 02:00
  retentionPolicy: "30d"                          # ObjectStore spec.retentionPolicy (barman-cloud retention)

# Velero namespace yedeği (dev: platform/apps/dev/40-velero.yaml chart'ı; prod: OADP —
# docs/50-isletme/yedek-ve-geri-donus.md).
# Kapatmak: velero.enabled=false -> Schedule VE Kafka/MinIO fs-backup dışlama annotation'ları render EDİLMEZ.
velero:
  enabled: false                # dev overlay'de true (platform/values/glue-dev.yaml); prod: OADP kurulduktan sonra namespace: openshift-adp ile açılır
  namespace: velero             # Schedule/Backup/Restore CR'leri Velero sunucusunun ns'inde yaşar
  schedule: "0 3 * * *"         # 5 alan (Velero robfig/cron, saniyesiz) -> her gün 03:00; CNPG yedeği 02:00'da (backup.schedule)
  ttl: 720h                     # yedek saklama: 30 gün
  # pods HARİÇ TUTULMAZ: fs-backup (PodVolumeBackup) pod öğesi yedeklenirken tetiklenir -> pods dışlanırsa
  # PVC'ler boş yedeklenir (canlı doğrulandı, task 4 raporu §Backup). replicasets/events gürültüdür;
  # backups.postgresql.cnpg.io CNPG'nin kendi yedek nesneleridir (Barman tarafında zaten var).
  excludedResources: [replicasets, events, backups.postgresql.cnpg.io]
  # fs-backup'tan dışlanan pod hacimleri (backup.velero.io/backup-volumes-excludes)
  excludeVolumes:
    kafka: data-0               # KafkaNodePool jbod id 0 -> pod hacim adı data-0 (canlı doğrulandı)
    minio: data                 # DEV-ONLY: MinIO PVC'si lakehouse'un KENDİSİ (Iceberg verisi) — Velero kapsamı dışı

networkPolicy:
  enabled: true

# ArgoCD'nin koştuğu ad alanı — networkpolicy.yaml `allow-platform-namespaces` girişini bundan üretir.
# install/lakehouse.env.example içindeki $ARGOCD_NS ile AYNI olmalıdır; farklıysa seçici hiçbir ad
# alanıyla eşleşmez ve ArgoCD'den pod'a doğrudan erişim sessizce kapalı kalır.
# OpenShift GitOps operatörü `openshift-gitops` kullanır -> prod değeri platform/values/site/glue.yaml'da.
# Varsayılan `argocd`: upstream ArgoCD ve kind/CI bootstrap'ı (bootstrap/bootstrap.sh --argocd-ns) bu adı kullanır.
argocdNamespace: argocd

monitoring:
  enabled: true                 # PodMonitor + PrometheusRule + Grafana dashboard ConfigMap'leri (bu chart ServiceMonitor RENDER ETMEZ)
  namespace: monitoring         # dev/vanilla Prometheus/Grafana ns'i — networkpolicy.yaml scrape girişini bundan üretir (OpenShift'te openshift-* sabit)
  silverMergeStaleSeconds: 2700 # LakehouseSilverMergeStale eşiği (prod 15 dk cron -> 45 dk); dev gecelik cron -> glue-dev 172800
  sinkLagThreshold: 1000        # LakehouseSinkStalled eşiği (kafka_consumergroup_lag toplamı, connect-sink-*)
  sparkRunMaxSeconds: 1800      # LakehouseSparkRunTooLong eşiği (ortalama tamamlanan Spark koşu süresi, sn)

ingress:
  enabled: false
  className: nginx
route:
  enabled: false                # platform=openshift iken true

iceberg:
  catalogUri: http://polaris.lakehouse.svc:8181/api/catalog
  warehouse: lakehouse

s3:                                   # istemciler (sink, Spark) için; Polaris sunucusu için platform/polaris/setup.yaml
  endpoint: http://minio.lakehouse.svc:9000     # prod: müşteri S3 endpoint'i
  region: us-east-1
  pathStyleAccess: true
  vendedCredentials: true             # STS'siz S3'te false → istemciler s3-creds Secret'ını kullanır, delegation header none (F0 S1c)
  # S3 sertifikası ÖZEL (kurumsal) bir CA ile imzalıysa o CA'yı taşıyan Secret'ın adı (kurulumda `s3-ca`,
  # docs/30-kurulum.md §5.14). Anahtarlar: `ca.crt` (PEM kök CA) + `truststore.p12` (JDK kökleri + bu CA,
  # keytool, parola changeit). Boş = S3 herkesçe bilinen bir CA kullanır, hiçbir şey bağlanmaz (render aynı kalır).
  # Bağlananlar: CNPG yedeği (ObjectStore endpointCA), Kafka Connect sink ve Spark işleri (JVM güven deposu).
  # Polaris/Trino/not defterleri ayrı chart'lardır: aynı Secret'ı initContainer ile İSTEĞE BAĞLI okurlar
  # (platform/values/{polaris,trino,jupyterhub}.yaml), bu anahtara bakmazlar.
  caSecret: ""
  # Not defterlerinin (JupyterHub) S3'e doğrudan erişimi için S3 veri adres(ler)i, CIDR olarak (FlashBlade veri
  # VIP'leri; depolama ekibinden). z2jh'nin singleuser NetworkPolicy'si dış çıkışa izin verir ama ÖZEL IP
  # aralıklarını (10/8, 172.16/12, 192.168/16) hariç tutar -> iç ağdaki S3'e pyiceberg istekleri zaman aşımı verir
  # (ocpphy provası 2026-11-08). Doluysa glue yalnız not defteri pod'larına, yalnız bu adreslere ve S3 portuna
  # (s3.endpoint'ten; yoksa 443) EK bir çıkış politikası yazar (NetworkPolicy'ler toplanır). Boş = politika yok.
  egressCidrs: []

# Silver pipeline'ları (yalnız entity/upsert tabloları; append-only tablolar listelenmez). ConfigMap lakehouse-jobs/pipelines.json
pipelines: []
#  - bronze: shop_raw.orders
#    keys: [id]                       # bucket(bucket_count, keys[0]): YALNIZ İLK anahtar bölümlemeye girer
#                                     # -> bileşik anahtarda kardinalitesi en yüksek kolonu başa yaz
#    write_mode: merge-on-read         # | copy-on-write (küçük tablo)
#    bucket_count: 16
#    casts: {updated_at: timestamp}    # Bronze'da string gelen timestamptz kolonları (F0 S2d)

spark:
  image: docker.io/apache/spark:4.1.0-java21-python3
  version: "4.1.0"
  # spark.jars.packages şablonda versions.iceberg'den üretilir (iki yerde sürüm tutulmaz)
  serviceAccount: spark-operator-spark          # spark-operator chart'ının jobNamespaces'ta yarattığı SA
  credentialSecret: polaris-spark               # key: credential (polaris-setup.sh yazar)
  # cores tam sayıdır (Spark çekirdek sayısı); coreRequest kesirli CPU İSTEĞİ'dir (k8s request; boş = cores kadar).
  # Dar düğümlerde (CI 4 vCPU) driver/executor'ın schedule olabilmesi için dev'de düşürülür.
  driver:   {cores: 1, coreRequest: "", memory: 2g, memoryOverhead: 512m}
  executor: {instances: 1, cores: 1, coreRequest: "", memory: 2g, memoryOverhead: 512m}
  shufflePartitions: 8                          # küçük tier (F0 S4); büyük tier'da 200
  kafkaSecret: spark                 # KafkaUser spark'ın Secret'ı (sasl.jaas.config) — mongo-bronze Kafka okuması
  # boş = küme içi Maven önbelleği (mavenProxy; kapalıysa Maven Central). Doluysa kurumun kendi aynası kullanılır:
  # ConfigMap spark-ivysettings + tüm SSA'larda /opt/ivy/ivysettings.xml, spark.jars.ivySettings o yolu gösterir
  # (docs/50-isletme/sorun-giderme.md §6.2)
  ivySettingsXml: ""
  schedules:
    silverMerge: "*/15 * * * *"
    positionDeletes: "0 * * * *"
    compact: "0 */6 * * *"
    expireOrphanTtl: "30 3 * * *"
    mongoBronze: "*/5 * * * *"
  maintenance: {snapshotDays: 7, orphanDays: 3, bronzeTtlDays: 30}
